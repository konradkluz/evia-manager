# EVM-090 AC1 negative fixture: a public operation on both channels would let the guard skip the CSRF checks of the web login (SR-AUTHZ-12).
openapi: 3.1.0
info:
  title: Fixture
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
security: []
components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
    webSession:
      type: apiKey
      in: cookie
      name: __Host-evia_session
tags:
  - name: platform
    description: Fixture.
paths:
