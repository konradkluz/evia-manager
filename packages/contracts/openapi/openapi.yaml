# EVia Manager API — source of truth (ADR-0004, docs/architecture/api-guidelines.md). One file per module under
# paths/ and shared components under components/; `pnpm --filter @evia/contracts run build` bundles them into
# dist/openapi.json, the only input of the generator (types, fetch client, Zod schemas, authorization manifest).
openapi: 3.1.0
info:
  title: EVia Manager API
  version: 1.0.0
  description: >-
    API panelu web i aplikacji mobilnej EVia Manager. Każda operacja deklaruje politykę autoryzacji
    w `x-evia-authz` (deny-by-default). Błędy w formacie `application/problem+json` (RFC 9457).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Ta sama domena co panel web (CORS wyłączony).
security: []
tags:
  - name: platform
    description: Operacje techniczne platformy (zdrowie usługi).
  - name: identity
    description: Aktywacja konta, sesja i klucze dostępu (moduł identity).
  - name: audit
    description: Dziennik audytu tylko do odczytu dla Administratora po ponownym uwierzytelnieniu (moduł audit).
  - name: catalog
    description: Katalog usług, szablony procesów i zleceń, rodzaje dokumentów — odczyt konfiguracji (moduł catalog).
  - name: work-orders
    description: Zlecenia — lista z filtrami i paginacją kursorem (moduł work-orders).
paths:
  /api/health:
    $ref: paths/platform.yaml#/health
  /api/v1/auth/activation/check:
    $ref: paths/identity.yaml#/activationCheck
  /api/v1/auth/activation/password:
    $ref: paths/identity.yaml#/activationPassword
  /api/v1/auth/login:
    $ref: paths/identity.yaml#/login
  /api/v1/auth/login/passkey/options:
    $ref: paths/identity.yaml#/loginPasskeyOptions
  /api/v1/auth/login/passkey:
    $ref: paths/identity.yaml#/loginPasskey
  /api/v1/auth/session:
    $ref: paths/identity.yaml#/session
  /api/v1/auth/session/extend:
    $ref: paths/identity.yaml#/sessionExtend
  /api/v1/auth/logout:
    $ref: paths/identity.yaml#/logout
  /api/v1/auth/step-up/options:
    $ref: paths/identity.yaml#/stepUpOptions
  /api/v1/auth/step-up:
    $ref: paths/identity.yaml#/stepUp
  /api/v1/audit/events:
    $ref: paths/audit.yaml#/events
  /api/v1/account/passkeys/registration-options:
    $ref: paths/identity.yaml#/passkeyOptions
  /api/v1/account/passkeys:
    $ref: paths/identity.yaml#/passkeys
  /api/v1/catalog/work-order-templates:
    $ref: paths/catalog.yaml#/workOrderTemplates
  /api/v1/catalog/work-order-templates/{templateId}:
    $ref: paths/catalog.yaml#/workOrderTemplate
  /api/v1/catalog/service-items:
    $ref: paths/catalog.yaml#/serviceItems
  /api/v1/catalog/procedure-templates:
    $ref: paths/catalog.yaml#/procedureTemplates
  /api/v1/catalog/document-kinds:
    $ref: paths/catalog.yaml#/documentKinds
  /api/v1/work-orders:
    $ref: paths/work-orders.yaml#/workOrders
