# EVia Manager API — source of truth (ADR-0004, docs/architecture/api-guidelines.md). One file per module under
# paths/ and shared components under components/; `pnpm --filter @evia/contracts run build` bundles them into
# dist/openapi.json, the only input of the generator (types, fetch client, Zod schemas, authorization manifest).
openapi: 3.1.0
info:
  title: EVia Manager API
  version: 1.0.0
  description: >-
    API panelu web i aplikacji mobilnej EVia Manager. Każda operacja deklaruje politykę autoryzacji
    w `x-evia-authz` (deny-by-default). Błędy w formacie `application/problem+json` (RFC 9457).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Ta sama domena co panel web (CORS wyłączony).
security: []
tags:
  - name: platform
    description: Operacje techniczne platformy (zdrowie usługi).
  - name: identity
    description: Aktywacja konta, sesja i klucze dostępu (moduł identity).
  - name: audit
    description: Dziennik audytu tylko do odczytu dla Administratora po ponownym uwierzytelnieniu (moduł audit).
  - name: catalog
    description: Katalog usług, szablony procesów i zleceń, rodzaje dokumentów — odczyt konfiguracji (moduł catalog).
  - name: work-orders
    description: Zlecenia — lista z filtrami i paginacją kursorem, wyszukiwanie (fraza w treści), utworzenie z szablonu, odczyt szczegółów oraz edycja danych i zakresu (moduł work-orders).
  - name: customers
    description: Klienci — lista, szczegóły, edycja, wyszukiwanie i dodanie w formularzu nowego zlecenia (moduł customers).
  - name: sites
    description: Lokalizacje — wyszukiwanie, dodanie w formularzu nowego zlecenia, szczegóły i edycja (moduł sites).
  - name: parties
    description: Strony (OSD, zarządcy, eksperci) — wyszukiwanie, dodanie w formularzu nowego zlecenia, szczegóły i edycja (moduł parties).
  - name: procedures
    description: Procesy i etapy zlecenia — odczyt, osoba odpowiedzialna i termin etapu, ręczne dodanie, usunięcie i przywrócenie procesu lub etapu (moduł procedures).
  - name: payments
    description: Płatności etapowe zlecenia — transze z planu szablonu, kwoty i sumy (moduł payments; tylko panel web).
  - name: timeline
    description: Dziennik zlecenia — wpisy, komentarze i poprawki, tylko do dopisywania (moduł timeline).
  - name: media
    description: Zdjęcia, filmy i dokumenty zlecenia — dodanie, wieloczęściowy upload do prywatnego storage'u, stan pliku po skanie, klasa poufności dokumentu i podpisane adresy pobrania (moduł media; panel web).
  - name: devices
    description: Urządzenia mobilne — potwierdzenie wyczyszczenia danych (moduł identity; kanał mobile).
  - name: sync
    description: Synchronizacja aplikacji mobilnej — konfiguracja klienta, pobieranie zmian, migawka zlecenia i wysyłanie mutacji (moduł sync; kanał mobile).
