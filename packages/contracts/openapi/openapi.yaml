# EVia Manager API — source of truth (ADR-0004, docs/architecture/api-guidelines.md). One file per module under
# paths/ and shared components under components/; `pnpm --filter @evia/contracts run build` bundles them into
# dist/openapi.json, the only input of the generator (types, fetch client, Zod schemas, authorization manifest).
openapi: 3.1.0
info:
  title: EVia Manager API
  version: 1.0.0
  description: >-
    API panelu web i aplikacji mobilnej EVia Manager. Każda operacja deklaruje politykę autoryzacji
    w `x-evia-authz` (deny-by-default). Błędy w formacie `application/problem+json` (RFC 9457).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Ta sama domena co panel web (CORS wyłączony).
security: []
tags:
  - name: platform
    description: Operacje techniczne platformy (zdrowie usługi).
  - name: identity
    description: Aktywacja konta, sesja i klucze dostępu (moduł identity).
paths:
  /api/health:
    $ref: paths/platform.yaml#/health
  /api/v1/auth/activation/check:
    $ref: paths/identity.yaml#/activationCheck
  /api/v1/auth/activation/password:
    $ref: paths/identity.yaml#/activationPassword
  /api/v1/auth/session:
    $ref: paths/identity.yaml#/session
  /api/v1/auth/logout:
    $ref: paths/identity.yaml#/logout
  /api/v1/account/passkeys/registration-options:
    $ref: paths/identity.yaml#/passkeyOptions
  /api/v1/account/passkeys:
    $ref: paths/identity.yaml#/passkeys
components:
  schemas:
    Health:
      $ref: components/platform.yaml#/Health
    MinSupportedAppVersion:
      $ref: components/platform.yaml#/MinSupportedAppVersion
    Semver:
      $ref: components/common.yaml#/Semver
    Problem:
      $ref: components/problem.yaml#/Problem
    FieldError:
      $ref: components/problem.yaml#/FieldError
    UserRole:
      $ref: components/identity.yaml#/UserRole
    Channel:
      $ref: components/identity.yaml#/Channel
    SessionState:
      $ref: components/identity.yaml#/SessionState
    CsrfToken:
      $ref: components/identity.yaml#/CsrfToken
    ActivationToken:
      $ref: components/identity.yaml#/ActivationToken
    CurrentSession:
      $ref: components/identity.yaml#/CurrentSession
    Passkey:
      $ref: components/identity.yaml#/Passkey
