components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
      description: >-
        Nieprzezroczysty token dostępu aplikacji mobilnej (15 min, `Authorization: Bearer`). Tylko operacje z kanałem dokładnie
        `[mobile]`; token nigdy nie trafia do adresu. Źródłem prawdy autoryzacji pozostaje `x-evia-authz` (role, kanały, polityki).
    webSession:
      type: apiKey
      in: cookie
      name: __Host-evia_session
      description: >-
        Ciasteczko sesji panelu (`HttpOnly`, `Secure`, `SameSite=Strict`). Tylko operacje z kanałem dokładnie `[web]`; istniejące
        operacje panelu go nie deklarują (bez zmiany), a operacje mobilne go nie przyjmują.
