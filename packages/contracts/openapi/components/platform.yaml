# Response schemas are open (no additionalProperties: false): v1 changes are additive and clients ignore unknown
# fields (ADR-0004). The exact set of keys sent by the server is guarded by API tests, not by the schema.
Health:
  type: object
  required: [status, minSupportedAppVersion]
  properties:
    status:
      type: string
      const: ok
    minSupportedAppVersion:
      $ref: '#/MinSupportedAppVersion'
MinSupportedAppVersion:
  type: object
  description: Minimalna wspierana wersja aplikacji mobilnej per platforma (konfiguracja serwera).
  required: [android, ios]
  properties:
    android:
      $ref: common.yaml#/Semver
    ios:
      $ref: common.yaml#/Semver
Version:
  type: object
  description: Wydanie, które działa (EVM-007 AC4); `null` poza kanałem wdrożeń.
  required: [commit, manifestSha256]
  properties:
    commit:
      description: Pełny SHA commita, z którego zbudowano obraz.
      oneOf:
        - type: string
          pattern: '^[0-9a-f]{40}$'
          maxLength: 40
        - type: 'null'
    manifestSha256:
      description: SHA-256 (hex) dokładnych bajtów release-manifest.json wydania.
      oneOf:
        - type: string
          pattern: '^[0-9a-f]{64}$'
          maxLength: 64
        - type: 'null'
