# Module `identity` — activation of the first Administrator, passkeys, session (EVM-016). Request schemas are strict
# (`additionalProperties: false`, every string has `maxLength`): an unknown field is rejected, so identifiers such as
# `userId` or `sessionId` cannot be injected into a body (SR-AUTHZ-01, CWE-915).
UserRole:
  type: string
  description: Rola użytkownika (słownik domeny — Administrator, Edytor, Tylko odczyt).
  enum: [administrator, editor, read_only]
Channel:
  type: string
  description: Kanał sesji. W M1 wszystkie sesje są `web`; `mobile` od E9 (SR-AUTHZ-12).
  enum: [web, mobile]
SessionState:
  type: string
  description: >-
    `mfa_enrollment` — hasło ustawione, brak klucza dostępu (dopuszczone tylko operacje rejestracji klucza,
    wylogowania i odczytu sesji); `active` — pełna sesja.
  enum: [mfa_enrollment, active]
ActivationToken:
  type: string
  description: Jednorazowy token linku aktywacyjnego (256 bitów, base64url) — wyłącznie w treści POST, nigdy w adresie.
  pattern: '^[A-Za-z0-9_-]{43}$'
  minLength: 43
  maxLength: 43
CsrfToken:
  type: string
  description: Token CSRF sesji (nagłówek `X-CSRF-Token` w mutacjach) — zmienia się razem z sesją.
  pattern: '^[A-Za-z0-9_-]{43}$'
  maxLength: 43
CheckActivationLinkRequest:
  type: object
  additionalProperties: false
  required: [token]
  properties:
    token:
      $ref: '#/ActivationToken'
ActivationLinkInfo:
  type: object
  required: [email, role]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
    role:
      $ref: '#/UserRole'
SetActivationPasswordRequest:
  type: object
  additionalProperties: false
  required: [token, password]
  properties:
    token:
      $ref: '#/ActivationToken'
    password:
      type: string
      description: >-
        Nowe hasło — minimum 15 znaków Unicode po normalizacji NFC (polityka P2, błąd `too_short`), maksimum 256.
        Spacje i wklejanie są dozwolone, hasło nie jest przycinane.
      maxLength: 256
      writeOnly: true
RequestPasswordResetRequest:
  type: object
  additionalProperties: false
  required: [email]
  properties:
    email:
      type: string
      description: Adres e-mail konta. Sprawdzany jest tylko kształt danych; odbiorcą wiadomości jest adres z rekordu konta, nie ten z żądania.
      minLength: 1
      maxLength: 254
PasswordResetRequested:
  type: object
  description: Pusty obiekt — zawsze ta sama odpowiedź, niezależnie od konta.
  additionalProperties: false
  properties: {}
PasswordResetToken:
  type: string
  description: Jednorazowy token linku resetu hasła (256 bitów, base64url) — wyłącznie w treści POST, nigdy w adresie (fragment `#…` zostaje w przeglądarce).
  pattern: '^[A-Za-z0-9_-]{43}$'
  minLength: 43
  maxLength: 43
CheckPasswordResetLinkRequest:
  type: object
  additionalProperties: false
  required: [token]
  properties:
    token:
      $ref: '#/PasswordResetToken'
PasswordResetLinkInfo:
  type: object
  required: [email]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
CompletePasswordResetRequest:
  type: object
  additionalProperties: false
  required: [token, password]
  properties:
    token:
      $ref: '#/PasswordResetToken'
    password:
      type: string
      description: >-
        Nowe hasło — te same reguły co przy aktywacji: minimum 15 znaków Unicode po normalizacji NFC (`too_short`),
        maksimum 256 (`too_long`; górna granica chroni Argon2id). Spacje i wklejanie są dozwolone, hasło nie jest przycinane.
        Brak pytań pomocniczych i podpowiedzi hasła.
      maxLength: 256
      writeOnly: true
ActivationPasswordResult:
  type: object
  required: [csrfToken]
  properties:
    csrfToken:
      $ref: '#/CsrfToken'
PasskeyRegistrationOptions:
  type: object
  description: >-
    Opcje rejestracji klucza dostępu (WebAuthn `PublicKeyCredentialCreationOptionsJSON`, `userVerification: required`).
    Pola definiuje standard WebAuthn Level 3 — schemat jest otwarty.
  required: [rp, user, challenge, pubKeyCredParams]
  properties:
    rp:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          maxLength: 253
        name:
          type: string
          maxLength: 64
    user:
      type: object
      required: [id, name, displayName]
      properties:
        id:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 254
        displayName:
          type: string
          maxLength: 200
    challenge:
      type: string
      maxLength: 256
    pubKeyCredParams:
      type: array
      maxItems: 16
      items:
        type: object
        required: [type, alg]
        properties:
          type:
            type: string
            maxLength: 32
          alg:
            type: integer
    timeout:
      type: integer
    excludeCredentials:
      type: array
      maxItems: 32
      items:
        type: object
        required: [id, type]
        properties:
          id:
            type: string
            maxLength: 1024
          type:
            type: string
            maxLength: 32
          transports:
            type: array
            maxItems: 8
            items:
              type: string
              maxLength: 32
    authenticatorSelection:
      type: object
      properties:
        residentKey:
          type: string
          maxLength: 32
        requireResidentKey:
          type: boolean
        userVerification:
          type: string
          maxLength: 32
        authenticatorAttachment:
          type: string
          maxLength: 32
    attestation:
      type: string
      maxLength: 32
    hints:
      type: array
      maxItems: 8
      items:
        type: string
        maxLength: 32
RegisterPasskeyRequest:
  type: object
  additionalProperties: false
  required: [credential]
  properties:
    credential:
      $ref: '#/RegistrationCredential'
    name:
      type: string
      description: >-
        Nazwa klucza (EVM-028): zwykły tekst, NFC, przycięty, 1–60 znaków bez znaków sterujących i formatujących (ten sam walidator co
        nazwa wyświetlana). Brak pola → „Klucz dostępu”.
      maxLength: 60
RegistrationCredential:
  type: object
  description: Wynik `PublicKeyCredential.toJSON()` (WebAuthn `RegistrationResponseJSON`).
  additionalProperties: false
  required: [id, rawId, type, response]
  properties:
    id:
      type: string
      pattern: '^[A-Za-z0-9_-]*$'
      maxLength: 1024
    rawId:
      type: string
      pattern: '^[A-Za-z0-9_-]*$'
      maxLength: 1024
    type:
      type: string
      const: public-key
    authenticatorAttachment:
      type: string
      enum: [platform, cross-platform]
    clientExtensionResults:
      type: object
      description: Wyniki rozszerzeń WebAuthn — otwarty słownik zdefiniowany przez przeglądarkę (serwer ich nie interpretuje).
      additionalProperties: true
      maxProperties: 16
    response:
      type: object
      additionalProperties: false
      required: [clientDataJSON, attestationObject]
      properties:
        clientDataJSON:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 4096
        attestationObject:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 16384
        authenticatorData:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 16384
        publicKey:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 2048
        publicKeyAlgorithm:
          type: integer
        transports:
          type: array
          maxItems: 8
          items:
            type: string
            enum: [ble, cable, hybrid, internal, nfc, smart-card, usb]
Passkey:
  type: object
  required: [id, name, createdAt, deviceType, backedUp]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    name:
      type: string
      description: >-
        Nazwa nadana kluczowi przez właściciela (zwykły tekst, 1–60 znaków; EVM-028) albo „Klucz dostępu”, gdy nie podano nazwy
        (także klucze sprzed EVM-028). To dana osobowa wpisana przez osobę — usuwana razem z kluczem, nie trafia do e-maili, audytu ani logów.
      maxLength: 60
    createdAt:
      type: string
      format: date-time
      maxLength: 40
    deviceType:
      type: string
      enum: [single_device, multi_device]
    backedUp:
      type: boolean
CurrentSession:
  type: object
  required: [user, state, channel, csrfToken, idleExpiresAt, absoluteExpiresAt]
  properties:
    user:
      type: object
      required: [id, displayName, role]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        displayName:
          type: string
          maxLength: 200
        role:
          $ref: '#/UserRole'
    state:
      $ref: '#/SessionState'
    channel:
      $ref: '#/Channel'
    csrfToken:
      $ref: '#/CsrfToken'
    idleExpiresAt:
      type: string
      format: date-time
      description: Koniec sesji z powodu bezczynności (60 min od ostatniej aktywności); odczyt tej operacji go nie przesuwa.
      maxLength: 40
    absoluteExpiresAt:
      type: string
      format: date-time
      description: Bezwzględny koniec sesji (12 h od zalogowania; nie przesuwa się).
      maxLength: 40
LoginToken:
  type: string
  description: >-
    Jednorazowy token pierwszego kroku logowania (256 bitów, base64url, ważny 5 min) — wyłącznie w treści `POST`, trzymany
    w pamięci karty; w bazie tylko jego SHA-256.
  pattern: '^[A-Za-z0-9_-]{43}$'
  minLength: 43
  maxLength: 43
LoginRequest:
  type: object
  additionalProperties: false
  required: [email, password]
  properties:
    email:
      type: string
      description: Adres e-mail konta. Przy logowaniu sprawdzany jest tylko kształt danych (nie ma polityki jak przy aktywacji).
      minLength: 1
      maxLength: 254
    password:
      type: string
      description: >-
        Hasło — normalizowane do NFC, bez przycinania i zmiany wielkości liter; maksimum 1024 znaki (ochrona przed
        kosztownym haszowaniem), bez polityki minimalnej długości.
      minLength: 1
      maxLength: 1024
      writeOnly: true
LoginSecondStep:
  type: object
  description: Hasło poprawne, konto ma aktywny drugi krok dostępny w tym kanale dla tej roli — wymagany drugi krok (W-02).
  required: [state, loginToken, methods]
  properties:
    state:
      type: string
      const: second_step
    loginToken:
      $ref: '#/LoginToken'
    methods:
      type: array
      description: >-
        Dostępne metody drugiego kroku tego konta w tym kanale, dla jego roli (rola czytana z bazy w chwili żądania): `passkey` — klucz
        dostępu; `totp` — kod z aplikacji uwierzytelniającej (aktywny czynnik; nigdy dla Administratora w panelu); `recovery_code` — kod
        odzyskiwania (są nieużyte kody). Konfiguracja w toku (czynnik niepotwierdzony) nie jest metodą. Klient ignoruje nieznane wartości.
      maxItems: 4
      items:
        type: string
        enum: [passkey, totp, recovery_code]
SessionStarted:
  type: object
  description: Sesja rozpoczęta (ciasteczko w `Set-Cookie`) — pełna (`active`) albo ograniczona do konfiguracji drugiego kroku (`mfa_enrollment`).
  required: [state, csrfToken]
  properties:
    state:
      $ref: '#/SessionState'
    csrfToken:
      $ref: '#/CsrfToken'
LoginResult:
  description: >-
    Wynik pierwszego kroku: drugi krok (`second_step`) albo od razu sesja ograniczona `mfa_enrollment` (konto aktywne bez
    skonfigurowanego drugiego kroku).
  oneOf:
    - $ref: '#/LoginSecondStep'
    - $ref: '#/SessionStarted'
TotpCode:
  type: string
  description: Sześciocyfrowy kod z aplikacji uwierzytelniającej (dokładnie 6 cyfr ASCII, bez spacji).
  pattern: '^[0-9]{6}$'
  minLength: 6
  maxLength: 6
  writeOnly: true
RecoveryCodeInput:
  type: string
  description: >-
    Kod odzyskiwania — 20 znaków base32 (A–Z, 2–7); wielkość liter, spacje i myślniki są pomijane. Dłuższe wejście nie jest kodem.
  minLength: 1
  maxLength: 64
  writeOnly: true
LoginTotpRequest:
  type: object
  additionalProperties: false
  required: [loginToken, code]
  properties:
    loginToken:
      $ref: '#/LoginToken'
    code:
      $ref: '#/TotpCode'
LoginRecoveryCodeRequest:
  type: object
  additionalProperties: false
  required: [loginToken, code]
  properties:
    loginToken:
      $ref: '#/LoginToken'
    code:
      $ref: '#/RecoveryCodeInput'
RecoveryCodeSessionStarted:
  type: object
  description: Zalogowano kodem odzyskiwania (ciasteczko sesji w `Set-Cookie`); liczba pozostałych, nieużytych kodów — po zużyciu tego.
  required: [state, csrfToken, remainingCodes]
  properties:
    state:
      $ref: '#/SessionState'
    csrfToken:
      $ref: '#/CsrfToken'
    remainingCodes:
      type: integer
      minimum: 0
      maximum: 9
TotpSetup:
  type: object
  description: >-
    Nowy sekret czynnika TOTP (jeszcze niepotwierdzony). Sekret pokazywany jest wyłącznie w tej odpowiedzi (`Cache-Control: no-store`);
    panel generuje kod QR lokalnie, w przeglądarce — sekret nie trafia do żadnej zewnętrznej usługi.
  required: [secret, otpauthUri]
  properties:
    secret:
      type: string
      description: Klucz do wpisania ręcznie ("Pokaż klucz do wpisania") — base32 bez dopełnienia, 160 bitów.
      pattern: '^[A-Z2-7]{32}$'
      minLength: 32
      maxLength: 32
      readOnly: true
    otpauthUri:
      type: string
      description: Adres `otpauth://totp/…` do kodu QR; wydawca "EVia Manager", etykieta — e-mail pracownika.
      maxLength: 512
      readOnly: true
ConfirmTotpRequest:
  type: object
  additionalProperties: false
  required: [code]
  properties:
    code:
      $ref: '#/TotpCode'
RecoveryCodes:
  type: object
  description: >-
    Dziesięć kodów odzyskiwania, każdy 20 znaków base32. Pokazane tylko raz (`Cache-Control: no-store`, brak operacji odczytu);
    w bazie tylko skróty Argon2id.
  required: [codes]
  properties:
    codes:
      type: array
      minItems: 10
      maxItems: 10
      readOnly: true
      items:
        type: string
        pattern: '^[A-Z2-7]{20}$'
        minLength: 20
        maxLength: 20
LoginPasskeyOptionsRequest:
  type: object
  additionalProperties: false
  required: [loginToken]
  properties:
    loginToken:
      $ref: '#/LoginToken'
PasskeyAuthenticationOptions:
  type: object
  description: >-
    Opcje uwierzytelnienia kluczem dostępu (WebAuthn `PublicKeyCredentialRequestOptionsJSON`, `userVerification: required`,
    `allowCredentials` tylko z kluczami konta pierwszego kroku). Wyzwanie ≥ 128 bitów, jednorazowe, ważne 5 min.
  required: [challenge, rpId, allowCredentials, userVerification]
  properties:
    challenge:
      type: string
      maxLength: 256
    rpId:
      type: string
      maxLength: 253
    timeout:
      type: integer
    userVerification:
      type: string
      maxLength: 32
    allowCredentials:
      type: array
      maxItems: 32
      items:
        type: object
        required: [id, type]
        properties:
          id:
            type: string
            maxLength: 1024
          type:
            type: string
            maxLength: 32
          transports:
            type: array
            maxItems: 8
            items:
              type: string
              maxLength: 32
VerifyLoginPasskeyRequest:
  type: object
  additionalProperties: false
  required: [loginToken, credential]
  properties:
    loginToken:
      $ref: '#/LoginToken'
    credential:
      $ref: '#/AuthenticationCredential'
AuthenticationCredential:
  type: object
  description: Wynik `PublicKeyCredential.toJSON()` dla `navigator.credentials.get()` (WebAuthn `AuthenticationResponseJSON`).
  additionalProperties: false
  required: [id, rawId, type, response]
  properties:
    id:
      type: string
      pattern: '^[A-Za-z0-9_-]*$'
      maxLength: 1024
    rawId:
      type: string
      pattern: '^[A-Za-z0-9_-]*$'
      maxLength: 1024
    type:
      type: string
      const: public-key
    authenticatorAttachment:
      type: string
      enum: [platform, cross-platform]
    clientExtensionResults:
      type: object
      description: Wyniki rozszerzeń WebAuthn — otwarty słownik zdefiniowany przez przeglądarkę (serwer ich nie interpretuje).
      additionalProperties: true
      maxProperties: 16
    response:
      type: object
      additionalProperties: false
      required: [clientDataJSON, authenticatorData, signature]
      properties:
        clientDataJSON:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 4096
        authenticatorData:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 16384
        signature:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 2048
        userHandle:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 256
SessionExpiry:
  type: object
  description: Czas końca sesji po przedłużeniu. Bez identyfikatora sesji.
  required: [idleExpiresAt, absoluteExpiresAt]
  properties:
    idleExpiresAt:
      type: string
      format: date-time
      maxLength: 40
    absoluteExpiresAt:
      type: string
      format: date-time
      maxLength: 40
PasskeyStepUpRequest:
  type: object
  description: Odpowiedź klucza dostępu na wyzwanie step-upu.
  additionalProperties: false
  required: [credential]
  properties:
    credential:
      $ref: '#/AuthenticationCredential'
TotpStepUpRequest:
  type: object
  description: Kod z aplikacji uwierzytelniającej (Edytor, Tylko odczyt; Administrator w panelu — nie).
  additionalProperties: false
  required: [method, code]
  properties:
    method:
      type: string
      const: totp
    code:
      $ref: '#/TotpCode'
StepUpRequest:
  description: >-
    Ponowne uwierzytelnienie: odpowiedź klucza dostępu (`{ credential }`) albo kod z aplikacji (`{ method: totp, code }`). Kod
    odzyskiwania nie jest obsługiwany (decyzja 16).
  oneOf:
    - $ref: '#/PasskeyStepUpRequest'
    - $ref: '#/TotpStepUpRequest'
StepUpResult:
  type: object
  description: Nowy token CSRF (ciasteczko nowej sesji w `Set-Cookie`) — panel podmienia token i ponawia żądanie, które dostało `step_up_required`.
  required: [csrfToken]
  properties:
    csrfToken:
      $ref: '#/CsrfToken'
AssignableUser:
  type: object
  description: Użytkownik, którego można wskazać jako opiekuna zlecenia — wyłącznie identyfikator i nazwa wyświetlana (bez e-maila, roli, ostatniego logowania i statusu MFA, SR-DATA-03).
  required: [id, displayName]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 200
AssignableUserList:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      description: Aktywni użytkownicy posortowani po nazwie wyświetlanej i identyfikatorze (najwyżej 100).
      maxItems: 100
      items:
        $ref: '#/AssignableUser'
    nextCursor:
      description: Zawsze `null` — lista ma jedną stronę (kursor dojdzie addytywnie, gdy użytkowników będzie więcej niż 100).
      type: 'null'
UserStatus:
  type: string
  description: Status konta — `invited` („Oczekuje na aktywację”), `active`, `deactivated`.
  enum: [invited, active, deactivated]
InvitationState:
  type: string
  description: >-
    Stan zaproszenia konta `invited` (EVM-024): `sending` — e-mail czeka w kolejce albo jest ponawiany; `sent` — wysłany, link ważny;
    `failed` — nie wysłano po wyczerpaniu prób („Nie wysłano”, akcja „Wyślij ponownie”); `expired` — ostatni link wygasł.
  enum: [sending, sent, failed, expired]
UserInvitation:
  type: object
  description: Stan ostatniego zaproszenia konta `invited`. Bez adresu e-mail i bez tokenu.
  required: [state, sentAt, expiresAt]
  properties:
    state:
      $ref: '#/InvitationState'
    sentAt:
      description: Chwila wysłania e-maila albo `null`, gdy go jeszcze nie wysłano.
      oneOf:
        - type: string
          format: date-time
          maxLength: 40
        - type: 'null'
    expiresAt:
      description: Koniec ważności linku (72 godziny od wysłania) albo `null`, gdy link jeszcze nie powstał.
      oneOf:
        - type: string
          format: date-time
          maxLength: 40
        - type: 'null'
User:
  type: object
  description: >-
    Konto na liście użytkowników Administratora (W-16). Zawiera dane osobowe (DO-P: e-mail i nazwa) — tylko dla Administratora,
    bez hasła, kluczy dostępu, adresu IP i metod MFA.
  required: [id, email, displayName, role, status, invitation, version, activatedAt, secondStepMethods]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    email:
      type: string
      description: Adres e-mail konta (małe litery) — bez ścisłej walidacji formatu w odpowiedzi, bo konta z polecenia serwera mogą mieć adres luźniejszy niż zaproszenia.
      maxLength: 254
    displayName:
      type: string
      maxLength: 200
    role:
      $ref: '#/UserRole'
    status:
      $ref: '#/UserStatus'
    invitation:
      description: Stan zaproszenia dla konta `invited`; `null` dla pozostałych statusów.
      oneOf:
        - $ref: '#/UserInvitation'
        - type: 'null'
    version:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: >-
        Wersja konta (EVM-027) — wartość `If-Match` (`"<version>"`, także w `ETag` odpowiedzi) przy zmianie roli, dezaktywacji,
        reaktywacji i resecie drugiego kroku. Rośnie tylko przy zmianach zarządzanych (rola, status, reset, aktywacja), nie przy logowaniu.
    activatedAt:
      description: >-
        Chwila pierwszej aktywacji konta (EVM-027) albo `null`, gdy konto nigdy nie zostało aktywowane. Rozstrzyga wariant
        dialogu reaktywacji w W-16: konto z `activatedAt` wraca do `active`, bez — do `invited`.
      oneOf:
        - type: string
          format: date-time
          maxLength: 40
        - type: 'null'
    secondStepMethods:
      type: array
      description: >-
        Rodzaje aktywnych metod drugiego kroku konta (`passkey`, `totp`; EVM-027) — bez identyfikatorów poświadczeń, liczby kodów
        odzyskiwania i sekretów (SR-DATA-03). Pusta tablica = konto bez drugiego kroku.
      maxItems: 2
      uniqueItems: true
      items:
        $ref: '#/UserSecondStepMethod'
UserSecondStepMethod:
  type: string
  description: Rodzaj metody drugiego kroku widoczny dla Administratora w liście użytkowników.
  enum: [passkey, totp]
ChangeUserRoleRequest:
  type: object
  description: Zmiana roli konta (EVM-027). Tylko `role`; pole spoza kontraktu — `400 validation_failed` (`unknown_field`).
  additionalProperties: false
  required: [role]
  properties:
    role:
      $ref: '#/UserRole'
IdentityVerification:
  type: string
  description: >-
    Jak Administrator potwierdził tożsamość pracownika przed resetem drugiego kroku (EVM-027, SR-AUTH-13): osobiście albo wideo.
    Zamknięta lista — bez wolnego tekstu (trafia do audytu jako kod powodu).
  enum: [in_person, video_call]
ResetUserSecondStepRequest:
  type: object
  description: Reset drugiego kroku logowania konta (EVM-027). Pole potwierdzenia tożsamości jest wymagane.
  additionalProperties: false
  required: [identityVerification]
  properties:
    identityVerification:
      $ref: '#/IdentityVerification'
UserList:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      description: Użytkownicy (poza usuniętymi) posortowani po nazwie wyświetlanej (kolacja `pl-PL`) i identyfikatorze.
      maxItems: 100
      items:
        $ref: '#/User'
    nextCursor:
      description: Kursor następnej strony (nieprzezroczysty, ważny 30 minut) albo `null` na ostatniej stronie.
      oneOf:
        - type: string
          maxLength: 512
        - type: 'null'
InviteUserRequest:
  type: object
  description: >-
    Zaproszenie użytkownika (EVM-024). `id` (UUIDv7) nadaje klient (ponowienie używa tego samego `id` i `Idempotency-Key`). Adres
    e-mail jest normalizowany (NFC, małe litery); adres z CR/LF, cudzysłowem, `<>,;` lub więcej niż jednym `@` — `400 validation_failed`
    (`invalid_email`). Nazwa wyświetlana to zwykły tekst 1–200 znaków bez znaków sterujących.
  additionalProperties: false
  required: [id, email, displayName, role]
  properties:
    id:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      maxLength: 36
    email:
      type: string
      maxLength: 254
    displayName:
      type: string
      maxLength: 200
    role:
      $ref: '#/UserRole'
ReauthenticationPurpose:
  type: string
  description: >-
    Cel pełnego ponownego uwierzytelnienia (EVM-028; SR-AUTH-10, ASVS V7.5.1): `second_step_change` — zmiana metod drugiego kroku
    albo nowe kody odzyskiwania (hasło + drugi krok); `password_change` — zmiana hasła (sam drugi krok; bieżące hasło podaje
    `changePassword`). Znacznik jest związany z sesją i celem, jednorazowy i ważny 5 minut.
  enum: [second_step_change, password_change]
ReauthenticationPassword:
  type: string
  description: >-
    Bieżące hasło — wymagane dla celu `second_step_change`, niedozwolone dla `password_change` (`400 validation_failed`). Normalizowane
    do NFC, bez przycinania; maksimum 1024 znaki.
  minLength: 1
  maxLength: 1024
  writeOnly: true
ReauthenticationPasskeyRequest:
  type: object
  description: Pełne ponowne uwierzytelnienie kluczem dostępu (odpowiedź na wyzwanie z `getStepUpPasskeyOptions`).
  additionalProperties: false
  required: [purpose, credential]
  properties:
    purpose:
      $ref: '#/ReauthenticationPurpose'
    password:
      $ref: '#/ReauthenticationPassword'
    credential:
      $ref: '#/AuthenticationCredential'
ReauthenticationTotpRequest:
  type: object
  description: Pełne ponowne uwierzytelnienie kodem z aplikacji (Edytor, Tylko odczyt).
  additionalProperties: false
  required: [purpose, method, code]
  properties:
    purpose:
      $ref: '#/ReauthenticationPurpose'
    password:
      $ref: '#/ReauthenticationPassword'
    method:
      type: string
      const: totp
    code:
      $ref: '#/TotpCode'
ReauthenticationRequest:
  description: >-
    Pełne ponowne uwierzytelnienie: cel, hasło (tylko dla `second_step_change`) i drugi krok — klucz dostępu (`{ credential }`) albo kod
    z aplikacji (`{ method: totp, code }`). Kod odzyskiwania nie jest obsługiwany (decyzja 16).
  oneOf:
    - $ref: '#/ReauthenticationPasskeyRequest'
    - $ref: '#/ReauthenticationTotpRequest'
AccountTotp:
  type: object
  description: Kod z aplikacji uwierzytelniającej dodany do konta (bez sekretu).
  required: [addedAt]
  properties:
    addedAt:
      type: string
      format: date-time
      maxLength: 40
AccountRecoveryCodes:
  type: object
  description: Stan kodów odzyskiwania (bez kodów i skrótów).
  required: [remaining, generatedAt]
  properties:
    remaining:
      type: integer
      minimum: 0
      maximum: 10
    generatedAt:
      type: string
      format: date-time
      maxLength: 40
AccountSecondStep:
  type: object
  description: Metody drugiego kroku konta (bez sekretów, kluczy publicznych i identyfikatorów poświadczeń).
  required: [passkeys, totp, recoveryCodes]
  properties:
    passkeys:
      type: array
      maxItems: 50
      items:
        $ref: '#/Passkey'
    totp:
      description: Kod z aplikacji albo `null`, gdy go nie dodano (Administrator — służy tylko do aplikacji na telefonie).
      oneOf:
        - $ref: '#/AccountTotp'
        - type: 'null'
    recoveryCodes:
      description: Stan kodów odzyskiwania albo `null`, gdy konto nigdy ich nie wygenerowało.
      oneOf:
        - $ref: '#/AccountRecoveryCodes'
        - type: 'null'
Account:
  type: object
  description: >-
    Własne konto zalogowanego użytkownika (W-15; EVM-028). Zawiera dane osobowe (e-mail, nazwa, nazwy kluczy) — wyłącznie dla właściciela,
    `Cache-Control: no-store`.
  required: [displayName, email, role, secondStep]
  properties:
    displayName:
      type: string
      maxLength: 200
    email:
      type: string
      maxLength: 254
    role:
      $ref: '#/UserRole'
    secondStep:
      $ref: '#/AccountSecondStep'
UpdateAccountRequest:
  type: object
  description: >-
    Zmiana własnej nazwy wyświetlanej (EVM-028 AC1): zwykły tekst, NFC, przycięty, 1–200 znaków bez znaków sterujących i formatujących
    (`required`, `too_long`, `invalid_characters`). Identyfikator konta nie jest polem żądania — konto to sesja (pole `userId` → `400`).
  additionalProperties: false
  required: [displayName]
  properties:
    displayName:
      type: string
      maxLength: 200
ChangePasswordRequest:
  type: object
  description: >-
    Zmiana hasła (EVM-028 AC2): bieżące hasło i nowe. Nowe hasło przechodzi reguły SR-AUTH-01 i SR-AUTH-02 (minimum 15 znaków po NFC,
    hasła popularne i kontekstowe, Pwned Passwords) i różni się od bieżącego.
  additionalProperties: false
  required: [currentPassword, newPassword]
  properties:
    currentPassword:
      type: string
      minLength: 1
      maxLength: 1024
      writeOnly: true
    newPassword:
      type: string
      maxLength: 256
      writeOnly: true
PasswordChanged:
  type: object
  description: Wynik zmiany hasła — liczba pozostałych aktywnych sesji konta (do propozycji „Zakończ pozostałe sesje”).
  required: [otherActiveSessions]
  properties:
    otherActiveSessions:
      type: integer
      minimum: 0
      maximum: 1000
AccountSession:
  type: object
  description: >-
    Własna sesja web konta (W-15 „Moje sesje”; SR-SESS-07, P9). `id` to nieprzezroczysty identyfikator rekordu (nie token ani jego skrót).
    `browser` i `os` pochodzą ze zamkniętego słownika (bez wersji, nigdy surowy User-Agent). `ipAddress` to pełny adres własnej sesji (P9).
  required: [id, current, browser, os, ipAddress, lastSeenAt]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    current:
      type: boolean
      description: Sesja bieżącego żądania („Ta sesja”).
    browser:
      type: string
      maxLength: 40
    os:
      type: string
      maxLength: 40
    ipAddress:
      description: Pełny adres IP zapisany przy logowaniu albo `null`, gdy go nie zapisano.
      oneOf:
        - type: string
          maxLength: 45
        - type: 'null'
    lastSeenAt:
      type: string
      format: date-time
      maxLength: 40
AccountSessionList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      description: Aktywne, niewygasłe sesje web konta — najstarsza pierwsza (konto ma ich najwyżej 5).
      maxItems: 20
      items:
        $ref: '#/AccountSession'
EndedSessions:
  type: object
  description: Liczba zakończonych sesji (bieżąca zostaje).
  required: [ended]
  properties:
    ended:
      type: integer
      minimum: 0
      maximum: 1000
MobileDeviceInfo:
  type: object
  description: >-
    Opis telefonu przy logowaniu (minimalizacja, MASVS-PRIVACY-1): model, wersja systemu i poziom poprawek bezpieczeństwa.
    Bez IMEI, numeru seryjnego, ANDROID_ID i identyfikatora reklamowego (`rodo.md`, inwentarz „Device”).
  additionalProperties: false
  required: [model, osVersion, securityPatch]
  properties:
    model:
      type: string
      description: Model telefonu (np. `Pixel 8`).
      pattern: '^[A-Za-z0-9 ._()/+-]{1,100}$'
      minLength: 1
      maxLength: 100
    osVersion:
      type: string
      description: Wersja Androida (np. `14` albo `14.0.1`).
      pattern: '^[0-9]{1,2}(\.[0-9]{1,3}){0,2}$'
      minLength: 1
      maxLength: 16
    securityPatch:
      type: string
      description: Poziom poprawek bezpieczeństwa systemu (dzień, `RRRR-MM-DD`).
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      minLength: 10
      maxLength: 10
MobileLoginRequest:
  type: object
  description: >-
    Pierwszy krok logowania telefonu. Pierwsze logowanie: `email`, `password`, `device` — `deviceId` nadaje serwer. Ponowne logowanie
    tej samej instalacji: dodatkowo para `deviceId` + `installationSecret` (obie albo żadna, inaczej `400 validation_failed`); para
    niezgodna z urządzeniem konta jest ignorowana (telefon liczy się jak nowy), a zgodna z urządzeniem w stanie `wipe_required` daje
    `401 device_wipe_required` jeszcze przed sprawdzeniem hasła. Pola
    spoza schematu → `400 unknown_field`; pola `userId` i `deviceId` w znaczeniu „kto” nie istnieją — użytkownik wynika z hasła.
  additionalProperties: false
  required: [email, password, device]
  properties:
    email:
      type: string
      description: Adres e-mail konta (sprawdzany jest kształt; zły adres i złe hasło dają tę samą odpowiedź).
      minLength: 1
      maxLength: 254
    password:
      type: string
      description: Hasło (maksimum 256 znaków chroni Argon2id); nie jest przycinane.
      minLength: 1
      maxLength: 256
      writeOnly: true
    device:
      $ref: '#/MobileDeviceInfo'
    devicePublicKey:
      type: string
      description: >-
        Opcjonalny klucz publiczny urządzenia (base64url) — rezerwa pod powiązanie tokenu z urządzeniem (ADR-0005, decyzja 8); w M2
        serwer go tylko zapisuje i nie wymaga.
      pattern: '^[A-Za-z0-9_-]{16,512}$'
      minLength: 16
      maxLength: 512
    deviceId:
      $ref: devices.yaml#/DeviceId
    installationSecret:
      $ref: devices.yaml#/InstallationSecret
MobileLoginChallenge:
  type: object
  description: Pierwszy krok zaliczony — czas na kod z aplikacji TOTP.
  additionalProperties: false
  required: [challengeToken, challengeExpiresAt]
  properties:
    challengeToken:
      type: string
      description: >-
        Nieprzezroczysty, jednorazowy token wyzwania (≥ 256 bitów, base64url), ważny najwyżej 5 minut, związany z kontem i próbą
        rejestracji urządzenia; trzymany w pamięci aplikacji, nigdy w adresie.
      pattern: '^[A-Za-z0-9_-]{43}$'
      minLength: 43
      maxLength: 43
    challengeExpiresAt:
      type: string
      format: date-time
      description: Koniec ważności tokenu wyzwania (UTC; najwyżej 5 minut od wydania).
      maxLength: 40
MobileLoginTotpRequest:
  type: object
  description: >-
    Drugi krok: ściśle `{challengeToken, code}`. Kod odzyskiwania nie działa w kanale mobilnym (pole z kodem odzyskiwania → `400`).
  additionalProperties: false
  required: [challengeToken, code]
  properties:
    challengeToken:
      type: string
      description: Token wyzwania z pierwszego kroku.
      pattern: '^[A-Za-z0-9_-]{43}$'
      minLength: 43
      maxLength: 43
      writeOnly: true
    code:
      type: string
      description: Kod z aplikacji TOTP — dokładnie 6 cyfr ASCII.
      pattern: '^[0-9]{6}$'
      minLength: 6
      maxLength: 6
      writeOnly: true
MobileUser:
  type: object
  description: Zalogowany użytkownik — tylko to, co aplikacja pokazuje i do czego używa roli (bez e-maila i czasów logowania).
  additionalProperties: false
  required: [id, displayName, role]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 200
    role:
      $ref: '#/UserRole'
MobileSession:
  type: object
  description: >-
    Sesja mobilna: krótkotrwały token dostępu (15 min) i rotowany token odświeżania (ADR-0005). Wszystkie tokeny wyłącznie w treści
    odpowiedzi. Odpowiedź nigdy nie ustawia ciasteczek.
  additionalProperties: false
  required: [deviceId, accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, serverTime, user]
  properties:
    deviceId:
      $ref: devices.yaml#/DeviceId
    installationSecret:
      type: string
      description: >-
        Sekret instalacji — przy KAŻDYM udanym logowaniu (`mobileLoginTotp`): przy rejestracji nowego urządzenia i przy ponownym
        logowaniu tej samej instalacji (rotacja; poprzedni sekret przestaje działać atomowo). Aplikacja zapisuje nowy sekret
        w Android Keystore przed porzuceniem starego i nie pokazuje go ani nie loguje. Przy odświeżaniu tokenu pola nie ma.
      pattern: '^[A-Za-z0-9_-]{43}$'
      minLength: 43
      maxLength: 43
      readOnly: true
    accessToken:
      type: string
      description: >-
        Nieprzezroczysty token dostępu (nagłówek `Authorization` ze schematem Bearer), ważny 15 minut.
      minLength: 32
      maxLength: 512
    accessTokenExpiresAt:
      type: string
      format: date-time
      maxLength: 40
    refreshToken:
      type: string
      description: Nieprzezroczysty token odświeżania, używany raz (rotacja); ponowne użycie unieważnia rodzinę tokenów i wywołuje alert.
      minLength: 32
      maxLength: 512
    refreshTokenExpiresAt:
      type: string
      format: date-time
      maxLength: 40
    serverTime:
      type: string
      format: date-time
      description: Czas serwera (UTC) — punkt odniesienia reguł czasowych aplikacji (nie zegar telefonu).
      maxLength: 40
    user:
      $ref: '#/MobileUser'
RefreshMobileSessionRequest:
  type: object
  description: Odświeżenie sesji — wyłącznie token odświeżania w treści.
  additionalProperties: false
  required: [refreshToken]
  properties:
    refreshToken:
      type: string
      minLength: 32
      maxLength: 512
      writeOnly: true
