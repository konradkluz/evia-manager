# Module `identity` — activation of the first Administrator, passkeys, session (EVM-016). Request schemas are strict
# (`additionalProperties: false`, every string has `maxLength`): an unknown field is rejected, so identifiers such as
# `userId` or `sessionId` cannot be injected into a body (SR-AUTHZ-01, CWE-915).
UserRole:
  type: string
  description: Rola użytkownika (słownik domeny — Administrator, Edytor, Tylko odczyt).
  enum: [administrator, editor, read_only]
Channel:
  type: string
  description: Kanał sesji. W M1 wszystkie sesje są `web`; `mobile` od E9 (SR-AUTHZ-12).
  enum: [web, mobile]
SessionState:
  type: string
  description: >-
    `mfa_enrollment` — hasło ustawione, brak klucza dostępu (dopuszczone tylko operacje rejestracji klucza,
    wylogowania i odczytu sesji); `active` — pełna sesja.
  enum: [mfa_enrollment, active]
ActivationToken:
  type: string
  description: Jednorazowy token linku aktywacyjnego (256 bitów, base64url) — wyłącznie w treści POST, nigdy w adresie.
  pattern: '^[A-Za-z0-9_-]{43}$'
  minLength: 43
  maxLength: 43
CsrfToken:
  type: string
  description: Token CSRF sesji (nagłówek `X-CSRF-Token` w mutacjach) — zmienia się razem z sesją.
  pattern: '^[A-Za-z0-9_-]{43}$'
  maxLength: 43
CheckActivationLinkRequest:
  type: object
  additionalProperties: false
  required: [token]
  properties:
    token:
      $ref: '#/ActivationToken'
ActivationLinkInfo:
  type: object
  required: [email, role]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
    role:
      $ref: '#/UserRole'
SetActivationPasswordRequest:
  type: object
  additionalProperties: false
  required: [token, password]
  properties:
    token:
      $ref: '#/ActivationToken'
    password:
      type: string
      description: >-
        Nowe hasło — minimum 15 znaków Unicode po normalizacji NFC (polityka P2, błąd `too_short`), maksimum 256.
        Spacje i wklejanie są dozwolone, hasło nie jest przycinane.
      maxLength: 256
      writeOnly: true
RequestPasswordResetRequest:
  type: object
  additionalProperties: false
  required: [email]
  properties:
    email:
      type: string
      description: Adres e-mail konta. Sprawdzany jest tylko kształt danych; odbiorcą wiadomości jest adres z rekordu konta, nie ten z żądania.
      minLength: 1
      maxLength: 254
PasswordResetRequested:
  type: object
  description: Pusty obiekt — zawsze ta sama odpowiedź, niezależnie od konta.
  additionalProperties: false
  properties: {}
PasswordResetToken:
  type: string
  description: Jednorazowy token linku resetu hasła (256 bitów, base64url) — wyłącznie w treści POST, nigdy w adresie (fragment `#…` zostaje w przeglądarce).
  pattern: '^[A-Za-z0-9_-]{43}$'
  minLength: 43
  maxLength: 43
CheckPasswordResetLinkRequest:
  type: object
  additionalProperties: false
  required: [token]
  properties:
    token:
      $ref: '#/PasswordResetToken'
PasswordResetLinkInfo:
  type: object
  required: [email]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
CompletePasswordResetRequest:
  type: object
  additionalProperties: false
  required: [token, password]
  properties:
    token:
      $ref: '#/PasswordResetToken'
    password:
      type: string
      description: >-
        Nowe hasło — te same reguły co przy aktywacji: minimum 15 znaków Unicode po normalizacji NFC (`too_short`),
        maksimum 256 (`too_long`; górna granica chroni Argon2id). Spacje i wklejanie są dozwolone, hasło nie jest przycinane.
        Brak pytań pomocniczych i podpowiedzi hasła.
      maxLength: 256
      writeOnly: true
ActivationPasswordResult:
  type: object
  required: [csrfToken]
  properties:
    csrfToken:
      $ref: '#/CsrfToken'
PasskeyRegistrationOptions:
  type: object
  description: >-
    Opcje rejestracji klucza dostępu (WebAuthn `PublicKeyCredentialCreationOptionsJSON`, `userVerification: required`).
    Pola definiuje standard WebAuthn Level 3 — schemat jest otwarty.
  required: [rp, user, challenge, pubKeyCredParams]
  properties:
    rp:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          maxLength: 253
        name:
          type: string
          maxLength: 64
    user:
      type: object
      required: [id, name, displayName]
      properties:
        id:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 254
        displayName:
          type: string
          maxLength: 200
    challenge:
      type: string
      maxLength: 256
    pubKeyCredParams:
      type: array
      maxItems: 16
      items:
        type: object
        required: [type, alg]
        properties:
          type:
            type: string
            maxLength: 32
          alg:
            type: integer
    timeout:
      type: integer
    excludeCredentials:
      type: array
      maxItems: 32
      items:
        type: object
        required: [id, type]
        properties:
          id:
            type: string
            maxLength: 1024
          type:
            type: string
            maxLength: 32
          transports:
            type: array
            maxItems: 8
            items:
              type: string
              maxLength: 32
    authenticatorSelection:
      type: object
      properties:
        residentKey:
          type: string
          maxLength: 32
        requireResidentKey:
          type: boolean
        userVerification:
          type: string
          maxLength: 32
        authenticatorAttachment:
          type: string
          maxLength: 32
    attestation:
      type: string
      maxLength: 32
    hints:
      type: array
      maxItems: 8
      items:
        type: string
        maxLength: 32
RegisterPasskeyRequest:
  type: object
  additionalProperties: false
  required: [credential]
  properties:
    credential:
      $ref: '#/RegistrationCredential'
RegistrationCredential:
  type: object
  description: Wynik `PublicKeyCredential.toJSON()` (WebAuthn `RegistrationResponseJSON`).
  additionalProperties: false
  required: [id, rawId, type, response]
  properties:
    id:
      type: string
      pattern: '^[A-Za-z0-9_-]*$'
      maxLength: 1024
    rawId:
      type: string
      pattern: '^[A-Za-z0-9_-]*$'
      maxLength: 1024
    type:
      type: string
      const: public-key
    authenticatorAttachment:
      type: string
      enum: [platform, cross-platform]
    clientExtensionResults:
      type: object
      description: Wyniki rozszerzeń WebAuthn — otwarty słownik zdefiniowany przez przeglądarkę (serwer ich nie interpretuje).
      additionalProperties: true
      maxProperties: 16
    response:
      type: object
      additionalProperties: false
      required: [clientDataJSON, attestationObject]
      properties:
        clientDataJSON:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 4096
        attestationObject:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 16384
        authenticatorData:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 16384
        publicKey:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 2048
        publicKeyAlgorithm:
          type: integer
        transports:
          type: array
          maxItems: 8
          items:
            type: string
            enum: [ble, cable, hybrid, internal, nfc, smart-card, usb]
Passkey:
  type: object
  required: [id, createdAt, deviceType, backedUp]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    createdAt:
      type: string
      format: date-time
      maxLength: 40
    deviceType:
      type: string
      enum: [single_device, multi_device]
    backedUp:
      type: boolean
CurrentSession:
  type: object
  required: [user, state, channel, csrfToken, idleExpiresAt, absoluteExpiresAt]
  properties:
    user:
      type: object
      required: [id, displayName, role]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        displayName:
          type: string
          maxLength: 200
        role:
          $ref: '#/UserRole'
    state:
      $ref: '#/SessionState'
    channel:
      $ref: '#/Channel'
    csrfToken:
      $ref: '#/CsrfToken'
    idleExpiresAt:
      type: string
      format: date-time
      description: Koniec sesji z powodu bezczynności (60 min od ostatniej aktywności); odczyt tej operacji go nie przesuwa.
      maxLength: 40
    absoluteExpiresAt:
      type: string
      format: date-time
      description: Bezwzględny koniec sesji (12 h od zalogowania; nie przesuwa się).
      maxLength: 40
LoginToken:
  type: string
  description: >-
    Jednorazowy token pierwszego kroku logowania (256 bitów, base64url, ważny 5 min) — wyłącznie w treści `POST`, trzymany
    w pamięci karty; w bazie tylko jego SHA-256.
  pattern: '^[A-Za-z0-9_-]{43}$'
  minLength: 43
  maxLength: 43
LoginRequest:
  type: object
  additionalProperties: false
  required: [email, password]
  properties:
    email:
      type: string
      description: Adres e-mail konta. Przy logowaniu sprawdzany jest tylko kształt danych (nie ma polityki jak przy aktywacji).
      minLength: 1
      maxLength: 254
    password:
      type: string
      description: >-
        Hasło — normalizowane do NFC, bez przycinania i zmiany wielkości liter; maksimum 1024 znaki (ochrona przed
        kosztownym haszowaniem), bez polityki minimalnej długości.
      minLength: 1
      maxLength: 1024
      writeOnly: true
LoginSecondStep:
  type: object
  description: Hasło poprawne, konto ma klucz dostępu — wymagany drugi krok (W-02).
  required: [state, loginToken, methods]
  properties:
    state:
      type: string
      const: second_step
    loginToken:
      $ref: '#/LoginToken'
    methods:
      type: array
      description: Dostępne metody drugiego kroku. Do EVM-023 wyłącznie klucz dostępu.
      maxItems: 4
      items:
        type: string
        enum: [passkey]
SessionStarted:
  type: object
  description: Sesja rozpoczęta (ciasteczko w `Set-Cookie`) — pełna (`active`) albo ograniczona do konfiguracji drugiego kroku (`mfa_enrollment`).
  required: [state, csrfToken]
  properties:
    state:
      $ref: '#/SessionState'
    csrfToken:
      $ref: '#/CsrfToken'
LoginResult:
  description: >-
    Wynik pierwszego kroku: drugi krok (`second_step`) albo od razu sesja ograniczona `mfa_enrollment` (konto aktywne bez
    skonfigurowanego drugiego kroku).
  oneOf:
    - $ref: '#/LoginSecondStep'
    - $ref: '#/SessionStarted'
LoginPasskeyOptionsRequest:
  type: object
  additionalProperties: false
  required: [loginToken]
  properties:
    loginToken:
      $ref: '#/LoginToken'
PasskeyAuthenticationOptions:
  type: object
  description: >-
    Opcje uwierzytelnienia kluczem dostępu (WebAuthn `PublicKeyCredentialRequestOptionsJSON`, `userVerification: required`,
    `allowCredentials` tylko z kluczami konta pierwszego kroku). Wyzwanie ≥ 128 bitów, jednorazowe, ważne 5 min.
  required: [challenge, rpId, allowCredentials, userVerification]
  properties:
    challenge:
      type: string
      maxLength: 256
    rpId:
      type: string
      maxLength: 253
    timeout:
      type: integer
    userVerification:
      type: string
      maxLength: 32
    allowCredentials:
      type: array
      maxItems: 32
      items:
        type: object
        required: [id, type]
        properties:
          id:
            type: string
            maxLength: 1024
          type:
            type: string
            maxLength: 32
          transports:
            type: array
            maxItems: 8
            items:
              type: string
              maxLength: 32
VerifyLoginPasskeyRequest:
  type: object
  additionalProperties: false
  required: [loginToken, credential]
  properties:
    loginToken:
      $ref: '#/LoginToken'
    credential:
      $ref: '#/AuthenticationCredential'
AuthenticationCredential:
  type: object
  description: Wynik `PublicKeyCredential.toJSON()` dla `navigator.credentials.get()` (WebAuthn `AuthenticationResponseJSON`).
  additionalProperties: false
  required: [id, rawId, type, response]
  properties:
    id:
      type: string
      pattern: '^[A-Za-z0-9_-]*$'
      maxLength: 1024
    rawId:
      type: string
      pattern: '^[A-Za-z0-9_-]*$'
      maxLength: 1024
    type:
      type: string
      const: public-key
    authenticatorAttachment:
      type: string
      enum: [platform, cross-platform]
    clientExtensionResults:
      type: object
      description: Wyniki rozszerzeń WebAuthn — otwarty słownik zdefiniowany przez przeglądarkę (serwer ich nie interpretuje).
      additionalProperties: true
      maxProperties: 16
    response:
      type: object
      additionalProperties: false
      required: [clientDataJSON, authenticatorData, signature]
      properties:
        clientDataJSON:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 4096
        authenticatorData:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 16384
        signature:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 2048
        userHandle:
          type: string
          pattern: '^[A-Za-z0-9_-]*$'
          maxLength: 256
SessionExpiry:
  type: object
  description: Czas końca sesji po przedłużeniu. Bez identyfikatora sesji.
  required: [idleExpiresAt, absoluteExpiresAt]
  properties:
    idleExpiresAt:
      type: string
      format: date-time
      maxLength: 40
    absoluteExpiresAt:
      type: string
      format: date-time
      maxLength: 40
StepUpRequest:
  type: object
  description: Odpowiedź klucza dostępu na wyzwanie step-upu. Jedyna metoda (kod odzyskiwania nie jest obsługiwany — decyzja 16).
  additionalProperties: false
  required: [credential]
  properties:
    credential:
      $ref: '#/AuthenticationCredential'
StepUpResult:
  type: object
  description: Nowy token CSRF (ciasteczko nowej sesji w `Set-Cookie`) — panel podmienia token i ponawia żądanie, które dostało `step_up_required`.
  required: [csrfToken]
  properties:
    csrfToken:
      $ref: '#/CsrfToken'
AssignableUser:
  type: object
  description: Użytkownik, którego można wskazać jako opiekuna zlecenia — wyłącznie identyfikator i nazwa wyświetlana (bez e-maila, roli, ostatniego logowania i statusu MFA, SR-DATA-03).
  required: [id, displayName]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 200
AssignableUserList:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      description: Aktywni użytkownicy posortowani po nazwie wyświetlanej i identyfikatorze (najwyżej 100).
      maxItems: 100
      items:
        $ref: '#/AssignableUser'
    nextCursor:
      description: Zawsze `null` — lista ma jedną stronę (kursor dojdzie addytywnie, gdy użytkowników będzie więcej niż 100).
      type: 'null'
UserStatus:
  type: string
  description: Status konta — `invited` („Oczekuje na aktywację”), `active`, `deactivated`.
  enum: [invited, active, deactivated]
InvitationState:
  type: string
  description: >-
    Stan zaproszenia konta `invited` (EVM-024): `sending` — e-mail czeka w kolejce albo jest ponawiany; `sent` — wysłany, link ważny;
    `failed` — nie wysłano po wyczerpaniu prób („Nie wysłano”, akcja „Wyślij ponownie”); `expired` — ostatni link wygasł.
  enum: [sending, sent, failed, expired]
UserInvitation:
  type: object
  description: Stan ostatniego zaproszenia konta `invited`. Bez adresu e-mail i bez tokenu.
  required: [state, sentAt, expiresAt]
  properties:
    state:
      $ref: '#/InvitationState'
    sentAt:
      description: Chwila wysłania e-maila albo `null`, gdy go jeszcze nie wysłano.
      oneOf:
        - type: string
          format: date-time
          maxLength: 40
        - type: 'null'
    expiresAt:
      description: Koniec ważności linku (72 godziny od wysłania) albo `null`, gdy link jeszcze nie powstał.
      oneOf:
        - type: string
          format: date-time
          maxLength: 40
        - type: 'null'
User:
  type: object
  description: >-
    Konto na liście użytkowników Administratora (W-16). Zawiera dane osobowe (DO-P: e-mail i nazwa) — tylko dla Administratora,
    bez hasła, kluczy dostępu, adresu IP i metod MFA.
  required: [id, email, displayName, role, status, invitation]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    email:
      type: string
      description: Adres e-mail konta (małe litery) — bez ścisłej walidacji formatu w odpowiedzi, bo konta z polecenia serwera mogą mieć adres luźniejszy niż zaproszenia.
      maxLength: 254
    displayName:
      type: string
      maxLength: 200
    role:
      $ref: '#/UserRole'
    status:
      $ref: '#/UserStatus'
    invitation:
      description: Stan zaproszenia dla konta `invited`; `null` dla pozostałych statusów.
      oneOf:
        - $ref: '#/UserInvitation'
        - type: 'null'
UserList:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      description: Użytkownicy (poza usuniętymi) posortowani po nazwie wyświetlanej (kolacja `pl-PL`) i identyfikatorze.
      maxItems: 100
      items:
        $ref: '#/User'
    nextCursor:
      description: Kursor następnej strony (nieprzezroczysty, ważny 30 minut) albo `null` na ostatniej stronie.
      oneOf:
        - type: string
          maxLength: 512
        - type: 'null'
InviteUserRequest:
  type: object
  description: >-
    Zaproszenie użytkownika (EVM-024). `id` (UUIDv7) nadaje klient (ponowienie używa tego samego `id` i `Idempotency-Key`). Adres
    e-mail jest normalizowany (NFC, małe litery); adres z CR/LF, cudzysłowem, `<>,;` lub więcej niż jednym `@` — `400 validation_failed`
    (`invalid_email`). Nazwa wyświetlana to zwykły tekst 1–200 znaków bez znaków sterujących.
  additionalProperties: false
  required: [id, email, displayName, role]
  properties:
    id:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      maxLength: 36
    email:
      type: string
      maxLength: 254
    displayName:
      type: string
      maxLength: 200
    role:
      $ref: '#/UserRole'
