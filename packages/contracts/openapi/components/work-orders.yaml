# Module `work-orders` — the list of work orders (EVM-017; W-10). The list item carries only what the table shows: the customer name and
# the address without postal code (EVM-072), no description (they arrive with the stories that own them, additively). `title` is free text and may name a customer —
# it never reaches a URL, a log or a metric. The coordinator is `{id, displayName}` only (SR-DATA-03): no e-mail, role or account status.
WorkOrderStatus:
  type: string
  description: >-
    Status zlecenia (zamknięta lista po stronie serwera; klient obsługuje też wartość nieznaną — P-12). „Niezamknięte” to wszystkie
    poza `settled` i `cancelled`.
  enum: [new, quoting, accepted, in_progress, completed, settled, on_hold, cancelled]
WorkOrderSort:
  type: string
  description: >-
    Sortowanie: `-number` (numer malejąco, domyślne), `number`, `-createdAt`, `createdAt`, `longestWaitingSince` („Najdłużej
    czekamy”: najstarszy `waitingSince` oczekujących etapów rosnąco, zlecenia bez oczekiwań na końcu) i `nextDueDate` („Termin”:
    najbliższy termin niezakończonego etapu rosnąco, bez terminu na końcu) — oba tylko rosnąco, remis rozstrzyga identyfikator.
    `urgency` („Najpilniejsze”, EVM-056; tylko rosnąco, ADR-0017 D9): pierwsza pasująca grupa, w grupie klucz rosnąco, remis —
    identyfikator: 1) zlecenie niezamknięte z transzą albo etapem po terminie (klucz: najstarszy miniony termin), 2) zlecenie
    niezamknięte czekające dłużej niż 14 dni (klucz: `waitingSince` najdłuższego oczekiwania), 3) zlecenie niezamknięte z
    terminem etapu od dziś (klucz: najbliższy termin), 4) pozostałe, także zamknięte. Rola bez odczytu płatności dostaje
    kolejność bez składowej płatności (grupa 1 tylko z etapów). Serwer odrzuca wartość spoza listy (`400 validation_failed`).
  enum: [-number, number, -createdAt, createdAt, longestWaitingSince, nextDueDate, urgency]
WorkOrderView:
  type: string
  description: >-
    Widok: `all_open` (status poza `settled` i `cancelled`), `mine` (opiekun to zalogowany użytkownik — zawsze z sesji) albo
    `waiting_on_dso_over_14_days` („Czekamy na OSD > 14 dni”: zlecenie niezamknięte z etapem oczekującym na stronę rodzaju
    `distribution_system_operator` od ponad 14 dni; łączy się przez AND z pozostałymi filtrami). Brak parametru oznacza brak
    predykatu widoku; domyślny widok panelu („Wszystkie niezamknięte”) wysyła `view=all_open` jawnie. Widoki płatności (EVM-056,
    tylko zlecenia niezamknięte): `overdue_payments` („Po terminie”: transza wystawiona z terminem wcześniejszym niż dziś) i
    `unpaid` („Nieopłacone”: co najmniej jedna transza wystawiona, także po terminie); wymagają prawa odczytu płatności
    (`x-evia-authz.restrictedParams`) — bez niego `403 forbidden`.
  enum: [all_open, mine, waiting_on_dso_over_14_days, overdue_payments, unpaid]
WorkOrderWaitingOnFilter:
  type: string
  description: >-
    Filtr „Czekamy na”: `customer` — na klienta, `party` — na stronę (razem z `waitingOnPartyKind` — na stronę danego rodzaju).
  enum: [customer, party]
WorkOrderWaitingOn:
  type: string
  description: >-
    Na kogo czekamy w kolumnie „Czekamy na”: `customer` albo `party`. Lista wartości jest rozszerzalna — klient obsługuje też
    wartość nieznaną (etykieta zapasowa); dodanie wartości nie jest zmianą łamiącą.
  x-extensible-enum: [customer, party]
WorkOrderWaitingPartyKind:
  type: string
  description: >-
    Rodzaj strony, na którą czekamy (kod słownika rodzajów stron). Lista jest rozszerzalna — klient obsługuje też wartość
    nieznaną (etykieta zapasowa); dodanie rodzaju nie jest zmianą łamiącą.
  x-extensible-enum:
    - building_administration
    - property_manager
    - housing_community
    - designer
    - fire_safety_expert
    - technical_expert
    - distribution_system_operator
    - subcontractor
    - supplier
    - other
WorkOrderWaitingParty:
  type: object
  description: >-
    Strona, na którą czekamy — identyfikator, nazwa wyświetlana i rodzaj, nic więcej (SR-DATA-02). Nazwa strony będącej osobą
    fizyczną to dane osobowe (DO-3) — panel wyświetla ją jako tekst. Strona niewidoczna dla wołającego nie występuje (`party` = `null`).
  required: [id, displayName, kind]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 200
    kind:
      $ref: '#/WorkOrderWaitingPartyKind'
WorkOrderWaiting:
  type: object
  description: >-
    Najdłuższe oczekiwanie zlecenia (kolumna „Czekamy na”, W-10): na kogo, od kiedy i od ilu dni (pełne dni kalendarzowe,
    `Europe/Warsaw`, liczy serwer z zegara żądania), oraz ile innych oczekiwań ma zlecenie (`otherCount`, „+n”). Powyżej 14 dni panel
    ostrzega.
  required: [waitingOn, party, since, days, otherCount]
  additionalProperties: false
  properties:
    waitingOn:
      $ref: '#/WorkOrderWaitingOn'
    party:
      description: Strona, na którą czekamy (`waitingOn` = `party`), albo `null` (klient albo strona niewidoczna).
      oneOf:
        - $ref: '#/WorkOrderWaitingParty'
        - type: 'null'
    since:
      type: string
      format: date
      description: Od kiedy czekamy (dzień w strefie `Europe/Warsaw`, `RRRR-MM-DD`).
      maxLength: 10
    days:
      type: integer
      description: Ile pełnych dni kalendarzowych czekamy (dziś minus `since`; 0 = od dziś).
      minimum: 0
      maximum: 40000
    otherCount:
      type: integer
      description: Liczba pozostałych oczekujących etapów zlecenia („+n”).
      minimum: 0
      maximum: 900
WorkOrderCoordinator:
  type: object
  description: Opiekun zlecenia — identyfikator i nazwa wyświetlana (bez e-maila, roli i statusu konta).
  required: [id, displayName]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 200
WorkOrderListItem:
  type: object
  required: [id, number, title, status, coordinator, createdAt]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    number:
      type: string
      description: Numer zlecenia nadany przez serwer (np. `ZL-2026-0042`).
      maxLength: 32
    title:
      type: string
      description: Krótki opis (pole swobodne — może zawierać dane klienta).
      maxLength: 200
    status:
      $ref: '#/WorkOrderStatus'
    coordinator:
      description: Aktywny opiekun albo `null`.
      oneOf:
        - $ref: '#/WorkOrderCoordinator'
        - type: 'null'
    createdAt:
      type: string
      format: date-time
      maxLength: 40
    waiting:
      description: >-
        Najdłuższe oczekiwanie zlecenia („Czekamy na”, EVM-034) albo `null`, gdy zlecenie na nikogo nie czeka. Pole tylko do
        odczytu; nie jest w wymaganych, bo dodano je addytywnie — serwer zawsze je zwraca.
      oneOf:
        - $ref: '#/WorkOrderWaiting'
        - type: 'null'
    nextDueDate:
      description: >-
        Najbliższy termin niezakończonego etapu (`RRRR-MM-DD`) albo `null` („Termin”, EVM-034). Termin miniony panel oznacza
        `alarm-clock`; porównanie z dniem robi klient względem `hasOverdueStage`.
      oneOf:
        - type: string
          format: date
          maxLength: 10
        - type: 'null'
    hasOverdueStage:
      type: boolean
      description: '`true`, gdy najbliższy termin niezakończonego etapu jest wcześniejszy niż dziś (`Europe/Warsaw`; liczy serwer).'
    customer:
      description: >-
        Klient zlecenia (EVM-072; pole tylko do odczytu, serwer zawsze je zwraca): `{id, displayName}`, `{deleted: true}` dla
        klienta usuniętego albo niewidocznego (bez identyfikatora i nazwy, TM-18 — panel pokazuje „Klient usunięty” bez linku)
        albo `null`, gdy zlecenie nie ma klienta.
      oneOf:
        - $ref: '#/WorkOrderListCustomer'
        - $ref: '#/WorkOrderListCustomerDeleted'
        - type: 'null'
    site:
      description: >-
        Lokalizacja zlecenia (EVM-072; tylko do odczytu): miasto, ulica i numer budynku — bez kodu pocztowego, numeru lokalu i
        miejsca postojowego (SR-DATA-03). `null`, gdy zlecenie nie ma lokalizacji albo lokalizacja jest niewidoczna.
      oneOf:
        - $ref: '#/WorkOrderListSite'
        - type: 'null'
    payment:
      readOnly: true
      description: >-
        Kolumna „Płatność” (EVM-056; tylko do odczytu). Pole jest tylko dla ról z prawem odczytu płatności
        (`x-evia-authz.restrictedParams`; v1: Administrator, Edytor, Tylko odczyt) — dla pozostałych nie występuje.
      $ref: '#/WorkOrderPayment'
WorkOrderPaymentState:
  type: string
  description: >-
    Stan kolumny „Płatność” (EVM-056, ADR-0017 D8; pierwszy pasujący): `overdue` — transza wystawiona po terminie, `unpaid` —
    transza wystawiona, `paid` — transza opłacona i żadnej wystawionej, `none` — brak wystawionych i opłaconych. Lista wartości
    jest rozszerzalna — klient obsługuje też wartość nieznaną (etykieta zapasowa); dodanie wartości nie jest zmianą łamiącą.
  x-extensible-enum: [overdue, unpaid, paid, none]
WorkOrderPayment:
  type: object
  description: >-
    Płatności zlecenia na liście (EVM-056; pole tylko do odczytu, liczy serwer z dnia żądania w `Europe/Warsaw` — klient nie
    porównuje dat): stan, liczba transz wystawionych (także po terminie), suma kwot transz wystawionych i suma kwot transz po
    terminie (transze anulowane i usunięte się nie liczą). Stan i sumy pochodzą z dwóch odczytów bez wspólnej migawki: w chwili
    równoległej zmiany transzy mogą się na moment różnić (kolejne odświeżenie je wyrównuje), dlatego kontrakt ich nie wiąże.
  required: [state, invoicedCount, invoicedTotal, overdueTotal]
  additionalProperties: false
  properties:
    state:
      $ref: '#/WorkOrderPaymentState'
    invoicedCount:
      type: integer
      description: Liczba transz wystawionych (`invoiced`, także po terminie) — „Nieopłacone (n)”.
      minimum: 0
      maximum: 20
    invoicedTotal:
      $ref: common.yaml#/MoneyTotal
    overdueTotal:
      $ref: common.yaml#/MoneyTotal
WorkOrderListCustomer:
  type: object
  description: Klient na liście zleceń — identyfikator i nazwa wyświetlana (bez telefonu, e-maila, NIP i adresu, SR-DATA-03).
  required: [id, displayName]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 401
WorkOrderListCustomerDeleted:
  type: object
  description: Klient usunięty (albo niewidoczny dla wołającego) — bez identyfikatora i nazwy.
  required: [deleted]
  additionalProperties: false
  properties:
    deleted:
      type: boolean
      enum: [true]
WorkOrderListSite:
  type: object
  description: Lokalizacja na liście zleceń — miasto, ulica i numer budynku (bez kodu pocztowego i numeru lokalu, SR-DATA-03).
  required: [id, city, street, buildingNumber]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    city:
      type: string
      maxLength: 100
    street:
      type: string
      maxLength: 200
    buildingNumber:
      type: string
      maxLength: 20
WorkOrderSearchRequest:
  type: object
  description: >-
    Fraza wyszukiwania w treści (nigdy w adresie URL, SR-API-04) i filtry listy. Serwer normalizuje frazę do NFC, przycina ją i
    wymaga 3–100 znaków (`400 validation_failed`: `too_short`, `too_long`, `invalid_characters`). Pozostałe pola mają to samo
    znaczenie co parametry `listWorkOrders` (łączą się przez AND); `status` jest tablicą kodów. `cursor` jest związany z frazą,
    filtrami i użytkownikiem (zmiana frazy zaczyna od pierwszej strony); użyty z inną frazą, wygasły albo cudzy — `400 invalid_cursor`.
  required: [query]
  properties:
    query:
      type: string
      maxLength: 200
    status:
      type: array
      maxItems: 20
      items:
        $ref: '#/WorkOrderStatus'
    view:
      $ref: '#/WorkOrderView'
    coordinatorId:
      type: string
      format: uuid
      maxLength: 36
    customerId:
      type: string
      format: uuid
      maxLength: 36
    siteType:
      $ref: catalog.yaml#/SiteType
    templateId:
      type: string
      format: uuid
      maxLength: 36
    waitingOn:
      $ref: '#/WorkOrderWaitingOnFilter'
    waitingOnPartyKind:
      $ref: catalog.yaml#/PartyKind
    waitingLongerThanDays:
      type: integer
      minimum: 1
      maximum: 365
    sort:
      $ref: '#/WorkOrderSort'
    limit:
      type: integer
      description: Liczba pozycji na stronie (domyślnie 25).
      minimum: 1
      maximum: 100
      default: 25
    cursor:
      type: string
      description: Kursor ze strony poprzedniej (`nextCursor`) — wartość nieprzezroczysta.
      maxLength: 512
      pattern: '^[A-Za-z0-9_-]+$'
WorkOrderList:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      maxItems: 100
      items:
        $ref: '#/WorkOrderListItem'
    nextCursor:
      description: Kursor następnej strony (nieprzezroczysty, ważny 30 minut) albo `null` na ostatniej stronie. Bez licznika wyników.
      oneOf:
        - type: string
          maxLength: 512
        - type: 'null'
# Creation of a work order from a template (EVM-022; W-05, header of W-06). The request is its own schema: the fields of the server
# (`number`, `status`, `customer`, `site`, `coordinator`, `scopeItems`, `version`, `createdAt`) are not in it, so naming one is
# `400 validation_failed` with the code `read_only_field` (the validation derives the list: the keys of `WorkOrder` that the request
# lacks, SR-AUTHZ-04); a stranger is `unknown_field`. The client never sends scope items — the server copies them from the template.
WorkOrderCustomer:
  type: object
  description: Klient zlecenia — identyfikator i nazwa wyświetlana (bez telefonu, e-maila, NIP, adresu i notatek, SR-DATA-03).
  required: [id, displayName]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 401
ScopeItem:
  type: object
  description: >-
    Pozycja zakresu zlecenia — kopia pozycji katalogu albo szablonu (kod, nazwa, zestaw parametrów, parametry i ilość; zmiana
    szablonu ani katalogu nie zmienia zlecenia). Parametry to wyłącznie wartości techniczne. `version` jest wersją pozycji (ETag
    dla `If-Match` przy zmianie i usunięciu pozycji — zakres zlecenia nie zmienia wersji zlecenia). `notes` (EVM-035) to
    notatki do pozycji albo opis „Innej usługi” — pole swobodne, może zawierać dane osobowe; panel wyświetla je jako tekst.
  required: [id, position, code, name, parameterSetCode, parameters, quantity, version]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    position:
      $ref: catalog.yaml#/Position
    code:
      $ref: catalog.yaml#/ConfigCode
    name:
      $ref: catalog.yaml#/ConfigName
    parameterSetCode:
      oneOf:
        - $ref: catalog.yaml#/ParameterSetCode
        - type: 'null'
    parameters:
      $ref: catalog.yaml#/DefaultParameters
    quantity:
      type: integer
      minimum: 1
      maximum: 100
    notes:
      type: string
      description: Notatki do pozycji albo opis „Innej usługi” (1–1000 znaków); brak pola, gdy pozycja nie ma notatek.
      minLength: 1
      maxLength: 1000
    version:
      type: integer
      minimum: 1
CreateWorkOrderRequest:
  type: object
  description: >-
    Nowe zlecenie. `id` (UUIDv7) nadaje klient; `customerId`, `siteId` i `templateId` są wymagane — `templateId: null` oznacza
    puste zlecenie bez pozycji zakresu (brak pola to `400 required`). `title` jest opcjonalny (domyślnie nazwa szablonu albo
    „Nowe zlecenie”), `assigneeUserId` (opiekun) — domyślnie zalogowany użytkownik; musi to być aktywny użytkownik, w innym
    wypadku `400` z kodem `assignee_unavailable` (jeden kod dla konta nieistniejącego, dezaktywowanego i usuniętego).
    `plannedDate` to data z zakresu 2000-01-01 … 2100-12-31 (`out_of_range`). Pola swobodne to zwykły tekst (NFC, przycięty).
  required: [id, customerId, siteId, templateId]
  properties:
    id:
      type: string
      description: Identyfikator UUIDv7 nadany przez klienta (ponowienie zapisu używa tego samego `id`).
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      maxLength: 36
    customerId:
      type: string
      description: Klient (musi istnieć i nie być usunięty — inaczej `404 not_found`).
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      maxLength: 36
    siteId:
      type: string
      description: Lokalizacja (musi istnieć i nie być usunięta — inaczej `404 not_found`).
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      maxLength: 36
    templateId:
      description: Aktywny szablon zlecenia albo `null` (puste zlecenie). Szablon wycofany albo nieistniejący — `422 template_unavailable`.
      oneOf:
        - type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          maxLength: 36
        - type: 'null'
    title:
      type: string
      description: Tytuł (pole swobodne, może zawierać dane klienta). Pusty po przycięciu = brak.
      maxLength: 200
    assigneeUserId:
      type: string
      description: Opiekun zlecenia (aktywny użytkownik); brak = zalogowany użytkownik.
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      maxLength: 36
    plannedDate:
      type: string
      description: Planowana data (dzień w strefie `Europe/Warsaw`), `RRRR-MM-DD`.
      format: date
      maxLength: 10
    description:
      type: string
      description: Opis (zwykły tekst, pole swobodne — może zawierać dane klienta).
      maxLength: 2000
WorkOrder:
  type: object
  description: >-
    Zlecenie po utworzeniu — nagłówek W-06: numer, tytuł, status, klient, adres lokalizacji, opiekun, data utworzenia, oraz
    pozycje zakresu skopiowane z szablonu. Bez danych kontaktowych klienta i bez pól technicznych.
  required: [id, number, title, status, customer, site, coordinator, scopeItems, version, createdAt]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    number:
      type: string
      description: Numer zlecenia nadany przez serwer (np. `ZL-2026-0042`; rok wg `Europe/Warsaw`).
      maxLength: 32
    title:
      type: string
      maxLength: 200
    status:
      $ref: '#/WorkOrderStatus'
    customer:
      $ref: '#/WorkOrderCustomer'
    site:
      $ref: sites.yaml#/SiteSearchItem
    coordinator:
      $ref: '#/WorkOrderCoordinator'
    plannedDate:
      type: string
      format: date
      maxLength: 10
    description:
      type: string
      maxLength: 2000
    scopeItems:
      type: array
      maxItems: 50
      items:
        $ref: '#/ScopeItem'
    version:
      type: integer
      minimum: 1
    createdAt:
      type: string
      format: date-time
      maxLength: 40
# Reading a work order (EVM-018; W-06). Four reads anchored in the order, no collective endpoint: the header, the scope, the customer
# card and the site card. Every answer is an explicit list of fields (`additionalProperties: false`, SR-DATA-03): the customer card has
# the display name, the telephone and the e-mail; the parties of a site are `{id, displayName}`; the keeper is `{id, displayName}`.
# The customer and the site come from the facades of their modules — they are never copied into the order.
WorkOrderDetails:
  type: object
  description: >-
    Nagłówek zlecenia (W-06): numer, tytuł, status, klient i adres lokalizacji (z fasad modułów, tylko nazwa i adres), opiekun,
    data utworzenia oraz cykl życia (EVM-030): `allowedTransitions` dla wołającego, `resumeStatus`, `statusChangedAt`, `closedAt`, `completedOn`.
    Bez powodu wstrzymania i anulowania (pole swobodne — może zawierać dane osobowe; nie jest zwracany), zakresu, danych kontaktowych klienta, PPE i notatek (osobne odczyty). `customer` albo `site` jest `null`,
    gdy zlecenie go nie ma albo rekord został usunięty (żywe zlecenie nie ujawnia usuniętego rekordu).
  required: [id, number, title, status, customer, site, coordinator, version, createdAt, allowedTransitions]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    number:
      type: string
      description: Numer zlecenia nadany przez serwer (np. `ZL-2026-0042`).
      maxLength: 32
    title:
      type: string
      maxLength: 200
    status:
      $ref: '#/WorkOrderStatus'
    customer:
      oneOf:
        - $ref: '#/WorkOrderCustomer'
        - type: 'null'
    site:
      oneOf:
        - $ref: sites.yaml#/SiteSearchItem
        - type: 'null'
    coordinator:
      description: Aktywny opiekun albo `null`.
      oneOf:
        - $ref: '#/WorkOrderCoordinator'
        - type: 'null'
    version:
      type: integer
      minimum: 1
    createdAt:
      type: string
      format: date-time
      maxLength: 40
    allowedTransitions:
      type: array
      description: >-
        Statusy, do których WOŁAJĄCY może teraz przenieść zlecenie (menu odznaki W-06): zależą od roli — Tylko odczyt dostaje pustą
        listę, Edytor nie dostaje celów przywrócenia, Administrator dostaje je (przywrócenie wymaga jeszcze ponownego uwierzytelnienia).
        Dla zlecenia „Wstrzymane” cel wznowienia to `resumeStatus`. To podpowiedź dla UI — serwer rozstrzyga przy każdym przejściu.
      maxItems: 8
      items:
        $ref: '#/WorkOrderStatus'
    resumeStatus:
      description: >-
        Status aktywny, do którego wraca zlecenie „Wstrzymane” po wznowieniu (i z którego przywrócono „Anulowane”). Ustawia serwer;
        brak, gdy zlecenie nie było wstrzymane ani anulowane z aktywnego statusu.
      $ref: '#/WorkOrderStatus'
    statusChangedAt:
      type: string
      description: Chwila ostatniej zmiany statusu. Ustawia serwer.
      format: date-time
      maxLength: 40
    closedAt:
      type: string
      description: Data zamknięcia („Rozliczone” albo „Anulowane”); czyszczona przez przywrócenie. Ustawia serwer.
      format: date-time
      maxLength: 40
    completedOn:
      type: string
      description: Dzień zakończenia prac (`RRRR-MM-DD`, `Europe/Warsaw`); czyszczony przez ponowne otwarcie.
      format: date
      maxLength: 10
    description:
      type: string
      description: >-
        Opis zlecenia (EVM-035; zwykły tekst, pole swobodne — może zawierać dane osobowe, panel wyświetla go jako tekst); brak pola,
        gdy zlecenie nie ma opisu. Dialog „Edytuj dane zlecenia” wypełnia się z nagłówka bez dodatkowego odczytu.
      maxLength: 2000
    plannedDate:
      type: string
      description: Planowana data (dzień w strefie `Europe/Warsaw`, `RRRR-MM-DD`); brak pola, gdy jej nie ustawiono.
      format: date
      maxLength: 10
ScopeItemList:
  type: object
  description: Aktywne pozycje zakresu zlecenia w kolejności `position` (brak pozycji to pusta tablica).
  required: [items]
  additionalProperties: false
  properties:
    items:
      type: array
      maxItems: 50
      items:
        $ref: '#/ScopeItem'
CustomerCard:
  type: object
  description: Karta „Klient” (DO-K) — nazwa wyświetlana, telefon (E.164) i e-mail (`null`, gdy brak). Bez NIP, adresu i notatek.
  required: [displayName, phone, email]
  additionalProperties: false
  properties:
    displayName:
      type: string
      maxLength: 401
    phone:
      type: string
      description: Telefon w formacie E.164.
      maxLength: 32
    email:
      oneOf:
        - type: string
          maxLength: 254
        - type: 'null'
SitePartyRef:
  type: object
  description: Strona (OSD, zarządca) na karcie lokalizacji — identyfikator i nazwa wyświetlana (DO-3), bez kontaktu i notatek.
  required: [id, displayName]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 400
SiteCard:
  type: object
  description: >-
    Karta „Lokalizacja” (DO-K): typ obiektu, adres, miejsce i poziom, moc przyłączeniowa, PPE, notatki oraz OSD i zarządca jako
    `{id, displayName}` (`null`, gdy brak albo strona usunięta). Pola opcjonalne są pomijane, gdy lokalizacja ich nie ma.
  required: [siteId, siteType, street, buildingNumber, postalCode, city, distributionSystemOperator, manager]
  additionalProperties: false
  properties:
    siteId:
      type: string
      description: Identyfikator lokalizacji zlecenia (do odczytu i edycji lokalizacji, EVM-036).
      format: uuid
      maxLength: 36
    siteType:
      $ref: catalog.yaml#/SiteType
    street:
      type: string
      maxLength: 200
    buildingNumber:
      type: string
      maxLength: 20
    apartmentNumber:
      type: string
      maxLength: 20
    postalCode:
      type: string
      maxLength: 6
    city:
      type: string
      maxLength: 100
    parkingSpotNumber:
      type: string
      maxLength: 20
    garageLevel:
      type: string
      maxLength: 20
    connectionPowerKw:
      type: number
      exclusiveMinimum: 0
      maximum: 1000
    meteringPointId:
      type: string
      description: PPE (punkt poboru energii).
      maxLength: 40
    notes:
      type: string
      description: Notatki lokalizacji — zwykły tekst; panel nigdy nie traktuje ich jako HTML.
      maxLength: 2000
    distributionSystemOperator:
      oneOf:
        - $ref: '#/SitePartyRef'
        - type: 'null'
    manager:
      oneOf:
        - $ref: '#/SitePartyRef'
        - type: 'null'
TransitionWorkOrderRequest:
  type: object
  description: >-
    Komenda przejścia statusu zlecenia (EVM-030). `to` — docelowy status z listy (tabela przejść w `domain-model.md`; przejścia spoza
    tabeli — `409 invalid_state_transition`). `reason` jest wymagany przy wstrzymaniu i anulowaniu (zwykły tekst, NFC, przycięty,
    1–500 znaków; kody `required`, `too_long`, `invalid_characters`) i niedozwolony w pozostałych przejściach (`not_allowed`);
    to pole swobodne, które może zawierać dane osobowe — nie trafia do audytu, logów ani odpowiedzi. `completedOn` (dzień
    zakończenia prac, `Europe/Warsaw`, nie z przyszłości, od 2000-01-01; kod `out_of_range`) tylko przy „Zakończ”; domyślnie dziś.
    Pola serwera (`status`, `resumeStatus`, `closedAt`, `statusChangedAt` …) w treści — `400 read_only_field`, inne — `400 unknown_field`.
  required: [to]
  additionalProperties: false
  properties:
    to:
      $ref: '#/WorkOrderStatus'
    reason:
      type: string
      description: Powód wstrzymania albo anulowania (pole swobodne — może zawierać dane osobowe).
      maxLength: 500
    completedOn:
      type: string
      description: Dzień zakończenia prac, `RRRR-MM-DD` (tylko przy przejściu „Zakończ”).
      format: date
      maxLength: 10
SiteOrderItem:
  type: object
  description: >-
    Inne zlecenie w tej samej lokalizacji — wyłącznie metadane (EVM-036 AC5, SR-AUTHZ-08): bez klienta, kontaktu, kwot, zdjęć
    i dokumentów. `closedAt` jest obecne tylko dla zleceń zamkniętych.
  required: [id, number, title, status]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    number:
      type: string
      description: Numer zlecenia (np. `ZL-2026-0017`).
      maxLength: 32
    title:
      type: string
      description: Krótki opis (pole swobodne — może zawierać dane osobowe; panel wyświetla go jako tekst).
      maxLength: 200
    status:
      $ref: '#/WorkOrderStatus'
    closedAt:
      type: string
      format: date-time
      maxLength: 40
SiteOrders:
  type: object
  description: >-
    Inne zlecenia w lokalizacji bieżącego zlecenia: `total` to liczba zleceń widocznych dla wywołującego (bez bieżącego), `items` —
    najwyżej 20 z nich, numer malejąco.
  required: [total, items]
  additionalProperties: false
  properties:
    total:
      type: integer
      minimum: 0
      maximum: 2147483647
    items:
      type: array
      maxItems: 20
      items:
        $ref: '#/SiteOrderItem'
# Editing the data and the scope of an order (EVM-035; W-06 (a), (c)). The requests are their own schemas: the fields of the server
# (`number`, `status`, `customerId`, `siteId`, `version`; `code`, `name`, `parameterSetCode`, `position`, `quantity`,
# `sourceCatalogItemId`) are not in them, so naming one is `400 validation_failed` with the code `read_only_field`; a stranger is
# `unknown_field`. Free text is plain text (NFC, trimmed, no control characters; a new line only in the multi-line fields).
WorkOrderPatch:
  type: object
  description: >-
    Zmiana danych zlecenia (merge-patch; EVM-035 AC1) — co najmniej jedno pole. Pole nieobecne zostaje bez zmian, `null` czyści
    `description` i `plannedDate`. `title` ma 1–200 znaków i nie bywa `null`. `assigneeUserId` (opiekun) musi być aktywnym
    użytkownikiem — inaczej `400` z kodem `assignee_unavailable` (jeden kod dla konta nieistniejącego, zaproszonego,
    zdezaktywowanego i usuniętego); opiekuna nie można usunąć. `plannedDate` to data z zakresu 2000-01-01 … 2100-12-31
    (`out_of_range`). Pola kontrolowane przez serwer (`id`, `number`, `status`, `customerId`, `siteId`, `customer`, `site`,
    `coordinator`, `scopeItems`, `version`, `createdAt` …) — `400 read_only_field`, inne — `400 unknown_field`.
  minProperties: 1
  additionalProperties: false
  properties:
    title:
      type: string
      description: Tytuł (pole swobodne, może zawierać dane klienta; pusty po przycięciu — `400 required`).
      maxLength: 200
    description:
      description: Opis (zwykły tekst, pole swobodne — może zawierać dane klienta) albo `null`, by go usunąć.
      oneOf:
        - type: string
          maxLength: 2000
        - type: 'null'
    plannedDate:
      description: Planowana data, `RRRR-MM-DD` (2000-01-01 … 2100-12-31), albo `null`, by ją usunąć.
      oneOf:
        - type: string
          format: date
          maxLength: 10
        - type: 'null'
    assigneeUserId:
      type: string
      description: Opiekun zlecenia (aktywny użytkownik).
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      maxLength: 36
CreateScopeItemRequest:
  type: object
  description: >-
    Nowa pozycja zakresu (EVM-035 AC2, AC4). `id` (UUIDv7) nadaje klient (istniejące — `409 id_conflict`). `catalogItemCode`
    wskazuje aktywną pozycję katalogu usług (kod stały; nieistniejąca albo wycofana — `400`, `/catalogItemCode`,
    `unknown_catalog_item`); serwer kopiuje z niej kod, nazwę i zestaw parametrów — klient ich nie podaje. `parameters` brak
    albo `{}` oznacza „bez parametrów”; niepuste są walidowane schematem zestawu pozycji (pole nieznane, wartość spoza zakresu,
    typ albo > 16 KB — `400 validation_failed`, wskaźniki `/parameters/…`); pozycja bez zestawu przyjmuje tylko `{}`
    (`not_allowed`). `notes` — notatki do pozycji, a dla „Innej usługi” (`custom_service`) wymagany opis usługi (1–1000 znaków;
    `required`). `procedureCodes` — kody procesów wnoszonych przez pozycję, które mają zostać dodane do zlecenia (do 30,
    bez powtórzeń); kod spoza procesów pozycji — `400` (`/procedureCodes/N`, `not_brought_by_item`); proces o kodzie już
    aktywnym w zleceniu jest pomijany (bez duplikatów po kodzie). Parametry i notatki nie przyjmują danych osobowych ani
    identyfikatorów (PPE, numerów liczników, nazwisk) — zestawy nie mają na nie pól.
  required: [id, catalogItemCode]
  additionalProperties: false
  properties:
    id:
      type: string
      description: Identyfikator UUIDv7 nadany przez klienta (ponowienie zapisu używa tego samego `id`).
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      maxLength: 36
    catalogItemCode:
      $ref: catalog.yaml#/ConfigCode
    parameters:
      $ref: catalog.yaml#/DefaultParameters
    notes:
      type: string
      description: Notatki do pozycji albo opis „Innej usługi” (zwykły tekst, pole swobodne — może zawierać dane osobowe).
      maxLength: 1000
    procedureCodes:
      type: array
      maxItems: 30
      uniqueItems: true
      items:
        $ref: catalog.yaml#/ConfigCode
ScopeItemPatch:
  type: object
  description: >-
    Zmiana pozycji zakresu (merge-patch; EVM-035 AC4) — co najmniej jedno pole. `parameters` zastępuje całą mapę parametrów i jest
    walidowane schematem zestawu zapisanym w pozycji (nie wartością od klienta; `{}` — „bez parametrów”); `notes` zmienia notatki
    albo opis „Innej usługi” (`null` czyści notatki; opis „Innej usługi” jest wymagany — `required`). Pola kontrolowane przez serwer
    (`id`, `code`, `name`, `parameterSetCode`, `position`, `quantity`, `sourceCatalogItemId`, `version`) — `400 read_only_field`.
  minProperties: 1
  additionalProperties: false
  properties:
    parameters:
      $ref: catalog.yaml#/DefaultParameters
    notes:
      description: Notatki do pozycji (zwykły tekst, pole swobodne — może zawierać dane osobowe) albo `null`, by je usunąć.
      oneOf:
        - type: string
          maxLength: 1000
        - type: 'null'
ScopeItemAddition:
  type: object
  description: >-
    Wynik dodania pozycji (EVM-035 AC2): pozycja i kody procesów dodanych razem z nią w tej samej transakcji (bez procesów
    pominiętych jako duplikaty po kodzie). Procesy z etapami „Do zrobienia” czyta się z `listWorkOrderProcedures`.
  required: [item, addedProcedureCodes]
  additionalProperties: false
  properties:
    item:
      $ref: '#/ScopeItem'
    addedProcedureCodes:
      type: array
      maxItems: 30
      items:
        $ref: catalog.yaml#/ConfigCode
