# Module `work-orders` — the list of work orders (EVM-017; W-10). The list item carries only what the table shows: no customer, no
# site, no description (they arrive with the stories that own them, additively). `title` is free text and may name a customer —
# it never reaches a URL, a log or a metric. The coordinator is `{id, displayName}` only (SR-DATA-03): no e-mail, role or account status.
WorkOrderStatus:
  type: string
  description: >-
    Status zlecenia (zamknięta lista po stronie serwera; klient obsługuje też wartość nieznaną — P-12). „Niezamknięte” to wszystkie
    poza `settled` i `cancelled`.
  enum: [new, quoting, accepted, in_progress, completed, settled, on_hold, cancelled]
WorkOrderSort:
  type: string
  description: >-
    Sortowanie: `-number` (numer malejąco, domyślne), `number`, `-createdAt`, `createdAt`. Kolejne epiki dodają wartości
    (`longestWaitingSince`, `nextDueDate`, `urgency`) addytywnie; serwer odrzuca wartość spoza listy (`400 validation_failed`).
  enum: [-number, number, -createdAt, createdAt]
WorkOrderView:
  type: string
  description: >-
    Widok: `all_open` (status poza `settled` i `cancelled`) albo `mine` (opiekun to zalogowany użytkownik — zawsze z sesji).
    Brak parametru oznacza brak predykatu widoku; domyślny widok panelu („Wszystkie niezamknięte”) wysyła `view=all_open` jawnie.
  enum: [all_open, mine]
WorkOrderCoordinator:
  type: object
  description: Opiekun zlecenia — identyfikator i nazwa wyświetlana (bez e-maila, roli i statusu konta).
  required: [id, displayName]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 200
WorkOrderListItem:
  type: object
  required: [id, number, title, status, coordinator, createdAt]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    number:
      type: string
      description: Numer zlecenia nadany przez serwer (np. `ZL-2026-0042`).
      maxLength: 32
    title:
      type: string
      description: Krótki opis (pole swobodne — może zawierać dane klienta).
      maxLength: 200
    status:
      $ref: '#/WorkOrderStatus'
    coordinator:
      description: Aktywny opiekun albo `null`.
      oneOf:
        - $ref: '#/WorkOrderCoordinator'
        - type: 'null'
    createdAt:
      type: string
      format: date-time
      maxLength: 40
WorkOrderList:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      maxItems: 100
      items:
        $ref: '#/WorkOrderListItem'
    nextCursor:
      description: Kursor następnej strony (nieprzezroczysty, ważny 30 minut) albo `null` na ostatniej stronie. Bez licznika wyników.
      oneOf:
        - type: string
          maxLength: 512
        - type: 'null'
# Creation of a work order from a template (EVM-022; W-05, header of W-06). The request is its own schema: the fields of the server
# (`number`, `status`, `customer`, `site`, `coordinator`, `scopeItems`, `version`, `createdAt`) are not in it, so naming one is
# `400 validation_failed` with the code `read_only_field` (the validation derives the list: the keys of `WorkOrder` that the request
# lacks, SR-AUTHZ-04); a stranger is `unknown_field`. The client never sends scope items — the server copies them from the template.
WorkOrderCustomer:
  type: object
  description: Klient zlecenia — identyfikator i nazwa wyświetlana (bez telefonu, e-maila, NIP, adresu i notatek, SR-DATA-03).
  required: [id, displayName]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 401
ScopeItem:
  type: object
  description: >-
    Pozycja zakresu zlecenia — kopia pozycji szablonu (kod, nazwa, zestaw parametrów, parametry domyślne i ilość; zmiana szablonu
    nie zmienia zlecenia). Parametry to wyłącznie wartości techniczne.
  required: [id, position, code, name, parameterSetCode, parameters, quantity]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    position:
      $ref: catalog.yaml#/Position
    code:
      $ref: catalog.yaml#/ConfigCode
    name:
      $ref: catalog.yaml#/ConfigName
    parameterSetCode:
      oneOf:
        - $ref: catalog.yaml#/ParameterSetCode
        - type: 'null'
    parameters:
      $ref: catalog.yaml#/DefaultParameters
    quantity:
      type: integer
      minimum: 1
      maximum: 100
CreateWorkOrderRequest:
  type: object
  description: >-
    Nowe zlecenie. `id` (UUIDv7) nadaje klient; `customerId`, `siteId` i `templateId` są wymagane — `templateId: null` oznacza
    puste zlecenie bez pozycji zakresu (brak pola to `400 required`). `title` jest opcjonalny (domyślnie nazwa szablonu albo
    „Nowe zlecenie”), `assigneeUserId` (opiekun) — domyślnie zalogowany użytkownik; musi to być aktywny użytkownik, w innym
    wypadku `400` z kodem `assignee_unavailable` (jeden kod dla konta nieistniejącego, dezaktywowanego i usuniętego).
    `plannedDate` to data z zakresu 2000-01-01 … 2100-12-31 (`out_of_range`). Pola swobodne to zwykły tekst (NFC, przycięty).
  required: [id, customerId, siteId, templateId]
  properties:
    id:
      type: string
      description: Identyfikator UUIDv7 nadany przez klienta (ponowienie zapisu używa tego samego `id`).
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      maxLength: 36
    customerId:
      type: string
      description: Klient (musi istnieć i nie być usunięty — inaczej `404 not_found`).
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      maxLength: 36
    siteId:
      type: string
      description: Lokalizacja (musi istnieć i nie być usunięta — inaczej `404 not_found`).
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      maxLength: 36
    templateId:
      description: Aktywny szablon zlecenia albo `null` (puste zlecenie). Szablon wycofany albo nieistniejący — `422 template_unavailable`.
      oneOf:
        - type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          maxLength: 36
        - type: 'null'
    title:
      type: string
      description: Tytuł (pole swobodne, może zawierać dane klienta). Pusty po przycięciu = brak.
      maxLength: 200
    assigneeUserId:
      type: string
      description: Opiekun zlecenia (aktywny użytkownik); brak = zalogowany użytkownik.
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      maxLength: 36
    plannedDate:
      type: string
      description: Planowana data (dzień w strefie `Europe/Warsaw`), `RRRR-MM-DD`.
      format: date
      maxLength: 10
    description:
      type: string
      description: Opis (zwykły tekst, pole swobodne — może zawierać dane klienta).
      maxLength: 2000
WorkOrder:
  type: object
  description: >-
    Zlecenie po utworzeniu — nagłówek W-06: numer, tytuł, status, klient, adres lokalizacji, opiekun, data utworzenia, oraz
    pozycje zakresu skopiowane z szablonu. Bez danych kontaktowych klienta i bez pól technicznych.
  required: [id, number, title, status, customer, site, coordinator, scopeItems, version, createdAt]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    number:
      type: string
      description: Numer zlecenia nadany przez serwer (np. `ZL-2026-0042`; rok wg `Europe/Warsaw`).
      maxLength: 32
    title:
      type: string
      maxLength: 200
    status:
      $ref: '#/WorkOrderStatus'
    customer:
      $ref: '#/WorkOrderCustomer'
    site:
      $ref: sites.yaml#/SiteSearchItem
    coordinator:
      $ref: '#/WorkOrderCoordinator'
    plannedDate:
      type: string
      format: date
      maxLength: 10
    description:
      type: string
      maxLength: 2000
    scopeItems:
      type: array
      maxItems: 50
      items:
        $ref: '#/ScopeItem'
    version:
      type: integer
      minimum: 1
    createdAt:
      type: string
      format: date-time
      maxLength: 40
# Reading a work order (EVM-018; W-06). Four reads anchored in the order, no collective endpoint: the header, the scope, the customer
# card and the site card. Every answer is an explicit list of fields (`additionalProperties: false`, SR-DATA-03): the customer card has
# the display name, the telephone and the e-mail; the parties of a site are `{id, displayName}`; the keeper is `{id, displayName}`.
# The customer and the site come from the facades of their modules — they are never copied into the order.
WorkOrderDetails:
  type: object
  description: >-
    Nagłówek zlecenia (W-06): numer, tytuł, status, klient i adres lokalizacji (z fasad modułów, tylko nazwa i adres), opiekun,
    data utworzenia oraz cykl życia (EVM-030): `allowedTransitions` dla wołającego, `resumeStatus`, `statusChangedAt`, `closedAt`, `completedOn`.
    Bez powodu wstrzymania i anulowania (pole swobodne — może zawierać dane osobowe; nie jest zwracany), zakresu, danych kontaktowych klienta, PPE i notatek (osobne odczyty). `customer` albo `site` jest `null`,
    gdy zlecenie go nie ma albo rekord został usunięty (żywe zlecenie nie ujawnia usuniętego rekordu).
  required: [id, number, title, status, customer, site, coordinator, version, createdAt, allowedTransitions]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    number:
      type: string
      description: Numer zlecenia nadany przez serwer (np. `ZL-2026-0042`).
      maxLength: 32
    title:
      type: string
      maxLength: 200
    status:
      $ref: '#/WorkOrderStatus'
    customer:
      oneOf:
        - $ref: '#/WorkOrderCustomer'
        - type: 'null'
    site:
      oneOf:
        - $ref: sites.yaml#/SiteSearchItem
        - type: 'null'
    coordinator:
      description: Aktywny opiekun albo `null`.
      oneOf:
        - $ref: '#/WorkOrderCoordinator'
        - type: 'null'
    version:
      type: integer
      minimum: 1
    createdAt:
      type: string
      format: date-time
      maxLength: 40
    allowedTransitions:
      type: array
      description: >-
        Statusy, do których WOŁAJĄCY może teraz przenieść zlecenie (menu odznaki W-06): zależą od roli — Tylko odczyt dostaje pustą
        listę, Edytor nie dostaje celów przywrócenia, Administrator dostaje je (przywrócenie wymaga jeszcze ponownego uwierzytelnienia).
        Dla zlecenia „Wstrzymane” cel wznowienia to `resumeStatus`. To podpowiedź dla UI — serwer rozstrzyga przy każdym przejściu.
      maxItems: 8
      items:
        $ref: '#/WorkOrderStatus'
    resumeStatus:
      description: >-
        Status aktywny, do którego wraca zlecenie „Wstrzymane” po wznowieniu (i z którego przywrócono „Anulowane”). Ustawia serwer;
        brak, gdy zlecenie nie było wstrzymane ani anulowane z aktywnego statusu.
      $ref: '#/WorkOrderStatus'
    statusChangedAt:
      type: string
      description: Chwila ostatniej zmiany statusu. Ustawia serwer.
      format: date-time
      maxLength: 40
    closedAt:
      type: string
      description: Data zamknięcia („Rozliczone” albo „Anulowane”); czyszczona przez przywrócenie. Ustawia serwer.
      format: date-time
      maxLength: 40
    completedOn:
      type: string
      description: Dzień zakończenia prac (`RRRR-MM-DD`, `Europe/Warsaw`); czyszczony przez ponowne otwarcie.
      format: date
      maxLength: 10
ScopeItemList:
  type: object
  description: Aktywne pozycje zakresu zlecenia w kolejności `position` (brak pozycji to pusta tablica).
  required: [items]
  additionalProperties: false
  properties:
    items:
      type: array
      maxItems: 50
      items:
        $ref: '#/ScopeItem'
CustomerCard:
  type: object
  description: Karta „Klient” (DO-K) — nazwa wyświetlana, telefon (E.164) i e-mail (`null`, gdy brak). Bez NIP, adresu i notatek.
  required: [displayName, phone, email]
  additionalProperties: false
  properties:
    displayName:
      type: string
      maxLength: 401
    phone:
      type: string
      description: Telefon w formacie E.164.
      maxLength: 32
    email:
      oneOf:
        - type: string
          maxLength: 254
        - type: 'null'
SitePartyRef:
  type: object
  description: Strona (OSD, zarządca) na karcie lokalizacji — identyfikator i nazwa wyświetlana (DO-3), bez kontaktu i notatek.
  required: [id, displayName]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 400
SiteCard:
  type: object
  description: >-
    Karta „Lokalizacja” (DO-K): typ obiektu, adres, miejsce i poziom, moc przyłączeniowa, PPE, notatki oraz OSD i zarządca jako
    `{id, displayName}` (`null`, gdy brak albo strona usunięta). Pola opcjonalne są pomijane, gdy lokalizacja ich nie ma.
  required: [siteId, siteType, street, buildingNumber, postalCode, city, distributionSystemOperator, manager]
  additionalProperties: false
  properties:
    siteId:
      type: string
      description: Identyfikator lokalizacji zlecenia (do odczytu i edycji lokalizacji, EVM-036).
      format: uuid
      maxLength: 36
    siteType:
      $ref: catalog.yaml#/SiteType
    street:
      type: string
      maxLength: 200
    buildingNumber:
      type: string
      maxLength: 20
    apartmentNumber:
      type: string
      maxLength: 20
    postalCode:
      type: string
      maxLength: 6
    city:
      type: string
      maxLength: 100
    parkingSpotNumber:
      type: string
      maxLength: 20
    garageLevel:
      type: string
      maxLength: 20
    connectionPowerKw:
      type: number
      exclusiveMinimum: 0
      maximum: 1000
    meteringPointId:
      type: string
      description: PPE (punkt poboru energii).
      maxLength: 40
    notes:
      type: string
      description: Notatki lokalizacji — zwykły tekst; panel nigdy nie traktuje ich jako HTML.
      maxLength: 2000
    distributionSystemOperator:
      oneOf:
        - $ref: '#/SitePartyRef'
        - type: 'null'
    manager:
      oneOf:
        - $ref: '#/SitePartyRef'
        - type: 'null'
TransitionWorkOrderRequest:
  type: object
  description: >-
    Komenda przejścia statusu zlecenia (EVM-030). `to` — docelowy status z listy (tabela przejść w `domain-model.md`; przejścia spoza
    tabeli — `409 invalid_state_transition`). `reason` jest wymagany przy wstrzymaniu i anulowaniu (zwykły tekst, NFC, przycięty,
    1–500 znaków; kody `required`, `too_long`, `invalid_characters`) i niedozwolony w pozostałych przejściach (`not_allowed`);
    to pole swobodne, które może zawierać dane osobowe — nie trafia do audytu, logów ani odpowiedzi. `completedOn` (dzień
    zakończenia prac, `Europe/Warsaw`, nie z przyszłości, od 2000-01-01; kod `out_of_range`) tylko przy „Zakończ”; domyślnie dziś.
    Pola serwera (`status`, `resumeStatus`, `closedAt`, `statusChangedAt` …) w treści — `400 read_only_field`, inne — `400 unknown_field`.
  required: [to]
  additionalProperties: false
  properties:
    to:
      $ref: '#/WorkOrderStatus'
    reason:
      type: string
      description: Powód wstrzymania albo anulowania (pole swobodne — może zawierać dane osobowe).
      maxLength: 500
    completedOn:
      type: string
      description: Dzień zakończenia prac, `RRRR-MM-DD` (tylko przy przejściu „Zakończ”).
      format: date
      maxLength: 10
SiteOrderItem:
  type: object
  description: >-
    Inne zlecenie w tej samej lokalizacji — wyłącznie metadane (EVM-036 AC5, SR-AUTHZ-08): bez klienta, kontaktu, kwot, zdjęć
    i dokumentów. `closedAt` jest obecne tylko dla zleceń zamkniętych.
  required: [id, number, title, status]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    number:
      type: string
      description: Numer zlecenia (np. `ZL-2026-0017`).
      maxLength: 32
    title:
      type: string
      description: Krótki opis (pole swobodne — może zawierać dane osobowe; panel wyświetla go jako tekst).
      maxLength: 200
    status:
      $ref: '#/WorkOrderStatus'
    closedAt:
      type: string
      format: date-time
      maxLength: 40
SiteOrders:
  type: object
  description: >-
    Inne zlecenia w lokalizacji bieżącego zlecenia: `total` to liczba zleceń widocznych dla wywołującego (bez bieżącego), `items` —
    najwyżej 20 z nich, numer malejąco.
  required: [total, items]
  additionalProperties: false
  properties:
    total:
      type: integer
      minimum: 0
      maximum: 2147483647
    items:
      type: array
      maxItems: 20
      items:
        $ref: '#/SiteOrderItem'
