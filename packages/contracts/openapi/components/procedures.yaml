# Module `procedures` — the processes of a work order and their stages (EVM-031; W-06 section "Procesy i etapy"). The processes are COPIED
# from the template at the creation of the order (D1) and are never created by a request. The only field of a stage a request changes
# in EVM-031 is the person responsible and the due date; the status of a stage is changed by a command of its own (EVM-032, the
# transition), so `status`, the names, the codes, the position and the version are `readOnly` for the patch (`400 read_only_field`).
# EVM-032 adds "waiting for" (`waitingOn`, `waitingParty`, `waitingSince`, `waitingDays`), the reason of a block, the start and the
# day of completion to the stage, and the change of the party waited for (an edit of the patch, not a transition).
# Personal data (DO-P): the person responsible and the party waited for are `{id, displayName}` only (SR-DATA-03) — no e-mail, role,
# telephone or contact person. The reason of a block is free text that may name a person (SR-DATA-02): the panel renders it as text.
# The notes of a stage are not returned.
StageStatus:
  type: string
  description: >-
    Status etapu (zamknięta lista po stronie serwera; klient obsługuje też wartość nieznaną — P-12). „Otwarte” to `todo`,
    `in_progress` i `waiting`. Etap powstaje w stanie `todo`; status zmienia wyłącznie komenda przejścia (EVM-032).
  enum: [todo, in_progress, waiting, blocked, done, not_applicable]
StageWaitingOn:
  type: string
  description: >-
    Na kogo czekamy: `customer` — na klienta, `party` — na stronę (OSD, zarządcę, administrację …; `waitingOnPartyId`). Ustawione
    dokładnie w statusie `waiting`.
  enum: [customer, party]
StageWaitingParty:
  type: object
  description: >-
    Strona, na którą czekamy — identyfikator i nazwa wyświetlana, nic więcej (bez telefonu, e-maila, osoby kontaktowej i notatek;
    SR-DATA-02). Nazwa strony będącej osobą fizyczną to dane osobowe — panel wyświetla ją jako tekst.
  required: [id, displayName]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 200
StageResponsibleUser:
  type: object
  description: Osoba odpowiedzialna za etap — identyfikator i nazwa wyświetlana (bez e-maila, roli i statusu konta).
  required: [id, displayName]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 200
ProcedureProgress:
  type: object
  description: >-
    Postęp procesu wyliczany przy odczycie (nie zapisywany): `done` — etapy w statusie `done`, `total` — etapy procesu bez
    `not_applicable` (etap „Nie dotyczy” nie wchodzi do mianownika — styleguide § 3.23). `total` równe 0 oznacza proces bez
    etapów do realizacji.
  required: [done, total]
  additionalProperties: false
  properties:
    done:
      type: integer
      minimum: 0
      maximum: 30
    total:
      type: integer
      minimum: 0
      maximum: 30
ProcedureStage:
  type: object
  description: >-
    Etap procesu w zleceniu. `overdue` liczy serwer przy odczycie: termin wcześniejszy niż dziś w `Europe/Warsaw` i etap jeszcze
    niezakończony (nie `done` i nie `not_applicable`) — klient nie porównuje dat sam. „Czekamy na…” (EVM-032): `waitingOn`,
    `waitingParty` (dla `party`), `waitingSince` i `waitingDays` (pełne dni kalendarzowe od `waitingSince` do dziś w
    `Europe/Warsaw`, liczy serwer) są ustawione dokładnie w statusie `waiting`, w pozostałych `null`; `blockedReason` tylko w
    statusie `blocked` (pole swobodne — może zawierać dane osobowe, panel wyświetla je jako tekst); `startedAt` ustawia „Rozpocznij”;
    `completedOn` tylko w statusie `done`. `waitingParty` jest `null` także wtedy, gdy strona została później usunięta.
  required:
    - id
    - code
    - name
    - position
    - status
    - dueDate
    - overdue
    - responsibleUser
    - waitingOn
    - waitingParty
    - waitingSince
    - waitingDays
    - blockedReason
    - startedAt
    - completedOn
    - version
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    code:
      type: string
      description: Stały kod etapu (kopia z szablonu).
      maxLength: 64
    name:
      type: string
      description: Nazwa etapu (kopia z szablonu) — panel wyświetla ją jako tekst.
      maxLength: 200
    position:
      type: integer
      minimum: 1
      maximum: 30
    status:
      $ref: '#/StageStatus'
    dueDate:
      description: Termin etapu (dzień w strefie `Europe/Warsaw`, `RRRR-MM-DD`) albo `null`.
      oneOf:
        - type: string
          format: date
          maxLength: 10
        - type: 'null'
    overdue:
      type: boolean
      description: '`true`, gdy termin jest wcześniejszy niż dziś (`Europe/Warsaw`) i etap jest niezakończony.'
    responsibleUser:
      description: Osoba odpowiedzialna albo `null`.
      oneOf:
        - $ref: '#/StageResponsibleUser'
        - type: 'null'
    waitingOn:
      description: Na kogo czekamy (tylko w statusie `waiting`) albo `null`.
      oneOf:
        - $ref: '#/StageWaitingOn'
        - type: 'null'
    waitingParty:
      description: Strona, na którą czekamy (`waitingOn` = `party`), albo `null`.
      oneOf:
        - $ref: '#/StageWaitingParty'
        - type: 'null'
    waitingSince:
      description: Od kiedy czekamy (dzień w strefie `Europe/Warsaw`, `RRRR-MM-DD`) albo `null`.
      oneOf:
        - type: string
          format: date
          maxLength: 10
        - type: 'null'
    waitingDays:
      description: Ile pełnych dni kalendarzowych czekamy (dziś minus `waitingSince`, `Europe/Warsaw`; 0 = od dziś) albo `null`. Powyżej 14 panel ostrzega.
      oneOf:
        - type: integer
          minimum: 0
          maximum: 40000
        - type: 'null'
    blockedReason:
      description: Powód blokady (pole swobodne — może zawierać dane osobowe) albo `null`.
      oneOf:
        - type: string
          maxLength: 500
        - type: 'null'
    startedAt:
      description: Kiedy etap rozpoczęto („Rozpocznij”, `todo → in_progress`) albo `null`.
      oneOf:
        - type: string
          format: date-time
          maxLength: 40
        - type: 'null'
    completedOn:
      description: Dzień zakończenia (`RRRR-MM-DD`; tylko w statusie `done`) albo `null`.
      oneOf:
        - type: string
          format: date
          maxLength: 10
        - type: 'null'
    version:
      type: integer
      description: Wersja etapu — wartość `If-Match` (`"<version>"`) przy zmianie etapu i przy przejściu.
      minimum: 1
Procedure:
  type: object
  description: Proces w zleceniu — kopia procesu z szablonu z etapami w kolejności `position`.
  required: [id, code, name, position, progress, stages]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    code:
      type: string
      description: Stały kod procesu (kopia z szablonu); w zleceniu jest co najwyżej jeden proces o danym kodzie.
      maxLength: 64
    name:
      type: string
      description: Nazwa procesu (kopia z szablonu) — panel wyświetla ją jako tekst.
      maxLength: 200
    position:
      type: integer
      minimum: 1
      maximum: 30
    sourceScopeItemId:
      type: string
      description: >-
        Pozycja zakresu, która wniosła proces (EVM-035 AC3; panel pokazuje „Procesy dodane z tą pozycją zostają: …” przy usuwaniu
        pozycji). Identyfikator zostaje po usunięciu pozycji (proces zostaje w zleceniu). Brak pola, gdy proces dodano ręcznie albo
        żadna pozycja zakresu go nie wniosła.
      format: uuid
      maxLength: 36
    version:
      type: integer
      description: >-
        Wersja procesu — wartość `If-Match` (`"<version>"`) przy usunięciu i przywróceniu procesu (EVM-042). Rośnie przy usunięciu i
        przywróceniu procesu oraz przy dodaniu, usunięciu i przywróceniu jego etapu (zmiana składu procesu), więc „Usuń proces” działa
        na tym, co użytkownik widział. Nie jest w wymaganych, bo dodano ją addytywnie — serwer zawsze ją zwraca.
      minimum: 1
    progress:
      $ref: '#/ProcedureProgress'
    currentStageId:
      description: >-
        Bieżący etap procesu (EVM-034; kafel „Na jakim etapie”): pierwszy etap niezakończony (`todo`, `in_progress`, `waiting`,
        `blocked`) w kolejności `position`, albo `null`, gdy wszystkie etapy są zakończone (`done`, `not_applicable`) albo proces nie
        ma etapów. Liczy serwer przy odczycie — nie jest zapisywane. Pole tylko do odczytu; nie jest w wymaganych, bo dodano je
        addytywnie — serwer zawsze je zwraca.
      oneOf:
        - type: string
          format: uuid
          maxLength: 36
        - type: 'null'
    stages:
      type: array
      maxItems: 30
      items:
        $ref: '#/ProcedureStage'
ProcedureList:
  type: object
  description: >-
    Procesy zlecenia w kolejności `position` (zlecenie bez procesów to pusta tablica `items`). `openStageCount` to liczba etapów
    otwartych (`todo`, `in_progress`, `waiting`) we wszystkich procesach — podstawa ostrzeżenia przy „Zakończ” (nie blokuje
    zakończenia).
  required: [items, openStageCount]
  additionalProperties: false
  properties:
    items:
      type: array
      maxItems: 30
      items:
        $ref: '#/Procedure'
    openStageCount:
      type: integer
      minimum: 0
      maximum: 900
ProcedureStagePatch:
  type: object
  description: >-
    Zmiana etapu (merge-patch; EVM-031, EVM-032): osoba odpowiedzialna, termin i/lub „na kogo czekamy” — co najmniej jedno pole.
    Pole nieobecne zostaje bez zmian, `null` czyści wartość (osoba, termin). `responsibleUserId` musi wskazywać aktywnego
    użytkownika (konto nieistniejące, zaproszone, zdezaktywowane i usunięte to jedna odpowiedź `400 validation_failed`,
    `/responsibleUserId`, `assignee_unavailable`). `dueDate` to dzień z zakresu 2000-01-01..2100-12-31 (`out_of_range` poza zakresem).
    „Zmień, na kogo czekamy…” (EVM-032 AC3) to edycja, nie przejście: `waitingOn` jest wymagane, gdy treść zawiera którekolwiek
    z pól `waitingOn`, `waitingOnPartyId`, `waitingSince`; `waitingOnPartyId` — wymagane dla `party`, niedozwolone dla `customer`
    (`required` / `not_allowed`); `waitingSince` — domyślnie dziś w `Europe/Warsaw`, od 2000-01-01, nie z przyszłości
    (`out_of_range`). Te pola są dozwolone tylko w statusie `waiting` (inaczej `409 invalid_state_transition`); strona nieistniejąca
    albo usunięta — `400` (`/waitingOnPartyId`, `unknown_party`, ta sama odpowiedź dla każdej roli). Pole kontrolowane przez serwer
    (`id`, `code`, `name`, `position`, `status`, `version`, `overdue`, `responsibleUser`, `waitingParty`, `waitingDays`,
    `blockedReason`, `startedAt`, `completedOn`, `notes`) — `400 read_only_field`, pole spoza schematu — `400 unknown_field`;
    pusta treść — `400 validation_failed`.
  minProperties: 1
  additionalProperties: false
  properties:
    responsibleUserId:
      description: Identyfikator aktywnego użytkownika (z listy `GET /api/v1/users/assignable`) albo `null`, by usunąć osobę odpowiedzialną.
      oneOf:
        - type: string
          format: uuid
          maxLength: 36
        - type: 'null'
    dueDate:
      description: Termin etapu, `RRRR-MM-DD` (2000-01-01..2100-12-31), albo `null`, by go usunąć.
      oneOf:
        - type: string
          format: date
          maxLength: 10
        - type: 'null'
    waitingOn:
      $ref: '#/StageWaitingOn'
    waitingOnPartyId:
      type: string
      description: Identyfikator strony (UUID), na którą czekamy — wymagany dla `waitingOn` = `party`.
      format: uuid
      maxLength: 36
    waitingSince:
      type: string
      description: Od kiedy czekamy, `RRRR-MM-DD` (domyślnie dziś, nie z przyszłości, od 2000-01-01).
      format: date
      maxLength: 10
TransitionProcedureStageRequest:
  type: object
  description: >-
    Komenda przejścia statusu etapu (EVM-032). `to` — docelowy status (tabela przejść „Etap procesu” w `domain-model.md`; przejścia
    spoza tabeli — `409 invalid_state_transition`). Pola zależą od `to` i są niedozwolone poza nim (`not_allowed`): `waiting` —
    `waitingOn` (wymagane), `waitingOnPartyId` (wymagane dla `party`, niedozwolone dla `customer`), `waitingSince` (domyślnie dziś,
    od 2000-01-01, nie z przyszłości; „Cofnij” podaje poprzednią wartość); `blocked` — `blockedReason` (wymagany: zwykły tekst, NFC,
    przycięty, 1–500 znaków; kody `required`, `too_long`, `invalid_characters`; pole swobodne — może zawierać dane osobowe i nigdy nie
    trafia do audytu, logów ani komunikatów błędów); `done` — `completedOn` (domyślnie dziś, od 2000-01-01, nie z przyszłości; kod
    `out_of_range`). „Cofnij” to zwykłe przejście z parametrami, które użytkownik mógłby podać ręcznie. Pola serwera (`status`,
    `version`, `waitingParty`, `waitingDays`, `startedAt` …) w treści — `400 read_only_field`, inne — `400 unknown_field`.
  required: [to]
  additionalProperties: false
  properties:
    to:
      $ref: '#/StageStatus'
    waitingOn:
      $ref: '#/StageWaitingOn'
    waitingOnPartyId:
      type: string
      description: Identyfikator strony (UUID), na którą czekamy — tylko przy `waiting` i `waitingOn` = `party`.
      format: uuid
      maxLength: 36
    waitingSince:
      type: string
      description: Od kiedy czekamy, `RRRR-MM-DD` (tylko przy `waiting`).
      format: date
      maxLength: 10
    blockedReason:
      type: string
      description: Powód blokady (tylko przy `blocked`; pole swobodne — może zawierać dane osobowe).
      maxLength: 500
    completedOn:
      type: string
      description: Dzień zakończenia, `RRRR-MM-DD` (tylko przy `done`).
      format: date
      maxLength: 10
CreateProcedureRequest:
  type: object
  description: >-
    Dodanie procesu do zlecenia z szablonu (EVM-042 AC1): `id` (UUIDv7) nadaje klient, `procedureTemplateId` wskazuje aktywny szablon
    procesu (wycofany albo nieistniejący — `422 template_unavailable`, jednakowa odpowiedź), `position` to miejsce na liście procesów
    (1–30; brak = na końcu; wartość większa niż liczba procesów + 1 jest przycinana do końca, więc wyścig z panelu nie daje `400`).
    Kod i nazwę procesu oraz etapy (wszystkie „Do zrobienia”) serwer kopiuje z szablonu; klient ich nie podaje — pole serwera
    (`code`, `name`, `stages`, `progress`, `version`, `sourceScopeItemId`, `currentStageId`) to `400 read_only_field`, inne — `400
    unknown_field`.
  required: [id, procedureTemplateId]
  additionalProperties: false
  properties:
    id:
      type: string
      description: Identyfikator nowego procesu (UUIDv7 nadany przez klienta). Istniejący — `409 id_conflict`.
      format: uuid
      maxLength: 36
    procedureTemplateId:
      type: string
      description: Identyfikator szablonu procesu (z `GET /api/v1/catalog/procedure-templates`).
      format: uuid
      maxLength: 36
    position:
      type: integer
      description: Miejsce na liście procesów zlecenia (1–30); brak = na końcu.
      minimum: 1
      maximum: 30
CreateProcedureStageRequest:
  type: object
  description: >-
    Dodanie etapu do procesu (EVM-042 AC2): `id` (UUIDv7) nadaje klient, `name` to zwykły tekst (NFC, przycięty, 1–120 znaków, bez
    znaków sterujących; kody `required`, `too_long`, `invalid_characters`) — pole swobodne, może zawierać dane osobowe, więc nigdy nie
    trafia do audytu, dziennika, logów ani komunikatów błędów. `position` to miejsce w procesie (1–30; brak = na końcu; za dużą
    wartość serwer przycina do końca). `dueDate` (2000-01-01..2100-12-31, `out_of_range` poza zakresem) i `responsibleUserId`
    (aktywny użytkownik — nieistniejący, zaproszony, zdezaktywowany i usunięty to jedna odpowiedź `400`, `/responsibleUserId`,
    `assignee_unavailable`) są opcjonalne. Kod etapu (`custom_…`), status („Do zrobienia”) i wersję nadaje serwer — pole serwera
    to `400 read_only_field`, inne — `400 unknown_field`.
  required: [id, name]
  additionalProperties: false
  properties:
    id:
      type: string
      description: Identyfikator nowego etapu (UUIDv7 nadany przez klienta). Istniejący — `409 id_conflict`.
      format: uuid
      maxLength: 36
    name:
      type: string
      description: Nazwa etapu (zwykły tekst — pole swobodne, bez danych osobowych).
      minLength: 1
      maxLength: 120
    position:
      type: integer
      description: Miejsce w procesie (1–30); brak = na końcu.
      minimum: 1
      maximum: 30
    dueDate:
      type: string
      description: Termin etapu, `RRRR-MM-DD` (2000-01-01..2100-12-31).
      format: date
      maxLength: 10
    responsibleUserId:
      type: string
      description: Identyfikator aktywnego użytkownika (z listy `GET /api/v1/users/assignable`).
      format: uuid
      maxLength: 36
DeletedProcedure:
  type: object
  description: >-
    Usunięty proces w sekcji „Usunięte procesy i etapy” (tylko Administrator; EVM-042 AC3) — wyłącznie to, czego potrzebuje wiersz z
    „Przywróć”: bez osób odpowiedzialnych, terminów, notatek, „czekamy na” i powodów blokady (SR-DATA-03).
  required: [id, code, name, position, stageCount, version, deletedAt]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    code:
      type: string
      maxLength: 64
    name:
      type: string
      maxLength: 200
    position:
      type: integer
      description: Miejsce, na które proces wróci po przywróceniu (przycięte do końca listy).
      minimum: 1
      maximum: 30
    stageCount:
      type: integer
      description: Liczba etapów (nieusuniętych), z którymi proces wróci.
      minimum: 0
      maximum: 30
    version:
      type: integer
      description: Wersja procesu — wartość `If-Match` przy przywróceniu.
      minimum: 1
    deletedAt:
      type: string
      format: date-time
      maxLength: 40
DeletedProcedureStage:
  type: object
  description: >-
    Usunięty etap w sekcji „Usunięte procesy i etapy” (tylko Administrator; EVM-042 AC3). `procedureDeleted` = `true`, gdy proces
    etapu też jest usunięty (przywrócenie etapu najpierw wymaga przywrócenia procesu — `409 parent_deleted`). Bez osoby
    odpowiedzialnej, terminu, notatek i powodu blokady.
  required: [id, procedureId, procedureName, name, position, procedureDeleted, version, deletedAt]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    procedureId:
      type: string
      format: uuid
      maxLength: 36
    procedureName:
      type: string
      description: Nazwa procesu etapu (kopia z szablonu) — panel wyświetla ją jako tekst.
      maxLength: 200
    name:
      type: string
      description: Nazwa etapu — panel wyświetla ją jako tekst.
      maxLength: 200
    position:
      type: integer
      minimum: 1
      maximum: 30
    procedureDeleted:
      type: boolean
    version:
      type: integer
      description: Wersja etapu — wartość `If-Match` przy przywróceniu.
      minimum: 1
    deletedAt:
      type: string
      format: date-time
      maxLength: 40
DeletedProcedureList:
  type: object
  description: >-
    Usunięte procesy i etapy zlecenia, od najnowszych (`deletedAt` malejąco, potem `id`), co najwyżej 100 każdego rodzaju — ograniczenie
    odpowiedzi (SR-API-02). `truncated` = `true`, gdy któraś lista jest ucięta (starsze usunięte pozycje istnieją, ale nie są
    pokazane).
  required: [procedures, stages, truncated]
  additionalProperties: false
  properties:
    procedures:
      type: array
      maxItems: 100
      items:
        $ref: '#/DeletedProcedure'
    stages:
      type: array
      maxItems: 100
      items:
        $ref: '#/DeletedProcedureStage'
    truncated:
      type: boolean
