MediaExportConflict:
  description: >-
    Brak zdjęć do eksportu (`no_media_to_export`): zlecenie nie ma żadnego zdjęcia w stanie `ready`. Odpowiedź nie zdradza liczby plików w kwarantannie.
    Zlecenie jest wizją lokalną bez klienta (`customer_required`, EVM-135; EVM-147, ADR-0025 pkt 3: w wizji dokument zlecenia rodzaju
    Oferta/wycena — tak; płatności i ZIP po przypisaniu klienta): eksport ZIP dopiero po przypisaniu klienta.
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/no_media_to_export
        title: There are no photos to export
        status: 409
        code: no_media_to_export
