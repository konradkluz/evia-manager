            code: channel_not_allowed
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        device_limit_reached:
          value:
            type: /problems/device_limit_reached
            title: The device limit of the account is reached
            status: 403
            code: device_limit_reached
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
