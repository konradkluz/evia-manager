        title: Identifier already in use
        status: 409
        code: id_conflict
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
ProcedureRestoreConflict:
  description: >-
    Zlecenie jest zamknięte (`work_order_closed`: Rozliczone albo Anulowane, PO-8), proces o tym kodzie jest już aktywny w zleceniu
    (`procedure_already_active` — przywrócenie procesu), proces etapu jest usunięty (`parent_deleted` — najpierw przywróć proces)
    albo żądanie z tym samym kluczem idempotencji jest w toku (`idempotency_in_progress`, z `Retry-After`). Odpowiedź nie podaje
    statusu zlecenia, nazwy procesu ani danych etapu.
  headers:
    Retry-After:
      description: Liczba sekund do ponowienia (tylko `idempotency_in_progress`).
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/parent_deleted
        title: The process of the stage is deleted
        status: 409
        code: parent_deleted
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
ProcedureUnprocessable:
  description: >-
    Szablon procesu wycofany albo nieistniejący (`template_unavailable` — jednakowa odpowiedź w obu przypadkach), przekroczony limit
    obiektów podrzędnych (`limit_exceeded`: 30 procesów w zleceniu albo 30 etapów w procesie, także przy przywracaniu; `errors[]` ma
    tylko wskaźnik i kod, bez wartości) albo ten sam klucz idempotencji z inną treścią, na innym zleceniu lub na innej operacji
    (`idempotency_mismatch`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/limit_exceeded
        title: A limit of the number of objects was exceeded
        status: 422
        code: limit_exceeded
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          - pointer: ''
            code: too_many_procedures
ReauthenticationFailed:
  description: >-
    Pełne ponowne uwierzytelnienie odrzucone (`reauthentication_failed`) — JEDNA odpowiedź niezależnie od tego, który czynnik zawiódł
    (hasło, klucz dostępu, kod z aplikacji; bez wyroczni, ASVS V6.3.8); nieudana próba liczy się do limitu logowania (SR-AUTH-05).
    Piąty zły kod z aplikacji w sesji (wspólnie ze step-upem) unieważnia ją (`session_revoked`). Brak sesji (`unauthenticated`),
    sesja unieważniona (`session_revoked`) albo wygasła (`session_expired`). Złe bieżące hasło przy zmianie hasła: `invalid_credentials`.
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/reauthentication_failed
        title: Re-authentication failed
        status: 401
        code: reauthentication_failed
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
ReauthenticationRequired:
  description: >-
    Brak dostępu: `reauthentication_required` — operacja wymaga pełnego ponownego uwierzytelnienia (`reauthenticate`) o właściwym
    celu; znacznik jest jednorazowy, ważny 5 minut i związany z sesją; `forbidden`, `csrf_failed`, `mfa_enrollment_required`
    (sesja `mfa_enrollment` nie ma dostępu do operacji konta poza konfiguracją własnego drugiego kroku), `step_up_required`.
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/reauthentication_required
        title: Full re-authentication required
        status: 403
        code: reauthentication_required
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
SecondStepConflict:
  description: >-
    Konflikt reguł drugiego kroku (EVM-028 AC4): `last_second_step_method` — nie wolno usunąć ostatniego klucza Administratora
    (`errors[0].code: passkey_required`) ani ostatniej metody innego konta (`errors[0].code: method_required`) — najpierw trzeba dodać
    inną metodę; `mfa_already_configured` — konto ma już kod z aplikacji (sekret nigdy nie jest zwracany); `current_session` — bieżącą
    sesję kończy „Wyloguj”.
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/last_second_step_method
        title: The last second step method cannot be removed
        status: 409
        code: last_second_step_method
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          - pointer: /passkeyId
            code: passkey_required
# Mobile channel (EVM-090 AC5): every response of the auth, device and sync operations — errors included — is `no-store`
# problem+json. Codes are the catalogue of api-guidelines.md; no code is invented here.
MobileValidationFailed:
  description: Treść, parametry albo nagłówki niezgodne ze schematem (`validation_failed`, szczegóły w `errors[]` — wskaźnik i kod, bez wartości).
  headers:
    Cache-Control:
      $ref: devices.yaml#/CacheControlNoStore
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/validation_failed
        title: Request validation failed
        status: 400
        code: validation_failed
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          - pointer: /device/securityPatch
            code: invalid_format
MobileSyncBadRequest:
  description: >-
    Parametry niezgodne ze schematem (`validation_failed`) albo kursor innego użytkownika lub urządzenia (`invalid_cursor` — legalnie
    nie występuje; niedekodowalny lub przeterminowany kursor daje `200 resync_required`, nie ten błąd).
  headers:
    Cache-Control:
      $ref: devices.yaml#/CacheControlNoStore
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      examples:
        invalid_cursor:
          value:
            type: /problems/invalid_cursor
            title: Invalid cursor
            status: 400
            code: invalid_cursor
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        validation_failed:
          value:
            type: /problems/validation_failed
            title: Request validation failed
            status: 400
            code: validation_failed
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            errors:
              - pointer: /limit
                code: too_large
MobileInvalidCredentials:
  description: >-
    `invalid_credentials` — JEDYNA odpowiedź na każdą porażkę pierwszego kroku (zły e-mail, złe hasło, konto zaproszone lub
    dezaktywowane, zła para `deviceId` + sekret instalacji) w tym samym czasie i z tymi samymi nagłówkami (SR-AUTH-05).
  headers:
    Cache-Control:
      $ref: devices.yaml#/CacheControlNoStore
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/invalid_credentials
        title: Invalid email or password
        status: 401
        code: invalid_credentials
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
MobileLoginTotpUnauthorized:
  description: >-
    `invalid_credentials` — zły kod, a także zły, wygasły i zużyty `challengeToken` (jedna odpowiedź); `device_wipe_required` —
    dopiero po poprawnym kodzie, gdy urządzenie z podanym sekretem ma zlecone wyczyszczenie (aplikacja usuwa dane i potwierdza).
  headers:
    Cache-Control:
      $ref: devices.yaml#/CacheControlNoStore
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      examples:
        invalid_credentials:
          value:
            type: /problems/invalid_credentials
            title: Invalid email or password
            status: 401
            code: invalid_credentials
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        device_wipe_required:
          value:
            type: /problems/device_wipe_required
            title: The device must wipe its data
            status: 401
            code: device_wipe_required
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
MobileLoginForbidden:
  description: >-
    Dopiero po POPRAWNYM haśle (SR-AUTH-05): konto musi dokończyć konfigurację drugiego kroku w panelu (`mfa_enrollment_required`)
    albo nie ma skonfigurowanej aplikacji TOTP (`totp_not_configured`).
