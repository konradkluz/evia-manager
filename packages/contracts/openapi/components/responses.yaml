        title: Forbidden
        status: 403
        code: forbidden
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
MobileNotFound:
  description: >-
    Zlecenie nie istnieje, jest usunięte, poza zakresem albo bez dostępu — jednakowe `404 not_found` (istnienie jest informacją, IDOR);
    klient usuwa wtedy lokalną kopię (poza obiektami oczekującymi).
  headers:
    Cache-Control:
      $ref: devices.yaml#/CacheControlNoStore
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/not_found
        title: Not found
        status: 404
        code: not_found
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
MobilePayloadTooLarge:
  description: Treść większa niż limit (`payload_too_large`; operacje publiczne — 8 KB, partia mutacji — 1 MB).
  headers:
    Cache-Control:
      $ref: devices.yaml#/CacheControlNoStore
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/payload_too_large
        title: Payload too large
        status: 413
        code: payload_too_large
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
MobileUnsupportedMediaType:
  description: Treść inna niż `application/json` (`unsupported_media_type`).
  headers:
    Cache-Control:
      $ref: devices.yaml#/CacheControlNoStore
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/unsupported_media_type
        title: Unsupported media type
        status: 415
        code: unsupported_media_type
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
MobileClientVersionUnsupported:
  description: >-
    Wersja aplikacji poniżej minimalnej albo brak lub niepoprawny nagłówek `X-Client-Version` / `X-Client-Platform`
    (`client_version_unsupported`) z `minSupportedVersion`. Aplikacja blokuje pracę online, ZACHOWUJE kolejkę offline i prosi o
    aktualizację. Nie dotyczy `GET /api/v1/meta/client-config` i potwierdzenia wyczyszczenia.
  headers:
    Cache-Control:
      $ref: devices.yaml#/CacheControlNoStore
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/client_version_unsupported
        title: Client version is no longer supported
        status: 426
        code: client_version_unsupported
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        minSupportedVersion:
          android: 1.1.0
          ios: 1.1.0
MobileRateLimited:
  description: Przekroczony limit żądań (`rate_limited`) z `Retry-After`.
  headers:
    Retry-After:
      description: Liczba sekund do ponowienia.
      schema:
        type: integer
        minimum: 1
        maximum: 3600
    Cache-Control:
      $ref: devices.yaml#/CacheControlNoStore
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/rate_limited
        title: Too many requests
        status: 429
        code: rate_limited
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
CompletedObjectMismatch:
  description: >-
    Zakończona sesja uploadu ma obiekt o innym rozmiarze albo go brak (`completed_object_mismatch`; EVM-011, media-pipeline.md):
    operacja niczego nie usuwa. Zwraca ją `complete` sesji uploadu (EVM-044) — w EVM-090 kod jest tylko wpisany do katalogu.
  headers:
    Cache-Control:
      $ref: devices.yaml#/CacheControlNoStore
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/completed_object_mismatch
        title: The completed object does not match the session
        status: 409
        code: completed_object_mismatch
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
