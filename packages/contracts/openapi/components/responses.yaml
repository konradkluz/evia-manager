# Shared error responses (application/problem+json, api-guidelines.md → Format błędów). Examples use catalogue codes.
ValidationFailed:
  description: Treść niezgodna ze schematem (`validation_failed`, szczegóły w `errors[]` — wskaźnik i kod, bez wartości) albo nieprawidłowy JSON.
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/validation_failed
        title: Request validation failed
        status: 400
        code: validation_failed
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          - pointer: /password
            code: too_short
Unauthenticated:
  description: Brak sesji (`unauthenticated`), sesja unieważniona (`session_revoked`) albo wygasła (`session_expired`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/unauthenticated
        title: Authentication required
        status: 401
        code: unauthenticated
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
Forbidden:
  description: >-
    Brak uprawnienia (`forbidden`), nieudana kontrola CSRF (`csrf_failed`) albo konto bez klucza dostępu
    (`mfa_enrollment_required`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/csrf_failed
        title: Cross-site request check failed
        status: 403
        code: csrf_failed
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
PayloadTooLarge:
  description: Treść większa niż limit (`payload_too_large`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/payload_too_large
        title: Payload too large
        status: 413
        code: payload_too_large
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
UnsupportedMediaType:
  description: Treść inna niż `application/json` (`unsupported_media_type`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/unsupported_media_type
        title: Unsupported media type
        status: 415
        code: unsupported_media_type
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
RateLimited:
  description: Przekroczony limit żądań (`rate_limited`), z nagłówkiem `Retry-After`.
  headers:
    Retry-After:
      description: Liczba sekund do ponowienia.
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/rate_limited
        title: Too many requests
        status: 429
        code: rate_limited
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
ActivationLinkInvalid:
  description: >-
    Link jest użyty, zmieniony, zastąpiony, wygasły albo nieznany (`activation_link_invalid`) — jedna odpowiedź dla
    wszystkich przypadków, bez informacji o koncie — albo treść niezgodna ze schematem (`validation_failed`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/activation_link_invalid
        title: Activation link is invalid or expired
        status: 400
        code: activation_link_invalid
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
InvalidCredentials:
  description: >-
    Nieprawidłowy e-mail lub hasło (`invalid_credentials`) — jedna odpowiedź (kod, treść i nagłówki) dla złego hasła,
    nieistniejącego konta, konta zaproszonego i dezaktywowanego (SR-AUTH-05).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/invalid_credentials
        title: Invalid email or password
        status: 401
        code: invalid_credentials
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
LoginSecondStepFailed:
  description: >-
    Drugi krok nie powiódł się: klucz dostępu odrzucony (`passkey_failed` — można ponowić z tym samym `loginToken`),
    czas na drugi krok minął (`login_expired`) albo brak ważnego pierwszego kroku (`unauthenticated`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/passkey_failed
        title: Passkey sign-in failed
        status: 401
        code: passkey_failed
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
SessionExpired:
  description: >-
    Brak sesji (`unauthenticated`), sesja unieważniona (`session_revoked`) albo wygasła z powodu bezczynności lub limitu
    12 godzin (`session_expired`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/session_expired
        title: Session expired
        status: 401
        code: session_expired
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
PasskeyVerificationFailed:
  description: Weryfikacja klucza dostępu nie powiodła się (`passkey_verification_failed`) albo treść niezgodna ze schematem (`validation_failed`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/passkey_verification_failed
        title: Passkey verification failed
        status: 400
        code: passkey_verification_failed
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
NotFound:
  description: Zasób nie istnieje albo nie jest dostępny dla wywołującego (`not_found`) — jedna odpowiedź, bez szczegółów.
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/not_found
        title: Not found
        status: 404
        code: not_found
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
StepUpRequired:
  description: >-
    Operacja wymaga ponownego uwierzytelnienia (`step_up_required`): ostatnie uwierzytelnienie kluczem dostępu w tej sesji
    było 15 minut temu lub wcześniej albo go nie było (sesja z hasła, aktywacji lub kodu odzyskiwania). Zwracane dopiero po
    kontroli kanału i roli — rola bez prawa do operacji dostaje `forbidden`.
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/step_up_required
        title: Re-authentication required
        status: 403
        code: step_up_required
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
StepUpFailed:
  description: >-
    Klucz dostępu odrzucony (`passkey_failed` — sesja bez zmian, wyzwanie zużyte; trzeba poprosić o nowe opcje), brak sesji
    (`unauthenticated`), sesja unieważniona (`session_revoked`) albo wygasła (`session_expired`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/passkey_failed
        title: Passkey sign-in failed
        status: 401
        code: passkey_failed
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
InvalidListQuery:
  description: >-
    Parametry zapytania niezgodne ze schematem (`validation_failed`, `errors[]` — wskaźnik i kod, bez wartości), nieznany
    (`unknown_parameter`) albo powtórzony parametr (`duplicate_parameter`), albo kursor zmieniony, wygasły, wydany komu innemu
    lub użyty z innymi filtrami (`invalid_cursor` — jedna odpowiedź dla wszystkich przypadków, bez szczegółów).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/invalid_cursor
        title: Invalid cursor
        status: 400
        code: invalid_cursor
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
CustomerConflict:
  description: >-
    Identyfikator zajęty (`id_conflict` — bez danych istniejącego zasobu) albo żądanie z tym samym kluczem idempotencji
    jest w toku (`idempotency_in_progress`, z `Retry-After`).
  headers:
    Retry-After:
      description: Liczba sekund do ponowienia (tylko `idempotency_in_progress`).
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/id_conflict
        title: Identifier already in use
        status: 409
        code: id_conflict
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
ResourceConflict:
  description: >-
    Identyfikator zajęty (`id_conflict` — bez danych istniejącego zasobu) albo żądanie z tym samym kluczem idempotencji
    jest w toku (`idempotency_in_progress`, z `Retry-After`).
  headers:
    Retry-After:
      description: Liczba sekund do ponowienia (tylko `idempotency_in_progress`).
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/id_conflict
        title: Identifier already in use
        status: 409
        code: id_conflict
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
IdempotencyMismatch:
  description: Ten sam klucz idempotencji z inną treścią albo na innej operacji (`idempotency_mismatch`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/idempotency_mismatch
        title: Idempotency key reused with a different request
        status: 422
        code: idempotency_mismatch
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
CreateWorkOrderUnprocessable:
  description: >-
    Szablon wycofany albo nieistniejący (`template_unavailable` — jednakowa odpowiedź w obu przypadkach) albo ten sam klucz
    idempotencji z inną treścią lub na innej operacji (`idempotency_mismatch`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/template_unavailable
        title: Work order template is not available
        status: 422
        code: template_unavailable
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
TransitionForbidden:
  description: >-
    Brak uprawnienia do tego przejścia (`forbidden`: Tylko odczyt zawsze; Edytor przy przywróceniu — przejściu `settled → completed` albo
    `cancelled → on_hold`), nieudana kontrola CSRF (`csrf_failed`) albo konto bez klucza dostępu (`mfa_enrollment_required`). Przywrócenie
    przez Administratora bez uwierzytelnienia kluczem dostępu w ostatnich 15 minutach — `step_up_required` (sprawdzane po roli: rola bez
    prawa do przejścia nigdy się nie dowiaduje o step-upie). Odpowiedzi nie podają stanu zlecenia.
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/step_up_required
        title: Re-authentication required
        status: 403
        code: step_up_required
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
TransitionConflict:
  description: >-
    Przejścia nie ma w tabeli przejść z bieżącego statusu (`invalid_state_transition` — odpowiedź nie podaje bieżącego statusu; klient
    pobiera zlecenie), albo żądanie z tym samym kluczem idempotencji jest w toku (`idempotency_in_progress`, z `Retry-After`).
  headers:
    Retry-After:
      description: Liczba sekund do ponowienia (tylko `idempotency_in_progress`).
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/invalid_state_transition
        title: Transition is not allowed from the current state
        status: 409
        code: invalid_state_transition
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
PreconditionFailed:
  description: >-
    `If-Match` nie zgadza się z bieżącą wersją zlecenia (`version_conflict`) — ktoś zmienił zlecenie w międzyczasie; klient pobiera je
    ponownie i ponawia decyzję. Odpowiedź nie podaje bieżącej wersji.
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/version_conflict
        title: The resource was changed by someone else
        status: 412
        code: version_conflict
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
PreconditionRequired:
  description: Brak nagłówka `If-Match` przy zmianie zasobu współdzielonego (`precondition_required`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/precondition_required
        title: Precondition required
        status: 428
        code: precondition_required
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
TransitionUnprocessable:
  description: >-
    Przejście jest w tabeli, ale warunek nie jest spełniony (`transition_condition_not_met`; `errors[]` ma tylko wskaźnik `/to` i kod
    powodu zgłoszony przez moduł, bez danych), albo ten sam klucz idempotencji z inną treścią, na innym zleceniu lub na innej operacji
    (`idempotency_mismatch`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/transition_condition_not_met
        title: A condition of the transition is not met
        status: 422
        code: transition_condition_not_met
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          - pointer: /to
            code: unpaid_milestones
WorkOrderClosed:
  description: >-
    Zlecenie jest zamknięte (`work_order_closed`: Rozliczone albo Anulowane — zakres, procesy i płatności są tylko do odczytu, PO-8)
    albo żądanie z tym samym kluczem idempotencji jest w toku (`idempotency_in_progress`, z `Retry-After`). Odpowiedź nie podaje statusu
    zlecenia ani danych etapu.
  headers:
    Retry-After:
      description: Liczba sekund do ponowienia (tylko `idempotency_in_progress`).
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/work_order_closed
        title: The work order is closed
        status: 409
        code: work_order_closed
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
StageConflict:
  description: >-
    Zlecenie jest zamknięte (`work_order_closed`: Rozliczone albo Anulowane, PO-8), przejścia nie ma w tabeli przejść etapu z jego
    bieżącego statusu albo zmiana „na kogo czekamy” dotyczy etapu, który nie czeka (`invalid_state_transition` — odpowiedź nie
    podaje bieżącego statusu; klient pobiera etap), albo żądanie z tym samym kluczem idempotencji jest w toku
    (`idempotency_in_progress`, z `Retry-After`). Odpowiedź nie podaje statusu zlecenia ani danych etapu.
  headers:
    Retry-After:
      description: Liczba sekund do ponowienia (tylko `idempotency_in_progress`).
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/invalid_state_transition
        title: Transition is not allowed from the current state
        status: 409
        code: invalid_state_transition
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
