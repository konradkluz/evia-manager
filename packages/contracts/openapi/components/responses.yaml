    Cache-Control:
      $ref: devices.yaml#/CacheControlNoStore
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      examples:
        mfa_enrollment_required:
          value:
            type: /problems/mfa_enrollment_required
            title: Second step enrolment required
            status: 403
            code: mfa_enrollment_required
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        totp_not_configured:
          value:
            type: /problems/totp_not_configured
            title: Authenticator app is not configured
            status: 403
            code: totp_not_configured
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
MobileLoginTotpForbidden:
  description: >-
    Dopiero po POPRAWNYM kodzie TOTP: rola bez kanału mobilnego (Tylko odczyt — `channel_not_allowed`; dotyczy tylko logowania
