    zamknięte (`work_order_closed`: Rozliczone albo Anulowane — płatności tylko do odczytu, PO-8) albo żądanie z tym samym kluczem
    idempotencji jest w toku (`idempotency_in_progress`, z `Retry-After`). Odpowiedź nie podaje statusu zlecenia ani kwot.
  headers:
    Retry-After:
      description: Liczba sekund do ponowienia (tylko `idempotency_in_progress`).
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/work_order_closed
        title: The work order is closed
        status: 409
        code: work_order_closed
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
PaymentMilestoneForbidden:
  description: >-
    Brak uprawnienia (`forbidden`: Tylko odczyt zawsze; Edytor przy korekcie płatności — wycofaniu i anulowaniu faktury, cofnięciu
    wpłaty, przywróceniu transzy i zmianie kwoty transzy „Wystawiona” albo „Opłacona”; każda rola przy zmianie kwoty transzy
    „Anulowana”), Administrator bez uwierzytelnienia kluczem dostępu w ostatnich 15 minutach przy korekcie płatności
    (`step_up_required` — sprawdzane po roli, EVM-057), nieudana kontrola CSRF (`csrf_failed`) albo konto bez klucza dostępu
    (`mfa_enrollment_required`). Odpowiedź nie podaje statusu ani kwoty transzy.
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/forbidden
        title: Forbidden
        status: 403
        code: forbidden
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
PaymentMilestoneStateConflict:
  description: >-
    Zlecenie jest zamknięte (`work_order_closed`: Rozliczone albo Anulowane — płatności są tylko do odczytu, PO-8), przejścia nie ma w
    tabeli przejść transzy z jej bieżącego statusu albo pole zmiany nie należy do bieżącego statusu transzy
    (`invalid_state_transition` — odpowiedź nie podaje bieżącego statusu; klient pobiera transze), albo żądanie z tym samym kluczem
    idempotencji jest w toku (`idempotency_in_progress`, z `Retry-After`). Odpowiedź nie podaje statusu zlecenia ani danych transzy.
  headers:
    Retry-After:
      description: Liczba sekund do ponowienia (tylko `idempotency_in_progress`).
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/invalid_state_transition
        title: Transition is not allowed from the current state
        status: 409
        code: invalid_state_transition
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
PaymentMilestoneUnprocessable:
  description: >-
    Przejście jest w tabeli, ale warunek nie jest spełniony (`transition_condition_not_met`; `errors[]` ma tylko wskaźnik pola i kod
    powodu, bez danych — np. `/paidOn`, `in_future`: data wpłaty późniejsza niż dziś w `Europe/Warsaw`), albo ten sam klucz
    idempotencji z inną treścią, dla innej transzy lub na innej operacji (`idempotency_mismatch`).
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/transition_condition_not_met
        title: A condition of the transition is not met
        status: 422
        code: transition_condition_not_met
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          - pointer: /paidOn
            code: in_future
PaymentMilestoneDeleteForbidden:
  description: >-
    Brak uprawnienia (`forbidden`: Edytor i Tylko odczyt zawsze), Administrator bez uwierzytelnienia kluczem dostępu w ostatnich 15 minutach (`step_up_required` —
    sprawdzane po roli), nieudana kontrola CSRF (`csrf_failed`) albo konto bez klucza dostępu (`mfa_enrollment_required`). Odpowiedź
    nie mówi, czy transza istnieje.
  content:
    application/problem+json:
      schema:
        $ref: problem.yaml#/Problem
      example:
        type: /problems/step_up_required
        title: Re-authentication required
        status: 403
        code: step_up_required
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
ProcedureCreateConflict:
  description: >-
    Identyfikator zajęty (`id_conflict` — także identyfikator procesu innego zlecenia; bez danych istniejącego zasobu), proces o tym
    kodzie jest już aktywny w zleceniu (`procedure_already_active` — odpowiedź nie podaje nazwy procesu), zlecenie jest zamknięte
    (`work_order_closed`: Rozliczone albo Anulowane, PO-8) albo żądanie z tym samym kluczem idempotencji jest w toku
    (`idempotency_in_progress`, z `Retry-After`). Odpowiedź nie podaje statusu zlecenia.
  headers:
    Retry-After:
      description: Liczba sekund do ponowienia (tylko `idempotency_in_progress`).
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  content:
    application/problem+json:
      schema:
