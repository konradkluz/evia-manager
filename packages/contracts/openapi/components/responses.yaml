      example:
        type: /problems/procedure_already_active
        title: A process with this code is already active in the work order
        status: 409
        code: procedure_already_active
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
ProcedureStageCreateConflict:
  description: >-
    Identyfikator zajęty (`id_conflict` — także identyfikator etapu innego zlecenia; bez danych istniejącego zasobu), zlecenie jest
    zamknięte (`work_order_closed`: Rozliczone albo Anulowane, PO-8) albo żądanie z tym samym kluczem idempotencji jest w toku
    (`idempotency_in_progress`, z `Retry-After`). Odpowiedź nie podaje statusu zlecenia ani danych etapu.
  headers:
    Retry-After:
      description: Liczba sekund do ponowienia (tylko `idempotency_in_progress`).
      schema:
