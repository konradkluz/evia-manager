# Module `customers` — clients of the company (EVM-020; W-05 section "1. Klient"; EVM-039; W-14). `Customer` is DO-K (personal data):
# it is returned by the creation, the detail and the edit; a list or a search item is smaller (`CustomerSearchItem`, SR-DATA-03).
# The fields the server controls are `readOnly`: a request that names one is answered `400 validation_failed` with the code
# `read_only_field` (the list of such fields is derived from this schema, not kept by hand — EVM-020 AC5, SR-AUTHZ-04).
CustomerKind:
  type: string
  description: Rodzaj klienta — osoba (imię i nazwisko) albo firma (nazwa firmy).
  enum: [person, company]
CustomerPostalAddress:
  type: object
  description: Adres korespondencyjny (opcjonalny — tylko gdy potrzebny do dokumentów formalnych). Ulica, numer budynku, kod i miasto są wymagane razem.
  required: [street, buildingNumber, postalCode, city]
  properties:
    street:
      type: string
      maxLength: 200
    buildingNumber:
      type: string
      maxLength: 20
    apartmentNumber:
      type: string
      maxLength: 20
    postalCode:
      type: string
      description: Kod pocztowy w formacie `00-000`.
      pattern: '^\d{2}-\d{3}$'
      maxLength: 6
    city:
      type: string
      maxLength: 100
Customer:
  type: object
  description: >-
    Klient (osoba albo firma). Wejście: `id` (UUIDv7 nadany przez klienta), `kind` i pola właściwe dla rodzaju — osoba: `firstName`,
    `lastName`; firma: `companyName`, opcjonalnie `taxId` (NIP) i `contactPersonName`; wspólne: `phone` (wymagany), `email`,
    `postalAddress`, `notes`. Reguły zależne od `kind` sprawdza serwer (`required`, `not_allowed_for_kind` w `errors[]`).
    Pola `readOnly` ustawia wyłącznie serwer.
  required: [id, kind, phone, displayName, version, createdAt, updatedAt]
  properties:
    id:
      type: string
      description: Identyfikator UUIDv7 nadany przez klienta (ponowienie zapisu używa tego samego `id`).
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      maxLength: 36
    kind:
      $ref: '#/CustomerKind'
    firstName:
      type: string
      maxLength: 200
    lastName:
      type: string
      maxLength: 200
    companyName:
      type: string
      maxLength: 200
    taxId:
      type: string
      description: NIP firmy; przyjmowany z prefiksem `PL`, spacjami i myślnikami, zapisywany jako 10 cyfr (z sumą kontrolną).
      maxLength: 20
    contactPersonName:
      type: string
      maxLength: 200
    phone:
      type: string
      description: >-
        Telefon w dowolnym zapisie (spacje, myślniki, nawiasy, `+48`, `0048`, 9 cyfr krajowych); serwer normalizuje do E.164
        (`^\+[1-9]\d{7,14}$`). W odpowiedzi — zawsze E.164.
      maxLength: 32
    email:
      type: string
      description: Adres e-mail; zapisywany małymi literami.
      maxLength: 254
    postalAddress:
      $ref: '#/CustomerPostalAddress'
    notes:
      type: string
      description: Notatki (zwykły tekst). Nie wpisuj numerów PESEL, numerów dokumentów ani kodów do bram i alarmów.
      maxLength: 2000
    displayName:
      type: string
      description: Nazwa wyświetlana (osoba — „Imię Nazwisko”, firma — nazwa firmy). Ustawia serwer.
      readOnly: true
      maxLength: 400
    sortName:
      type: string
      description: Klucz sortowania (nazwisko przed imieniem). Ustawia serwer; nie jest zwracany.
      readOnly: true
      maxLength: 400
    searchText:
      type: string
      description: Tekst wyszukiwania (zawiera telefon i e-mail). Ustawia serwer; nigdy nie jest zwracany.
      readOnly: true
      maxLength: 2000
    version:
      type: integer
      description: Wersja zasobu (ETag). Ustawia serwer.
      readOnly: true
      minimum: 1
    createdAt:
      type: string
      format: date-time
      readOnly: true
      maxLength: 40
    createdBy:
      type: string
      description: Autor — ustawia serwer; nie jest zwracany.
      format: uuid
      readOnly: true
      maxLength: 36
    updatedAt:
      type: string
      format: date-time
      readOnly: true
      maxLength: 40
    updatedBy:
      type: string
      description: Ustawia serwer; nie jest zwracany.
      format: uuid
      readOnly: true
      maxLength: 36
    deletedAt:
      type: string
      description: Znacznik usunięcia (soft delete). Ustawia serwer; nie jest zwracany.
      format: date-time
      readOnly: true
      maxLength: 40
    deletedBy:
      type: string
      description: Ustawia serwer; nie jest zwracany.
      format: uuid
      readOnly: true
      maxLength: 36
CustomerSearchRequest:
  type: object
  description: >-
    Fraza wyszukiwania w treści (nigdy w adresie URL, SR-API-04). Serwer normalizuje ją do NFC, przycina i wymaga 3–100 znaków
    (`400 validation_failed`, kod `too_short` albo `too_long`). Fraza zbudowana z cyfr, `+`, spacji, nawiasów i myślników
    jest traktowana jak telefon (porównanie po samych cyfrach). `cursor` i `limit` (EVM-039) są opcjonalne: kursor jest związany z
    frazą i użytkownikiem; użyty z inną frazą, wygasły albo cudzy — `400 invalid_cursor`.
  required: [query]
  properties:
    query:
      type: string
      maxLength: 200
    limit:
      type: integer
      description: Liczba pozycji na stronie (domyślnie 25).
      minimum: 1
      maximum: 100
      default: 25
    cursor:
      type: string
      description: Kursor ze strony poprzedniej (`nextCursor`) — wartość nieprzezroczysta, bez danych.
      maxLength: 512
      pattern: '^[A-Za-z0-9_-]+$'
CustomerSearchItem:
  type: object
  description: >-
    Pozycja listy albo wyniku wyszukiwania (W-14, picker W-05): nazwa wyświetlana, klucz sortowania, rodzaj, telefon i e-mail (bez NIP,
    adresu i notatek, SR-DATA-03). Dostęp do listy mają te same trzy role, które mają szczegóły.
  required: [id, kind, displayName, sortName, phone, email]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    kind:
      $ref: '#/CustomerKind'
    displayName:
      type: string
      maxLength: 400
    sortName:
      type: string
      description: Klucz sortowania (nazwisko przed imieniem; firma — nazwa firmy).
      maxLength: 400
    phone:
      type: string
      description: Telefon w formacie E.164.
      maxLength: 16
    email:
      description: Adres e-mail albo `null`, gdy go nie podano.
      oneOf:
        - type: string
          maxLength: 254
        - type: 'null'
CustomerSearchResult:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      description: Klienci posortowani po kluczu sortowania (nazwisko, imię) i identyfikatorze.
      maxItems: 100
      items:
        $ref: '#/CustomerSearchItem'
    nextCursor:
      description: Kursor następnej strony (nieprzezroczysty, ważny 30 minut) albo `null` na ostatniej stronie. Bez licznika wyników.
      oneOf:
        - type: string
          maxLength: 512
        - type: 'null'
CustomerList:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      description: Klienci posortowani po kluczu sortowania (nazwisko, imię) i identyfikatorze.
      maxItems: 100
      items:
        $ref: '#/CustomerSearchItem'
    nextCursor:
      description: Kursor następnej strony (nieprzezroczysty, ważny 30 minut) albo `null` na ostatniej stronie. Bez licznika wyników.
      oneOf:
        - type: string
          maxLength: 512
        - type: 'null'
CustomerPatch:
  type: object
  description: >-
    Zmiana danych klienta (EVM-039; merge-patch): pole nieobecne zostaje bez zmian, pole opcjonalne (`email`, `notes`, `taxId`,
    `contactPersonName`, `postalAddress`) z wartością `null` jest czyszczone. Zmiana `kind` odrzuca pola poprzedniego rodzaju.
    Obowiązują te same reguły co przy dodaniu (telefon E.164, e-mail małymi literami, NIP z sumą, zwykły tekst). Pole spoza schematu —
    `unknown_field`, pole kontrolowane przez serwer (m.in. `id`, `displayName`, `version`) — `read_only_field`.
  additionalProperties: false
  properties:
    kind:
      $ref: '#/CustomerKind'
    firstName:
      type: string
      maxLength: 200
    lastName:
      type: string
      maxLength: 200
    companyName:
      type: string
      maxLength: 200
    taxId:
      description: NIP firmy (jak w `Customer`) albo `null`, by go usunąć.
      oneOf:
        - type: string
          maxLength: 20
        - type: 'null'
    contactPersonName:
      description: Osoba kontaktowa firmy albo `null`, by ją usunąć.
      oneOf:
        - type: string
          maxLength: 200
        - type: 'null'
    phone:
      type: string
      description: Telefon w dowolnym zapisie; serwer normalizuje do E.164. Nie można go usunąć.
      maxLength: 32
    email:
      description: Adres e-mail (zapisywany małymi literami) albo `null`, by go usunąć.
      oneOf:
        - type: string
          maxLength: 254
        - type: 'null'
    postalAddress:
      description: Adres korespondencyjny (wszystkie pola wymagane razem) albo `null`, by go usunąć.
      oneOf:
        - $ref: '#/CustomerPostalAddress'
        - type: 'null'
    notes:
      description: Notatki (zwykły tekst) albo `null`, by je usunąć. Nie wpisuj numerów PESEL, numerów dokumentów ani kodów do bram i alarmów.
      oneOf:
        - type: string
          maxLength: 2000
        - type: 'null'
