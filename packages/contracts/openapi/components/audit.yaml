AuditOutcome:
  type: string
  description: Wynik zdarzenia.
  enum: [success, denied, failed]
AuditObjectType:
  type: string
  description: Typ obiektu, którego dotyczy zdarzenie.
  enum:
    [
      user,
      session,
      passkey,
      device,
      audit,
      work_order,
      scope_item,
      customer,
      site,
      party,
      procedure,
      procedure_stage,
      timeline_entry,
      payment_milestone,
      media_asset,
      document,
    ]
AuditReasonCode:
  type: string
  description: Kod powodu (zamknięta lista, bez wolnego tekstu).
  enum:
    - logout
    - rotated
    - emergency_reset
    - link_superseded
    - lost_device
    - lost_credentials
    - suspected_compromise
    - other
    - verification_failed
    - bad_password
    - unknown_user
    - not_active
    - passkey_failed
    - login_expired
    - expired
    - step_up_verified
    - password_reset
    - totp_failed
    - recovery_code_failed
    - role_changed
    - account_deactivated
    - sessions_ended
    - second_step_reset
    - identity_verified_in_person
    - identity_verified_video_call
    - mfa_setup_expired
    - password
    - second_step
    - session_limit
    - ended_by_user
    - rate_limited
    - refresh_reuse
    - device_inactive
    - secret_mismatch
    - previous_secret
    - channel_not_allowed
    - device_limit_reached
    - device_wipe_required
    - totp_not_configured
    - mfa_enrollment_required
    - session_revoked
AuditActor:
  type: object
  description: Osoba wykonująca akcję — identyfikator i nazwa wyświetlana (bez e-maila).
  required: [userId, displayName]
  properties:
    userId:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      description: Nazwa wyświetlana; `null`, gdy konto nie istnieje już w katalogu użytkowników.
      oneOf:
        - type: string
          maxLength: 200
        - type: 'null'
AuditEvent:
  type: object
  required: [id, occurredAt, actor, action, outcome, reasonCode, objectType, objectId, ipPrefix]
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    occurredAt:
      type: string
      format: date-time
      maxLength: 40
    actor:
      description: Osoba; `null` dla zdarzeń systemu i osoby niezalogowanej.
      oneOf:
        - $ref: '#/AuditActor'
        - type: 'null'
    action:
      $ref: '#/AuditAction'
    outcome:
      $ref: '#/AuditOutcome'
    reasonCode:
      oneOf:
        - $ref: '#/AuditReasonCode'
        - type: 'null'
    objectType:
      $ref: '#/AuditObjectType'
    objectId:
      description: Identyfikator obiektu; numer zlecenia dołączy historyjka zleceń bez zmiany łamiącej.
      oneOf:
        - type: string
          format: uuid
          maxLength: 36
        - type: 'null'
    ipPrefix:
      description: Adres IP wyłącznie jako prefiks (/24 dla IPv4, /48 dla IPv6) albo `null`.
      oneOf:
        - type: string
          maxLength: 43
        - type: 'null'
    amountBefore:
      description: >-
        Kwota transzy przed zmianą — wyjątek audytu dla płatności (EVM-053, SR-LOG-03): tylko akcje `payment_milestone.*`; `null`
        (albo brak pola), gdy kwoty nie było albo zdarzenie nie dotyczy płatności. Korekty płatności (EVM-057): przejścia korekty
        (`.invoice_withdrawn`, `.invoice_cancelled`, `.payment_undone`, `.restored`) — kwota transzy (przed i po równe),
        `.amount_corrected` — kwota przed korektą, `.deleted` — kwota usuniętej transzy.
      oneOf:
        - $ref: common.yaml#/Money
        - type: 'null'
    amountAfter:
      description: >-
        Kwota transzy po zmianie (przy utworzeniu — kwota podana; przy anulowaniu — kwota anulowanej transzy; przy korekcie kwoty
        `.amount_corrected` — kwota po korekcie, EVM-057) — tylko akcje `payment_milestone.*`; `null` (albo brak pola), gdy kwoty nie
        ma, także przy usunięciu transzy (`.deleted`).
      oneOf:
        - $ref: common.yaml#/Money
        - type: 'null'
    fromCode:
      description: >-
        Kod statusu obiektu przed zmianą (EVM-054: przejścia transzy — `payment_milestone.invoiced`, `.paid`, `.cancelled`; EVM-057:
        korekty — `.invoice_withdrawn`, `.invoice_cancelled`, `.payment_undone`, `.restored`; EVM-049: `media_file.rescanned` — `quarantined`; EVM-027: `user.role_changed` — kod
        roli przed zmianą; EVM-047: `document.confidentiality_raised` — klasa poufności przed podniesieniem, a przy `document.created`, `document_file.downloaded` i `document_file.download_denied` — klasa dokumentu, powtórzona w obu polach); `null` (albo brak pola), gdy zdarzenie nie zmienia statusu (także `.amount_corrected` i `.deleted`). Zawsze
        razem z `toCode`.
      oneOf:
        - type: string
          maxLength: 40
          pattern: '^[a-z][a-z_]{0,39}$'
        - type: 'null'
    toCode:
      description: Kod statusu obiektu po zmianie (EVM-054; `user.role_changed` — kod roli po zmianie, EVM-027; `media_file.rescanned` — wynik ponownego skanu, `clean`, `quarantined` albo `failed`, EVM-049; EVM-047 — klasa poufności dokumentu po podniesieniu albo klasa dokumentu — `standard`, `building_security`, `identity_data`); `null` (albo brak pola) razem z `fromCode`.
      oneOf:
        - type: string
          maxLength: 40
          pattern: '^[a-z][a-z_]{0,39}$'
        - type: 'null'
AuditEventList:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      maxItems: 100
      items:
        $ref: '#/AuditEvent'
    nextCursor:
      description: Kursor następnej strony albo `null` na ostatniej stronie.
      oneOf:
        - type: string
          maxLength: 512
        - type: 'null'
