# Module `audit` — the read model of the audit trail (EVM-029). Every field comes from a closed list, an identifier or a time;
# there is no free text, no e-mail address, no user agent, no session or trace identifier (SR-DATA-03, P9). The lists below are
# kept equal to the lists of the code by a test (apps/api/test/audit/contract-sync.test.ts).
