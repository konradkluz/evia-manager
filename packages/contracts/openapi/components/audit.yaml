    - mfa.totp_enrolled
    - mfa.recovery_codes_generated
    - login.recovery_code_used
    - user.role_changed
    - user.deactivated
    - user.reactivated
    - user.sessions_ended
    - user.second_step_reset
    - account.locked
    - account.browser_locked
    - account.profile_updated
    - password.changed
    - passkey.removed
    - mfa.totp_removed
    - reauthentication.succeeded
    - reauthentication.failed
    - device.registered
    - device.recognized
    - device.wipe_confirmed
    - session.refreshed
    - audit.read
    - bulk_read.alerted
    - bulk_read.rejected
    - sync.full_download
    - sync.full_download_completed
    - sync.work_order_snapshot
    - sync.mutation_applied
    - sync.quota_exceeded
    - customer.created
    - customer.updated
    - customer.deleted
    - customer.restored
    - customer.anonymized
    - site.created
    - site.updated
    - party.created
    - party.updated
    - work_order.created
    - work_order.cancelled
    - work_order.restored
    - work_order.deleted
    - work_order.undeleted
    - work_order.updated
    - scope_item.created
    - scope_item.updated
    - scope_item.deleted
    - procedure_stage.updated
    - procedure_stage.transitioned
    - procedure.created
    - procedure.deleted
    - procedure.restored
    - procedure_stage.created
    - procedure_stage.deleted
    - procedure_stage.restored
    - timeline_entry.created
    - timeline_entry.deleted
    - timeline_entry.restored
    - timeline_entry.redacted
