# Module `timeline` — the journal of a work order: notes, comments and events (EVM-037, EVM-038; W-08 "Dziennik"). One table,
# append-only (D3): the text of an entry is never changed — a correction is a NEW entry that points at the old one
# (`supersedesEntryId`). The automatic events of the journal (`kind = event`: the changes of a status) are written by the server
# in the transaction of the change (EVM-038) and are never accepted as input; they carry codes and identifiers, never a value of
# personal data (SR-LOG-03, SR-DATA-01) — the names are read from the current data when the journal is shown. The text of an entry is free text that may name a customer, a party or an employee (SR-DATA-02): the panel renders it as
# text and nothing else (SR-WEB-03). The author is `{id, displayName}` and nothing else (SR-DATA-03).
TimelineEntryKind:
  type: string
  description: >-
    Rodzaj wpisu (zamknięta lista po stronie serwera; klient obsługuje też wartość nieznaną — P-12): `note` — wpis (rozmowa,
    ustalenie), `comment` — komentarz, `event` — automatyczna zmiana zapisana przez serwer (EVM-038; nigdy z wejścia).
  enum: [note, comment, event]
TimelineEntryInputKind:
  type: string
  description: Rodzaj wpisu przyjmowany na wejściu — `event` zapisuje wyłącznie serwer.
  enum: [note, comment]
NoteCategory:
  type: string
  description: >-
    Kategoria wpisu `note` (rozmowa telefoniczna, spotkanie, ustalenie, wizyta na miejscu, inne). Komentarz kategorii nie ma.
  enum: [phone_call, meeting, arrangement, site_visit, other]
TimelineEntryOrigin:
  type: string
  description: Skąd pochodzi wpis — `web` (panel), `mobile` (telefon, M2) albo `system` (zdarzenie zapisane przez serwer).
  enum: [web, mobile, system]
TimelineEntryAuthor:
  type: object
  description: Autor wpisu — identyfikator i nazwa wyświetlana (bez e-maila, roli i statusu konta).
  required: [id, displayName]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    displayName:
      type: string
      maxLength: 200
TimelineEntry:
  type: object
  description: >-
    Wpis dziennika zlecenia. `createdAt` nadaje serwer i według niego (nie według UUIDv7 od klienta) wpisy są uporządkowane.
    `body` jest `null` dla zdarzeń (`event`). Wpis poprawiony zostaje w dzienniku: `supersededByEntryId` wskazuje poprawkę
    (panel zwija taki wpis i pokazuje „Pokaż treść”), a poprawka wskazuje poprzednika w `supersedesEntryId`. `redactedAt` jest
    ustawione, gdy treść zastąpiono znacznikiem (EVM-040), a `deletedAt` — gdy wpis usunięto (soft delete, EVM-040). Treść jest tekstem — panel nie interpretuje w niej znaczników.
  required:
    - id
    - kind
    - noteCategory
    - body
    - procedureStageId
    - procedureStageName
    - author
    - createdAt
    - origin
    - capturedAt
    - supersedesEntryId
    - supersededByEntryId
    - redactedAt
    - deletedAt
    - event
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    kind:
      $ref: '#/TimelineEntryKind'
    noteCategory:
      description: Kategoria wpisu `note`; `null` dla komentarza i zdarzenia.
      oneOf:
        - $ref: '#/NoteCategory'
        - type: 'null'
    body:
      description: >-
        Treść wpisu (tekst, do 10 000 znaków — punktów kodowych; granica 20 000 to jednostki UTF-16 generowanego schematu) albo
        `null` (zdarzenie).
      oneOf:
        - type: string
          maxLength: 20000
        - type: 'null'
    procedureStageId:
      description: Etap tego zlecenia, którego wpis dotyczy, albo `null`.
      oneOf:
        - type: string
          format: uuid
          maxLength: 36
        - type: 'null'
    procedureStageName:
      description: Nazwa etapu (kopia z szablonu) albo `null`, gdy wpis nie dotyczy etapu.
      oneOf:
        - type: string
          maxLength: 200
        - type: 'null'
    author:
      description: Autor wpisu albo `null` (zdarzenie zapisane przez serwer).
      oneOf:
        - $ref: '#/TimelineEntryAuthor'
        - type: 'null'
    createdAt:
      type: string
      format: date-time
      description: Czas serwera (UTC).
      maxLength: 40
    origin:
      $ref: '#/TimelineEntryOrigin'
    capturedAt:
      description: Czas urządzenia, na którym wpis powstał (metadana, M2) albo `null`.
      oneOf:
        - type: string
          format: date-time
          maxLength: 40
        - type: 'null'
    supersedesEntryId:
      description: Wpis, który ta pozycja poprawia, albo `null`.
      oneOf:
        - type: string
          format: uuid
          maxLength: 36
        - type: 'null'
    supersededByEntryId:
      description: Poprawka tego wpisu albo `null` (wpis nie został poprawiony).
      oneOf:
        - type: string
          format: uuid
          maxLength: 36
        - type: 'null'
    redactedAt:
      description: Chwila redakcji treści (EVM-040) albo `null`.
      oneOf:
        - type: string
          format: date-time
          maxLength: 40
        - type: 'null'
    deletedAt:
      description: >-
        Chwila usunięcia wpisu (EVM-040) albo `null`. Usunięty wpis widzi tylko Administrator (`includeDeleted=true` albo odczyt po `id`);
        dla pozostałych ról wpis usunięty nie istnieje. Zdarzenia automatyczne nie są usuwane — dla nich zawsze `null`.
      oneOf:
        - type: string
          format: date-time
          maxLength: 40
        - type: 'null'
    event:
      description: Dane zdarzenia (`kind = event`; EVM-038) albo `null` dla wpisu i komentarza.
      oneOf:
        - $ref: '#/TimelineEvent'
        - type: 'null'
TimelineEventGroup:
  type: string
  description: >-
    Grupa zdarzeń do filtrowania dziennika (zamknięta lista; rośnie z E6 i E7; grupy są rozłączne): `status_changes` — „Zmiany
    statusów” (zlecenie, etapy, dane i zakres zlecenia), `payments` — „Płatności” (zmiany statusu transz, EVM-054, i usunięcia transz, EVM-057).
  enum: [status_changes, payments]
TimelineEventObjectType:
  type: string
  description: Obiekt, którego dotyczy zdarzenie (zamknięta lista po stronie serwera; klient obsługuje też wartość nieznaną — P-12).
  enum: [work_order, procedure, procedure_stage, scope_item, payment_milestone]
TimelineEventParty:
  type: object
  description: >-
    Strona, na którą czekamy — identyfikator z zapisu zdarzenia, a nazwa i rodzaj z BIEŻĄCYCH danych (polityka odczytu stron).
    Strona niewidoczna dla roli albo usunięta ma `name` i `kind` równe `null`. Nazwa strony będącej osobą fizyczną to dane
    osobowe — panel wyświetla ją jako tekst.
  required: [id, name, kind]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    name:
      oneOf:
        - type: string
          maxLength: 200
        - type: 'null'
    kind:
      oneOf:
        - type: string
          maxLength: 40
        - type: 'null'
TimelineEvent:
  type: object
  description: >-
    Zdarzenie automatyczne (`kind = event`; EVM-038) — kod i dane strukturalne, bez treści: tekst panel składa sam, w formie
    bezosobowej. `code` to jeden z `work_order_created`, `work_order_status_changed`, `stage_status_changed`,
    `stage_waiting_on_changed`, `stage_updated`, `work_order_fields_changed`, `scope_item_added`, `scope_item_updated`,
    `scope_item_removed` (EVM-035), `procedure_added`, `procedure_removed`, `procedure_restored`, `stage_added`, `stage_removed`,
    `stage_restored` (EVM-042: kod procesu w `procedureCodes`, bez nazw; nazwę usuniętego etapu daje `procedureStageName` wpisu),
    `payment_milestone_status_changed` (EVM-054 — zmiana statusu transzy, także skutek anulowania
    zlecenia; bez kwoty, numeru faktury i powodu), `payment_milestone_deleted` (EVM-057 — usunięcie transzy korektą Administratora;
    bez kwoty, numeru faktury i nazwy) — lista rośnie z E6 i E7, klient pokazuje nieznany kod neutralnym tekstem; zapis,
    którego serwer nie potrafi odczytać, ma kod `unknown_event` i puste pola.
    `fromStatus` / `toStatus` to kody statusów zlecenia, etapu albo transzy (`null`, gdy zdarzenie nie dotyczy statusu); `waitingOn` i
    `waitingOnParty` — na kogo czekamy (`null` poza zdarzeniami „Czekamy na…”); `changedFields` — nazwy zmienionych pól etapu
    (etapu: `responsibleUserId`, `dueDate`; zlecenia: `title`, `description`, `plannedDate`, `coordinator`;
    pozycji: `parameters`, `notes`; wartości NIE są zapisane). Etap zdarzenia to `procedureStageId` / `procedureStageName` wpisu.
  required: [code, objectType, fromStatus, toStatus, waitingOn, waitingOnParty, changedFields]
  additionalProperties: false
  properties:
    code:
      type: string
      maxLength: 64
      pattern: '^[a-z][a-z_]{0,63}$'
    objectType:
      description: Obiekt zdarzenia albo `null`, gdy serwer nie umie odczytać zapisu (kod nieznany tej wersji).
      oneOf:
        - $ref: '#/TimelineEventObjectType'
        - type: 'null'
    fromStatus:
      oneOf:
        - type: string
          maxLength: 40
          pattern: '^[a-z][a-z_]{0,39}$'
        - type: 'null'
    toStatus:
      oneOf:
        - type: string
          maxLength: 40
          pattern: '^[a-z][a-z_]{0,39}$'
        - type: 'null'
    waitingOn:
      oneOf:
        - $ref: ./procedures.yaml#/StageWaitingOn
        - type: 'null'
    waitingOnParty:
      oneOf:
        - $ref: '#/TimelineEventParty'
        - type: 'null'
    changedFields:
      type: array
      maxItems: 10
      items:
        type: string
        maxLength: 40
    itemCode:
      type: string
      description: >-
        Kod pozycji katalogu w zdarzeniu zakresu (`scope_item_added`, `scope_item_updated`, `scope_item_removed`); brak pola poza
        nimi. Nazwę pozycji panel bierze z katalogu po kodzie (zdarzenie nie przechowuje nazw).
      pattern: '^[a-z][a-z0-9_]{1,63}$'
      maxLength: 64
    procedureCodes:
      type: array
      description: >-
        Kody procesów dodanych razem z pozycją (`scope_item_added`) albo kod jednego procesu, którego dotyczy zdarzenie
        (`procedure_added`, `procedure_removed`, `procedure_restored`, `stage_added`, `stage_removed`, `stage_restored` — EVM-042);
        brak pola poza tymi zdarzeniami. Nazwy procesów panel bierze z katalogu po kodzie.
      maxItems: 30
      items:
        type: string
        maxLength: 64
        pattern: '^[a-z][a-z0-9_]{1,63}$'
    paymentMilestone:
      $ref: '#/TimelineEventPaymentMilestone'
TimelineEventPaymentMilestone:
  type: object
  description: >-
    Transza zdarzenia `payment_milestone_status_changed` (EVM-054) i `payment_milestone_deleted` (EVM-057); brak pola poza nimi.
    Identyfikator z zapisu zdarzenia, nazwa z BIEŻĄCYCH danych transzy tego zlecenia — transza usunięta ma `name` równe `null`
    (zawsze w `payment_milestone_deleted`). Nazwa to tekst — panel wyświetla ją bez
    interpretacji znaczników.
  required: [id, name]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      maxLength: 36
    name:
      oneOf:
        - type: string
          maxLength: 200
        - type: 'null'
TimelineEntryList:
  type: object
  description: >-
    Strona dziennika od najnowszych wpisów (`createdAt` malejąco, potem `id`). `nextCursor` jest `null` na ostatniej stronie.
  required: [items, nextCursor]
  additionalProperties: false
  properties:
    items:
      type: array
      maxItems: 100
      items:
        $ref: '#/TimelineEntry'
    nextCursor:
      description: Kursor następnej strony (wartość nieprzezroczysta) albo `null`.
      oneOf:
        - type: string
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
        - type: 'null'
CreateTimelineEntryRequest:
  type: object
  description: >-
    Nowy wpis albo komentarz; `id` (UUIDv7) nadaje klient. Wpis `note` wymaga `noteCategory`, komentarz go nie przyjmuje.
    `supersedesEntryId` czyni z wpisu poprawkę wskazanego wpisu tego samego zlecenia (ten sam `kind`; etap, gdy nie podano
    `procedureStageId`, jest dziedziczony — `null` go czyści). Pola serwera (`author`, `createdAt`, `origin`, `capturedAt`,
    `supersededByEntryId`, `redactedAt`, `version`, `workOrderId`) są odrzucane — `400 read_only_field`.
  required: [id, kind, body]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      description: Identyfikator UUIDv7 nadany przez klienta; istniejący — `409 id_conflict`.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      maxLength: 36
    kind:
      $ref: '#/TimelineEntryInputKind'
    noteCategory:
      $ref: '#/NoteCategory'
    body:
      type: string
      maxLength: 10000
      description: >-
        Treść (tekst): po normalizacji NFC, zamianie CRLF na LF, usunięciu znaków sterujących (poza nową linią) i przycięciu
        ma 1–10 000 znaków (punktów kodowych) — inaczej `400` (`required` / `too_long`, bez wartości). Serwer liczy znaki po
        normalizacji; samotny surogat UTF-16 — `400` (`invalid_characters`).
    procedureStageId:
      description: Etap tego zlecenia, którego wpis dotyczy; etap innego, nieistniejącego albo usuniętego zlecenia — `400`.
      oneOf:
        - type: string
          format: uuid
          maxLength: 36
        - type: 'null'
    supersedesEntryId:
      type: string
      format: uuid
      description: Poprawiany wpis tego zlecenia (note albo comment, który nie ma jeszcze poprawki).
      maxLength: 36
