createSiteDocumentDownloadUrl:
  post:
    operationId: createSiteDocumentDownloadUrl
    tags: [media]
    summary: Podpisany adres pliku dokumentu lokalizacji (pobranie wg klasy poufności)
    description: >-
      Jak `createDocumentDownloadUrl` (EVM-050 AC3, AC5, AC6; SR-FILE-07, SR-FILE-10, SR-AUTHZ-02, SR-AUTHZ-06, SR-AUTHZ-07). Role Administrator, Edytor i Tylko odczyt, kanał `web`; bez treści; wymaga `X-CSRF-Token`. Kolejność: strażnik → ścieżka (`400`) → lokalizację przez politykę odczytu (`404`) → JEDNO zapytanie o dokument z TĄ kotwicą (`404`: dokument innej lokalizacji, zlecenia, medium, nieistniejący) → klasa efektywna (Tylko odczyt dla `building_security`/`identity_data` - `403` z audytem odmowy) → stan pliku (`404` poza `clean`/`ready`) → ten sam licznik „oryginały i dokumenty” co pozostałe ścieżki (`429`) → podpis (300 s, `attachment`, typ wykryty przez serwer). Audyt `document_file.downloaded` / `document_file.download_denied` z kodem klasy, bez tytułu, nazwy pliku i adresu.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - $ref: ./sites.yaml#/SiteIdParameter
      - $ref: '#/DocumentIdParameter'
    responses:
      '200':
        description: Podpisany adres pliku.
        headers:
          Cache-Control:
            description: Zawsze `no-store`.
            schema:
              type: string
              enum: [no-store]
        content:
          application/json:
            schema:
              $ref: ../components/documents.yaml#/DocumentDownloadUrl
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/media-responses.yaml#/MediaStorageUnavailable
