# Module `parties` — search and creation of a party in the new-work-order form (EVM-021; W-05 combobox OSD / zarządca, dialog "Dodaj stronę").
partiesSearch:
  post:
    operationId: searchParties
    tags: [parties]
    summary: Wyszukiwanie stron (fraza w treści)
    description: >-
      Role Administrator, Edytor i Tylko odczyt, kanał `web`, bez audytu odczytu. To `POST`, bo fraza zawiera nazwy osób
      (dane osobowe) i nie może trafić do adresu URL, logów dostępu ani historii przeglądarki (SR-API-04); wymaga `X-CSRF-Token`,
      nie wymaga `Idempotency-Key`. Wielkość liter i polskie znaki nie mają znaczenia. Wyszukiwanie obejmuje nazwę strony i osobę
      kontaktową (nie telefon, e-mail ani notatki); opcjonalny filtr `kinds` (maks. 10 rodzajów, bez powtórzeń) zawęża wynik do
      rodzajów stron — combobox OSD wysyła `distribution_system_operator`, combobox zarządcy `building_administration`,
      `property_manager` i `housing_community`. W wyniku są tylko `id`, `kind`, `legalForm` i `displayName`, najwyżej 20 pozycji.
      Strony usunięte (soft delete) nie występują — warunek jest w zapytaniu. Limit 60 wyszukiwań na minutę na użytkownika, osobno
      dla stron (`429 rate_limited` z `Retry-After`; liczy się każde wyszukiwanie, także odrzucone przez walidację); wyniki
      wliczają się do progu masowego odczytu (P10). Fraza krótsza niż 3 znaki po normalizacji — `400 validation_failed`,
      kod `too_short`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      audit: false
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/parties.yaml#/PartySearchRequest
    responses:
      '200':
        description: Pasujące strony (brak wyników to pusta tablica `items`).
        content:
          application/json:
            schema:
              $ref: ../components/parties.yaml#/PartySearchResult
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
parties:
  post:
    operationId: createParty
    tags: [parties]
    summary: Dodanie strony
    description: >-
      Role Administrator i Edytor (Tylko odczyt — `403 forbidden`), kanał `web`, z audytem (`party.created`, bez wartości danych
      osobowych, także bez nazwy osoby fizycznej). `id` (UUIDv7) nadaje klient; istniejące `id` (także strony usuniętej) —
      `409 id_conflict` bez żadnych danych istniejącego zasobu. Telefon jest normalizowany do E.164, e-mail zapisywany małymi
      literami. Pole spoza schematu — `400 validation_failed` (`unknown_field`), pole kontrolowane przez serwer — `400` z kodem
      `read_only_field`, błąd reguły — `400` z `errors[]` (wskaźnik i kod, nigdy wartość). Idempotencja (api-guidelines.md →
      Idempotencja): `Idempotency-Key` (UUIDv7) jest opcjonalny; panel wysyła go zawsze, a przy ponowieniu używa tego samego `id`
      i klucza. Powtórka (ten sam klucz i treść) — ten sam status i `id`, bieżąca reprezentacja i `Idempotent-Replayed: true`, bez
      nowego zdarzenia audytu; ten sam klucz z inną treścią albo na innej operacji — `422 idempotency_mismatch`; równoległe
      żądanie z tym samym kluczem — `409 idempotency_in_progress` z `Retry-After`. Klucz obowiązuje 30 dni, osobno dla każdego
      użytkownika. Wymaga `X-CSRF-Token`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: true
    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/parties.yaml#/Party
    responses:
      '201':
        description: >-
          Strona zapisana (albo powtórka wcześniejszego zapisu — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Wersja zasobu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key` i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/parties.yaml#/Party
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/ResourceConflict
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/IdempotencyMismatch
      '429':
        $ref: ../components/responses.yaml#/RateLimited
