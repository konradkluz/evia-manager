# Module `payments` — the payment milestones of a work order (EVM-053; W-06 section "Płatności"). Web channel only (P3).
workOrderPaymentMilestones:
  get:
    operationId: listPaymentMilestones
    tags: [payments]
    summary: Zlecenie — transze płatności z sumami
    description: >-
      Sekcja „Płatności” W-06 (EVM-053 AC2, AC7; SR-AUTHZ-02, SR-AUTHZ-05, SR-DATA-03, P6). Transze zlecenia w kolejności `position`
      (najwyżej 20 — `LIMIT 20` w zapytaniu) i sumy `totals` z tego samego odczytu: `unpaid` — kwoty transz `invoiced`, `paid` — kwoty
      transz `paid` (`planned` i `cancelled` nie wchodzą do sum). Zlecenie jest rozwiązywane najpierw, polityką odczytu w zapytaniu:
      nieistniejące i usunięte (także dla Administratora) — jedna odpowiedź `404 not_found`; zły format `workOrderId` — `400`.
      Zlecenie bez transz (bez planu płatności w szablonie albo założone przed EVM-053) to pusta tablica `items` i sumy zero. Role
      Administrator, Edytor i Tylko odczyt (P6), kanał `web` (token mobilny — `403 channel_not_allowed`; płatności nie trafiają na
      telefon — P3), bez audytu odczytu. Nazwa transzy to tekst — panel wyświetla ją bez interpretacji znaczników. `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
    responses:
      '200':
        description: Transze zlecenia i sumy (pusta tablica `items`, gdy zlecenie nie ma transz).
        content:
          application/json:
            schema:
              $ref: ../components/payments.yaml#/PaymentMilestoneList
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  post:
    operationId: createPaymentMilestone
    tags: [payments]
    summary: Dodanie transzy („Dodaj transzę”)
    description: >-
      Dodanie transzy na końcu listy (EVM-053 AC4, AC5, AC7; SR-AUTHZ-02, SR-AUTHZ-04, SR-AUTHZ-05, SR-INPUT-01, SR-API-05, SR-API-06,
      SR-LOG-03). Role Administrator i Edytor (Tylko odczyt — `403 forbidden` dla dowolnej treści; niezalogowany — `401`; token
      mobilny — `403 channel_not_allowed`), kanał `web`, z audytem (`payment_milestone.created` — aktor, identyfikator transzy, wynik,
      `traceId` i kwota, gdy podana; bez nazwy). Wymaga `X-CSRF-Token` i `Idempotency-Key`. Jedna transakcja na zablokowanym wierszu
      zlecenia (`SELECT … FOR NO KEY UPDATE` — serializacja z przejściami zlecenia): zlecenie (`404` — przed nagłówkiem i treścią),
      `Idempotency-Key` i treść `PaymentMilestoneCreate` (`400`: schemat i reguły nazwy — kod i wskaźnik, nigdy wartość; pole serwera
      — `read_only_field`), powtórka idempotentna, zlecenie zamknięte (`409 work_order_closed`), limit 20 transz zlecenia, także
      anulowanych (`422 limit_exceeded`, `""`, `too_many_payment_milestones`), zapis (`position` = największa + 1, status `planned`,
      `version` = 1; istniejące `id` — także transzy innego zlecenia — `409 id_conflict` bez nadpisania), audyt i rekord idempotencji.
      Błąd któregokolwiek kroku cofa całość. Idempotencja: klucz (UUIDv7) związany z użytkownikiem, metodą, szablonem ścieżki I
      identyfikatorem zlecenia (ten sam klucz i treść na innym zleceniu — `422 idempotency_mismatch`); powtórka — `201` z bieżącą
      reprezentacją i `Idempotent-Replayed: true`, bez drugiej transzy i drugiego zdarzenia. Odpowiedź ma `ETag` transzy i `Location`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - name: Idempotency-Key
        in: header
        required: true
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/payments.yaml#/PaymentMilestoneCreate
    responses:
      '201':
        description: >-
          Transza dodana (albo powtórka wcześniejszego zapisu — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Wersja transzy (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Location:
            description: Adres transzy (`/api/v1/work-orders/{workOrderId}/payment-milestones/{milestoneId}`).
            schema:
              type: string
              maxLength: 140
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key`, zleceniem i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/payments.yaml#/PaymentMilestone
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/PaymentMilestoneConflict
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/LimitExceeded
      '429':
        $ref: ../components/responses.yaml#/RateLimited
PaymentMilestoneIdParameter:
  name: milestoneId
  in: path
  required: true
  description: Identyfikator transzy (UUID).
  schema:
    type: string
    format: uuid
    maxLength: 36
paymentMilestone:
  patch:
    operationId: updatePaymentMilestone
    tags: [payments]
    summary: Zmiana transzy — kwota, dane faktury, data wpłaty (If-Match)
    description: >-
      Zmiana transzy bez zmiany statusu (EVM-053 AC3, AC5, AC7; EVM-054 AC4, AC5, AC7, AC8; SR-AUTHZ-02, SR-AUTHZ-04, SR-AUTHZ-05,
      SR-AUTHZ-10, SR-INPUT-01, SR-INPUT-02, SR-API-05, SR-API-07, SR-LOG-03): kwota transzy `planned` („Zmień kwotę”), numer faktury,
      data wystawienia i termin transzy `invoiced` („Popraw dane faktury…”), data wpłaty transzy `paid` („Popraw datę wpłaty…”). Role
      Administrator i Edytor (Tylko odczyt — `403 forbidden` przed `If-Match`, treścią i sprawdzeniem istnienia; niezalogowany — `401`;
      token mobilny — `403 channel_not_allowed`), kanał `web`, z audytem: `payment_milestone.amount_changed` (aktor, identyfikator
      transzy, wynik, `traceId` oraz kwota przed i po — wyjątek audytu dla płatności), `payment_milestone.amount_corrected` (korekta
      kwoty transzy `invoiced` albo `paid` przez Administratora ze step-upem, EVM-057 — kwota przed i po) albo
      `payment_milestone.details_changed` (bez wartości: bez numeru faktury, dat i kwoty); nigdy nazwa transzy. Wymaga `X-CSRF-Token` i `If-Match` (silny ETag `"<version>"`
      transzy). Kolejność (jedna transakcja, decyzje na wierszach zablokowanych — najpierw zlecenie `FOR NO KEY UPDATE`, potem transza
      `FOR UPDATE`): guard (rola, CSRF, kanał), ścieżka i `Idempotency-Key` (`400`), zlecenie (polityka odczytu w zapytaniu) i transza
      wyszukiwana warunkiem `id = {milestoneId} AND work_order_id = {workOrderId}` (transza innego zlecenia, nieistniejąca, usunięta i
      transza zlecenia usuniętego — jedna odpowiedź `404 not_found`, przed `If-Match` i treścią), `If-Match` (brak — `428
      precondition_required`; słaby, lista, `*` albo zniekształcony — `400`), treść `PaymentMilestonePatch` (`400`: schemat, zwykły
      tekst numeru faktury, zakres dat; kod i wskaźnik, nigdy wartość; pole serwera — `read_only_field`; pusta treść), powtórka
      idempotentna, zlecenie zamknięte (`409 work_order_closed`), kwota w statusie `invoiced` albo `paid` — korekta płatności (EVM-057,
      SR-AUTHZ-10, SR-SESS-08; także razem z innymi polami): Edytor — `403 forbidden`, Administrator bez uwierzytelnienia kluczem
      dostępu w ostatnich 15 minutach — `403 step_up_required` (rola przed step-upem; odpowiedź `403` nie zostawia rekordu
      idempotencji, więc ponowienie z tym samym kluczem po step-upie wykonuje korektę), kwota w statusie `cancelled` — `403 forbidden`
      dla każdej roli, pole spoza bieżącego statusu (`409 invalid_state_transition`), wersja
      (`412 version_conflict` — bez bieżących wartości), reguły na stanie po zmianie (`400`: termin przed datą wystawienia —
      `before_invoiced_on`; data wpłaty z przyszłości — `/paidOn`, `in_future`), zapis `version + 1`, audyt i rekord idempotencji.
      Zmiana bez efektu (wszystkie podane wartości równe zapisanym) — `200` z transzą bez nowej wersji i bez zdarzenia. Błąd cofa
      całość. Idempotencja: `Idempotency-Key` (UUIDv7) opcjonalny, panel wysyła go zawsze; klucz związany z użytkownikiem, metodą,
      szablonem ścieżki, zleceniem I transzą — ten sam klucz z tą samą treścią dla innej transzy to `422 idempotency_mismatch`; w
      rekordzie idempotencji tylko skrót treści. Powtórka — `200` z bieżącą reprezentacją i `Idempotent-Replayed: true`, bez drugiej
      zmiany i drugiego zdarzenia audytu. Odpowiedź `200` ma nowy `ETag` i `allowedTransitions` dla roli wołającego.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/PaymentMilestoneIdParameter'
      - name: If-Match
        in: header
        required: true
        description: Silny ETag wersji transzy, na której użytkownik podjął decyzję (`"<version>"`, z pola `version` transzy).
        schema:
          type: string
          pattern: '^"[1-9][0-9]{0,9}"$'
          maxLength: 12
      - name: Idempotency-Key
        in: header
        required: false
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/payments.yaml#/PaymentMilestonePatch
    responses:
      '200':
        description: >-
          Transza po zmianie (albo powtórka wcześniejszej zmiany — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Nowa wersja transzy (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key`, transzą i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/payments.yaml#/PaymentMilestone
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/PaymentMilestoneForbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/PaymentMilestoneStateConflict
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/IdempotencyMismatch
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  delete:
    operationId: deletePaymentMilestone
    tags: [payments]
    summary: Usunięcie transzy (korekta płatności Administratora ze step-upem)
    description: >-
      Usunięcie transzy (soft delete) to korekta płatności Administratora ze step-upem (EVM-057 AC4, AC6–AC8; EVM-054 AC5, decyzja Q1;
      SR-AUTHZ-02, SR-AUTHZ-05, SR-AUTHZ-10, SR-AUTHZ-11, SR-SESS-08, SR-API-05, SR-API-06, SR-LOG-03). Rola Administrator (Edytor i
      Tylko odczyt — `403 forbidden`; niezalogowany — `401`; token mobilny — `403 channel_not_allowed`), kanał `web`, step-up:
      Administrator bez uwierzytelnienia kluczem dostępu w ostatnich 15 minutach — `403 step_up_required` (po roli: rola bez prawa do
      operacji nigdy się nie dowiaduje o step-upie). Wymaga `X-CSRF-Token` i `If-Match`. Kolejność (jedna transakcja, decyzje na
      wierszach zablokowanych): guard (rola, CSRF, kanał, step-up), ścieżka i `Idempotency-Key` (`400`), zlecenie (polityka odczytu w
      zapytaniu, `FOR NO KEY UPDATE`; nieistniejące albo usunięte — `404 not_found`), `If-Match` (brak — `428 precondition_required`;
      słaby, lista, `*` albo zniekształcony — `400`), powtórka idempotentna (klucz związany z użytkownikiem, metodą, szablonem ścieżki,
      zleceniem I transzą — powtórka po udanym usunięciu to `204` z `Idempotent-Replayed: true`, choć transzy już nie ma; ten sam klucz
      dla innej transzy — `422 idempotency_mismatch`), transza wyszukiwana warunkiem `id = {milestoneId} AND work_order_id =
      {workOrderId} AND deleted_at IS NULL` (`FOR UPDATE`; transza innego zlecenia, nieistniejąca i już usunięta — jedna odpowiedź `404
      not_found`), zlecenie zamknięte (`409 work_order_closed`), wersja (`412 version_conflict` — bez bieżących wartości), soft delete
      (`deleted_at`, `deleted_by`, `version + 1`), przesunięcie następnych transz o jedno miejsce (`position`, bez zmiany ich
      `version`), audyt `payment_milestone.deleted` (aktor, identyfikator transzy, wynik, `traceId`, kwota usuniętej transzy; nigdy
      nazwa ani numer faktury), wpis dziennika zlecenia `payment_milestone_deleted` (bez kwoty, numeru faktury i nazwy) i rekord
      idempotencji. Błąd któregokolwiek kroku cofa całość. Usunięta transza znika dla każdej roli z listy transz, sum, zestawienia
      nieopłaconych i sygnałów płatności zlecenia; nie można jej zmienić, przejść ani usunąć ponownie (`404`). Usunięcia zlecenia nie
      ma w API.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      stepUp: true
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/PaymentMilestoneIdParameter'
      - name: If-Match
        in: header
        required: true
        description: Silny ETag wersji transzy, na której Administrator podjął decyzję (`"<version>"`, z pola `version` transzy).
        schema:
          type: string
          pattern: '^"[1-9][0-9]{0,9}"$'
          maxLength: 12
      - name: Idempotency-Key
        in: header
        required: false
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika; panel wysyła go zawsze.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    responses:
      '204':
        description: >-
          Transza usunięta (albo powtórka wcześniejszego usunięcia — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key` i transzą.'
            schema:
              type: string
              enum: ['true']
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/PaymentMilestoneDeleteForbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/PaymentMilestoneStateConflict
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
paymentMilestoneTransitions:
  post:
    operationId: transitionPaymentMilestone
    tags: [payments]
    summary: Zmiana statusu transzy (komenda przejścia — wystawienie faktury, wpłata, anulowanie)
    description: >-
      Jedyna droga zmiany statusu transzy (`PATCH` pola `status` jest odrzucany — `400 read_only_field`; EVM-054 AC1–AC3, AC5–AC8;
      SR-AUTHZ-02, SR-AUTHZ-04, SR-AUTHZ-05, SR-AUTHZ-10, SR-INPUT-01, SR-INPUT-02, SR-API-05, SR-API-06, SR-API-07, SR-LOG-03):
      `{ "to": "invoiced", "invoiceNumber": "…", … }` wg tabeli przejść „Etap płatności” z `domain-model.md` (pola —
      `PaymentMilestoneTransition`; korekty płatności — EVM-057 AC1, AC2, AC4–AC8, SR-SESS-08). Role Administrator i Edytor (Tylko odczyt — `403 forbidden` przed `If-Match`, treścią i
      sprawdzeniem istnienia; niezalogowany — `401`; token mobilny — `403 channel_not_allowed`), kanał `web`, z audytem
      (`payment_milestone.invoiced`, `payment_milestone.paid`, `payment_milestone.cancelled`, a dla korekt
      `payment_milestone.invoice_withdrawn`, `.invoice_cancelled`, `.payment_undone`, `.restored` — aktor, identyfikator transzy, wynik,
      `traceId`, kwota przed i po oraz kody statusu przed i po (`fromCode`, `toCode`); nigdy nazwa transzy, numer faktury ani powód) i
      wpisem dziennika zlecenia (`payment_milestone_status_changed` — kody statusów, bez kwoty). Wymaga `X-CSRF-Token` i `If-Match`
      (silny ETag `"<version>"` transzy). Kolejność (jedna transakcja; decyzje na wierszach zablokowanych — najpierw zlecenie `FOR NO
      KEY UPDATE`, co serializuje przejście transzy z przejściem zlecenia, potem transza `FOR UPDATE`): guard (rola, CSRF, kanał),
      ścieżka i `Idempotency-Key` (`400`), zlecenie (polityka odczytu w zapytaniu) i transza wyszukiwana warunkiem `id = {milestoneId}
      AND work_order_id = {workOrderId}` (transza innego zlecenia, nieistniejąca, usunięta i transza zlecenia usuniętego — jedna
      odpowiedź `404 not_found`, przed `If-Match` i treścią), `If-Match` (brak — `428 precondition_required`; słaby, lista, `*` albo
      zniekształcony — `400`), treść wg schematu (`400`; pole serwera — `read_only_field`, inne — `unknown_field`), powtórka
      idempotentna (zapisany wynik, bez ponownej kontroli wersji), zlecenie zamknięte (`409 work_order_closed` — przed tabelą), przejście
      w tabeli (brak: `412` przy nieaktualnej wersji, inaczej `409 invalid_state_transition`), korekta płatności — przed wersją (Edytor —
      `403 forbidden`; Administrator bez uwierzytelnienia kluczem dostępu w ostatnich 15 minutach — `403 step_up_required`; odpowiedź
      `403` nie zostawia rekordu idempotencji, więc ponowienie z tym samym kluczem po step-upie wykonuje korektę), wersja (`412 version_conflict` — bez bieżących wartości), pola przejścia (`400`: kod i
      wskaźnik, nigdy wartość), warunek (`422 transition_condition_not_met`: data wpłaty z przyszłości — `/paidOn`, `in_future`), zapis
      `version + 1`, audyt, dziennik i rekord idempotencji. Błąd któregokolwiek kroku cofa całość. Idempotencja: `Idempotency-Key`
      (UUIDv7) opcjonalny, panel wysyła go zawsze; klucz związany z użytkownikiem, metodą, szablonem ścieżki, zleceniem I transzą —
      ten sam klucz z tą samą treścią dla innej transzy to `422 idempotency_mismatch`; w rekordzie idempotencji tylko skrót treści (bez
      numeru faktury i powodu). Powtórka — `200` z bieżącą reprezentacją i `Idempotent-Replayed: true`, bez drugiego przejścia i
      drugiego zdarzenia. Odpowiedź `200` ma nowy `ETag` i `allowedTransitions` dla roli wołającego. Limit żądań: ogólny limit na adres
      IP (`429 rate_limited` z `Retry-After`).
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      stepUp: false
      transitions: paymentMilestoneStatus
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/PaymentMilestoneIdParameter'
      - name: If-Match
        in: header
        required: true
        description: Silny ETag wersji transzy, na której użytkownik podjął decyzję (`"<version>"`, z pola `version` transzy).
        schema:
          type: string
          pattern: '^"[1-9][0-9]{0,9}"$'
          maxLength: 12
      - name: Idempotency-Key
        in: header
        required: false
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/payments.yaml#/PaymentMilestoneTransition
    responses:
      '200':
        description: >-
          Transza po przejściu (albo powtórka wcześniejszego przejścia — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Nowa wersja transzy (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key`, transzą i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/payments.yaml#/PaymentMilestone
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/PaymentMilestoneForbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/PaymentMilestoneStateConflict
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/PaymentMilestoneUnprocessable
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited

# The summary of unpaid invoices over all orders (EVM-055; W-11 "Płatności"). Web channel only (P3).
unpaidPaymentMilestones:
  get:
    operationId: listUnpaidPaymentMilestones
    tags: [payments]
    summary: Zestawienie nieopłaconych i po terminie (transze „Wystawiona”, najdłużej po terminie pierwsze)
    description: >-
      Widok „Płatności” (W-11; EVM-055 AC1–AC8; SR-AUTHZ-03, SR-AUTHZ-05, SR-AUTHZ-06, SR-API-02, SR-API-04, SR-DATA-03; P6, P10).
      Transze w statusie `invoiced` wszystkich zleceń, które wołający może zobaczyć — polityka odczytu zlecenia jest warunkiem
      zapytania (zlecenia usunięte, także dla Administratora, i transze usunięte nie występują ani na liście, ani w sumach).
      Porządek stały: termin płatności rosnąco, potem identyfikator („Najdłużej po terminie”); parametru `sort` nie ma.
      Filtry łączą się przez AND i zawężają listę, `summary.filtered` i kursor: `view` (`unpaid` — domyślnie wszystkie wystawione —
      albo `overdue` — termin wcześniejszy niż dziś w `Europe/Warsaw`), `dueFrom` i `dueTo` (`RRRR-MM-DD`, 2000-01-01…2100-12-31,
      włącznie, `dueFrom` nie później niż `dueTo`), `customerId` (UUID; klient nieistniejący albo niewidoczny daje pustą listę,
      nie `404` — brak wyroczni). Kafle `summary.unpaid`, `summary.overdue` i `summary.longestOverdue` NIE zależą od filtrów
      (zawsze wszystkie widoczne wystawione transze), `summary.filtered` — od filtrów. Dzień „dziś” to dzień `Europe/Warsaw` z zegara
      serwera; kolejne strony liczą go z kursora (`asOf`), więc zmiana dnia nie miesza stron, a kafle, lista i suma używają tego
      samego dnia. Wszystko z jednej migawki bazy. Pozycja to tylko pola zestawienia (bez powodu anulowania, autorów i całych
      encji); klient usunięty to `{deleted: true}`; `version` służy do `If-Match` akcji `transitionPaymentMilestone` (Administrator i
      Edytor; Tylko odczyt — `403 forbidden`). `overdueDays` (liczba całkowita ≥ 1 albo `null`) liczy serwer jako różnicę dat.
      Paginacja kursorem nieprzezroczystym (`nextCursor`; liczba wszystkich pozycji filtra jest w `summary.filtered`):
      zmieniony, wygasły (30 minut), wydany komu innemu albo użyty z innymi filtrami — `400 invalid_cursor`. Role Administrator,
      Edytor i Tylko odczyt, kanał `web` (token mobilny — `403 channel_not_allowed`), bez audytu odczytu. Masowy odczyt (P10):
      rekordy `items` wliczają się do progu 2000 / 10 000 rekordów w 10 minutach (`429 rate_limited` z `Retry-After`; odrzucone
      żądania nie są liczone), a klienci pozycji do licznika różnych klientów (300 na godzinę). Odpowiedź ma `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - name: view
        in: query
        required: false
        description: Widok (`unpaid` — wszystkie wystawione, domyślnie; `overdue` — po terminie). Jedyna wartość w adresie panelu.
        schema:
          $ref: ../components/payments.yaml#/UnpaidView
      - name: dueFrom
        in: query
        required: false
        description: Termin płatności nie wcześniejszy niż (`RRRR-MM-DD`, 2000-01-01…2100-12-31). Nie trafia do adresu panelu.
        schema:
          $ref: ../components/payments.yaml#/DueDateFilter
      - name: dueTo
        in: query
        required: false
        description: Termin płatności nie późniejszy niż (`RRRR-MM-DD`, 2000-01-01…2100-12-31; nie wcześniejszy niż `dueFrom`). Nie trafia do adresu panelu.
        schema:
          $ref: ../components/payments.yaml#/DueDateFilter
      - name: customerId
        in: query
        required: false
        description: Filtr klienta (UUID; klient nieistniejący albo niewidoczny — pusta lista). Nie trafia do adresu panelu.
        schema:
          type: string
          format: uuid
          maxLength: 36
      - name: limit
        in: query
        required: false
        description: Liczba pozycji na stronie.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        description: Kursor ze strony poprzedniej (`nextCursor`) — wartość nieprzezroczysta.
        schema:
          type: string
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
    responses:
      '200':
        description: Strona zestawienia, kafle i suma (brak nieopłaconych to pusta tablica `items`, `nextCursor` równy `null` i zerowe sumy).
        content:
          application/json:
            schema:
              $ref: ../components/payments.yaml#/UnpaidPaymentMilestoneList
      '400':
        $ref: ../components/responses.yaml#/InvalidListQuery
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
