# Module `payments` — the payment milestones of a work order (EVM-053; W-06 section "Płatności"). Web channel only (P3).
workOrderPaymentMilestones:
  get:
    operationId: listPaymentMilestones
    tags: [payments]
    summary: Zlecenie — transze płatności z sumami
    description: >-
      Sekcja „Płatności” W-06 (EVM-053 AC2, AC7; SR-AUTHZ-02, SR-AUTHZ-05, SR-DATA-03, P6). Transze zlecenia w kolejności `position`
      (najwyżej 20 — `LIMIT 20` w zapytaniu) i sumy `totals` z tego samego odczytu: `unpaid` — kwoty transz `invoiced`, `paid` — kwoty
      transz `paid` (`planned` i `cancelled` nie wchodzą do sum). Zlecenie jest rozwiązywane najpierw, polityką odczytu w zapytaniu:
      nieistniejące i usunięte (także dla Administratora) — jedna odpowiedź `404 not_found`; zły format `workOrderId` — `400`.
      Zlecenie bez transz (bez planu płatności w szablonie albo założone przed EVM-053) to pusta tablica `items` i sumy zero. Role
      Administrator, Edytor i Tylko odczyt (P6), kanał `web` (token mobilny — `403 channel_not_allowed`; płatności nie trafiają na
      telefon — P3), bez audytu odczytu. Nazwa transzy to tekst — panel wyświetla ją bez interpretacji znaczników. `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
    responses:
      '200':
        description: Transze zlecenia i sumy (pusta tablica `items`, gdy zlecenie nie ma transz).
        content:
          application/json:
            schema:
              $ref: ../components/payments.yaml#/PaymentMilestoneList
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  post:
    operationId: createPaymentMilestone
    tags: [payments]
    summary: Dodanie transzy („Dodaj transzę”)
    description: >-
      Dodanie transzy na końcu listy (EVM-053 AC4, AC5, AC7; SR-AUTHZ-02, SR-AUTHZ-04, SR-AUTHZ-05, SR-INPUT-01, SR-API-05, SR-API-06,
      SR-LOG-03). Role Administrator i Edytor (Tylko odczyt — `403 forbidden` dla dowolnej treści; niezalogowany — `401`; token
      mobilny — `403 channel_not_allowed`), kanał `web`, z audytem (`payment_milestone.created` — aktor, identyfikator transzy, wynik,
      `traceId` i kwota, gdy podana; bez nazwy). Wymaga `X-CSRF-Token` i `Idempotency-Key`. Jedna transakcja na zablokowanym wierszu
      zlecenia (`SELECT … FOR NO KEY UPDATE` — serializacja z przejściami zlecenia): zlecenie (`404` — przed nagłówkiem i treścią),
      `Idempotency-Key` i treść `PaymentMilestoneCreate` (`400`: schemat i reguły nazwy — kod i wskaźnik, nigdy wartość; pole serwera
      — `read_only_field`), powtórka idempotentna, zlecenie zamknięte (`409 work_order_closed`), limit 20 transz zlecenia, także
      anulowanych (`422 limit_exceeded`, `""`, `too_many_payment_milestones`), zapis (`position` = największa + 1, status `planned`,
      `version` = 1; istniejące `id` — także transzy innego zlecenia — `409 id_conflict` bez nadpisania), audyt i rekord idempotencji.
      Błąd któregokolwiek kroku cofa całość. Idempotencja: klucz (UUIDv7) związany z użytkownikiem, metodą, szablonem ścieżki I
      identyfikatorem zlecenia (ten sam klucz i treść na innym zleceniu — `422 idempotency_mismatch`); powtórka — `201` z bieżącą
      reprezentacją i `Idempotent-Replayed: true`, bez drugiej transzy i drugiego zdarzenia. Odpowiedź ma `ETag` transzy i `Location`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - name: Idempotency-Key
        in: header
        required: true
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/payments.yaml#/PaymentMilestoneCreate
    responses:
      '201':
        description: >-
          Transza dodana (albo powtórka wcześniejszego zapisu — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Wersja transzy (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Location:
            description: Adres transzy (`/api/v1/work-orders/{workOrderId}/payment-milestones/{milestoneId}`).
            schema:
              type: string
              maxLength: 140
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key`, zleceniem i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/payments.yaml#/PaymentMilestone
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/PaymentMilestoneConflict
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/LimitExceeded
      '429':
        $ref: ../components/responses.yaml#/RateLimited
PaymentMilestoneIdParameter:
  name: milestoneId
  in: path
  required: true
  description: Identyfikator transzy (UUID).
  schema:
    type: string
    format: uuid
    maxLength: 36
paymentMilestone:
  patch:
    operationId: updatePaymentMilestone
    tags: [payments]
    summary: Zmiana kwoty transzy planowanej („Zmień kwotę”, If-Match)
    description: >-
      Zmiana kwoty transzy w statusie `planned` (EVM-053 AC3, AC5, AC7; SR-AUTHZ-02, SR-AUTHZ-04, SR-AUTHZ-05, SR-INPUT-01, SR-API-05,
      SR-API-07, SR-LOG-03). Role Administrator i Edytor (Tylko odczyt — `403 forbidden` przed `If-Match`, treścią i sprawdzeniem
      istnienia; niezalogowany — `401`; token mobilny — `403 channel_not_allowed`), kanał `web`, z audytem
      (`payment_milestone.amount_changed` — aktor, identyfikator transzy, wynik, `traceId` oraz kwota przed i po — wyjątek audytu dla
      płatności; bez nazwy). Wymaga `X-CSRF-Token` i `If-Match` (silny ETag `"<version>"` transzy). Kolejność (jedna transakcja,
      decyzje na wierszach zablokowanych — najpierw zlecenie `FOR NO KEY UPDATE`, potem transza `FOR UPDATE`): guard (rola, CSRF,
      kanał), ścieżka i `Idempotency-Key` (`400`), zlecenie (polityka odczytu w zapytaniu) i transza wyszukiwana warunkiem `id =
      {milestoneId} AND work_order_id = {workOrderId}` (transza innego zlecenia, nieistniejąca, usunięta i transza zlecenia usuniętego
      — jedna odpowiedź `404 not_found`, przed `If-Match` i treścią), `If-Match` (brak — `428 precondition_required`; słaby, lista,
      `*` albo zniekształcony — `400`), treść `PaymentMilestonePatch` (`400`; kwota ułamkowa, zero, ujemna, tekst albo waluta inna niż
      `PLN` — `400`; inne pole transzy — `read_only_field`), powtórka idempotentna, zlecenie zamknięte (`409 work_order_closed`),
      wersja (`412 version_conflict` — bez bieżących wartości), status inny niż `planned` (`403 forbidden` — kwotę transzy wystawionej
      albo opłaconej zmienia Administrator korektą płatności, EVM-057), zapis `version + 1`, audyt i rekord idempotencji. Błąd cofa
      całość. Idempotencja: `Idempotency-Key` (UUIDv7) opcjonalny, panel wysyła go zawsze; klucz związany z użytkownikiem, metodą,
      szablonem ścieżki, zleceniem I transzą — ten sam klucz z tą samą treścią dla innej transzy to `422 idempotency_mismatch`.
      Powtórka — `200` z bieżącą reprezentacją i `Idempotent-Replayed: true`, bez drugiej zmiany i drugiego zdarzenia audytu. Odpowiedź
      `200` ma nowy `ETag`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/PaymentMilestoneIdParameter'
      - name: If-Match
        in: header
        required: true
        description: Silny ETag wersji transzy, na której użytkownik podjął decyzję (`"<version>"`, z pola `version` transzy).
        schema:
          type: string
          pattern: '^"[1-9][0-9]{0,9}"$'
          maxLength: 12
      - name: Idempotency-Key
        in: header
        required: false
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/payments.yaml#/PaymentMilestonePatch
    responses:
      '200':
        description: >-
          Transza po zmianie (albo powtórka wcześniejszej zmiany — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Nowa wersja transzy (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key`, transzą i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/payments.yaml#/PaymentMilestone
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/PaymentMilestoneForbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/WorkOrderClosed
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/IdempotencyMismatch
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
