# Module `media` - the ZIP export of the photos of a work order (EVM-052; W-09, W-04). Web channel only (a mobile token - `403 channel_not_allowed`).
# Every operation is authorised on the order of the path AND on the object: an export is visible to the person who asked for it ONLY (SR-AUTHZ-06);
# for anyone else - another Administrator, an Editor, Read-only - and for an expired, missing or foreign one the answer is the same `404`.
MediaExportIdParameter:
  name: exportId
  in: path
  required: true
  description: Identyfikator eksportu (UUIDv7).
  schema:
    type: string
    format: uuid
    maxLength: 36
workOrderMediaExports:
  get:
    operationId: listMediaExports
    tags: [media]
    summary: Zlecenie - własne aktywne eksporty ZIP wołającego
    description: >-
      Lista eksportów ZIP zlecenia, które zlecił WOŁAJĄCY i które nie wygasły (EVM-052 AC7; SR-AUTHZ-05, SR-AUTHZ-06; CWE-639). Role Administrator, Edytor i
      Tylko odczyt, kanał `web`; Tylko odczyt i każdy, kto nie zlecił eksportu, widzi pustą listę - nigdy cudzego eksportu. Zlecenie przez politykę odczytu
      (`404`). Eksport po `expiresAt` nie występuje na liście niezależnie od przebiegu zadania sprzątającego. `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
    responses:
      '200':
        description: Aktywne eksporty wołającego.
        content:
          application/json:
            schema:
              $ref: ../components/media-exports.yaml#/MediaExportList
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  post:
    operationId: createMediaExport
    tags: [media]
    summary: Eksport ZIP zdjęć zlecenia (Administrator i Edytor, step-up)
    description: >-
      Zlecenie zadania w tle, które składa do jednego pliku ZIP oryginały zdjęć zlecenia w stanie `ready` (czyste po skanie; bez kwarantanny, wymazanych, usuniętych,
      filmów i dokumentów) - EVM-052 AC1, AC2, AC3, AC5; ADR-0009; P10; SR-FILE-07, SR-FILE-09, SR-SESS-08, SR-AUTHZ-05, SR-LOG-03, SR-LOG-07. Role Administrator
      i Edytor, kanał `web`, `stepUp: true`; Tylko odczyt - `403 forbidden`, niezalogowany - `401`, token mobilny - `403 channel_not_allowed`, Administrator lub Edytor bez
      świeżego uwierzytelnienia (15 min) - `403 step_up_required`. Wymaga `X-CSRF-Token` i `Idempotency-Key` (powtórka zwraca ten sam eksport i nie liczy się do
      limitu). Kolejność: strażnik → ścieżka (`400`) → zlecenie przez politykę odczytu (`404`) → blokada użytkownika → limity (`429`) → zbiór zdjęć (`409
      no_media_to_export`; `429 export_too_large` powyżej 10 GB) → zapis. Limity per użytkownik: jeden eksport na 10 minut i 5 w kroczących 24 godzinach
      (nieudane też się liczą; `Retry-After` obcięty do 3600 s; kod `export_rate_limited`, a przy zbiorze powyżej 10 GB `export_too_large`). W tej samej transakcji: audyt `media_export.requested`, e-mail do KAŻDEGO aktywnego Administratora (tylko link do
      zlecenia; bez danych klienta i bez linku do pliku) i alert `media_export_started`. Odpowiedź `202`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      stepUp: true
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: ./media.yaml#/IdempotencyKeyHeader
    responses:
      '202':
        description: Eksport zlecony (albo powtórka wcześniejszego zlecenia, z nagłówkiem `Idempotent-Replayed`).
        headers:
          Idempotent-Replayed:
            description: '`true`, gdy odpowiedź powtarza wcześniejsze zlecenie (ten sam klucz i zlecenie).'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/media-exports.yaml#/CreatedMediaExport
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/media-export-responses.yaml#/MediaExportConflict
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/media-responses.yaml#/MediaStorageUnavailable
workOrderMediaExportById:
  get:
    operationId: getMediaExport
    tags: [media]
    summary: Stan eksportu ZIP (tylko zlecający)
    description: >-
      Stan jednego eksportu (EVM-052 AC6, AC7; SR-AUTHZ-05, SR-AUTHZ-06; CWE-639, CWE-203). Role Administrator, Edytor i Tylko odczyt, kanał `web`. Warunek obiektu: eksport
      TEGO zlecenia ORAZ zlecony przez wołającego, niewygasły - w przeciwnym razie `404` w jednym kształcie (cudzy, innego zlecenia, wygasły, nieistniejący,
      zlecenie niewidoczne; odpowiedź nie zdradza istnienia). Nie zawiera klucza obiektu ani adresu. `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/MediaExportIdParameter'
    responses:
      '200':
        description: Eksport zlecającego.
        content:
          application/json:
            schema:
              $ref: ../components/media-exports.yaml#/MediaExport
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
workOrderMediaExportDownloadUrl:
  post:
    operationId: createMediaExportDownloadUrl
    tags: [media]
    summary: Podpisany link do gotowego ZIP (jednorazowy, tylko zlecający)
    description: >-
      „Pobierz ZIP” (EVM-052 AC1, AC7; SR-FILE-07, SR-AUTHZ-05, SR-AUTHZ-06, SR-LOG-03; CWE-639, CWE-285). Role Administrator, Edytor i Tylko odczyt (Tylko odczyt
      dostaje `404`, jak każdy, kto eksportu nie zlecił), kanał `web`, `X-CSRF-Token`. Sprawdza BIEŻĄCĄ rolę (Administrator lub Edytor) i aktywne konto w chwili
      wywołania - nie tylko, kto zlecił. Eksport zużywa się atomowo: pierwsze wywołanie na eksporcie `ready` i niewygasłym wystawia podpisany `GET` (ważny
      najwyżej 300 s, domena bucketu eksportów, `application/zip`, `attachment` z nazwą nadaną przez serwer, bez nazwiska klienta i adresu); każde kolejne (także
      równoległe) - `404`. Wystawienie jest zapisane w audycie (`media_export.downloaded`) w tej samej transakcji (błąd zapisu = brak linku). Adres i nazwa pliku nie
      są logowane ani audytowane. `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/MediaExportIdParameter'
    responses:
      '200':
        description: Podpisany adres pliku ZIP.
        headers:
          Cache-Control:
            description: Zawsze `no-store`.
            schema:
              type: string
              enum: [no-store]
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/MediaDerivativeUrl
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/media-responses.yaml#/MediaStorageUnavailable
