# Module `media` — photos of a work order: the batch of media, the list, and the multipart upload session (EVM-044; W-09). Web channel only
# in this story (the mobile channel is added by EVM-109). Every operation is authorised on the work order of the path AND on the
# object (the media asset belongs to the order; the session belongs to its creator): a stranger gets `404`, never `403`.
MediaAssetIdParameter:
  name: mediaAssetId
  in: path
  required: true
  description: Identyfikator medium (UUIDv7).
  schema:
    type: string
    format: uuid
    maxLength: 36
UploadSessionIdParameter:
  name: sessionId
  in: path
  required: true
  description: Identyfikator sesji uploadu (UUIDv7).
  schema:
    type: string
    format: uuid
    maxLength: 36
PartNumberParameter:
  name: partNumber
  in: path
  required: true
  description: Numer części (1 … liczba części sesji).
  schema:
    type: integer
    minimum: 1
    maximum: 1000
IdempotencyKeyHeader:
  name: Idempotency-Key
  in: header
  required: true
  description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
  schema:
    type: string
    format: uuid
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    maxLength: 36
workOrderMediaAssets:
  get:
    operationId: listMediaAssets
    tags: [media]
    summary: Zlecenie — media ze stanem pliku (kursor); niedokończone wysyłania wołającego
    description: >-
      Lista „Media i dokumenty” W-09 (EVM-044 AC1, AC4, AC7; SR-AUTHZ-02, SR-AUTHZ-03, SR-AUTHZ-05, SR-API-02). Role Administrator,
      Edytor i Tylko odczyt (bez audytu odczytu), kanał `web`. Zlecenie jest rozwiązywane najpierw polityką odczytu w zapytaniu:
      nieistniejące i usunięte — `404`. Kolejność: `createdAt` malejąco, potem `id`; `limit` 1–100 (domyślnie 25); jedno zapytanie
      ze stanami plików. Filtr `uploadState=unfinished` zwraca WYŁĄCZNIE niedokończone wysyłania wołającego: media z aktywną, niewygasłą
      (`expiresAt` w przyszłości) sesją uploadu wołającego (twórca: użytkownik i urządzenie) ORAZ media wołającego, których plik wciąż
      jest w `pending_upload`, a aktywnej sesji brak (przerwana partia: sesja wygasła, została przerwana albo nigdy nie powstała — baner
      liczy całą partię i nie powstają duplikaty). Tylko te media niosą `originalFilename`, a `uploadSession` jest w nich `null`, gdy
      sesji nie ma (wtedy wybór pliku otwiera nową sesję). Z nich panel buduje „Nie wysłano N zdjęć — wybierz je ponownie z galerii.” Filtr `needsAttention=true` (EVM-049 AC6) zwraca tylko pliki w kwarantannie `held`; `false` — wszystkie; inna wartość — `400
      validation_failed`. `needsAttentionCount` liczy pliki `held` zlecenia tymi samymi regułami widoczności. Przyczyna kwarantanny
      (`quarantineReasonCode`) wraca WYŁĄCZNIE Administratorowi (polityka `mediaQuarantine.manage`); dla Edytora i Tylko odczyt pola nie ma.
      Kursor jest związany z filtrem i wariantem polityki — z innym filtrem `400 invalid_cursor`. Odpowiedź nie zawiera klucza obiektu,
      skrótu ani identyfikatora uploadu S3. Nieznany lub powtórzony parametr — `400`. `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      restrictedParams:
        mediaQuarantine.manage:
          params: {}
          fields: [quarantineReasonCode]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - name: needsAttention
        in: query
        required: false
        description: '`true` — tylko pliki w kwarantannie (`held`), „Wymaga uwagi”.'
        schema:
          type: boolean
      - name: uploadState
        in: query
        required: false
        description: '`unfinished` — tylko niedokończone wysyłania wołającego.'
        schema:
          type: string
          enum: [unfinished]
      - name: limit
        in: query
        required: false
        description: Liczba pozycji na stronie.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        description: Kursor ze strony poprzedniej (`nextCursor`) — wartość nieprzezroczysta.
        schema:
          type: string
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
    responses:
      '200':
        description: Strona mediów (pusta lista to pusta tablica `items` i `nextCursor` równy `null`).
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/MediaAssetList
      '400':
        $ref: ../components/responses.yaml#/InvalidListQuery
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  post:
    operationId: createMediaAssets
    tags: [media]
    summary: Dodanie partii medium do zlecenia („Wyślij N plików”)
    description: >-
      Utworzenie medium i rekordu pliku w stanie `pending_upload` dla każdej pozycji (EVM-044 AC1, AC2, AC7; SR-AUTHZ-02,
      SR-AUTHZ-05, SR-INPUT-01, SR-FILE-01, SR-FILE-03, SR-API-05, SR-LOG-03). Role Administrator i Edytor (Tylko odczyt — `403
      forbidden` przed treścią; niezalogowany — `401`; token mobilny — `403 channel_not_allowed`), kanał `web`, z audytem
      (`media_asset.created` per medium — aktor, identyfikator, wynik, `traceId`; bez nazwy pliku). Wymaga `X-CSRF-Token` i
      `Idempotency-Key`. Jedna transakcja: zlecenie przez politykę odczytu (`404`), nagłówek i treść schematem (`400`; pola serwera —
      `read_only_field`; format spoza JPEG/PNG/WebP/HEIC/MP4/MOV lub rozmiar spoza 1 B … 50 MB (zdjęcie) / 4 GiB (film) — `400` ze wskaźnikiem `/items/N/…`),
      powtórka idempotentna, zlecenie zamknięte PRZYJMUJE media („nic nie ginie”), zapis wszystkich pozycji (istniejące `id` — także
      medium innego zlecenia lub użytkownika — `409 id_conflict` bez danych istniejącego), jedno zdarzenie dziennika zlecenia
      (`media_assets_added`: liczba i identyfikatory, najwyżej 50), audyt, rekord idempotencji. Brak konfiguracji magazynu — `503
      media_storage_unavailable` (usługa zdrowa). Klucz obiektu nadaje serwer (`media/{rok}/{miesiąc}/{id pliku}/original`, bez nazwy
      pliku i numeru zlecenia). Klucz idempotencji jest związany z użytkownikiem, metodą, szablonem ścieżki i zleceniem.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/media.yaml#/CreateMediaAssetsRequest
    responses:
      '201':
        description: Media utworzone (albo powtórka wcześniejszego zapisu, z nagłówkiem `Idempotent-Replayed`).
        headers:
          Idempotent-Replayed:
            description: '`true`, gdy odpowiedź powtarza wcześniejszy zapis (ten sam klucz, zlecenie i treść).'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/MediaAssetBatch
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/media-responses.yaml#/MediaConflict
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/media-responses.yaml#/MediaUnprocessable
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/media-responses.yaml#/MediaStorageUnavailable
mediaAssetUploadSessions:
  post:
    operationId: createUploadSession
    tags: [media]
    summary: Sesja uploadu medium (wieloczęściowy upload do prywatnego storage'u)
    description: >-
      Sesja uploadu medium (EVM-044 AC1, AC4, AC5, AC6, AC7; SR-FILE-02, SR-AUTHZ-02, SR-AUTHZ-05, SR-API-05). Role Administrator
      i Edytor (Tylko odczyt — `403`), kanał `web`. Łańcuch zlecenie → medium → plik sprawdzany jednym zapytaniem (`404` dla
      medium innego zlecenia). Sesję otwiera wyłącznie twórca medium albo Administrator (inny Edytor — `404`, jak dla medium
      innego zlecenia). Dozwolone tylko dla pliku w `pending_upload` (nowa sesja) albo `failed` z przyczyną
      `checksum_mismatch` („Ponów” — plik wraca do `pending_upload`, klucz obiektu ten sam, poprzednia wersja obiektu zostaje w
      bucketcie z wersjonowaniem); każdy inny stan — `409 invalid_state_transition`. Istniejąca aktywna sesja WOŁAJĄCEGO jest
      zwracana ponownie (wznowienie po ponownym wyborze pliku, `200`); aktywna sesja innego użytkownika (Administrator na medium z cudzą sesją) — `409 id_conflict` bez
      szczegółów. Powtórka tego samego żądania (ten sam `Idempotency-Key`), gdy utworzona wtedy sesja została przerwana albo wygasła —
      `409 invalid_state_transition` (klient otwiera nową sesję z nowym kluczem i identyfikatorem), nigdy `201` z sesją nieużyteczną. Serwer dzieli plik na części (stały rozmiar 16 MiB, ostatnia mniejsza, najwyżej 1000), wystawia `CreateMultipartUpload`
      z typem z listy dozwolonych i zapisuje sesję ważną 7 dni. Limit aktywnych sesji użytkownika — `429` z `Retry-After`. Brak
      konfiguracji magazynu — `503 media_storage_unavailable`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/MediaAssetIdParameter'
      - $ref: '#/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/media.yaml#/CreateUploadSessionRequest
    responses:
      '200':
        description: Istniejąca aktywna sesja wołającego (wznowienie).
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/UploadSession
      '201':
        description: Sesja utworzona (albo powtórka wcześniejszego zapisu, z nagłówkiem `Idempotent-Replayed`).
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/UploadSession
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/media-responses.yaml#/MediaConflict
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/media-responses.yaml#/MediaUnprocessable
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/media-responses.yaml#/MediaStorageUnavailable
uploadSessionParts:
  get:
    operationId: listUploadParts
    tags: [media]
    summary: Części sesji uploadu potwierdzone w storage'u
    description: >-
      Części już wysłane (`ListParts` po stronie serwera) — wysyłanie wznawia się od pierwszej brakującej (EVM-044 AC4, AC6, AC7;
      SR-AUTHZ-02, SR-AUTHZ-05). Role Administrator i Edytor, kanał `web`; sesję widzi wyłącznie jej twórca (inny użytkownik, sesja
      innego medium lub zlecenia, nieistniejąca — jedna odpowiedź `404`). Sesja zakończona lub wygasła — `409 invalid_state_transition`.
      `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/MediaAssetIdParameter'
      - $ref: '#/UploadSessionIdParameter'
    responses:
      '200':
        description: Części potwierdzone w storage'u.
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/UploadPartList
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/media-responses.yaml#/MediaConflict
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/media-responses.yaml#/MediaStorageUnavailable
uploadSessionPartUrl:
  get:
    operationId: getUploadPartUrl
    tags: [media]
    summary: Podpisany adres wysłania jednej części
    description: >-
      Podpisany `PUT` jednej części (EVM-044 AC6, AC7; SR-FILE-02, SR-WEB-04). Role Administrator i Edytor (Tylko odczyt — `403`),
      kanał `web`; tylko twórca sesji (`404` dla pozostałych). Adres jest związany z kluczem obiektu, identyfikatorem uploadu,
      numerem części i dokładnym `Content-Length` części obliczonym przez serwer z planu sesji, ważny 60 minut. Numer spoza
      `1 … partCount` — `400`. Odpowiedź ma `Cache-Control: no-store`; adres nie jest logowany. Panel wysyła `PUT` z `credentials:
      'omit'` i zapamiętuje `ETag` tylko informacyjnie (`complete` czyta części ze storage'u).
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/MediaAssetIdParameter'
      - $ref: '#/UploadSessionIdParameter'
      - $ref: '#/PartNumberParameter'
    responses:
      '200':
        description: Podpisany adres części.
        headers:
          Cache-Control:
            description: Zawsze `no-store`.
            schema:
              type: string
              enum: [no-store]
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/UploadPartUrl
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/media-responses.yaml#/MediaConflict
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/media-responses.yaml#/MediaStorageUnavailable
uploadSessionComplete:
  post:
    operationId: completeUploadSession
    tags: [media]
    summary: Zakończenie wysyłania — złożenie obiektu i weryfikacja rozmiaru
    description: >-
      Zakończenie sesji (EVM-044 AC1, AC5, AC6, AC7; SR-FILE-02, SR-CRYPTO-05). Role Administrator i Edytor (Tylko odczyt — `403`),
      kanał `web`; tylko twórca sesji (`404` dla pozostałych). Serwer czyta części ze storage'u (nie ufa ETagom klienta): liczba =
      `partCount`, każda poza ostatnią = `partSize`, suma = `declaredSize` (inaczej `422 upload_incomplete`, `size_mismatch` albo
      `parts_missing`), składa obiekt i sprawdza `HEAD` (rozmiar = `declaredSize`). Plik przechodzi do `uploaded` (panel: „Sprawdzanie
      pliku”) i czeka na skan; skan, SHA-256 i typ z zawartości wykonuje worker. Powtórka po złożeniu obiektu jest idempotentna
      (`200` z bieżącym stanem). Odpowiedź — medium z aktualnym stanem pliku.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/MediaAssetIdParameter'
      - $ref: '#/UploadSessionIdParameter'
    responses:
      '200':
        description: Medium ze stanem pliku po zakończeniu wysyłania.
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/MediaAsset
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/media-responses.yaml#/MediaConflict
      '422':
        $ref: ../components/media-responses.yaml#/MediaUnprocessable
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/media-responses.yaml#/MediaStorageUnavailable
uploadSessionAbort:
  post:
    operationId: abortUploadSession
    tags: [media]
    summary: Przerwanie sesji uploadu (porzucenie niewysłanego pliku)
    description: >-
      Przerwanie aktywnej sesji (EVM-044 AC6, AC7). Role Administrator i Edytor (Tylko odczyt — `403`), kanał `web`; tylko twórca
      sesji (`404` dla pozostałych). „Wstrzymaj” w panelu NIE wywołuje tej operacji (wstrzymanie zachowuje potwierdzone części).
      Idempotentne: przerwana sesja daje `204`; zakończona (`completed`) — `409 invalid_state_transition`. Niezłożony upload w
      storage'u jest przerywany; plik pozostaje w `pending_upload` i może dostać nową sesję.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/MediaAssetIdParameter'
      - $ref: '#/UploadSessionIdParameter'
    responses:
      '204':
        description: Sesja przerwana.
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/media-responses.yaml#/MediaConflict
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/media-responses.yaml#/MediaStorageUnavailable
mediaAssetRescan:
  post:
    operationId: rescanMediaAsset
    tags: [media]
    summary: Ponowny skan pliku w kwarantannie (Administrator, step-up)
    description: >-
      Zlecenie ponownego skanu pliku `held` (EVM-049 AC3, AC4, AC8; P5; SR-SESS-08, SR-AUTHZ-05, SR-ERR-01) — JEDYNA operacja zmieniająca
      stan pliku w kwarantannie (nie ma zwolnienia ani ominięcia skanu). Rola Administrator, kanał `web`, `stepUp: true`. Kolejność odpowiedzi:
      `401` → `403 forbidden` dla Edytora i Tylko odczyt (bez odczytu stanu; nigdy `step_up_required`) → `403 step_up_required` dla
      Administratora ze starym uwierzytelnieniem → `404` (zlecenie nieistniejące lub usunięte, medium innego zlecenia niż w ścieżce) → `409
      invalid_state_transition` (stan inny niż `quarantined` — w tym `scanning`, `purged` i po terminie 30 dni). Wymaga
      `X-CSRF-Token` i `Idempotency-Key`; bez `If-Match` (zmiana warunkowa po stanie pliku). Plik przechodzi do `scanning` (przyczyna jest
      czyszczona); worker wykonuje PEŁNY skan jak za pierwszym razem (suma kontrolna, typ po zawartości, ClamAV). Wynik czysty wraca do
      przepływu, pozytywny zostawia w kwarantannie bez nowego e-maila i alertu; termin 30 dni liczy się od pierwszego wejścia. Audyt:
      `media_file.rescan_requested` (Administrator) w tej samej transakcji, potem `media_file.rescanned` (system, wynik). Odpowiedź `202` —
      medium w stanie `scanning`.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      stepUp: true
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/MediaAssetIdParameter'
      - $ref: '#/IdempotencyKeyHeader'
    responses:
      '202':
        description: Ponowny skan zlecony (albo powtórka wcześniejszego zlecenia, z nagłówkiem `Idempotent-Replayed`).
        headers:
          Idempotent-Replayed:
            description: '`true`, gdy odpowiedź powtarza wcześniejsze zlecenie (ten sam klucz i medium).'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/MediaAsset
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/media-responses.yaml#/MediaConflict
      '429':
        $ref: ../components/responses.yaml#/RateLimited
mediaAssetDownloadUrl:
  post:
    operationId: createMediaAssetDownloadUrl
    tags: [media]
    summary: Podpisany adres pliku zdjęcia (miniatura, podgląd, oryginał)
    description: >-
      Podpisany `GET` miniatury, podglądu 1600 px albo oryginału zdjęcia (EVM-068 AC6, AC7; EVM-045 AC2-AC7; SR-FILE-07, SR-FILE-10, SR-WEB-04, SR-AUTHZ-02, SR-AUTHZ-05, SR-AUTHZ-06, SR-LOG-02, SR-LOG-03).
      Operacja wystawia adres (jak `getUploadPartUrl`), ale jest `POST` z treścią `{ variant }` — adres do pliku nie trafia do ścieżki ani
      zapytania (api-guidelines, „Pliki i podpisane URL-e”); nie zmienia stanu medium, więc nie ma `Idempotency-Key`. Wystawienie adresu
      ORYGINAŁU jest zapisane w dzienniku audytu (`media_file.original_downloaded`, w tej samej transakcji co wystawienie — błąd zapisu
      oznacza brak adresu); audyt dotyczy wystawienia adresu, nie samego pobrania z bucketu. Role Administrator, Edytor i Tylko odczyt, kanał `web` (token mobilny —
      `403 channel_not_allowed`), wymaga `X-CSRF-Token`; wariant `original` tylko dla Administratora i Edytora — Tylko odczyt dostaje `403
      forbidden` PRZED sprawdzeniem medium (odpowiedź nie zdradza, czy medium istnieje). Kolejność: strażnik (`401`/`403`) → ścieżka (`400`) →
      zlecenie przez politykę odczytu (`404`) → treść (`400`; wariant spoza listy, pola obce) → uprawnienie do wariantu (`403`) → JEDNO zapytanie o
      medium TEGO zlecenia → `404` w jednym kształcie: zlecenie albo medium nieistniejące, usunięte lub innego zlecenia, plik w stanie
      niedostępnym (dla pochodnych wymagane `ready`, dla oryginału `clean`, `ready` albo `failed` z przyczyną `processing_error`; plik w
      kwarantannie, skanowany, nieukończony i `failed` z innej przyczyny — `404`), brak wiersza pochodnej, zdjęcie bez oryginału do
      pobrania (wideo i dokumenty — EVM-046, EVM-047) → limit wystawiania adresów (`429 rate_limited` z `Retry-After`; osobno
      miniatury i podglądy: 1000 / 10 min per użytkownik, oryginały: 100 / 10 min; polityka P10, alert „masowe pobranie” od 600 i 50). Adres jest ważny 300 s (stała serwera) i pochodzi z domeny
      bucketu. `Cache-Control: no-store`; adres i nazwa pliku nie są logowane ani zapisywane w audycie.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/MediaAssetIdParameter'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/media.yaml#/CreateMediaDerivativeUrlRequest
    responses:
      '200':
        description: Podpisany adres pochodnej.
        headers:
          Cache-Control:
            description: Zawsze `no-store`.
            schema:
              type: string
              enum: [no-store]
        content:
          application/json:
            schema:
              $ref: ../components/media.yaml#/MediaDerivativeUrl
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/media-responses.yaml#/MediaStorageUnavailable
