      - $ref: ./work-orders.yaml#/IfMatchHeader
      - $ref: ./work-orders.yaml#/IdempotencyKeyHeader
    responses:
      '200':
        description: >-
          Etap przywrócony (albo powtórka wcześniejszego przywrócenia — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Nowa wersja etapu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key`, etapem i zleceniem.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/procedures.yaml#/ProcedureStage
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/ProcedureRestoreConflict
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '422':
        $ref: ../components/responses.yaml#/ProcedureUnprocessable
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
deletedProcedures:
  get:
    operationId: listDeletedWorkOrderProcedures
    tags: [procedures]
    summary: Usunięte procesy i etapy zlecenia (tylko Administrator)
    description: >-
      Sekcja „Usunięte procesy i etapy (n)” W-06 (d) (EVM-042 AC3, AC6; SR-AUTHZ-02, SR-AUTHZ-05, SR-DATA-03, SR-API-02). Tylko
      Administrator (Edytor i Tylko odczyt — `403 forbidden` przed sprawdzeniem istnienia zlecenia; niezalogowany — `401`; token
      mobilny — `403 forbidden` (kanał niedozwolony)), kanał `web`, bez audytu odczytu. Zlecenie jest rozwiązywane najpierw, polityką odczytu
      w zapytaniu: nieistniejące i usunięte (także dla Administratora) — jedna odpowiedź `404 not_found`. Odpowiedź zawiera tylko
      to, czego potrzebuje wiersz z „Przywróć” (identyfikator, kod, nazwa, miejsce, liczba etapów, `procedureDeleted`, `version`,
      `deletedAt`) — bez osób odpowiedzialnych, terminów, notatek, „czekamy na” i powodów blokady. Lista jest ograniczona: co najwyżej
      100 najnowszych usuniętych procesów i 100 najnowszych usuniętych etapów (`truncated`), filtrowanie warunkiem w zapytaniu.
      `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
    responses:
      '200':
        description: Usunięte procesy i etapy zlecenia (puste tablice, gdy nic nie usunięto).
        content:
          application/json:
            schema:
              $ref: ../components/procedures.yaml#/DeletedProcedureList
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
