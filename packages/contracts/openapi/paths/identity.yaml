# Module `identity` — activation of the first Administrator, passkeys, session (EVM-016). Authentication flows live
# under /api/v1/auth (one prefix for proxy rules and limits); passkeys are a resource of the account (EVM-028 reuses it).
# The session cookie `__Host-evia_session` (Secure, HttpOnly, SameSite=Strict, Path=/) is set and cleared by the server;
# mutations of an authenticated session send `X-CSRF-Token`, anonymous mutations are checked by Origin + Sec-Fetch-Site.
activationCheck:
  post:
    operationId: checkActivationLink
    tags: [identity]
    summary: Sprawdzenie linku aktywacyjnego (nie zużywa linku)
    description: >-
      Publiczna operacja: token linku (z fragmentu adresu `#…`, usuniętego z paska przez panel) trafia wyłącznie w treści
      `POST`. Zwraca e-mail i rolę konta do wyświetlenia w W-13. Nie zużywa linku — skaner linków w poczcie go nie „spali”.
      Link użyty, zmieniony, zastąpiony, wygasły i nieznany dają tę samą odpowiedź `400 activation_link_invalid`.
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/CheckActivationLinkRequest
    responses:
      '200':
        description: Link jest ważny.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/ActivationLinkInfo
            example:
              email: jan.przykladowy@example.invalid
              role: administrator
      '400':
        $ref: ../components/responses.yaml#/ActivationLinkInvalid
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
activationPassword:
  post:
    operationId: setActivationPassword
    tags: [identity]
    summary: Ustawienie hasła przy aktywacji konta
    description: >-
      Publiczna operacja: ważny link + nowe hasło (min. 15 znaków Unicode, nie z listy popularnych, bez słów
      kontekstowych, nie z wycieku — Pwned Passwords wyłącznie k-anonimowo; przy niedostępności tej usługi kontrola lokalna).
      Odrzucone hasło daje `400 validation_failed` z `errors[{pointer:/password, code: too_short|too_long|too_weak}]`.
      Sukces tworzy sesję w stanie `mfa_enrollment` (ciasteczko `__Host-evia_session`) — link nie jest zużyty do
      rejestracji klucza dostępu. Ponowne ustawienie hasła tym samym linkiem zastępuje hasło i kończy wszystkie sesje konta.
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/SetActivationPasswordRequest
    responses:
      '200':
        description: Hasło ustawione; sesja `mfa_enrollment`.
        headers:
          Set-Cookie:
            description: '`__Host-evia_session=…; Path=/; Secure; HttpOnly; SameSite=Strict` (nowy identyfikator sesji).'
            schema:
              type: string
              maxLength: 512
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/ActivationPasswordResult
      '400':
        $ref: ../components/responses.yaml#/ActivationLinkInvalid
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
passwordResetRequest:
  post:
    operationId: requestPasswordReset
    tags: [identity]
    summary: Prośba o link do ustawienia nowego hasła
    description: >-
      Publiczna operacja (tylko `web`, SR-AUTHZ-12). Zawsze `202` z pustym obiektem — jedna odpowiedź (status, treść i nagłówki)
      dla konta aktywnego, nieistniejącego, zaproszonego, dezaktywowanego i usuniętego oraz przy cichym limicie na konto
      (SR-AUTH-05 analogicznie; CWE-204, CWE-208). Czas odpowiedzi ma podłogę liczoną od początku żądania. E-mail z linkiem
      (wyłącznie link, SR-INPUT-07) trafia do aktywnego konta z kluczem dostępu; adres odbiorcy pochodzi z rekordu konta, nigdy z
      żądania. Link jest wydawany przez worker przy wysyłce (30 minut od wysyłki, tylko skrót w bazie), nowszy link unieważnia
      starsze. Limity: 60 żądań na minutę z jednego IP (`429 rate_limited` z `Retry-After`, ta sama treść dla każdego adresu);
      na konto — 1 wiadomość na 60 s i 5 na godzinę (nadmiarowe żądanie nie wysyła nic i dostaje to samo `202`).
      `400 validation_failed` tylko dla składni treści.
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/RequestPasswordResetRequest
    responses:
      '202':
        description: Prośba przyjęta (niezależnie od tego, czy konto istnieje).
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/PasswordResetRequested
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
passwordResetCheck:
  post:
    operationId: checkPasswordResetLink
    tags: [identity]
    summary: Sprawdzenie linku resetu hasła (nie zużywa linku)
    description: >-
      Publiczna operacja (tylko `web`): token linku (z fragmentu adresu `#…`, usuniętego z paska przez panel) trafia wyłącznie w
      treści `POST`. Zwraca e-mail konta do wyświetlenia w W-12. Nie zużywa linku — skaner linków w poczcie go nie „spali”.
      Link użyty, wygasły (30 min od wysyłki), zastąpiony nowszym, nieznany, link aktywacyjny i link konta, które nie jest
      aktywne, dają tę samą odpowiedź `400 password_reset_link_invalid`.
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/CheckPasswordResetLinkRequest
    responses:
      '200':
        description: Link jest ważny.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/PasswordResetLinkInfo
            example:
              email: jan.przykladowy@example.invalid
      '400':
        $ref: ../components/responses.yaml#/PasswordResetLinkInvalid
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
passwordResetComplete:
  post:
    operationId: completePasswordReset
    tags: [identity]
    summary: Ustawienie nowego hasła z linku resetu
    description: >-
      Publiczna operacja (tylko `web`): ważny link + nowe hasło (te same reguły co przy aktywacji: min. 15 znaków Unicode,
      nie z listy popularnych, bez słów kontekstowych, nie z wycieku — Pwned Passwords wyłącznie k-anonimowo; przy
      niedostępności tej usługi kontrola lokalna). Kolejność: token → polityka → Pwned → Argon2id → transakcja. W jednej
      transakcji: zapis hasła, zużycie linku, koniec wszystkich sesji konta (`401 session_revoked` przy następnym żądaniu),
      unieważnienie wcześniejszych prób logowania, wiadomość „Hasło zostało zmienione” (skrzynka nadawcza) i audyt. Reset NIE
      omija drugiego kroku: odpowiedź nie ustawia ciasteczka i nie tworzy sesji — zwraca `loginToken` pierwszego kroku (jednorazowy,
      5 min) do ekranu W-02; sesja powstaje dopiero po `verifyLoginPasskey`. Konto bez klucza dostępu nie dostaje ani sesji, ani
      `loginToken` (`400 password_reset_link_invalid`).
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/CompletePasswordResetRequest
    responses:
      '200':
        description: Hasło zmienione; wymagany drugi krok (bez `Set-Cookie`).
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/LoginSecondStep
      '400':
        $ref: ../components/responses.yaml#/PasswordResetLinkInvalid
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
login:
  post:
    operationId: login
    tags: [identity]
    summary: Logowanie — pierwszy krok (e-mail i hasło)
    description: >-
      Publiczna operacja (kanał `web`). Poprawne hasło aktywnego konta z kluczem dostępu → `200 { state: second_step, loginToken,
      methods: [passkey] }` (`loginToken` jest jednorazowy, ważny 5 min, trzymany w pamięci karty); aktywne konto bez klucza dostępu →
      `200 { state: mfa_enrollment, csrfToken }` z ciasteczkiem sesji ograniczonej (`403 mfa_enrollment_required` na resztę) — tylko w oknie
      konfiguracji otwartym resetem drugiego kroku przez Administratora (EVM-027); po końcu okna albo bez resetu poprawne hasło takiego
      konta to `403 mfa_setup_expired` (bez sesji).
      Zły e-mail, złe hasło, konto zaproszone i dezaktywowane dają tę samą odpowiedź `401 invalid_credentials` (kod, treść,
      nagłówki) w porównywalnym czasie (równoważna weryfikacja Argon2id). Limit 20 prób na minutę z jednego adresu IP
      (wspólny z drugim krokiem) liczony przed dostępem do bazy → `429 rate_limited` z `Retry-After`. Ciasteczko poprzedniej
      sesji z żądania jest unieważniane (rotacja). Ochrona przed zgadywaniem (EVM-026): od szóstej nieudanej próby odpowiedź jest opóźniana (1, 2, 4, 8, najwyżej 10 s); 10 nieudanych prób w 15 minutach — hasło i drugi krok razem — blokuje logowanie z przeglądarek nieznanych koncie na 15 minut: każda próba, także z poprawnym hasłem lub kodem, to `429 rate_limited` z `Retry-After` (ta sama odpowiedź co przy limicie adresu IP). Przeglądarka znana koncie (ciasteczko `__Host-evia_device`) ma własny licznik. Blokadę zdejmuje upływ czasu albo — gdy wynikała z haseł — reset hasła; nie ma odblokowania przez Administratora.
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/LoginRequest
    responses:
      '200':
        description: Pierwszy krok zaliczony.
        headers:
          Set-Cookie:
            description: >-
              Tylko przy `state: mfa_enrollment`: `__Host-evia_session=…; Path=/; Secure; HttpOnly; SameSite=Strict`
              (nowy identyfikator sesji).
            schema:
              type: string
              maxLength: 512
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/LoginResult
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/InvalidCredentials
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
loginPasskeyOptions:
  post:
    operationId: getLoginPasskeyOptions
    tags: [identity]
    summary: Opcje uwierzytelnienia kluczem dostępu (drugi krok)
    description: >-
      Publiczna operacja: wymaga ważnego `loginToken`. Zwraca opcje WebAuthn (`userVerification: required`,
      `allowCredentials` tylko z kluczami tego konta) i zapisuje jednorazowe wyzwanie (≥ 128 bitów, TTL 5 min) powiązane
      z próbą logowania; poprzednie wyzwania tej próby tracą ważność. Brak lub nieznany `loginToken` → `401 unauthenticated`,
      wygasły → `401 login_expired`. Ten sam limit prób co pierwszy krok; zablokowany zakres to `429 rate_limited` (bez opóźnienia — opcje nie są zgadywaniem). Ochrona przed zgadywaniem (EVM-026): od szóstej nieudanej próby odpowiedź jest opóźniana (1, 2, 4, 8, najwyżej 10 s); 10 nieudanych prób w 15 minutach — hasło i drugi krok razem — blokuje logowanie z przeglądarek nieznanych koncie na 15 minut: każda próba, także z poprawnym hasłem lub kodem, to `429 rate_limited` z `Retry-After` (ta sama odpowiedź co przy limicie adresu IP). Przeglądarka znana koncie (ciasteczko `__Host-evia_device`) ma własny licznik. Blokadę zdejmuje upływ czasu albo — gdy wynikała z haseł — reset hasła; nie ma odblokowania przez Administratora.
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/LoginPasskeyOptionsRequest
    responses:
      '200':
        description: Opcje uwierzytelnienia.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/PasskeyAuthenticationOptions
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/LoginSecondStepFailed
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
loginPasskey:
  post:
    operationId: verifyLoginPasskey
    tags: [identity]
    summary: Logowanie — drugi krok (klucz dostępu)
    description: >-
      Publiczna operacja (kanał `web`). Weryfikuje odpowiedź WebAuthn: klucz musi należeć do konta z `loginToken`, origin i RP ID
      z konfiguracji, `userVerification: required`, wyzwanie jednorazowe (zużywane przy każdej weryfikacji, także nieudanej).
      Sukces w jednej transakcji: zużycie `loginToken` i wyzwania, nowa sesja `active` z nowym identyfikatorem (poprzednia
      z ciasteczka żądania unieważniona), `lastLoginAt`, licznik klucza i audyt. Nieudany klucz → `401 passkey_failed`
      (`loginToken` nie jest zużywany — można ponowić; po 5 nieudanych próbach próba logowania wygasa), po upływie 5 min →
      `401 login_expired`, bez poprawnego pierwszego kroku → `401 unauthenticated`. Zablokowany zakres: `429 rate_limited` także dla poprawnej asercji (bez sesji). Ochrona przed zgadywaniem (EVM-026): od szóstej nieudanej próby odpowiedź jest opóźniana (1, 2, 4, 8, najwyżej 10 s); 10 nieudanych prób w 15 minutach — hasło i drugi krok razem — blokuje logowanie z przeglądarek nieznanych koncie na 15 minut: każda próba, także z poprawnym hasłem lub kodem, to `429 rate_limited` z `Retry-After` (ta sama odpowiedź co przy limicie adresu IP). Przeglądarka znana koncie (ciasteczko `__Host-evia_device`) ma własny licznik. Blokadę zdejmuje upływ czasu albo — gdy wynikała z haseł — reset hasła; nie ma odblokowania przez Administratora.
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/VerifyLoginPasskeyRequest
    responses:
      '200':
        description: Zalogowano.
        headers:
          Set-Cookie:
            description: >-
              Dwa ciasteczka (EVM-026): `__Host-evia_session=…; Path=/; Secure; HttpOnly; SameSite=Strict` (nowy identyfikator sesji) i `__Host-evia_device=…; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=2592000` (rotowane ciasteczko przeglądarki znanej koncie; nie uwierzytelnia i nie pomija drugiego kroku).
            schema:
              type: string
              maxLength: 512
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/SessionStarted
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/LoginSecondStepFailed
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
loginTotp:
  post:
    operationId: loginTotp
    tags: [identity]
    summary: Logowanie — drugi krok (kod z aplikacji)
    description: >-
      Publiczna operacja (kanał `web`). Wymaga ważnego `loginToken` i aktywnego czynnika TOTP konta; Administrator w panelu nie ma
      tej metody (`403 forbidden`; rola czytana z bazy). Kod: dokładnie 6 cyfr, tolerancja ±1 krok (30 s), każdy krok tylko raz
      (kod już użyty — przy logowaniu, step-upie albo konfiguracji — jest odrzucany). Sukces w jednej transakcji: zużycie
      `loginToken` i kroku kodu, nowa sesja `active` z nowym identyfikatorem (poprzednia z ciasteczka żądania unieważniona),
      `lastLoginAt` i audyt; sesja otwiera okno step-upu (15 min). Nieudany kod → `401 totp_failed` (`loginToken` nie jest zużywany;
      licznik wspólny z kluczem dostępu i kodem odzyskiwania — piąta nieudana próba kończy próbę logowania). Cudzy, zużyty, wygasły
      i nieznany `loginToken` dają tę samą odpowiedź. Limit 20 prób na minutę z jednego adresu IP (wspólny kubełek z hasłem
      i kluczem dostępu) → `429 rate_limited` z `Retry-After`. Odpowiedź nie jest buforowana (`Cache-Control: no-store`). Ochrona przed zgadywaniem (EVM-026): od szóstej nieudanej próby odpowiedź jest opóźniana (1, 2, 4, 8, najwyżej 10 s); 10 nieudanych prób w 15 minutach — hasło i drugi krok razem — blokuje logowanie z przeglądarek nieznanych koncie na 15 minut: każda próba, także z poprawnym hasłem lub kodem, to `429 rate_limited` z `Retry-After` (ta sama odpowiedź co przy limicie adresu IP). Przeglądarka znana koncie (ciasteczko `__Host-evia_device`) ma własny licznik. Blokadę zdejmuje upływ czasu albo — gdy wynikała z haseł — reset hasła; nie ma odblokowania przez Administratora.
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/LoginTotpRequest
    responses:
      '200':
        description: Zalogowano.
        headers:
          Set-Cookie:
            description: >-
              Dwa ciasteczka (EVM-026): `__Host-evia_session=…; Path=/; Secure; HttpOnly; SameSite=Strict` (nowy identyfikator sesji) i `__Host-evia_device=…; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=2592000` (rotowane ciasteczko przeglądarki znanej koncie; nie uwierzytelnia i nie pomija drugiego kroku).
            schema:
              type: string
              maxLength: 512
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/SessionStarted
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/LoginSecondStepFailed
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
loginRecoveryCode:
  post:
    operationId: loginRecoveryCode
    tags: [identity]
    summary: Logowanie — drugi krok (kod odzyskiwania)
    description: >-
      Publiczna operacja (kanał `web`). Kolejność kontroli: najpierw ważny, niewyczerpany `loginToken`, potem kształt kodu
      (20 znaków base32 po pominięciu wielkości liter, spacji i myślników — inne wejście jest nieudaną próbą bez haszowania),
      dopiero potem weryfikacja Argon2id (najwyżej 10 skrótów). Sukces w jednej transakcji: zużycie kodu (jednokrotne, warunkowy
      `UPDATE`) i `loginToken`, nowa sesja `active` bez okna step-upu (kod odzyskiwania go nie otwiera), e-mail o użyciu kodu
      i zdarzenie audytu `login.recovery_code_used`; odpowiedź ma `remainingCodes` liczone po zużyciu. Kod odrzucony →
      `401 recovery_code_failed` (licznik wspólny z innymi metodami drugiego kroku — piąta nieudana próba kończy próbę logowania).
      Limit i brak buforowania jak przy kodzie z aplikacji. Ochrona przed zgadywaniem (EVM-026): od szóstej nieudanej próby odpowiedź jest opóźniana (1, 2, 4, 8, najwyżej 10 s); 10 nieudanych prób w 15 minutach — hasło i drugi krok razem — blokuje logowanie z przeglądarek nieznanych koncie na 15 minut: każda próba, także z poprawnym hasłem lub kodem, to `429 rate_limited` z `Retry-After` (ta sama odpowiedź co przy limicie adresu IP). Przeglądarka znana koncie (ciasteczko `__Host-evia_device`) ma własny licznik. Blokadę zdejmuje upływ czasu albo — gdy wynikała z haseł — reset hasła; nie ma odblokowania przez Administratora.
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/LoginRecoveryCodeRequest
    responses:
      '200':
        description: Zalogowano kodem odzyskiwania.
        headers:
          Set-Cookie:
            description: >-
              Dwa ciasteczka (EVM-026): `__Host-evia_session=…; Path=/; Secure; HttpOnly; SameSite=Strict` (nowy identyfikator sesji) i `__Host-evia_device=…; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=2592000` (rotowane ciasteczko przeglądarki znanej koncie; nie uwierzytelnia i nie pomija drugiego kroku).
            schema:
              type: string
              maxLength: 512
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/RecoveryCodeSessionStarted
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/LoginSecondStepFailed
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
sessionExtend:
  post:
    operationId: extendSession
    tags: [identity]
    summary: Przedłużenie sesji (ostrzeżenie P-11)
    description: >-
      Odnawia czas bezczynności (60 min od teraz), nigdy ponad bezwzględny limit 12 h od zalogowania. Przedłuża wyłącznie sesję
      z ciasteczka (bez identyfikatora w żądaniu — treść musi być pusta). Wymaga `X-CSRF-Token`. Dozwolone w stanie
      `mfa_enrollment`. Sesja już wygasła → `401 session_expired`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      allowDuringMfaEnrollment: true
    responses:
      '200':
        description: Sesja przedłużona.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/SessionExpiry
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/SessionExpired
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
session:
  get:
    operationId: getCurrentSession
    tags: [identity]
    summary: Bieżąca sesja (użytkownik, stan, token CSRF)
    description: >-
      Dla panelu: powłoka i menu konta. Dostępne także w stanie `mfa_enrollment` (ekran W-03 po odświeżeniu strony odzyskuje
      token CSRF); zwraca wtedy `state: mfa_enrollment`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      allowDuringMfaEnrollment: true
    responses:
      '200':
        description: Sesja istnieje.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/CurrentSession
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
logout:
  post:
    operationId: logout
    tags: [identity]
    summary: Wylogowanie
    description: >-
      Unieważnia sesję w bazie, wygasza ciasteczko i odpowiada `Clear-Site-Data: "cache", "storage"`. Dostępne także w stanie
      `mfa_enrollment` (W-03 ma „Wyloguj”). Wymaga `X-CSRF-Token`; żądanie ze starym ciasteczkiem daje `401 session_revoked`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      allowDuringMfaEnrollment: true
      audit: true
    responses:
      '204':
        description: Sesja unieważniona.
        headers:
          Clear-Site-Data:
            description: Dokładnie wartość "cache", "storage" (cudzysłowy należą do wartości nagłówka).
            schema:
              type: string
              maxLength: 64
          Set-Cookie:
            description: 'Wygaszenie ciasteczka `__Host-evia_session` z tymi samymi atrybutami i `Max-Age=0`.'
            schema:
              type: string
              maxLength: 512
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
passkeyOptions:
  post:
    operationId: getPasskeyRegistrationOptions
    tags: [identity]
    summary: Opcje rejestracji klucza dostępu
    description: >-
      Zwraca opcje WebAuthn (`userVerification: required`, `attestation: none`) i zapisuje jednorazowe wyzwanie
      (≥ 128 bitów, TTL 5 min) powiązane z sesją, użytkownikiem i celem; `excludeCredentials` wymienia klucze, które konto już ma.
      Bez treści żądania. Dozwolone w stanie `mfa_enrollment` (konfiguracja pierwszego drugiego kroku) i — od EVM-028 — w sesji
      `active` po pełnym ponownym uwierzytelnieniu o celu `second_step_change` (`reauthenticate`): sprawdzenie znacznika nie zużywa
      go, zużywa go dopiero `registerPasskey`; bez znacznika `403 reauthentication_required`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      allowDuringMfaEnrollment: true
    responses:
      '200':
        description: Opcje rejestracji.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/PasskeyRegistrationOptions
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/ReauthenticationRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
passkeys:
  post:
    operationId: registerPasskey
    tags: [identity]
    summary: Rejestracja klucza dostępu
    description: >-
      Weryfikuje odpowiedź WebAuthn (origin i RP ID z konfiguracji, `userVerification: required`, wyzwanie jednorazowe).
      Sukces w jednej transakcji: zapis klucza, aktywacja konta, zużycie linku aktywacyjnego, nowa sesja `active`
      z nowym identyfikatorem (nowe ciasteczko; stara sesja unieważniona) i zdarzenia audytu. Odpowiedź nie zawiera danych
      sesji — panel wywołuje `getCurrentSession`. Dozwolone w stanie `mfa_enrollment`.
      Od EVM-028 także w sesji `active` (dodanie kolejnego klucza z konta, W-15): wymaga znacznika pełnego ponownego uwierzytelnienia o celu
      `second_step_change` (`403 reauthentication_required`), który zużywa w tej samej transakcji co zapis klucza (jednorazowy). Sesja
      nie jest wtedy rotowana (brak `Set-Cookie`), konto nie jest aktywowane; powstaje e-mail „zmiana drugiego kroku” (bez nazwy
      klucza), zdarzenie audytu `passkey.registered` i — dla konta Administratora — alert dla wszystkich aktywnych Administratorów.
      Opcjonalna `name` (1–60 znaków, zwykły tekst) trafia do listy metod.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      allowDuringMfaEnrollment: true
      audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/RegisterPasskeyRequest
    responses:
      '201':
        description: Klucz zarejestrowany.
        headers:
          Set-Cookie:
            description: '`__Host-evia_session=…` — nowy identyfikator sesji `active` (tylko przy konfiguracji z sesji `mfa_enrollment`).'
            schema:
              type: string
              maxLength: 512
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/Passkey
      '400':
        $ref: ../components/responses.yaml#/PasskeyVerificationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/ReauthenticationRequired
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
stepUpOptions:
  post:
    operationId: getStepUpPasskeyOptions
    tags: [identity]
    summary: Opcje ponownego uwierzytelnienia kluczem dostępu (step-up)
    description: >-
      Każda rola, kanał `web`, sesja `active` (konto musi mieć klucz dostępu — inaczej `403 forbidden`); bez treści żądania. Zwraca opcje WebAuthn (`userVerification: required`,
      `allowCredentials` tylko z kluczami zalogowanego użytkownika) i zapisuje jednorazowe wyzwanie (≥ 128 bitów, TTL 5 min)
      o celu `passkey_step_up` powiązane z bieżącą sesją; wcześniejsze otwarte wyzwania tej sesji z tym celem tracą ważność.
      Wyzwanie rejestracji klucza i wyzwanie step-upu nie są wymienne. Wymaga `X-CSRF-Token`. Limit 20 żądań na minutę z jednego
      adresu IP (wspólny z logowaniem). Nie wymaga świeżego uwierzytelnienia (to jest ta ścieżka).
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    responses:
      '200':
        description: Opcje uwierzytelnienia.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/PasskeyAuthenticationOptions
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/SessionExpired
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
stepUp:
  post:
    operationId: stepUp
    tags: [identity]
    summary: Ponowne uwierzytelnienie kluczem dostępu albo kodem z aplikacji (step-up)
    description: >-
      Każda rola, kanał `web`, sesja `active`. Metody: klucz dostępu (`{ credential }`) albo kod z aplikacji (`{ method: totp, code }`
      — Edytor i Tylko odczyt z aktywnym TOTP; Administrator w panelu → `403 forbidden`, rola czytana z bazy). Kod odzyskiwania nie
      jest obsługiwany (treść jest ścisła: każde inne pole daje `400 validation_failed`). Kod z aplikacji: 6 cyfr, ±1 krok, każdy
      krok tylko raz (wspólnie z logowaniem); nieudany → `401 totp_failed` (sesja bez zmian, zdarzenie `step_up.failed`), piąty zły
      kod w sesji unieważnia ją (`401 session_revoked`, `revoke_reason step_up_failed`); sukces — te same skutki co klucz dostępu,
      z czasem uwierzytelnienia kodem = teraz (kod z aplikacji nie przedłuża limitu 12 h). Klucz: weryfikuje odpowiedź WebAuthn: klucz
      musi należeć do użytkownika sesji, origin i RP ID z konfiguracji, `userVerification: required`, licznik podpisów,
      wyzwanie jednorazowe o celu `passkey_step_up` powiązane z bieżącą sesją (zużywane przy każdej weryfikacji, także nieudanej).
      Sukces w jednej transakcji: poprzednia sesja unieważniona (`rotated`, warunkowy `UPDATE`), nowa sesja z nowym tokenem i nowym
      `csrfToken`, ten sam użytkownik, kanał i stan, bezwzględny limit 12 h bez zmian, czas uwierzytelnienia kluczem = teraz,
      zdarzenia audytu `session.revoked`, `session.created`, `step_up.succeeded`. Sesja już nieważna → `401 session_revoked`
      bez nowej sesji. Nieudany klucz → `401 passkey_failed` (sesja bez zmian, bez rotacji, zdarzenie `step_up.failed`). Wymaga
      `X-CSRF-Token`. Limit 20 żądań na minutę z jednego adresu IP.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/StepUpRequest
    responses:
      '200':
        description: Tożsamość potwierdzona.
        headers:
          Set-Cookie:
            description: '`__Host-evia_session=…; Path=/; Secure; HttpOnly; SameSite=Strict` (nowy identyfikator sesji).'
            schema:
              type: string
              maxLength: 512
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/StepUpResult
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/StepUpFailed
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
totpEnrolment:
  post:
    operationId: startTotpEnrolment
    tags: [identity]
    summary: Konfiguracja kodu z aplikacji — nowy sekret
    description: >-
      Od EVM-028 także sesja `active` (dodanie kodu z aplikacji z konta, W-15) po pełnym ponownym uwierzytelnieniu o celu `second_step_change`
      (znacznik sprawdzany, nie zużywany: `403 reauthentication_required` bez niego); wtedy `409 mfa_already_configured` dotyczy tylko konta
      z AKTYWNYM kodem z aplikacji (klucz dostępu nie przeszkadza). Poza tym: sesja `mfa_enrollment` powiązana z jednorazowym linkiem
      aktywacyjnym (nie z samego logowania hasłem — `403 forbidden`),
      kanał `web`; Administrator w panelu — `403 forbidden` (TOTP Administratora tylko w aplikacji mobilnej). Konto z aktywnym
      drugim krokiem (klucz dostępu albo kod z aplikacji) → `409 mfa_already_configured`, bez ujawniania sekretu. Zwraca nowy
      sekret (160 bitów z CSPRNG; w bazie wyłącznie zaszyfrowany kopertowo, powiązany z kontem) i adres `otpauth://`; ponowne
      wywołanie przed potwierdzeniem zastępuje sekret oczekujący. Czynnik jest nieaktywny do potwierdzenia poprawnym kodem.
      Brak kluczy szyfrowania w konfiguracji → `503 service_unavailable`. Odpowiedź nie jest buforowana (`Cache-Control: no-store`).
      Wymaga `X-CSRF-Token`; limit 20 żądań na minutę z jednego adresu IP (wspólny kubełek z logowaniem).
    x-evia-authz:
      roles: [editor, read_only]
      channels: [web]
      allowDuringMfaEnrollment: true
    responses:
      '200':
        description: Sekret i adres do kodu QR.
        headers:
          Cache-Control:
            description: '`no-store`.'
            schema:
              type: string
              maxLength: 32
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/TotpSetup
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/ReauthenticationRequired
      '409':
        $ref: ../components/responses.yaml#/MfaAlreadyConfigured
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/responses.yaml#/SecondStepUnavailable
totpConfirm:
  post:
    operationId: confirmTotp
    tags: [identity]
    summary: Potwierdzenie kodu z aplikacji — aktywacja metody
    description: >-
      Jak `startTotpEnrolment` (sesja `mfa_enrollment` z linkiem, bez Administratora w panelu). Poprawny kod z oczekującego sekretu
      (6 cyfr, ±1 krok) w jednej transakcji: aktywuje czynnik (krok kodu zapisany — ten kod nie zaloguje), zużywa link aktywacyjny,
      aktywuje konto, unieważnia sesję konfiguracji i tworzy sesję `active` z nowym identyfikatorem i oknem step-upu (nowe
      ciasteczko), wysyła e-mail o zmianie drugiego kroku i zapisuje zdarzenie `mfa.totp_enrolled`. Dwa równoległe potwierdzenia dają
      jedną aktywację. Zły kod → `400 totp_verification_failed` (metoda pozostaje nieaktywna); link wygasły lub zastąpiony →
      `401 session_revoked`. Wymaga `X-CSRF-Token`; limit 20/min/IP; `Cache-Control: no-store`.
      Od EVM-028 także sesja `active` (dodanie kodu z aplikacji z konta): potwierdzenie zużywa znacznik pełnego ponownego uwierzytelnienia
      (`second_step_change`) w tej samej transakcji co aktywację czynnika; sesja nie jest rotowana (brak `Set-Cookie`), odpowiedź niesie bieżący
      `csrfToken`; e-mail „zmiana drugiego kroku”, zdarzenie `mfa.totp_enrolled` i — dla Administratora — alert.
    x-evia-authz:
      roles: [editor, read_only]
      channels: [web]
      allowDuringMfaEnrollment: true
      audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/ConfirmTotpRequest
    responses:
      '200':
        description: Metoda aktywna, konto aktywne, nowa sesja.
        headers:
          Set-Cookie:
            description: '`__Host-evia_session=…` — nowy identyfikator sesji `active` (tylko przy konfiguracji z sesji `mfa_enrollment`).'
            schema:
              type: string
              maxLength: 512
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/SessionStarted
      '400':
        $ref: ../components/responses.yaml#/TotpVerificationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/ReauthenticationRequired
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
recoveryCodes:
  post:
    operationId: generateRecoveryCodes
    tags: [identity]
    summary: Kody odzyskiwania — wygenerowanie (krok 3 konfiguracji; nowe kody z konta)
    description: >-
      Sesja `active`, kanał `web`, każda rola. Bez treści żądania. Dwie ścieżki: (1) NOWE KODY Z KONTA (EVM-028 AC5, W-15) — po pełnym
      ponownym uwierzytelnieniu o celu `second_step_change` (`reauthenticate`; znacznik jednorazowy, zużyty w tej samej transakcji),
      zawsze dozwolone, poprzednie kody przestają działać, bez okna step-upu; (2) KROK 3 KONFIGURACJI (EVM-023) — bez znacznika, ale z
      uwierzytelnieniem w ciągu ostatnich 15 minut (`403 step_up_required`, sprawdzane przez przypadek użycia), tylko gdy konto nie ma jeszcze
      kodów albo bieżące wygenerowała ta sama sesja; inaczej `403 recovery_codes_regeneration_unavailable`. Odpowiedź nie jest buforowana. Zwraca 10 kodów po
      20 znaków base32 z CSPRNG — pokazanych tylko raz (brak operacji odczytu, `Cache-Control: no-store`); w bazie tylko skróty
      Argon2id. Dozwolone w dwóch przypadkach: konto nie ma jeszcze żadnych kodów, albo bieżące kody wygenerowała ta sama sesja
      (odświeżenie kroku 3 — poprzednie kody są unieważniane w tej samej transakcji). Sesja z kodu odzyskiwania nigdy nie generuje kodów
      bez znacznika. Zapisuje zdarzenie `mfa.recovery_codes_generated` i wysyła e-mail o zmianie drugiego kroku (bez kodów); dla konta
      Administratora także alert dla wszystkich aktywnych Administratorów (SR-LOG-07).
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      audit: true
    responses:
      '200':
        description: Nowe kody (jedyne pokazanie).
        headers:
          Cache-Control:
            description: '`no-store`.'
            schema:
              type: string
              maxLength: 32
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/RecoveryCodes
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/RecoveryCodesForbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
assignableUsers:
  get:
    operationId: listAssignableUsers
    tags: [identity]
    summary: Lista użytkowników do wyboru opiekuna zlecenia
    description: >-
      Role Administrator i Edytor, kanał `web`, bez audytu odczytu. Aktywni użytkownicy (nie zaproszeni, nie dezaktywowani, nie
      usunięci) posortowani po nazwie wyświetlanej i identyfikatorze, najwyżej 100. Każda pozycja to wyłącznie `id` i `displayName`
      — bez e-maila, roli, ostatniego logowania i statusu MFA (SR-DATA-03). Operacja nie przyjmuje parametrów.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: false
    responses:
      '200':
        description: Aktywni użytkownicy (pole `nextCursor` jest zawsze `null`).
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/AssignableUserList
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
UserIdParameter:
  name: userId
  in: path
  required: true
  description: Identyfikator konta użytkownika (UUID).
  schema:
    type: string
    format: uuid
    maxLength: 36
users:
  get:
    operationId: listUsers
    tags: [identity]
    summary: Lista użytkowników (Administracja, W-16)
    description: >-
      Rola Administrator, kanał `web`, bez step-upu i bez audytu odczytu (Edytor i Tylko odczyt — `403 forbidden`; niezalogowany —
      `401`; token mobilny — `403 channel_not_allowed`). Konta usunięte nie występują. Porządek stały: nazwa wyświetlana w kolacji
      `pl-PL` („Ł” po „L”), potem `id`. Paginacja kursorem nieprzezroczystym (`limit` 1–100, domyślnie 25; zły kursor —
      `400 invalid_cursor`). Pozycja to konto z e-mailem (dane osobowe — tylko Administrator), rolą, statusem i — dla konta
      `invited` — stanem zaproszenia (`sending`, `sent`, `failed` = „Nie wysłano”, `expired`). Bez haseł, kluczy dostępu, adresów IP
      i metod MFA.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      audit: false
    parameters:
      - name: limit
        in: query
        required: false
        description: Liczba pozycji na stronie.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        description: Kursor ze strony poprzedniej (`nextCursor`) — wartość nieprzezroczysta.
        schema:
          type: string
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
    responses:
      '200':
        description: Strona użytkowników (pusta lista to pusta tablica `items` i `nextCursor` równy `null`).
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/UserList
      '400':
        $ref: ../components/responses.yaml#/InvalidListQuery
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  post:
    operationId: inviteUser
    tags: [identity]
    summary: Zaproszenie użytkownika (W-16)
    description: >-
      Rola Administrator po step-upie, kanał `web`, z audytem (`user.invited`, bez adresu i nazwy). Edytor i Tylko odczyt — `403
      forbidden` (także dla istniejącego adresu: `409` nigdy nie wyprzedza kontroli uprawnień); niezalogowany — `401`; token mobilny —
      `403 channel_not_allowed`; Administrator bez uwierzytelnienia kluczem dostępu w ostatnich 15 minutach — `403 step_up_required`
      (także dla istniejącego adresu — brak wyliczania kont przed step-upem). Kolejność: guard (rola, CSRF, kanał, step-up),
      `Idempotency-Key` i treść (`400 validation_failed`: `invalid_email`, `required`, `too_long`, `invalid_characters`, `invalid_value`),
      jedna transakcja: powtórka idempotentna, konflikt adresu (`409 email_conflict` z `existingUserId` konta widocznego na liście;
      konto usunięte — ten sam kod bez `existingUserId`; wyścig dwóch zaproszeń — jedno `201` i jedno `409`, nigdy `500`), konto
      `invited`, wiersz skrzynki nadawczej e-maila (outbox — w tej samej transakcji; bez adresu, tylko identyfikatory) i zdarzenie
      audytu. Token zaproszenia powstaje w workerze przy wysyłce (w bazie wyłącznie skrót, ważność 72 godziny od wysłania); w
      odpowiedzi go nie ma. Zaproszenie z rolą Administrator tworzy też alert bezpieczeństwa dla każdego aktywnego Administratora.
      Idempotencja: `Idempotency-Key` (UUIDv7) opcjonalny, panel wysyła go zawsze; powtórka — to samo `201`, bieżąca reprezentacja i
      `Idempotent-Replayed: true`; inna treść — `422 idempotency_mismatch`; równoległe żądanie — `409 idempotency_in_progress`.
      Wymaga `X-CSRF-Token`.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      stepUp: true
      audit: true
    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/InviteUserRequest
    responses:
      '201':
        description: >-
          Konto `invited` utworzone, e-mail w kolejce (albo powtórka — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          Location:
            description: Adres zasobu (`/api/v1/users/{userId}`).
            schema:
              type: string
              maxLength: 64
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key` i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/User
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '409':
        $ref: ../components/responses.yaml#/UserConflict
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/IdempotencyMismatch
      '429':
        $ref: ../components/responses.yaml#/RateLimited
