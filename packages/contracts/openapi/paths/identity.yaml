      '429':
        $ref: ../components/responses.yaml#/RateLimited
  patch:
    operationId: updateAccount
    tags: [identity]
    summary: Zmiana własnej nazwy wyświetlanej (W-15 → Profil)
    description: >-
      Każda rola, kanał `web`, sesja `active`, bez ponownego uwierzytelnienia. Treść ścisła `{ displayName }` (zwykły tekst, NFC, przycięty,
      1–200 znaków, bez znaków sterujących i formatujących — `required`, `too_long`, `invalid_characters`); pole `userId` albo inne → `400`.
      Zmienia wyłącznie konto z sesji. Nowa nazwa jest widoczna w `getCurrentSession` (nagłówek) i u innych użytkowników (`listAssignableUsers`:
      tylko `id` i `displayName`, SR-DATA-03). Audyt `account.profile_updated` — bez nazwy (starej ani nowej). Wymaga `X-CSRF-Token`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/UpdateAccountRequest
    responses:
      '200':
        description: Konto po zmianie.
        headers:
          Cache-Control:
            description: '`no-store`.'
            schema:
              type: string
              maxLength: 32
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/Account
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
accountReauthentication:
  post:
    operationId: reauthenticate
    tags: [identity]
    summary: Pełne ponowne uwierzytelnienie przed zmianą hasła albo drugiego kroku (W-04)
    description: >-
      Każda rola, kanał `web`, sesja `active`. Ustawia na bieżącej sesji JEDNORAZOWY znacznik o podanym celu (ważny 5 minut, związany z
      sesją i celem; zużywa go operacja docelowa warunkowym `UPDATE` w swojej transakcji; nie jest kopiowany przy rotacji sesji ani
      zwracany klientowi — brak tokenu do wycieku). Cel `second_step_change`: hasło i drugi krok; cel `password_change`: sam drugi krok
      (bieżące hasło podaje `changePassword`); hasło przy `password_change` albo jego brak przy `second_step_change` → `400 validation_failed`.
      Drugi krok: klucz dostępu (wyzwanie z `getStepUpPasskeyOptions`, zużywane przy każdej weryfikacji) albo kod z aplikacji (Edytor, Tylko
      odczyt; Administrator w panelu — `403 forbidden`); kod odzyskiwania jest odrzucany (treść ścisła, decyzja 16). Kolejność: hasło,
      potem drugi krok; przy złym haśle drugi krok nie jest oceniany. Każda próba (hasło, klucz, kod) przechodzi przez licznik
      zgadywania z logowania (SR-AUTH-05): zakres — przeglądarka znana koncie (ciasteczko `__Host-evia_device`) albo konto; trwająca
      blokada → `429 rate_limited` z `Retry-After` BEZ weryfikacji i z zakończeniem sesji; próba, która ją wywołuje, także. Zły czynnik
      → `401 reauthentication_failed` (jedna odpowiedź, bez wskazania czynnika, ASVS V6.3.8). Zły kod z aplikacji liczy się w sesji
      wspólnie ze step-upem (piąty kończy sesję, `401 session_revoked`). Wymaga `X-CSRF-Token`; limit 20/min/IP wspólny z logowaniem.
      Audyt `reauthentication.succeeded` i `reauthentication.failed` (powód: `bad_password`, `passkey_failed`, `totp_failed`, `rate_limited`).
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/ReauthenticationRequest
    responses:
      '204':
        description: Znacznik ustawiony.
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/ReauthenticationFailed
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
accountPassword:
  post:
    operationId: changePassword
    tags: [identity]
    summary: Zmiana własnego hasła (W-15 → Hasło)
    description: >-
      Każda rola, kanał `web`, sesja `active`. Kolejność: bieżące hasło (licznik zgadywania z logowania; zła → `401 invalid_credentials`,
      trwająca blokada → `429` i koniec sesji) → reguły nowego hasła (SR-AUTH-01 i SR-AUTH-02: długość, hasła popularne i kontekstowe,
      Pwned Passwords; takie samo jak bieżące — `400 validation_failed`, `/newPassword`, `same_as_current`) → znacznik pełnego
      ponownego uwierzytelnienia o celu `password_change` (`403 reauthentication_required` — panel pokazuje W-04 z samym drugim krokiem i
      ponawia żądanie) → zapis w jednej transakcji: nowy skrót (Argon2id), zużycie znacznika, zdjęcie blokady z przyczyną `password` (blokada z
      przyczyną `second_step` zostaje), skasowanie rejestru znanych przeglądarek konta (EVM-026 AC5), unieważnienie wiszących linków resetu i
      `loginToken`, e-mail „Hasło zostało zmienione” (wariant z konta, bez IP i bez sprawcy) i audyt `password.changed`. Sesje NIE kończą
      się same: odpowiedź zwraca liczbę pozostałych aktywnych sesji (propozycja „Zakończ pozostałe sesje” → `endOtherAccountSessions`).
      Wymaga `X-CSRF-Token`; limit 20/min/IP wspólny z logowaniem. Hasła nie występują w logach ani w audycie.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/ChangePasswordRequest
    responses:
      '200':
        description: Hasło zmienione.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/PasswordChanged
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/InvalidCredentials
      '403':
        $ref: ../components/responses.yaml#/ReauthenticationRequired
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
