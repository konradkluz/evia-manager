      '403':
        $ref: ../components/responses.yaml#/ReauthenticationRequired
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/SecondStepConflict
      '429':
        $ref: ../components/responses.yaml#/RateLimited
accountSessions:
  get:
    operationId: listAccountSessions
    tags: [identity]
    summary: Moje sesje (W-15)
    description: >-
      Każda rola, kanał `web`, sesja `active` po step-upie (okno 15 minut; `403 step_up_required`). Własne, aktywne i niewygasłe sesje web
      konta, najstarsza pierwsza: `id` (nieprzezroczysty), `current`, `browser` i `os` ze zamkniętego słownika (bez wersji, nigdy surowy
      User-Agent ani skrót tokenu), pełny adres IP własnej sesji (P9) i ostatnia aktywność. Odpowiedź ma `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
