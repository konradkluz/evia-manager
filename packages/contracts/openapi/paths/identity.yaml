        $ref: ../components/responses.yaml#/RateLimited
  delete:
    operationId: endOtherAccountSessions
    tags: [identity]
    summary: Zakończenie pozostałych sesji konta (W-15)
    description: >-
      Każda rola, kanał `web`, sesja `active` po step-upie. Kończy wszystkie pozostałe otwarte sesje konta (powód `ended_by_user`;
      następne ich żądanie to `401 session_revoked`); bieżąca zostaje. Idempotentna — `200 { ended: 0 }` bez innych sesji. Audyt
      `session.revoked` dla każdej zakończonej sesji. Wymaga `X-CSRF-Token`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      stepUp: true
