      mobilny — `403 forbidden`; Administrator bez uwierzytelnienia kluczem dostępu w ostatnich 15 minutach — `403 step_up_required`.
      Wymaga `X-CSRF-Token`.
      Kolejność: guard (rola, CSRF, kanał, step-up), `userId`, `If-Match` (`400`/`428`), jedna transakcja: blokada administratorów (jedna dla
      wszystkich operacji na kontach), ponowne sprawdzenie wywołującego pod blokadą (konto nieaktywne — `401 session_revoked`), blokada konta
      docelowego (nieistniejące albo usunięte — `404 not_found`), wersja (`412 version_conflict`), reguły (`409`), zmiana, unieważnienie sesji, e-maile, alerty i audyt.
      Konto `active` albo `invited` przechodzi w `deactivated`; wszystkie jego sesje web kończą się (`401 session_revoked`), wiszące
      `loginToken`, wyzwania WebAuthn, oczekujące konfiguracje kodu z aplikacji, linki resetu hasła, zaproszenia i okno konfiguracji
      drugiego kroku są unieważnione. Logowanie daje tę samą odpowiedź co złe hasło. Metody drugiego kroku zostają (reaktywacja je
      przywraca). Odrzucenia `409`: `last_active_administrator`, `own_account_not_allowed`, `invalid_state_transition` (konto już
      dezaktywowane). Alert bezpieczeństwa, gdy dezaktywowane jest konto aktywnego Administratora. Audyt `user.deactivated`.
