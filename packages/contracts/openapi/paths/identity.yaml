      Rola Administrator po step-upie, kanał `web`, z audytem. Edytor i Tylko odczyt — `403 forbidden`; niezalogowany — `401`; token
      mobilny — `403 forbidden`; Administrator bez uwierzytelnienia kluczem dostępu w ostatnich 15 minutach — `403 step_up_required`.
      Wymaga `X-CSRF-Token`.
      Kolejność: guard (rola, CSRF, kanał, step-up), `userId` (`400`), jedna transakcja: blokada administratorów (jedna dla wszystkich operacji na kontach), ponowne sprawdzenie wywołującego pod blokadą (konto nieaktywne — `401 session_revoked`), blokada konta docelowego (nieistniejące albo usunięte — `404 not_found`), potem `If-Match` i treść (`428`/`400`), wersja (`412 version_conflict`), reguły (`409`), zmiana, unieważnienie sesji, e-maile, alerty i audyt.
