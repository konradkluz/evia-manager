userSecondStepReset:
  post:
    operationId: resetUserSecondStep
    tags: [identity]
    summary: Reset drugiego kroku logowania użytkownika (W-16)
    description: >-
      Rola Administrator po step-upie, kanał `web`, z audytem. Edytor i Tylko odczyt — `403 forbidden`; niezalogowany — `401`; token
      mobilny — `403 forbidden`; Administrator bez uwierzytelnienia kluczem dostępu w ostatnich 15 minutach — `403 step_up_required`.
      Wymaga `X-CSRF-Token`.
      Kolejność: guard (rola, CSRF, kanał, step-up), `userId`, `If-Match` i treść (`400`/`428`), jedna transakcja: blokada administratorów (jedna dla
      wszystkich operacji na kontach), ponowne sprawdzenie wywołującego pod blokadą (konto nieaktywne — `401 session_revoked`), blokada konta
      docelowego (nieistniejące albo usunięte — `404 not_found`), wersja (`412 version_conflict`), reguły (`409`), zmiana, unieważnienie sesji, e-maile, alerty i audyt.
      Tylko konto `active`. Klucze dostępu i sekrety kodu z aplikacji są usuwane (materiał szyfrowany znika), kody odzyskiwania
      przestają działać, wszystkie sesje web konta, wiszące `loginToken`, wyzwania i linki resetu hasła są unieważnione. Otwiera się okno
      konfiguracji drugiego kroku (24 godziny, bez tokenu): logowanie hasłem daje wtedy sesję `mfa_enrollment` (`403
      mfa_enrollment_required` na resztę, ekran W-03); w oknie konta Administratora wolno zarejestrować wyłącznie klucz dostępu. Po
      końcu okna logowanie poprawnym hasłem to `403 mfa_setup_expired`. Reset hasła nie otwiera drogi omijającej okno — konto bez
      metod nie dostaje linku. Ponowny reset zastępuje okno. Właściciel dostaje e-mail ze stałego szablonu (bez linku logowania).
      `identityVerification` (`in_person`, `video_call`) trafia do audytu jako kod powodu. Reset własnego drugiego kroku —
      `409 own_account_not_allowed`; konto nieaktywne — `409 invalid_state_transition`. Alert bezpieczeństwa, gdy reset dotyczy konta
      Administratora. Audyt `user.second_step_reset`.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      stepUp: true
      audit: true
    parameters:
      - $ref: '#/UserIdParameter'
      - $ref: '#/UserIfMatchHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/ResetUserSecondStepRequest
    responses:
      '200':
        description: Drugi krok zresetowany; konto po zmianie.
        headers:
          ETag:
            description: Nowa wersja konta (`"<version>"`).
            schema:
              type: string
              maxLength: 32
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/User
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/UserAccessConflict
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
