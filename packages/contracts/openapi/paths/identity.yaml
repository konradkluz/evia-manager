      identyfikatora konta — konto to sesja (nie ma sposobu na odczyt cudzego). Zwraca nazwę, e-mail, rolę oraz metody drugiego kroku:
      klucze dostępu (nazwa i data dodania), kod z aplikacji (data dodania; Administrator: służy tylko do aplikacji na telefonie) i stan
      kodów odzyskiwania (liczba pozostałych, data wygenerowania). Bez sekretów, kluczy publicznych i skrótów. Odpowiedź ma
      `Cache-Control: no-store` (zawiera dane osobowe). Bez audytu odczytu.
