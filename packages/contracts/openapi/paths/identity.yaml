# Module `identity` — activation of the first Administrator, passkeys, session (EVM-016). Authentication flows live
# under /api/v1/auth (one prefix for proxy rules and limits); passkeys are a resource of the account (EVM-028 reuses it).
# The session cookie `__Host-evia_session` (Secure, HttpOnly, SameSite=Strict, Path=/) is set and cleared by the server;
# mutations of an authenticated session send `X-CSRF-Token`, anonymous mutations are checked by Origin + Sec-Fetch-Site.
activationCheck:
  post:
    operationId: checkActivationLink
    tags: [identity]
    summary: Sprawdzenie linku aktywacyjnego (nie zużywa linku)
    description: >-
      Publiczna operacja: token linku (z fragmentu adresu `#…`, usuniętego z paska przez panel) trafia wyłącznie w treści
      `POST`. Zwraca e-mail i rolę konta do wyświetlenia w W-13. Nie zużywa linku — skaner linków w poczcie go nie „spali”.
      Link użyty, zmieniony, zastąpiony, wygasły i nieznany dają tę samą odpowiedź `400 activation_link_invalid`.
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/CheckActivationLinkRequest
    responses:
      '200':
        description: Link jest ważny.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/ActivationLinkInfo
            example:
              email: jan.przykladowy@example.invalid
              role: administrator
      '400':
        $ref: ../components/responses.yaml#/ActivationLinkInvalid
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
activationPassword:
  post:
    operationId: setActivationPassword
    tags: [identity]
    summary: Ustawienie hasła przy aktywacji konta
    description: >-
      Publiczna operacja: ważny link + nowe hasło (min. 15 znaków Unicode, nie z listy popularnych, bez słów
      kontekstowych, nie z wycieku — Pwned Passwords wyłącznie k-anonimowo; przy niedostępności tej usługi kontrola lokalna).
      Odrzucone hasło daje `400 validation_failed` z `errors[{pointer:/password, code: too_short|too_long|too_weak}]`.
      Sukces tworzy sesję w stanie `mfa_enrollment` (ciasteczko `__Host-evia_session`) — link nie jest zużyty do
      rejestracji klucza dostępu. Ponowne ustawienie hasła tym samym linkiem zastępuje hasło i kończy wszystkie sesje konta.
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/SetActivationPasswordRequest
    responses:
      '200':
        description: Hasło ustawione; sesja `mfa_enrollment`.
        headers:
          Set-Cookie:
            description: '`__Host-evia_session=…; Path=/; Secure; HttpOnly; SameSite=Strict` (nowy identyfikator sesji).'
            schema:
              type: string
              maxLength: 512
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/ActivationPasswordResult
      '400':
        $ref: ../components/responses.yaml#/ActivationLinkInvalid
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
login:
  post:
    operationId: login
    tags: [identity]
    summary: Logowanie — pierwszy krok (e-mail i hasło)
    description: >-
      Publiczna operacja (kanał `web`). Poprawne hasło aktywnego konta z kluczem dostępu → `200 { state: second_step, loginToken,
      methods: [passkey] }` (`loginToken` jest jednorazowy, ważny 5 min, trzymany w pamięci karty); aktywne konto bez klucza dostępu →
      `200 { state: mfa_enrollment, csrfToken }` z ciasteczkiem sesji ograniczonej (`403 mfa_enrollment_required` na resztę).
      Zły e-mail, złe hasło, konto zaproszone i dezaktywowane dają tę samą odpowiedź `401 invalid_credentials` (kod, treść,
      nagłówki) w porównywalnym czasie (równoważna weryfikacja Argon2id). Limit 20 prób na minutę z jednego adresu IP
      (wspólny z drugim krokiem) liczony przed dostępem do bazy → `429 rate_limited` z `Retry-After`. Ciasteczko poprzedniej
      sesji z żądania jest unieważniane (rotacja).
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/LoginRequest
    responses:
      '200':
        description: Pierwszy krok zaliczony.
        headers:
          Set-Cookie:
            description: >-
              Tylko przy `state: mfa_enrollment`: `__Host-evia_session=…; Path=/; Secure; HttpOnly; SameSite=Strict`
              (nowy identyfikator sesji).
            schema:
              type: string
              maxLength: 512
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/LoginResult
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/InvalidCredentials
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
loginPasskeyOptions:
  post:
    operationId: getLoginPasskeyOptions
    tags: [identity]
    summary: Opcje uwierzytelnienia kluczem dostępu (drugi krok)
    description: >-
      Publiczna operacja: wymaga ważnego `loginToken`. Zwraca opcje WebAuthn (`userVerification: required`,
      `allowCredentials` tylko z kluczami tego konta) i zapisuje jednorazowe wyzwanie (≥ 128 bitów, TTL 5 min) powiązane
      z próbą logowania; poprzednie wyzwania tej próby tracą ważność. Brak lub nieznany `loginToken` → `401 unauthenticated`,
      wygasły → `401 login_expired`. Ten sam limit prób co pierwszy krok.
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/LoginPasskeyOptionsRequest
    responses:
      '200':
        description: Opcje uwierzytelnienia.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/PasskeyAuthenticationOptions
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/LoginSecondStepFailed
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
loginPasskey:
  post:
    operationId: verifyLoginPasskey
    tags: [identity]
    summary: Logowanie — drugi krok (klucz dostępu)
    description: >-
      Publiczna operacja (kanał `web`). Weryfikuje odpowiedź WebAuthn: klucz musi należeć do konta z `loginToken`, origin i RP ID
      z konfiguracji, `userVerification: required`, wyzwanie jednorazowe (zużywane przy każdej weryfikacji, także nieudanej).
      Sukces w jednej transakcji: zużycie `loginToken` i wyzwania, nowa sesja `active` z nowym identyfikatorem (poprzednia
      z ciasteczka żądania unieważniona), `lastLoginAt`, licznik klucza i audyt. Nieudany klucz → `401 passkey_failed`
      (`loginToken` nie jest zużywany — można ponowić; po 5 nieudanych próbach próba logowania wygasa), po upływie 5 min →
      `401 login_expired`, bez poprawnego pierwszego kroku → `401 unauthenticated`.
    x-evia-authz:
      public: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/VerifyLoginPasskeyRequest
    responses:
      '200':
        description: Zalogowano.
        headers:
          Set-Cookie:
            description: '`__Host-evia_session=…; Path=/; Secure; HttpOnly; SameSite=Strict` (nowy identyfikator sesji).'
            schema:
              type: string
              maxLength: 512
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/SessionStarted
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/LoginSecondStepFailed
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
sessionExtend:
  post:
    operationId: extendSession
    tags: [identity]
    summary: Przedłużenie sesji (ostrzeżenie P-11)
    description: >-
      Odnawia czas bezczynności (60 min od teraz), nigdy ponad bezwzględny limit 12 h od zalogowania. Przedłuża wyłącznie sesję
      z ciasteczka (bez identyfikatora w żądaniu — treść musi być pusta). Wymaga `X-CSRF-Token`. Dozwolone w stanie
      `mfa_enrollment`. Sesja już wygasła → `401 session_expired`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      allowDuringMfaEnrollment: true
    responses:
      '200':
        description: Sesja przedłużona.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/SessionExpiry
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/SessionExpired
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
session:
  get:
    operationId: getCurrentSession
    tags: [identity]
    summary: Bieżąca sesja (użytkownik, stan, token CSRF)
    description: >-
      Dla panelu: powłoka i menu konta. Dostępne także w stanie `mfa_enrollment` (ekran W-03 po odświeżeniu strony odzyskuje
      token CSRF); zwraca wtedy `state: mfa_enrollment`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      allowDuringMfaEnrollment: true
    responses:
      '200':
        description: Sesja istnieje.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/CurrentSession
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
logout:
  post:
    operationId: logout
    tags: [identity]
    summary: Wylogowanie
    description: >-
      Unieważnia sesję w bazie, wygasza ciasteczko i odpowiada `Clear-Site-Data: "cache", "storage"`. Dostępne także w stanie
      `mfa_enrollment` (W-03 ma „Wyloguj”). Wymaga `X-CSRF-Token`; żądanie ze starym ciasteczkiem daje `401 session_revoked`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      allowDuringMfaEnrollment: true
      audit: true
    responses:
      '204':
        description: Sesja unieważniona.
        headers:
          Clear-Site-Data:
            description: Dokładnie wartość "cache", "storage" (cudzysłowy należą do wartości nagłówka).
            schema:
              type: string
              maxLength: 64
          Set-Cookie:
            description: 'Wygaszenie ciasteczka `__Host-evia_session` z tymi samymi atrybutami i `Max-Age=0`.'
            schema:
              type: string
              maxLength: 512
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
passkeyOptions:
  post:
    operationId: getPasskeyRegistrationOptions
    tags: [identity]
    summary: Opcje rejestracji klucza dostępu
    description: >-
      Zwraca opcje WebAuthn (`userVerification: required`, `attestation: none`) i zapisuje jednorazowe wyzwanie
      (≥ 128 bitów, TTL 5 min) powiązane z sesją, użytkownikiem i celem. Bez treści żądania. Dozwolone w stanie `mfa_enrollment`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      allowDuringMfaEnrollment: true
    responses:
      '200':
        description: Opcje rejestracji.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/PasskeyRegistrationOptions
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
passkeys:
  post:
    operationId: registerPasskey
    tags: [identity]
    summary: Rejestracja klucza dostępu
    description: >-
      Weryfikuje odpowiedź WebAuthn (origin i RP ID z konfiguracji, `userVerification: required`, wyzwanie jednorazowe).
      Sukces w jednej transakcji: zapis klucza, aktywacja konta, zużycie linku aktywacyjnego, nowa sesja `active`
      z nowym identyfikatorem (nowe ciasteczko; stara sesja unieważniona) i zdarzenia audytu. Odpowiedź nie zawiera danych
      sesji — panel wywołuje `getCurrentSession`. Dozwolone w stanie `mfa_enrollment`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      allowDuringMfaEnrollment: true
      audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/RegisterPasskeyRequest
    responses:
      '201':
        description: Klucz zarejestrowany.
        headers:
          Set-Cookie:
            description: '`__Host-evia_session=…` — nowy identyfikator sesji `active`.'
            schema:
              type: string
              maxLength: 512
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/Passkey
      '400':
        $ref: ../components/responses.yaml#/PasskeyVerificationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
stepUpOptions:
  post:
    operationId: getStepUpPasskeyOptions
    tags: [identity]
    summary: Opcje ponownego uwierzytelnienia kluczem dostępu (step-up)
    description: >-
      Tylko Administrator, kanał `web`, sesja `active`; bez treści żądania. Zwraca opcje WebAuthn (`userVerification: required`,
      `allowCredentials` tylko z kluczami zalogowanego użytkownika) i zapisuje jednorazowe wyzwanie (≥ 128 bitów, TTL 5 min)
      o celu `passkey_step_up` powiązane z bieżącą sesją; wcześniejsze otwarte wyzwania tej sesji z tym celem tracą ważność.
      Wyzwanie rejestracji klucza i wyzwanie step-upu nie są wymienne. Wymaga `X-CSRF-Token`. Limit 20 żądań na minutę z jednego
      adresu IP (wspólny z logowaniem). Nie wymaga świeżego uwierzytelnienia (to jest ta ścieżka).
    x-evia-authz:
      roles: [administrator]
      channels: [web]
    responses:
      '200':
        description: Opcje uwierzytelnienia.
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/PasskeyAuthenticationOptions
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/SessionExpired
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
stepUp:
  post:
    operationId: stepUp
    tags: [identity]
    summary: Ponowne uwierzytelnienie kluczem dostępu (step-up)
    description: >-
      Tylko Administrator, kanał `web`, sesja `active`. Jedyną metodą jest klucz dostępu — kod odzyskiwania nie jest obsługiwany
      (treść jest ścisła: tylko `credential`, każde inne pole daje `400 validation_failed`). Weryfikuje odpowiedź WebAuthn: klucz
      musi należeć do użytkownika sesji, origin i RP ID z konfiguracji, `userVerification: required`, licznik podpisów,
      wyzwanie jednorazowe o celu `passkey_step_up` powiązane z bieżącą sesją (zużywane przy każdej weryfikacji, także nieudanej).
      Sukces w jednej transakcji: poprzednia sesja unieważniona (`rotated`, warunkowy `UPDATE`), nowa sesja z nowym tokenem i nowym
      `csrfToken`, ten sam użytkownik, kanał i stan, bezwzględny limit 12 h bez zmian, czas uwierzytelnienia kluczem = teraz,
      zdarzenia audytu `session.revoked`, `session.created`, `step_up.succeeded`. Sesja już nieważna → `401 session_revoked`
      bez nowej sesji. Nieudany klucz → `401 passkey_failed` (sesja bez zmian, bez rotacji, zdarzenie `step_up.failed`). Wymaga
      `X-CSRF-Token`. Limit 20 żądań na minutę z jednego adresu IP.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      audit: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/StepUpRequest
    responses:
      '200':
        description: Tożsamość potwierdzona.
        headers:
          Set-Cookie:
            description: '`__Host-evia_session=…; Path=/; Secure; HttpOnly; SameSite=Strict` (nowy identyfikator sesji).'
            schema:
              type: string
              maxLength: 512
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/StepUpResult
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/StepUpFailed
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
assignableUsers:
  get:
    operationId: listAssignableUsers
    tags: [identity]
    summary: Lista użytkowników do wyboru opiekuna zlecenia
    description: >-
      Role Administrator i Edytor, kanał `web`, bez audytu odczytu. Aktywni użytkownicy (nie zaproszeni, nie dezaktywowani, nie
      usunięci) posortowani po nazwie wyświetlanej i identyfikatorze, najwyżej 100. Każda pozycja to wyłącznie `id` i `displayName`
      — bez e-maila, roli, ostatniego logowania i statusu MFA (SR-DATA-03). Operacja nie przyjmuje parametrów.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: false
    responses:
      '200':
        description: Aktywni użytkownicy (pole `nextCursor` jest zawsze `null`).
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/AssignableUserList
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
UserIdParameter:
  name: userId
  in: path
  required: true
  description: Identyfikator konta użytkownika (UUID).
  schema:
    type: string
    format: uuid
    maxLength: 36
users:
  get:
    operationId: listUsers
    tags: [identity]
    summary: Lista użytkowników (Administracja, W-16)
    description: >-
      Rola Administrator, kanał `web`, bez step-upu i bez audytu odczytu (Edytor i Tylko odczyt — `403 forbidden`; niezalogowany —
      `401`; token mobilny — `403 channel_not_allowed`). Konta usunięte nie występują. Porządek stały: nazwa wyświetlana w kolacji
      `pl-PL` („Ł” po „L”), potem `id`. Paginacja kursorem nieprzezroczystym (`limit` 1–100, domyślnie 25; zły kursor —
      `400 invalid_cursor`). Pozycja to konto z e-mailem (dane osobowe — tylko Administrator), rolą, statusem i — dla konta
      `invited` — stanem zaproszenia (`sending`, `sent`, `failed` = „Nie wysłano”, `expired`). Bez haseł, kluczy dostępu, adresów IP
      i metod MFA.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      audit: false
    parameters:
      - name: limit
        in: query
        required: false
        description: Liczba pozycji na stronie.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        description: Kursor ze strony poprzedniej (`nextCursor`) — wartość nieprzezroczysta.
        schema:
          type: string
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
    responses:
      '200':
        description: Strona użytkowników (pusta lista to pusta tablica `items` i `nextCursor` równy `null`).
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/UserList
      '400':
        $ref: ../components/responses.yaml#/InvalidListQuery
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  post:
    operationId: inviteUser
    tags: [identity]
    summary: Zaproszenie użytkownika (W-16)
    description: >-
      Rola Administrator po step-upie, kanał `web`, z audytem (`user.invited`, bez adresu i nazwy). Edytor i Tylko odczyt — `403
      forbidden` (także dla istniejącego adresu: `409` nigdy nie wyprzedza kontroli uprawnień); niezalogowany — `401`; token mobilny —
      `403 channel_not_allowed`; Administrator bez uwierzytelnienia kluczem dostępu w ostatnich 15 minutach — `403 step_up_required`
      (także dla istniejącego adresu — brak wyliczania kont przed step-upem). Kolejność: guard (rola, CSRF, kanał, step-up),
      `Idempotency-Key` i treść (`400 validation_failed`: `invalid_email`, `required`, `too_long`, `invalid_characters`, `invalid_value`),
      jedna transakcja: powtórka idempotentna, konflikt adresu (`409 email_conflict` z `existingUserId` konta widocznego na liście;
      konto usunięte — ten sam kod bez `existingUserId`; wyścig dwóch zaproszeń — jedno `201` i jedno `409`, nigdy `500`), konto
      `invited`, wiersz skrzynki nadawczej e-maila (outbox — w tej samej transakcji; bez adresu, tylko identyfikatory) i zdarzenie
      audytu. Token zaproszenia powstaje w workerze przy wysyłce (w bazie wyłącznie skrót, ważność 72 godziny od wysłania); w
      odpowiedzi go nie ma. Zaproszenie z rolą Administrator tworzy też alert bezpieczeństwa dla każdego aktywnego Administratora.
      Idempotencja: `Idempotency-Key` (UUIDv7) opcjonalny, panel wysyła go zawsze; powtórka — to samo `201`, bieżąca reprezentacja i
      `Idempotent-Replayed: true`; inna treść — `422 idempotency_mismatch`; równoległe żądanie — `409 idempotency_in_progress`.
      Wymaga `X-CSRF-Token`.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      stepUp: true
      audit: true
    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/identity.yaml#/InviteUserRequest
    responses:
      '201':
        description: >-
          Konto `invited` utworzone, e-mail w kolejce (albo powtórka — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          Location:
            description: Adres zasobu (`/api/v1/users/{userId}`).
            schema:
              type: string
              maxLength: 64
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key` i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/User
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '409':
        $ref: ../components/responses.yaml#/UserConflict
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/IdempotencyMismatch
      '429':
        $ref: ../components/responses.yaml#/RateLimited
userInvitations:
  post:
    operationId: resendUserInvitation
    tags: [identity]
    summary: Ponowne wysłanie zaproszenia (W-16)
    description: >-
      Rola Administrator po step-upie, kanał `web`, z audytem (`invitation.resent`). Bez treści żądania. Kolejność: guard (rola,
      CSRF, kanał, step-up), `userId` (`400`), konto (kolejność blokad: konto, potem wiersz e-maila — jedna transakcja): nieistniejące
      albo usunięte — `404 not_found`, konto `active` albo `deactivated` — `409 invalid_state_transition` (bez danych konta). W tej samej
      transakcji poprzednie otwarte linki konta (i sesje konfiguracji drugiego kroku z nich) są unieważnione — poprzedni link
      przestaje działać natychmiast, także gdy usługa e-mail jest niedostępna; poprzedni niewysłany wiersz e-maila jest zastąpiony nowym.
      Nowy link (ważność 72 godziny od wysłania) powstaje w workerze przy wysyłce. Zaproszenie z rolą Administrator tworzy alert
      bezpieczeństwa dla aktywnych Administratorów. Odpowiedź to konto ze stanem zaproszenia `sending`.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      stepUp: true
      audit: true
    parameters:
      - $ref: '#/UserIdParameter'
    responses:
      '200':
        description: Zaproszenie wysłane ponownie (do kolejki).
        content:
          application/json:
            schema:
              $ref: ../components/identity.yaml#/User
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/UserStateConflict
      '429':
        $ref: ../components/responses.yaml#/RateLimited
