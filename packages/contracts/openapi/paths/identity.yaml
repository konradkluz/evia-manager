accountPasskey:
  delete:
    operationId: removePasskey
    tags: [identity]
    summary: Usunięcie własnego klucza dostępu (W-15 → Drugi krok logowania)
    description: >-
      Każda rola, kanał `web`, sesja `active` (sesja `mfa_enrollment` — `403 mfa_enrollment_required`). Kolejność: `passkeyId` (`400`), jedna
      transakcja: blokada wiersza konta, klucz TEGO konta (cudzy, nieistniejący i już usunięty — jedna odpowiedź `404 not_found`), znacznik
      pełnego ponownego uwierzytelnienia `second_step_change` (`403 reauthentication_required`; zużywany dopiero z sukcesem operacji),
      reguła AC4 pod blokadą konta: Administrator nie usuwa ostatniego klucza, a konto bez Administratora — ostatniej metody
      (klucz albo kod z aplikacji; kod z aplikacji Administratora nie liczy się, kody odzyskiwania nie są metodą) →
      `409 last_second_step_method`. Sukces: usunięcie, e-mail „zmiana drugiego kroku” (bez nazwy klucza), audyt `passkey.removed`, alert dla
      Administratorów, gdy dotyczy konta Administratora. Wymaga `X-CSRF-Token`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      audit: true
    parameters:
      - $ref: '#/PasskeyIdParameter'
    responses:
      '204':
        description: Klucz usunięty.
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/ReauthenticationRequired
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/SecondStepConflict
      '429':
        $ref: ../components/responses.yaml#/RateLimited
accountTotp:
  delete:
    operationId: removeTotp
    tags: [identity]
    summary: Usunięcie własnego kodu z aplikacji (W-15 → Drugi krok logowania)
    description: >-
      Każda rola, kanał `web`, sesja `active`. Wymaga znacznika `second_step_change` (`403 reauthentication_required`). Konto bez aktywnego
      kodu z aplikacji — `404 not_found`. Reguła AC4: Edytor i Tylko odczyt nie usuwają ostatniej metody (`409 last_second_step_method`); kod
      z aplikacji Administratora nie jest metodą drugiego kroku w panelu, więc usunięcie go jest zawsze dozwolone. Sukces: usunięcie
      sekretu (materiał szyfrowany znika), e-mail „zmiana drugiego kroku”, audyt `mfa.totp_removed`, alert dla Administratorów, gdy
      dotyczy konta Administratora. Wymaga `X-CSRF-Token`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      audit: true
    responses:
      '204':
        description: Kod z aplikacji usunięty.
      '401':
