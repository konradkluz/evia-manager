# Module `customers` — search and creation of a customer in the new-work-order form (EVM-020; W-05); list, detail and edit (EVM-039; W-14).
customersSearch:
  post:
    operationId: searchCustomers
    tags: [customers]
    summary: Wyszukiwanie klientów (fraza w treści)
    description: >-
      Role Administrator, Edytor i Tylko odczyt, kanał `web`, bez audytu odczytu. To `POST`, bo fraza zawiera dane osobowe i nie może
      trafić do adresu URL, logów dostępu ani historii przeglądarki (SR-API-04); wymaga `X-CSRF-Token`, nie wymaga `Idempotency-Key`.
      Wielkość liter i polskie znaki nie mają znaczenia („Lodz” znajduje klienta z Łodzi). Wyszukiwanie obejmuje imię, nazwisko,
      nazwę firmy, NIP, telefon (same cyfry), e-mail i miasto; w wyniku są `id`, `kind`, `displayName`, `sortName`, `phone` i `email`
      (nigdy NIP, adres, notatki ani tekst wyszukiwania). Paginacja (EVM-039): opcjonalne `limit` (1–100, domyślnie 25) i `cursor` w
      treści — kursor jest związany z frazą i użytkownikiem i nie zawiera żadnych danych (sama pozycja identyfikatora); zmieniony,
      wygasły, cudzy albo użyty z inną frazą — `400 invalid_cursor`. Porządek stały: klucz sortowania w kolacji ICU `pl-PL`
      (nazwisko przed imieniem, „Ł” po „L”), potem `id`. Klienci usunięci (soft delete) nie występują — warunek jest w zapytaniu; pole `deleted: true` (EVM-041) to widok „Usunięci” — tylko Administrator (inne role — `403 forbidden` przed walidacją kursora), filtr jest związany z kursorem, a wyszukiwanie w tym widoku wlicza się do progu masowego odczytu tak jak zwykłe. Limit 60 wyszukiwań na minutę na użytkownika
      (`429 rate_limited` z `Retry-After`; liczy się każde wyszukiwanie, także odrzucone przez walidację); wyniki wliczają się do progu
      masowego odczytu (P10) i do licznika różnych klientów (alert przy 301. różnym kliencie w ciągu godziny). Fraza krótsza niż 3 znaki po normalizacji — `400 validation_failed`, kod `too_short`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      audit: false
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/customers.yaml#/CustomerSearchRequest
    responses:
      '200':
        description: Pasujący klienci (brak wyników to pusta tablica `items` i `nextCursor` równy `null`).
        content:
          application/json:
            schema:
              $ref: ../components/customers.yaml#/CustomerSearchResult
      '400':
        $ref: ../components/responses.yaml#/InvalidListQuery
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
customers:
  get:
    operationId: listCustomers
    tags: [customers]
    summary: Lista klientów (kursor)
    description: >-
      Role Administrator, Edytor i Tylko odczyt, kanał `web`, bez audytu odczytu (masowy odczyt pilnuje licznik poniżej). Porządek
      stały: klucz sortowania w kolacji ICU `pl-PL` (nazwisko przed imieniem, „Ł” po „L”), potem `id` — bez parametru sortowania.
      Klienci usunięci (soft delete) nie występują — warunek jest w zapytaniu, nie w odsiewaniu strony; widok „Usunięci” (EVM-041)
      to `deleted=true` — wyłącznie klienci usunięci, tylko dla Administratora (Edytor i Tylko odczyt — `403 forbidden`, przed
      walidacją kursora; filtr jest związany z kursorem, więc kursor widoku „Usunięci” nie otwiera się bez `deleted=true` ani dla innej
      roli); brak parametru albo `deleted=false` — wyłącznie nieusunięci, także dla Administratora. `limit` 1–100 (domyślnie 25);
      zły `limit`, nieznany parametr (`400 unknown_parameter`) albo powtórzony (`400 duplicate_parameter`) — `400`. Paginacja kursorem
      nieprzezroczystym bez danych (sama pozycja identyfikatora, bez licznika wyników): zmieniony, wygasły albo wydany komu innemu —
      `400 invalid_cursor`. Frazy wyszukiwania nie ma w adresie (SR-API-04): do tego służy `searchCustomers`. Masowy odczyt (P10):
      rekordy wliczają się do progu 2000 w 10 minut (alert) i 10 000 (`429 rate_limited` z `Retry-After`), a 301. różny klient odczytany
      w ciągu godziny (lista, wyszukiwanie, szczegóły, karta klienta zlecenia) wywołuje alert bezpieczeństwa.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      audit: false
    parameters:
      - name: limit
        in: query
        required: false
        description: Liczba pozycji na stronie.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        description: Kursor ze strony poprzedniej (`nextCursor`) — wartość nieprzezroczysta.
        schema:
          type: string
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
      - name: deleted
        in: query
        required: false
        description: Widok „Usunięci” (tylko Administrator) - `true` to wyłącznie klienci usunięci, brak albo `false` to wyłącznie nieusunięci.
        schema:
          type: boolean
    responses:
      '200':
        description: Strona klientów (pusta lista to pusta tablica `items` i `nextCursor` równy `null`).
        content:
          application/json:
            schema:
              $ref: ../components/customers.yaml#/CustomerList
      '400':
        $ref: ../components/responses.yaml#/InvalidListQuery
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  post:
    operationId: createCustomer
    tags: [customers]
    summary: Dodanie klienta
    description: >-
      Role Administrator i Edytor (Tylko odczyt — `403 forbidden`), kanał `web`, z audytem (`customer.created`, bez wartości danych
      osobowych). `id` (UUIDv7) nadaje klient; istniejące `id` (także klienta usuniętego) — `409 id_conflict` bez żadnych danych
      istniejącego zasobu. Telefon jest normalizowany do E.164, e-mail zapisywany małymi literami, NIP do 10 cyfr z sumą kontrolną.
      Pole spoza schematu — `400 validation_failed` (`unknown_field`), pole kontrolowane przez serwer — `400` z kodem `read_only_field`,
      błąd reguły — `400` z `errors[]` (wskaźnik i kod, nigdy wartość). Idempotencja (api-guidelines.md → Idempotencja):
      `Idempotency-Key` (UUIDv7) jest opcjonalny; panel wysyła go zawsze, a przy ponowieniu używa tego samego `id` i klucza.
      Powtórka (ten sam klucz i treść) — ten sam status i `id`, bieżąca reprezentacja i `Idempotent-Replayed: true`, bez nowego zdarzenia
      audytu; ten sam klucz z inną treścią albo na innej operacji — `422 idempotency_mismatch`; równoległe żądanie z tym samym kluczem —
      `409 idempotency_in_progress` z `Retry-After`. Klucz obowiązuje 30 dni, osobno dla każdego użytkownika. Wymaga `X-CSRF-Token`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: true
    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/customers.yaml#/Customer
    responses:
      '201':
        description: >-
          Klient zapisany (albo powtórka wcześniejszego zapisu — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Wersja zasobu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key` i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/customers.yaml#/Customer
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/CustomerConflict
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/IdempotencyMismatch
      '429':
        $ref: ../components/responses.yaml#/RateLimited
CustomerIdParameter:
  name: customerId
  in: path
  required: true
  description: Identyfikator klienta (UUID).
  schema:
    type: string
    format: uuid
    maxLength: 36
customer:
  get:
    operationId: getCustomer
    tags: [customers]
    summary: Szczegóły klienta
    description: >-
      Role Administrator, Edytor i Tylko odczyt, kanał `web` (sesja mobilna — `403 forbidden`: kanał poza polityką), bez audytu odczytu.
      Odpowiedź ma `ETag` (`"<version>"`) i komplet danych klienta (telefon, e-mail, adres korespondencyjny, notatki; bez tekstu
      wyszukiwania i klucza sortowania; `deletedAt` i `anonymizedAt` — `null` albo znacznik). Klient jest rozwiązywany przez politykę odczytu
      w zapytaniu: nieistniejący i usunięty (soft delete) dają tę samą odpowiedź `404 not_found` dla Edytora i Tylko odczyt;
      Administrator widzi klienta usuniętego (`deletedAt` niepuste — EVM-041, W-14). Zły format `customerId` — `400 validation_failed`. Odczyt wlicza się do progu masowego odczytu (rekordy: 10 000
      w 10 minut → `429 rate_limited` z `Retry-After`) i do licznika różnych klientów (P10). Każda odpowiedź ma `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      audit: false
    parameters:
      - $ref: '#/CustomerIdParameter'
    responses:
      '200':
        description: Dane klienta.
        headers:
          ETag:
            description: Wersja zasobu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
        content:
          application/json:
            schema:
              $ref: ../components/customers.yaml#/Customer
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  patch:
    operationId: updateCustomer
    tags: [customers]
    summary: Zmiana danych klienta (merge-patch, If-Match)
    description: >-
      Role Administrator i Edytor (Tylko odczyt — `403 forbidden` przed walidacją, `If-Match` i sprawdzeniem istnienia; niezalogowany —
      `401`), kanał `web`, z audytem (`customer.updated` — aktor, identyfikator klienta, wynik i `traceId`; bez wartości pól). Wymaga
      `X-CSRF-Token` i `If-Match` (silny ETag `"<version>"`): brak — `428 precondition_required`; słaby (`W/`), lista, `*` albo
      zniekształcony — `400 validation_failed` (`/headers/If-Match`) — niezależnie od istnienia klienta; nieaktualna wersja —
      `412 version_conflict` (odpowiedź nie zawiera bieżących wartości; klient pobiera klienta ponownie). Treść to `CustomerPatch`:
      pole spoza schematu — `400 unknown_field`, pole kontrolowane przez serwer — `400 read_only_field`, błąd reguły (jak przy
      dodaniu: telefon E.164, e-mail, NIP, pola zależne od rodzaju) — `400` z `errors[]` (wskaźnik i kod, nigdy wartość).
      Kolejność: guard (rola, CSRF, kanał), `If-Match` i treść (kształt), blokada wiersza `SELECT … FOR UPDATE` z polityką odczytu
      w zapytaniu (nieistniejący i usunięty klient — `404 not_found`, także z nieaktualnym `If-Match`), powtórka idempotentna,
      wersja (`412`), reguły domeny (`400`), zapis `version + 1`, audyt i rekord idempotencji w jednej transakcji; błąd cofa całość.
      Idempotencja (api-guidelines.md → Idempotencja): `Idempotency-Key` (UUIDv7) jest opcjonalny, panel wysyła go zawsze. Klucz jest
      związany z użytkownikiem, metodą, szablonem ścieżki I identyfikatorem klienta: ten sam klucz z tą samą treścią dla innego klienta
      — `422 idempotency_mismatch`. Powtórka (ten sam klucz, klient i treść) — `200` z bieżącą reprezentacją odczytaną z polityką
      odczytu (usunięty w międzyczasie — `404`) i `Idempotent-Replayed: true`, bez drugiej zmiany i drugiego zdarzenia audytu, także
      gdy `If-Match` jest już nieaktualny. Klient zanonimizowany (EVM-041) — `409 customer_anonymized` (po blokadzie wiersza i powtórce idempotentnej, przed wersją). Odpowiedź `200` ma nowy `ETag`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: true
    parameters:
      - $ref: '#/CustomerIdParameter'
      - name: If-Match
        in: header
        required: true
        description: Silny ETag wersji klienta, na której użytkownik podjął decyzję (`"<version>"`, z `ETag` odczytu).
        schema:
          type: string
          pattern: '^"[1-9][0-9]{0,9}"$'
          maxLength: 12
      - name: Idempotency-Key
        in: header
        required: false
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/customers.yaml#/CustomerPatch
    responses:
      '200':
        description: >-
          Klient po zmianie (albo powtórka wcześniejszej zmiany — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Nowa wersja zasobu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key`, klientem i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/customers.yaml#/Customer
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/CustomerAnonymizedConflict
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/IdempotencyMismatch
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  delete:
    operationId: deleteCustomer
    tags: [customers]
    summary: Usunięcie klienta (soft delete, tylko Administrator)
    description: >-
      Ukrycie klienta dodanego przez pomyłkę (EVM-041 AC1, AC2, AC6, AC7; SR-AUTHZ-02, SR-AUTHZ-05, SR-API-05, SR-API-06, SR-LOG-03,
      SR-DATA-08). Soft delete: klient znika dla Edytora i Tylko odczyt (`404`, lista, wyszukiwanie, dane osadzone w zleceniach —
      „Klient usunięty”); wiersz zostaje i można go przywrócić (`restoreCustomer`). Dozwolone tylko bez niezamkniętych zleceń
      (status inny niż „Rozliczone” i „Anulowane”; zlecenia usunięte nie blokują): inaczej `409 has_active_dependents` z `openWorkOrders`
      (liczba). Tylko Administrator, kanał `web` (Edytor i Tylko odczyt — `403 forbidden` przed `404`, `If-Match` i sprawdzeniem stanu;
      niezalogowany — `401`; token mobilny — `403 channel_not_allowed`), z audytem (`customer.deleted` — aktor, identyfikator klienta,
      wynik, `traceId`, prefiks IP; bez żadnej wartości danych). Wymaga `X-CSRF-Token`, `If-Match` (silny ETag `"<version>"`: brak —
      `428`, zniekształcony lub `*` — `400`, nieaktualna wersja — `412 version_conflict`) i `Idempotency-Key` (UUIDv7, opcjonalny;
      panel wysyła go zawsze). Kolejność (jedna transakcja, decyzje na wierszu klienta zablokowanym `SELECT … FOR UPDATE`): guard,
      ścieżka i klucz (`400`), klient (`404` — nieistniejący i usunięty to jedna odpowiedź), powtórka idempotentna (zapisany `204`, przed
      regułą zależności), zależności (`409`; zlecenia liczy osobne zapytanie po zdobyciu blokady, więc zlecenie zatwierdzone przed blokadą
      jest widoczne), `If-Match` (`412`), zapis `version + 1`, `deleted_at`, `deleted_by`, audyt i rekord idempotencji. Równoległe
      utworzenie zlecenia klienta jest szeregowane z usunięciem (blokada `FOR KEY SHARE` przy tworzeniu zlecenia): zlecenie utworzone
      pierwsze blokuje usunięcie (`409`), usunięcie pierwsze — tworzenie dostaje `404`/`422` jak dla nieistniejącego klienta. Klucz
      idempotencji jest związany z użytkownikiem, metodą, szablonem ścieżki I identyfikatorem klienta. Brak rozstrzygnięcia reguły
      zależności (błąd modułu zleceń) — `500` bez zapisu (fail closed). Oczekiwanie na blokadę dłuższe niż limit — `503 service_unavailable`.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      stepUp: false
      audit: true
    parameters:
      - $ref: '#/CustomerIdParameter'
      - $ref: ./work-orders.yaml#/IfMatchHeader
      - $ref: ./work-orders.yaml#/IdempotencyKeyHeader
    responses:
      '204':
        description: >-
          Klient usunięty (albo powtórka wcześniejszego usunięcia — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key` i klientem.'
            schema:
              type: string
              enum: ['true']
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/CustomerHasActiveDependents
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '422':
        $ref: ../components/responses.yaml#/IdempotencyMismatch
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/responses.yaml#/CustomerBusy
customerRestore:
  post:
    operationId: restoreCustomer
    tags: [customers]
    summary: Przywrócenie usuniętego klienta (tylko Administrator)
    description: >-
      Przywrócenie klienta usuniętego przez `deleteCustomer` (EVM-041 AC3, AC6, AC7; SR-AUTHZ-05, SR-API-05, SR-API-06, SR-LOG-03):
      klient znów jest widoczny dla wszystkich ról. Klient zanonimizowany też da się przywrócić (zostaje zanonimizowany). Tylko
      Administrator, kanał `web` (Edytor i Tylko odczyt — `403 forbidden` przed `404` i `If-Match`; niezalogowany — `401`; token
      mobilny — `403 channel_not_allowed`), z audytem (`customer.restored` — aktor, identyfikator, wynik, `traceId`; bez wartości).
      Wymaga `X-CSRF-Token`, `If-Match` (`428` / `400` / `412 version_conflict`) i `Idempotency-Key` (opcjonalny). Klient
      nieusunięty albo nieistniejący — `404` (tak samo; `If-Match` nie jest wtedy czytany), chyba że to powtórka z kluczem. Powtórka
      (ten sam klucz i klient) — `200` z bieżącą reprezentacją i `Idempotent-Replayed: true`, także gdy `If-Match` jest nieaktualny.
      Klucz jest związany z użytkownikiem, metodą, szablonem ścieżki i klientem. Odpowiedź `200` ma nowy `ETag`.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      stepUp: false
      audit: true
    parameters:
      - $ref: '#/CustomerIdParameter'
      - $ref: ./work-orders.yaml#/IfMatchHeader
      - $ref: ./work-orders.yaml#/IdempotencyKeyHeader
    responses:
      '200':
        description: >-
          Klient po przywróceniu (albo powtórka — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Nowa wersja zasobu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key` i klientem.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/customers.yaml#/Customer
      '400':
