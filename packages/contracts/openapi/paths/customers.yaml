customerAnonymize:
  post:
    operationId: anonymizeCustomer
    tags: [customers]
    summary: Anonimizacja klienta (tylko Administrator, ze step-upem)
    description: >-
      Nieodwracalne zastąpienie danych klienta wartościami neutralnymi „Klient zanonimizowany” z zachowaniem powiązań ze zleceniami
      (EVM-041 AC2, AC4, AC5, AC6, AC7; SR-DATA-08, SR-SESS-08, SR-PRIV-04, SR-LOG-03, SR-AUTHZ-05). Imię i nazwisko (osoba) albo nazwa
      firmy mają wartość „Klient zanonimizowany”; NIP, osoba kontaktowa, e-mail, adres i notatki są puste; telefon to stała neutralna
      `+48000000000` (nie numer) — panel pokazuje wtedy „—”. Tekst wyszukiwania jest przeliczany: stare dane nie są znajdowane (także
      w wyszukiwaniu zleceń). Tylko Administrator, kanał `web`, z `X-CSRF-Token`, z uwierzytelnieniem kluczem dostępu w ciągu ostatnich
      15 minut (`403 step_up_required` przed jakimkolwiek odczytem, zapisem i liczeniem zleceń; rola przed step-upem — Edytor i Tylko
      odczyt dostają `403 forbidden`), z audytem (`customer.anonymized` — aktor, identyfikator klienta, wynik `success` albo `failed`,
      `traceId`; bez wartości). Wymaga `If-Match` (`428` / `400` / `412`). Bez `Idempotency-Key`: powtórka to `409 already_anonymized`
      (bez drugiego obiektu w rejestrze). Dostępne także dla klienta usuniętego. Kolejność (jedna transakcja, wiersz klienta
      `SELECT … FOR UPDATE`): klient (`404` — także usunięty, dla Administratora jest widoczny), już zanonimizowany (`409 already_anonymized`
      — przed `If-Match`, więc powtórka po utracie odpowiedzi nie jest `412`), `If-Match` (`428` / `400` / `412`), niezamknięte zlecenia (`409 has_active_dependents` z `openWorkOrders`), POTEM zapis obiektu do rejestru
      usunięć (identyfikator klienta, kod operacji `customer_anonymized`, czas, aktor — bez żadnej wartości), dopiero potem zmiana w bazie.
      Rejestr niedostępny (brak konfiguracji, odmowa, brak odpowiedzi w terminie) — `503 deletion_register_unavailable`, dane i wersja bez
      zmian, audyt z wynikiem `failed`, usługa pozostaje zdrowa. Odpowiedź `200` ma nowy `ETag`.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      stepUp: true
      audit: true
    parameters:
      - $ref: '#/CustomerIdParameter'
      - $ref: ./work-orders.yaml#/IfMatchHeader
    responses:
      '200':
        description: Klient zanonimizowany.
        headers:
          ETag:
            description: Nowa wersja zasobu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
        content:
          application/json:
            schema:
              $ref: ../components/customers.yaml#/Customer
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/CustomerHasActiveDependents
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/responses.yaml#/DeletionRegisterUnavailable
