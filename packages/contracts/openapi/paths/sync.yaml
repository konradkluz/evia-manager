# Module `sync` (EVM-090; offline-sync.md, ADR-0021) and the configuration of the mobile client. Every operation is on the `mobile`
# channel for the Administrator and the Editor, authenticated by `Authorization: Bearer`, `Cache-Control: no-store`, and carries
# `x-evia-planned: true` until its story implements the route (client-config: done in EVM-094; changes: EVM-096; snapshot: EVM-097;
# mutations: EVM-098). Identity of the user and of the device always comes from the session — never from the request.
clientConfig:
  get:
    operationId: getClientConfig
    tags: [sync]
    summary: Konfiguracja klienta mobilnego
    description: >-
      Parametry pracy aplikacji zależne od serwera (ADR-0021 D7): okno braku kontaktu (domyślnie 7 dni), N dni zamkniętych zleceń w
      zakresie (30), okres kontrolnego resyncu (7), wersja reguły zakresu, minimalna i zalecana wersja aplikacji. Administrator i
      Edytor, kanał `mobile`, `Authorization: Bearer`; bez danych osobowych. Przed zalogowaniem minimalną wersję podaje publiczne
      `GET /api/health`. Jedyna operacja mobilna bez kontroli wersji (`426` nie dotyczy tej operacji — aplikacja musi móc odczytać
      minimalną wersję, żeby poprosić o aktualizację). `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [mobile]
    security:
      - mobileBearer: []
    parameters:
      - $ref: ../components/devices.yaml#/ClientPlatformHeader
      - $ref: ../components/devices.yaml#/ClientVersionHeader
    responses:
      '200':
        description: Konfiguracja.
        headers:
          Cache-Control:
            $ref: ../components/devices.yaml#/CacheControlNoStore
        content:
          application/json:
            schema:
              $ref: ../components/devices.yaml#/ClientConfig
            example:
              offlineContactWindowDays: 7
              closedWorkOrdersInScopeDays: 30
              periodicResyncDays: 7
              scopeRuleVersion: 1
              minSupportedVersion:
                android: 1.1.0
                ios: 1.1.0
              recommendedVersion:
                android: 1.1.0
                ios: 1.1.0
      '401':
        $ref: ../components/responses.yaml#/MobileSessionUnauthorized
      '403':
        $ref: ../components/responses.yaml#/MobileForbidden
      '429':
        $ref: ../components/responses.yaml#/MobileRateLimited
changes:
  get:
    operationId: getSyncChanges
    tags: [sync]
    summary: Pobranie zmian (strona zmian albo żądanie resyncu)
    description: >-
      Administrator i Edytor, kanał `mobile`. Kursor jest nieprzezroczysty i chroniony integralnie (ADR-0021 D6): niedekodowalny lub
      przeterminowany kursor daje `200 resync_required` (powód `cursor_invalid` / `cursor_expired`; także `periodic`, `scope_changed`,
      `access_changed`), kursor innego użytkownika lub urządzenia albo zmodyfikowany (zły tag przy znanym kluczu) daje `400 invalid_cursor`. Bez kursora zaczyna się faza migawki
      (pierwsze pobranie). `limit` 1–500, domyślnie 200; strona zmian najwyżej 1 MB. Zmiana to `upsert` (bieżący stan z `version`) albo
      `delete` (`type` + `id`, bez danych osobowych); projekcje zawierają wyłącznie pola z „Projekcja pól na telefonie”
      (`offline-sync.md`). `pendingItems` (opcjonalne, 0–1 000 000) to liczba niewysłanych elementów telefonu — informacyjnie.
      Zapytanie nie niesie `userId` ani `deviceId` (wynikają z sesji). `401 device_wipe_required`, gdy urządzenie ma zlecone
      wyczyszczenie (ma pierwszeństwo przed `session_revoked` i `unauthenticated`: blokada i wyczyszczenie unieważniają też rodzinę tokenów). Limit na użytkownika (`429` z `Retry-After`). Pełne pobranie (bez kursora, także po `resync_required`) jest limitowane na urządzenie (domyślnie 3 na kroczącą dobę → `429` z `Retry-After`); zwykłe pobieranie zmian nie. Odczyty synchronizacji NIE zasilają licznika różnych klientów (EVM-039). `limit` powyżej 500 jest ograniczany do 500.
      `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [mobile]
    security:
      - mobileBearer: []
    parameters:
      - $ref: ../components/devices.yaml#/ClientPlatformHeader
      - $ref: ../components/devices.yaml#/ClientVersionHeader
      - name: cursor
        in: query
        required: false
        description: Kursor ze strony poprzedniej (nieprzezroczysty). Brak = pierwsze pobranie.
        schema:
          $ref: ../components/sync.yaml#/SyncCursor
      - name: limit
        in: query
        required: false
        description: Liczba zmian na stronie (1–500, domyślnie 200).
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      - name: pendingItems
        in: query
        required: false
        description: Liczba niewysłanych elementów telefonu (informacyjnie).
        schema:
          $ref: ../components/sync.yaml#/SyncPendingItems
    responses:
      '200':
        description: Strona zmian albo żądanie resyncu (rozróżnia pole `result`).
        headers:
          Cache-Control:
            $ref: ../components/devices.yaml#/CacheControlNoStore
        content:
          application/json:
            schema:
              $ref: ../components/sync.yaml#/SyncChangesResponse
            examples:
              changes:
                value:
                  result: changes
                  phase: changes
                  changes:
                    - op: upsert
                      entity:
                        type: customer
                        id: 0193a000-0000-7000-8000-0000000000c1
                        version: 3
                        kind: person
                        displayName: Anna Przykładowa
                        phone: '+48500000001'
                    - op: delete
                      type: timeline_entry
                      id: 0193a000-0000-7000-8000-0000000000e1
                  cursor: EXAMPLE_cursor_not_real_0123456789abcdef
                  hasMore: false
                  serverTime: '2026-10-27T08:00:00Z'
              resync_required:
                value:
                  result: resync_required
                  reason: periodic
                  serverTime: '2026-10-27T08:00:00Z'
      '400':
        $ref: ../components/responses.yaml#/MobileSyncBadRequest
      '401':
        $ref: ../components/responses.yaml#/MobileSessionUnauthorized
      '403':
        $ref: ../components/responses.yaml#/MobileForbidden
      '426':
        $ref: ../components/responses.yaml#/MobileClientVersionUnsupported
      '429':
        $ref: ../components/responses.yaml#/MobileRateLimited
workOrder:
  get:
    operationId: getSyncWorkOrder
    tags: [sync]
    summary: Migawka agregatu zlecenia dla telefonu
    description: >-
      Administrator i Edytor, kanał `mobile`. Bieżący agregat zlecenia w projekcji dla telefonu (zlecenie, zakres, procesy i etapy,
      wpisy, klient, lokalizacja, strony, nazwy użytkowników, metadane mediów), każdy obiekt z `version`. Polityka obiektowa:
      zakres urządzenia (ADR-0021 D3) przy KAŻDYM odczycie. Zlecenie nieistniejące, usunięte, poza zakresem albo bez dostępu → jednakowe
      `404 not_found` (nie `403`: istnienie jest informacją, ochrona przed IDOR). Podlega limitowi na użytkownika i licznikowi masowego
      odczytu (P10, insider): limit 120 żądań na godzinę na urządzenie (liczone także żądania kończące się `404`), powyżej `429` z `Retry-After`.
      Ta sama projekcja i ten sam czytnik agregatu co pierwsze pobranie. Zły format identyfikatora → `400 validation_failed`.
      `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [mobile]
      policy: sync.deviceScope
      anchor: path.workOrderId
    security:
      - mobileBearer: []
    parameters:
      - $ref: ../components/devices.yaml#/ClientPlatformHeader
      - $ref: ../components/devices.yaml#/ClientVersionHeader
      - name: workOrderId
        in: path
        required: true
        description: Identyfikator zlecenia (UUID).
        schema:
          $ref: ../components/sync.yaml#/SyncId
    responses:
      '200':
        description: Migawka zlecenia.
        headers:
          Cache-Control:
            $ref: ../components/devices.yaml#/CacheControlNoStore
        content:
          application/json:
            schema:
              $ref: ../components/sync.yaml#/SyncWorkOrderSnapshot
            example:
              serverTime: '2026-10-27T08:00:00Z'
              entities:
                - type: work_order
                  id: 0193a000-0000-7000-8000-0000000000b1
                  version: 2
                  number: ZL-2026-0042
                  title: Wallbox w garażu
                  status: in_progress
                  customerId: 0193a000-0000-7000-8000-0000000000c1
                  siteId: 0193a000-0000-7000-8000-0000000000f1
                  coordinatorUserId: 0193a000-0000-7000-8000-0000000000a1
                  description: null
                  plannedDate: '2026-11-03'
                  createdAt: '2026-10-20T07:00:00Z'
                  closedAt: null
                - type: user
                  id: 0193a000-0000-7000-8000-0000000000a1
                  version: 1
                  displayName: Jan Przykładowy
      '401':
        $ref: ../components/responses.yaml#/MobileSessionUnauthorized
      '403':
        $ref: ../components/responses.yaml#/MobileForbidden
      '400':
        $ref: ../components/responses.yaml#/MobileSyncBadRequest
      '404':
        $ref: ../components/responses.yaml#/MobileNotFound
      '426':
        $ref: ../components/responses.yaml#/MobileClientVersionUnsupported
      '429':
        $ref: ../components/responses.yaml#/MobileRateLimited
mutations:
  post:
    operationId: pushSyncMutations
    tags: [sync]
    summary: Wysłanie partii mutacji z kolejki telefonu
    description: >-
      Administrator i Edytor, kanał `mobile`. Partia 1–50 mutacji w kolejności kolejki (`CreateNote`, `CreateComment`,
      `CreateQuickWorkOrder`); każda: `mutationId` (UUIDv7 — klucz idempotencji), `type`, `commandVersion`, `payload`, najwyżej 64 KB
      (egzekwuje serwer, EVM-098; treść partii najwyżej 1 MB → `413 payload_too_large`). Wynik per mutacja: `applied`, `duplicate`
      (ta sama mutacja już zastosowana), `conflict` (`id_conflict`) albo `rejected` z kodem (`forbidden`, `target_unavailable`,
      `validation_failed`, `idempotency_mismatch`, `idempotency_in_progress`, `template_unavailable`) i ostrzeżeniami
      (`captured_at_out_of_range`, `idempotency_expired`). Zła koperta lub partia → `400`; zły ładunek albo nieznany `type` to wynik
      JEDNEJ mutacji (`rejected` `validation_failed`), nie `400` całej partii. Sesja lub urządzenie unieważnione → `401` dla całej
      partii (`session_revoked`, `device_wipe_required`; wyczyszczenie ma pierwszeństwo). Autoryzacja mutacji następuje w chwili zastosowania (rola, polityka
      obiektowa). Treść nie niesie `userId` ani `deviceId`. `pendingItems` — informacyjnie. `Cache-Control: no-store`; limit 60
      żądań na minutę na urządzenie (partia to jedno żądanie, obok limitu na użytkownika), powyżej `429` z `Retry-After` bez skutków.
      `CreateQuickWorkOrder` do EVM-099 → `rejected` `validation_failed`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [mobile]
      audit: true
    security:
      - mobileBearer: []
    parameters:
      - $ref: ../components/devices.yaml#/ClientPlatformHeader
      - $ref: ../components/devices.yaml#/ClientVersionHeader
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/sync.yaml#/SyncMutationsRequest
          example:
            pendingItems: 2
            mutations:
              - mutationId: 0193a000-0000-7000-8000-000000000a01
                type: CreateNote
                commandVersion: 1
                payload:
                  id: 0193a000-0000-7000-8000-000000000a02
                  workOrderId: 0193a000-0000-7000-8000-0000000000b1
                  noteCategory: site_visit
                  body: Sprawdzono miejsce pod wallbox.
                  capturedAt: '2026-10-27T07:55:00Z'
              - mutationId: 0193a000-0000-7000-8000-000000000a03
                type: CreateComment
                commandVersion: 1
                payload:
                  id: 0193a000-0000-7000-8000-000000000a04
                  workOrderId: 0193a000-0000-7000-8000-0000000000b1
                  body: Klient prosi o telefon przed wizytą.
                  capturedAt: '2026-10-27T07:56:00Z'
    responses:
      '200':
        description: Wyniki per mutacja, w kolejności żądania.
        headers:
          Cache-Control:
            $ref: ../components/devices.yaml#/CacheControlNoStore
        content:
          application/json:
            schema:
              $ref: ../components/sync.yaml#/SyncMutationsResponse
            example:
              serverTime: '2026-10-27T08:00:00Z'
              results:
                - mutationId: 0193a000-0000-7000-8000-000000000a01
                  outcome: applied
                - mutationId: 0193a000-0000-7000-8000-000000000a03
                  outcome: rejected
                  code: target_unavailable
                  warnings: [captured_at_out_of_range]
      '400':
        $ref: ../components/responses.yaml#/MobileValidationFailed
      '401':
        $ref: ../components/responses.yaml#/MobileSessionUnauthorized
      '403':
        $ref: ../components/responses.yaml#/MobileForbidden
      '413':
        $ref: ../components/responses.yaml#/MobilePayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/MobileUnsupportedMediaType
      '426':
        $ref: ../components/responses.yaml#/MobileClientVersionUnsupported
      '429':
        $ref: ../components/responses.yaml#/MobileRateLimited
