# Module `timeline` — the journal of a work order: notes and comments (EVM-037; W-08 "Dziennik"). Append-only: there is no PATCH or PUT of an
# entry; a correction is a new entry that points at the old one (`supersedesEntryId`). The Administrator alone hides an entry (`DELETE`, soft
# delete, reversible with `restore`) and redacts its text (`redact`, irreversible; EVM-040).
TimelineEntryIdParameter:
  name: entryId
  in: path
  required: true
  description: Identyfikator wpisu dziennika (UUID).
  schema:
    type: string
    format: uuid
    maxLength: 36
workOrderTimeline:
  get:
    operationId: listTimelineEntries
    tags: [timeline]
    summary: Dziennik zlecenia — oś czasu od najnowszych wpisów (kursor, filtry)
    description: >-
      Oś czasu „Dziennik” W-06 / W-08 (EVM-037 AC6; SR-AUTHZ-02, SR-AUTHZ-05, SR-DATA-03, SR-API-02, SR-API-04). Role
      Administrator, Edytor i Tylko odczyt, kanał `web` (token mobilny — `403 channel_not_allowed`; telefon dostanie dziennik z
      synchronizacją, M2), bez audytu odczytu. Zlecenie jest rozwiązywane najpierw, przez politykę odczytu w zapytaniu:
      nieistniejące i usunięte (także dla Administratora) — jedna odpowiedź `404 not_found`. Wpisy zlecenia w kolejności
      `createdAt` serwera malejąco, potem `id` malejąco; wpisy usunięte nie występują (warunek w zapytaniu, nie w odsiewaniu
      strony) — poza `includeDeleted=true` Administratora (EVM-040), który widzi je z `deletedAt`. Filtry łączą się przez AND: `kind` (`note` albo `comment`) i `procedureStageId` (UUID etapu; etap innego zlecenia
      albo nieistniejący daje pustą listę — filtr nie jest sprawdzeniem istnienia). `limit` 1–100 (domyślnie 25), zły `limit`
      albo `kind` spoza listy — `400 validation_failed`; nieznany parametr — `400 unknown_parameter`, powtórzony — `400
      duplicate_parameter`. Paginacja kursorem nieprzezroczystym (`nextCursor`; bez licznika wyników): zmieniony, wygasły (30
      minut), wydany komu innemu albo użyty z innymi filtrami lub dla innego zlecenia — `400 invalid_cursor`. Pozycja ma autora
      jako `{id, displayName}` i nazwę etapu (nazwy ze wsadowych zapytań, stała liczba zapytań na stronę), `supersededByEntryId`
      i `redactedAt`. Treść wpisu może zawierać dane osobowe — panel wyświetla ją jako tekst. `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - name: kind
        in: query
        required: false
        description: Filtr rodzaju — `note` („Wpisy”) albo `comment` („Komentarze”).
        schema:
          $ref: ../components/timeline.yaml#/TimelineEntryInputKind
      - name: eventGroup
        in: query
        required: false
        description: >-
          Grupa zdarzeń automatycznych (EVM-038 AC4) — `status_changes` („Zmiany statusów”): tylko zdarzenia zlecenia i etapów;
          `payments` („Płatności”, EVM-054 AC3): tylko zmiany statusu transz (grupy są rozłączne). Implikuje `kind = event`, więc
          razem z `kind` — `400 validation_failed`; wartość spoza listy — `400`. Grupa „Media i dokumenty” dojdzie z E6.
        schema:
          $ref: ../components/timeline.yaml#/TimelineEventGroup
      - name: includeDeleted
        in: query
        required: false
        description: >-
          Pokaż także wpisy usunięte (EVM-040 AC1) — wyłącznie Administrator; Edytor i Tylko odczyt z `includeDeleted=true` dostają `403
          forbidden` (parametr nie jest po cichu ignorowany). Kursor jest związany z tym filtrem.
        schema:
          type: boolean
          default: false
      - name: procedureStageId
        in: query
        required: false
        description: Filtr etapu (UUID). Nie trafia do adresu panelu.
        schema:
          type: string
          format: uuid
          maxLength: 36
      - name: limit
        in: query
        required: false
        description: Liczba pozycji na stronie.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        description: Kursor ze strony poprzedniej (`nextCursor`) — wartość nieprzezroczysta.
        schema:
          type: string
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
    responses:
      '200':
        description: Strona dziennika (pusta lista to pusta tablica `items` i `nextCursor` równy `null`).
        content:
          application/json:
            schema:
              $ref: ../components/timeline.yaml#/TimelineEntryList
      '400':
        $ref: ../components/responses.yaml#/InvalidListQuery
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  post:
    operationId: createTimelineEntry
    tags: [timeline]
    summary: Dziennik zlecenia — nowy wpis, komentarz albo poprawka wpisu
    description: >-
      Dodanie wpisu (`note`), komentarza (`comment`) albo poprawki wpisu (EVM-037 AC1–AC5, AC7, AC8; SR-AUTHZ-02, SR-AUTHZ-04,
      SR-AUTHZ-05, SR-INPUT-01, SR-INPUT-05, SR-API-05, SR-DATA-02, SR-LOG-02, SR-LOG-03). Role Administrator i Edytor (Tylko
      odczyt — `403 forbidden` przed treścią i przed zapisem rekordu idempotencji, dla dowolnej treści; niezalogowany — `401`;
      token mobilny — `403 channel_not_allowed`), kanał `web`, z audytem (`timeline_entry.created` — aktor, identyfikator wpisu,
      wynik i `traceId`; bez treści, kategorii i nazwy etapu). Wymaga `X-CSRF-Token` i `Idempotency-Key` (UUIDv7; brak — `400
      validation_failed`, `/headers/Idempotency-Key`). Zlecenie Rozliczone albo Anulowane PRZYJMUJE wpis („nic nie ginie”, PO-8).
      Kolejność: guard (rola, CSRF, kanał), ścieżka (`400`), zlecenie przez politykę odczytu w zapytaniu (`404` — to samo dla
      nieistniejącego i usuniętego, przed nagłówkiem i treścią), nagłówek i treść schematem i regułami (`400`: kody i
      wskaźniki, nigdy wartość), powtórka
      idempotentna, etap tego zlecenia (`400`, `/procedureStageId`, `unknown_stage` — etap innego, nieistniejący i usunięty to ta
      sama odpowiedź), poprawiany wpis (`400`, `/supersedesEntryId`, `unknown_entry` — wpis innego zlecenia, nieistniejący,
      usunięty i zdarzenie to ta sama odpowiedź; już poprawiony — `409 entry_superseded`), zapis `INSERT`, audyt i rekord
      idempotencji w jednej transakcji; błąd któregokolwiek kroku cofa całość. Treść ścisła `CreateTimelineEntryRequest`: pole
      spoza schematu — `400 unknown_field`, pole serwera (`author`, `createdAt`, `origin`, `capturedAt`, `supersededByEntryId`,
      `redactedAt`, `version`, `workOrderId`) — `400 read_only_field`, `kind: event` — `400`. `body`: NFC, CRLF → LF, znaki
      sterujące (poza nową linią) usuwane, przycięcie, 1–10 000 znaków po normalizacji (`required` / `too_long`, bez wartości).
      `noteCategory` jest wymagane dla `note` i niedozwolone dla `comment`. `id` (UUIDv7) nadaje klient; istniejące `id` (także
      wpisu innego zlecenia) — `409 id_conflict` bez danych istniejącego wpisu. Poprawka (`supersedesEntryId`) ma ten sam `kind`
      co poprawiany wpis; poprawiać może każdy Administrator i Edytor, a autor poprawki jest widoczny (poprzednia treść
      zostaje dostępna). Brak operacji zmiany albo usunięcia treści wpisu. Idempotencja (api-guidelines.md → Idempotencja): klucz
      jest związany z użytkownikiem, metodą, szablonem ścieżki I identyfikatorem zlecenia — ten sam klucz i treść dla innego
      zlecenia to `422 idempotency_mismatch`. Powtórka (ten sam klucz, zlecenie i treść) — `201` z bieżącą reprezentacją wpisu i
      `Idempotent-Replayed: true`, bez drugiego wpisu i drugiego zdarzenia audytu; równoległe żądanie z tym samym kluczem — `409
      idempotency_in_progress` z `Retry-After`. Limity: treść do 64 KB (`413`), ogólny limit żądań na adres IP.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - name: Idempotency-Key
        in: header
        required: true
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika; ponowienie używa tego samego klucza i `id`.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/timeline.yaml#/CreateTimelineEntryRequest
    responses:
      '201':
        description: >-
          Wpis zapisany (albo powtórka wcześniejszego zapisu — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          Location:
            description: Adres wpisu (`/api/v1/work-orders/{workOrderId}/timeline/{entryId}`).
            schema:
              type: string
              maxLength: 200
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key`, zleceniem i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/timeline.yaml#/TimelineEntry
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/TimelineConflict
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/IdempotencyMismatch
      '429':
        $ref: ../components/responses.yaml#/RateLimited
timelineEntry:
  get:
    operationId: getTimelineEntry
    tags: [timeline]
    summary: Dziennik zlecenia — jeden wpis
    description: >-
      Pojedynczy wpis dziennika (EVM-037 AC7, AC8; SR-AUTHZ-02, SR-AUTHZ-05). Role Administrator, Edytor i Tylko odczyt, kanał
      `web`, bez audytu odczytu. Wpis jest wyszukiwany warunkiem `id = {entryId} AND work_order_id = {workOrderId}` w jednym
      zapytaniu: wpis innego zlecenia, nieistniejący, usunięty (dla Edytora i Tylko odczyt) oraz wpis zlecenia nieistniejącego albo
      usuniętego (także dla Administratora) to jedna odpowiedź `404 not_found`. Administrator czyta także wpis usunięty (EVM-040 AC1) —
      z `deletedAt`. Odpowiedź `200` ma `ETag` wpisu (`"<version>"`) — wersję do `If-Match` usunięcia, przywrócenia i redakcji.
      `Cache-Control: no-store`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/TimelineEntryIdParameter'
    responses:
      '200':
        description: Wpis dziennika.
        headers:
          ETag:
            description: Wersja wpisu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
        content:
          application/json:
            schema:
              $ref: ../components/timeline.yaml#/TimelineEntry
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  delete:
    operationId: deleteTimelineEntry
    tags: [timeline]
    summary: Usunięcie wpisu z dziennika (tylko Administrator)
    description: >-
      Ukrycie wpisu — soft delete, odwracalne przez `restoreTimelineEntry` (EVM-040 AC1, AC4, AC5, AC6; SR-PRIV-03, SR-AUTHZ-02,
      SR-AUTHZ-05, SR-API-05, SR-API-07, SR-LOG-03). Tylko Administrator (Edytor i Tylko odczyt — `403 forbidden` przed `If-Match` i
      sprawdzeniem istnienia; niezalogowany — `401`; token mobilny — odmowa kanału), kanał `web`, z audytem (`timeline_entry.deleted` —
      aktor, identyfikator wpisu, wynik i `traceId`; bez treści). Wymaga `X-CSRF-Token` i `If-Match` (silny ETag `"<version>"` wpisu z
      `getTimelineEntry`): brak — `428 precondition_required`, zniekształcony — `400`, nieaktualna wersja — `412 version_conflict`.
      Kolejność: zlecenie (polityka odczytu, `404`), powtórka idempotentna, wpis tego zlecenia (`id AND work_order_id AND deleted_at is
      null` — wpis innego zlecenia, nieistniejący i już usunięty to jedna odpowiedź `404`, przed `If-Match`), zdarzenie
      automatyczne (`409 entry_is_event`), `If-Match` (`428` / `400`), wersja (`412`). Po usunięciu wpis znika z dziennika Edytora i Tylko odczyt (lista, odczyt po `id`
      — `404`), Administrator widzi go z `deletedAt`. Wersja wpisu rośnie o jeden. Powtórka z tym samym `Idempotency-Key` — `204` z
      `Idempotent-Replayed: true`.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/TimelineEntryIdParameter'
      - $ref: ./work-orders.yaml#/IfMatchHeader
      - $ref: ./work-orders.yaml#/IdempotencyKeyHeader
    responses:
      '204':
        description: >-
          Wpis usunięty (albo powtórka wcześniejszego usunięcia — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key`, wpisem i zleceniem.'
            schema:
              type: string
              enum: ['true']
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/TimelineEraseConflict
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/responses.yaml#/TimelineBusy
timelineEntryRestore:
  post:
    operationId: restoreTimelineEntry
    tags: [timeline]
    summary: Przywrócenie usuniętego wpisu (tylko Administrator)
    description: >-
      Przywrócenie wpisu usuniętego przez `deleteTimelineEntry` (EVM-040 AC1, AC4, AC6; SR-AUTHZ-02, SR-AUTHZ-05, SR-API-05, SR-API-07,
      SR-LOG-03). Tylko Administrator, kanał `web`, bez uwierzytelnienia kluczem dostępu (cofnięcie ukrycia jest tak samo odwracalne jak
      ukrycie), z audytem (`timeline_entry.restored` — osobna akcja, bez treści). Wymaga `X-CSRF-Token` i `If-Match` (silny ETag
      usuniętego wpisu z `getTimelineEntry`): brak — `428`, zniekształcony — `400`, nieaktualna wersja — `412`. Wpis jest wyszukiwany
      warunkiem `id AND work_order_id AND deleted_at is not null`: wpis innego zlecenia, nieistniejący i nieusunięty to jedna odpowiedź
      `404`, przed `If-Match`. Przywrócony wpis wraca na swoje miejsce na osi czasu (kolejność wg `createdAt`). Odpowiedź `200` ma `ETag`
      wpisu. Powtórka z tym samym `Idempotency-Key` — `200` z bieżącą reprezentacją i `Idempotent-Replayed: true`.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/TimelineEntryIdParameter'
      - $ref: ./work-orders.yaml#/IfMatchHeader
      - $ref: ./work-orders.yaml#/IdempotencyKeyHeader
    responses:
      '200':
        description: >-
          Wpis przywrócony (albo powtórka wcześniejszego przywrócenia — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Nowa wersja wpisu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key`, wpisem i zleceniem.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/timeline.yaml#/TimelineEntry
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/TimelineEraseConflict
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/responses.yaml#/TimelineBusy
timelineEntryRedact:
  post:
    operationId: redactTimelineEntry
    tags: [timeline]
    summary: Redakcja treści wpisu (tylko Administrator, ze step-upem)
    description: >-
      Trwałe zastąpienie treści wpisu znacznikiem „Treść usunięta przez administratora DD.MM.RRRR.” (data w strefie Europe/Warsaw) — wyjątek
      od zasady tylko do dopisywania, niecofalny (EVM-040 AC2, AC3, AC4, AC5, AC6; SR-PRIV-03, SR-PRIV-04, SR-SESS-08, SR-AUTHZ-02,
      SR-AUTHZ-05, SR-API-07, SR-LOG-03, SR-DATA-08). Tylko Administrator, kanał `web`, z `X-CSRF-Token`, z uwierzytelnieniem kluczem
      dostępu w ciągu ostatnich 15 minut (`403 step_up_required`; rola przed step-upem — Edytor i Tylko odczyt dostają `403 forbidden`),
      z audytem (`timeline_entry.redacted` — aktor, identyfikator wpisu, wynik `success` albo `failed`, `traceId`; bez treści). Wymaga
      `If-Match` (silny ETag wpisu): brak — `428`, zniekształcony — `400`, nieaktualna wersja — `412 version_conflict`. Kolejność: zlecenie
      (`404`), wpis tego zlecenia (`id AND work_order_id`, także usunięty — dane osobowe usuniętego wpisu nadal są w bazie; wpis innego
      zlecenia i nieistniejący to jedna odpowiedź `404`) zablokowany `FOR NO KEY UPDATE`, zdarzenie automatyczne (`409 entry_is_event`),
      `If-Match` (`428` / `400`), wersja (`412`), treść już zredagowana (`409 already_redacted`), POTEM zapis obiektu do rejestru usunięć (identyfikator wpisu,
      kod operacji, czas, aktor — bez treści), dopiero potem zmiana w bazie. Rejestr niedostępny — `503 deletion_register_unavailable`,
      treść i wersja bez zmian. Wersja wpisu rośnie o jeden; metadane (autor, czas, rodzaj, kategoria, etap, powiązanie z poprawką) i
      miejsce wpisu na osi czasu zostają. Odpowiedź `200` ma `ETag` wpisu i `redactedAt`; zredagowany wpis można usunąć i przywrócić.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      stepUp: true
      audit: true
    parameters:
      - $ref: ./work-orders.yaml#/WorkOrderIdParameter
      - $ref: '#/TimelineEntryIdParameter'
      - $ref: ./work-orders.yaml#/IfMatchHeader
    responses:
      '200':
        description: Wpis ze zredagowaną treścią.
        headers:
          ETag:
            description: Nowa wersja wpisu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
        content:
          application/json:
            schema:
              $ref: ../components/timeline.yaml#/TimelineEntry
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/TimelineEraseConflict
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
      '503':
        $ref: ../components/responses.yaml#/DeletionRegisterUnavailable
