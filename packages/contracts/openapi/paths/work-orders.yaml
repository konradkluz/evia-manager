# Module `work-orders` — the list of work orders (EVM-017; W-10) and the creation of an order from a template (EVM-022; W-05).
workOrders:
  get:
    operationId: listWorkOrders
    tags: [work-orders]
    summary: Lista zleceń (kursor, filtry, widoki, sortowanie)
    description: >-
      Role Administrator, Edytor i Tylko odczyt, kanał `web` (mobile — M2), bez audytu odczytu (masowy odczyt pilnuje licznik
      poniżej). Zlecenia usunięte (soft delete) nie występują w wyniku — warunek jest w zapytaniu, nie w odsiewaniu strony.
      Wszystkie filtry łączą się przez AND: `status` (lista po przecinku, do 8 różnych wartości z zamkniętej listy), `view`
      (`all_open` albo `mine`; brak = bez predykatu widoku), `coordinatorId` (UUID; nieistniejący identyfikator daje pustą listę),
      `customerId` (UUID klienta — „Historia zleceń” w W-14, EVM-039; ta sama polityka odczytu i paginacja; nieistniejący klient daje
      pustą listę, bo filtr nie jest sprawdzeniem istnienia klienta; zlecenia usuniętego klienta pozostają widoczne jak na liście zleceń — decyzja w EVM-041).
      `mine` bierze opiekuna wyłącznie z sesji — parametru z identyfikatorem użytkownika nie ma. `sort`: `-number` (domyślne),
      `number`, `-createdAt`, `createdAt`, `longestWaitingSince`, `nextDueDate`, `urgency` (trzy ostatnie tylko rosnąco); wartość spoza listy,
      zły `limit` (1–100, domyślnie 25) albo zły format `status` — `400 validation_failed`; nieznany parametr —
      `400 unknown_parameter`, powtórzony — `400 duplicate_parameter`.
      „Czekamy na…” (EVM-034): `waitingOn` (`customer` albo `party`), `waitingOnPartyKind` (rodzaj strony; bez `waitingOn` oznacza
      `party`, razem z `waitingOn=customer` — `400 validation_failed` na `/waitingOnPartyKind`) i `waitingLongerThanDays` (1–365;
      zlecenie ma etap oczekujący dłużej niż tyle dni). Widok `waiting_on_dso_over_14_days` to „Czekamy na OSD > 14 dni”
      (niezamknięte; łączy się przez AND z pozostałymi filtrami). Dzień „dziś” to dzień `Europe/Warsaw` z zegara serwera; kolejne
      strony liczą go z kursora (`asOf`), więc zmiana dnia nie miesza stron. Parametry w adresie to wyłącznie kody i liczby.
      Element listy ma pola tylko do odczytu `waiting`, `nextDueDate` i `hasOverdueStage` oraz (EVM-072) `customer` i `site` (adres i, od EVM-043, kod typu obiektu `siteType`).
      `siteType` (typ obiektu) i `templateId` (szablon) zawężają listę przez AND; to kody i UUID katalogu, nie dane osobowe.
      Płatności (EVM-056): widoki `overdue_payments` i `unpaid`, sortowanie `urgency` („Najpilniejsze”) i pole elementu `payment`
      wymagają prawa odczytu płatności (`restrictedParams` w `x-evia-authz`; v1: wszystkie trzy role). Bez niego widok płatności
      daje `403 forbidden` (po walidacji, przed odczytem), `urgency` liczy kolejność bez składowej płatności, a pole `payment` nie
      występuje. Domyślne sortowanie API się nie zmienia (`-number`); panel wysyła `sort=urgency` jawnie.
      Frazy wyszukiwania w adresie nie ma (SR-API-04): do tego służy `searchWorkOrders`. Lista czyta model odczytu (`overview`),
      kontrakt operacji — ścieżka, `operationId`, tag i `x-evia-authz` — jest bez zmian.
      Paginacja kursorem nieprzezroczystym (`nextCursor`; bez licznika wyników): zmieniony, wygasły (30 minut), wydany komu innemu
      albo użyty z innymi filtrami lub sortowaniem — `400 invalid_cursor`. Masowy odczyt (P10): gdy użytkownik dostał w ostatnich
      10 minutach co najmniej 2000 rekordów, powstaje alert bezpieczeństwa; od 10 000 rekordów — `429 rate_limited` z `Retry-After`
      (sekundy) do chwili, gdy suma spadnie poniżej progu. Odrzucone żądania nie są liczone.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      restrictedParams:
        paymentMilestone.read:
          params:
            view: [overdue_payments, unpaid]
            sort: [urgency]
          fields: [payment]
    parameters:
      - name: status
        in: query
        required: false
        description: Statusy po przecinku (np. `new,quoting`), bez duplikatów znaczenia; pusty element jest błędem.
        schema:
          type: string
          maxLength: 120
          pattern: '^[a-z_]+(,[a-z_]+){0,19}$'
      - name: view
        in: query
        required: false
        description: Widok (`all_open` albo `mine`).
        schema:
          $ref: ../components/work-orders.yaml#/WorkOrderView
      - name: coordinatorId
        in: query
        required: false
        description: Filtr opiekuna (UUID; „Więcej filtrów”). Nie trafia do adresu panelu.
        schema:
          type: string
          format: uuid
          maxLength: 36
      - name: customerId
        in: query
        required: false
        description: Filtr klienta (UUID; historia zleceń klienta). Nie trafia do adresu panelu.
        schema:
          type: string
          format: uuid
          maxLength: 36
      - name: siteType
        in: query
        required: false
        description: Filtr typu obiektu lokalizacji (kod słownika; „Więcej filtrów”, EVM-072). Nie trafia do adresu panelu.
        schema:
          $ref: ../components/catalog.yaml#/SiteType
      - name: templateId
        in: query
        required: false
        description: Filtr szablonu, z którego powstało zlecenie (UUID; „Więcej filtrów”, EVM-072). Nie trafia do adresu panelu.
        schema:
          type: string
          format: uuid
          maxLength: 36
      - name: waitingOn
        in: query
        required: false
        description: Czekamy na klienta (`customer`) albo na stronę (`party`). Tylko kod.
        schema:
          $ref: ../components/work-orders.yaml#/WorkOrderWaitingOnFilter
      - name: waitingOnPartyKind
        in: query
        required: false
        description: Rodzaj strony, na którą czekamy (kod; nie razem z `waitingOn=customer`). Nie trafia do adresu panelu jako identyfikator strony.
        schema:
          $ref: ../components/catalog.yaml#/PartyKind
      - name: waitingLongerThanDays
        in: query
        required: false
        description: Czekamy dłużej niż tyle dni (liczba całkowita 1–365).
        schema:
          type: integer
          minimum: 1
          maximum: 365
      - name: sort
        in: query
        required: false
        description: Sortowanie (domyślnie `-number`).
        schema:
          $ref: ../components/work-orders.yaml#/WorkOrderSort
      - name: limit
        in: query
        required: false
        description: Liczba pozycji na stronie.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        description: Kursor ze strony poprzedniej (`nextCursor`) — wartość nieprzezroczysta.
        schema:
          type: string
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
    responses:
      '200':
        description: Strona zleceń (pusta lista to pusta tablica `items` i `nextCursor` równy `null`).
        content:
          application/json:
            schema:
              $ref: ../components/work-orders.yaml#/WorkOrderList
      '400':
        $ref: ../components/responses.yaml#/InvalidListQuery
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  post:
    operationId: createWorkOrder
    tags: [work-orders]
    summary: Utworzenie zlecenia z szablonu (albo pustego)
    description: >-
      Role Administrator i Edytor (Tylko odczyt — `403 forbidden` dla dowolnej treści, także pustej i nieprawidłowej; niezalogowany —
      `401`), kanał `web`, z audytem (`work_order.created` — identyfikatory, bez tytułu i opisu). Wymaga `X-CSRF-Token`.
      Jedna transakcja: klient i lokalizacja (odczyt przez fasady modułów, tą samą transakcją co zapis) → szablon → numer z licznika
      rocznego (`ZL-RRRR-NNNN`, rok wg `Europe/Warsaw`, bez luk: wycofanie transakcji cofa zużycie numeru) → zlecenie w statusie
      `new` → pozycje zakresu skopiowane z szablonu (kod, nazwa, zestaw i parametry domyślne, ilość) → opiekun (`coordinator`) →
      kontrybutorzy kompozycji (procesy — EVM-031, transze — EVM-053) → audyt; błąd któregokolwiek kroku cofa całość (nie powstaje
      zlecenie, pozycja, przypisanie, wpis audytu ani rekord idempotencji, numer nie jest zużyty). `customerId` albo `siteId`
      nieistniejące lub usunięte (także dla Administratora) — `404 not_found`, ta sama odpowiedź w obu przypadkach;
      `templateId` wycofany albo nieistniejący — `422 template_unavailable`; `assigneeUserId` spoza aktywnych użytkowników —
      `400 validation_failed` (`/assigneeUserId`, `assignee_unavailable`). Pole spoza schematu — `400 unknown_field`, pole serwera
      (`number`, `status`, `scopeItems` …) — `400 read_only_field`; błędy to wskaźnik i kod, nigdy wartość. `id` (UUIDv7)
      nadaje klient; istniejące `id` (także zlecenia usuniętego) — `409 id_conflict` bez danych istniejącego zasobu.
      Idempotencja (api-guidelines.md → Idempotencja): `Idempotency-Key` (UUIDv7) jest opcjonalny; panel wysyła go zawsze, a przy
      ponowieniu używa tego samego `id` i klucza. Powtórka (ten sam klucz i treść) — to samo zlecenie z tym samym numerem,
      bieżąca reprezentacja i `Idempotent-Replayed: true`, bez nowego zdarzenia audytu; ten sam klucz z inną treścią albo na innej
      operacji — `422 idempotency_mismatch`; równoległe żądanie z tym samym kluczem — `409 idempotency_in_progress` z `Retry-After`.
      Klucz obowiązuje 30 dni, osobno dla każdego użytkownika.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: true
    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/work-orders.yaml#/CreateWorkOrderRequest
    responses:
      '201':
        description: >-
          Zlecenie utworzone (albo powtórka wcześniejszego zapisu — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Wersja zasobu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key` i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/work-orders.yaml#/WorkOrder
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/ResourceConflict
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/CreateWorkOrderUnprocessable
      '429':
        $ref: ../components/responses.yaml#/RateLimited
workOrdersSearch:
  post:
    operationId: searchWorkOrders
    tags: [work-orders]
    summary: Wyszukiwanie zleceń (fraza w treści)
    description: >-
      Role Administrator, Edytor i Tylko odczyt, kanał `web`, bez audytu odczytu. To `POST`, bo fraza może zawierać dane osobowe i
      nie może trafić do adresu URL, logów dostępu ani historii przeglądarki (SR-API-04); wymaga `X-CSRF-Token`, nie wymaga
      `Idempotency-Key`. Wielkość liter i polskie znaki nie mają znaczenia („Lodz” znajduje zlecenie w Łodzi). Fraza dopasowuje
      numer i tytuł zlecenia, dane klienta (imię, nazwisko, firma, NIP, cyfry telefonu, e-mail, miasto — jak `searchCustomers`)
      i adres lokalizacji; wynik to ta sama koperta `{items, nextCursor}` co lista. Pozostałe pola treści to filtry listy
      (łączą się z frazą przez AND), a `cursor` i `limit` są w treści; kursor jest związany z frazą, filtrami i użytkownikiem,
      a kursor listy nie otwiera się w wyszukiwaniu (i odwrotnie) — `400 invalid_cursor`. Zlecenia usunięte (soft delete) nie
      występują: warunek polityki odczytu jest w zapytaniu strony, a zbiory identyfikatorów z modułów klientów i lokalizacji tylko
      je zawężają. Klient usunięty nie jest znajdowany po nazwisku, a element zlecenia nie niesie jego danych (`customer`
      `{deleted: true}`). Fraza krótsza niż 3 znaki po normalizacji — `400 validation_failed`, kod `too_short` (dłuższa niż
      100 — `too_long`, znak sterujący — `invalid_characters`); fraza zbyt ogólna (ponad 10 000 trafień w jednym ze źródeł) —
      `400 validation_failed`, kod `too_broad` na `/query` (należy ją doprecyzować). Limit 60 wyszukiwań na minutę na użytkownika
      (`429 rate_limited` z `Retry-After`; liczy się każde wyszukiwanie, także odrzucone przez walidację); wyniki wliczają się do
      progu masowego odczytu (P10: alert przy 2000 rekordów w 10 minut, `429` od 10 000) i do licznika różnych klientów (alert
      przy 301. różnym kliencie w ciągu godziny). Fraza nie trafia do logów, metryk ani `errors[]`. Widoki płatności, `urgency`
      i pole `payment` — jak w `listWorkOrders` (EVM-056). Pole tylko do odczytu elementu listy (`id`, `number`, `payment` …)
      w treści — `400 read_only_field` (nie `unknown_field`).
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
      audit: false
      restrictedParams:
        paymentMilestone.read:
          params:
            view: [overdue_payments, unpaid]
            sort: [urgency]
          fields: [payment]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/work-orders.yaml#/WorkOrderSearchRequest
    responses:
      '200':
        description: Pasujące zlecenia (brak wyników to pusta tablica `items` i `nextCursor` równy `null`).
        content:
          application/json:
            schema:
              $ref: ../components/work-orders.yaml#/WorkOrderList
      '400':
        $ref: ../components/responses.yaml#/InvalidListQuery
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '429':
        $ref: ../components/responses.yaml#/RateLimited
WorkOrderIdParameter:
  name: workOrderId
  in: path
  required: true
  description: Identyfikator zlecenia (UUID).
  schema:
    type: string
    format: uuid
    maxLength: 36
workOrder:
  get:
    operationId: getWorkOrder
    tags: [work-orders]
    summary: Szczegóły zlecenia — nagłówek
    description: >-
      Nagłówek W-06: numer, tytuł, status, klient i adres lokalizacji (nazwa i adres z fasad modułów `customers` i `sites`),
      opiekun, data utworzenia; odpowiedź ma `ETag` (`"<version>"`). Role Administrator, Edytor i Tylko odczyt, kanał `web`
      (aplikacja mobilna korzysta z synchronizacji; token mobilny — `403 channel_not_allowed`), bez audytu odczytu. Zlecenie
      jest rozwiązywane najpierw, przez politykę odczytu w zapytaniu: nieistniejące albo usunięte (soft delete — także dla
      Administratora; podgląd usuniętych to EVM-060) daje `404 not_found` — ta sama odpowiedź w obu przypadkach, bez wartości.
      Zły format `workOrderId` — `400 validation_failed`. Każda odpowiedź ma `Cache-Control: no-store` (dane osobowe).
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - $ref: '#/WorkOrderIdParameter'
    responses:
      '200':
        description: Nagłówek zlecenia.
        headers:
          ETag:
            description: Wersja zasobu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
        content:
          application/json:
            schema:
              $ref: ../components/work-orders.yaml#/WorkOrderDetails
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  patch:
    operationId: updateWorkOrder
    tags: [work-orders]
    summary: Dane zlecenia — tytuł, opis, opiekun, planowana data (merge-patch, If-Match)
    description: >-
      Zmiana danych zlecenia (EVM-035 AC1, AC6–AC8; SR-AUTHZ-02, SR-AUTHZ-04, SR-AUTHZ-05, SR-INPUT-01, SR-INPUT-02, SR-INPUT-05,
      SR-API-05, SR-API-07, SR-DATA-02, SR-LOG-02, SR-LOG-03). Role Administrator i Edytor (Tylko odczyt — `403 forbidden` przed
      walidacją, `If-Match` i sprawdzeniem istnienia; niezalogowany — `401`; token mobilny — `403 channel_not_allowed`), kanał `web`,
      z audytem (`work_order.updated` — aktor, identyfikator zlecenia, wynik i `traceId`; bez wartości i nazw pól; zmiana bez
      efektu nie tworzy zdarzenia). Wymaga `X-CSRF-Token` i `If-Match` (silny ETag `"<version>"` zlecenia): brak — `428
      precondition_required`; słaby (`W/`), lista, `*` albo zniekształcony — `400 validation_failed` (`/headers/If-Match`);
      nieaktualna wersja — `412 version_conflict` (dane zlecenia zostają bez zmian, odpowiedź nie zawiera bieżących wartości).
      Treść to `WorkOrderPatch` (co najmniej jedno z `title`, `description`, `plannedDate`, `assigneeUserId`); pole kontrolowane
      przez serwer (`number`, `status`, `customerId`, `siteId`, `version` …) — `400 read_only_field`, pole spoza schematu —
      `400 unknown_field`; `assigneeUserId` spoza aktywnych użytkowników — `400` (`/assigneeUserId`, `assignee_unavailable`; jedna
      odpowiedź); `plannedDate` poza zakresem — `400` (`/plannedDate`, `out_of_range`). Zlecenie Rozliczone albo Anulowane — `409
      work_order_closed` (PO-8; sprawdzane po `404` i treści, przed wersją). Zmiana statusu nie jest tu możliwa — to komenda
      `transitionWorkOrder`; zmiana klienta i lokalizacji — poza M1. Kolejność (decyzje zapadają na wierszu zablokowanym `SELECT …
      FOR UPDATE`, w jednej transakcji): guard (rola, CSRF, kanał), ścieżka i `Idempotency-Key` (`400`), zlecenie (`404` — przed
      `If-Match` i treścią), `If-Match` (`428` / `400`), treść (`400`: kod i wskaźnik, nigdy wartość), powtórka idempotentna,
      `409 work_order_closed`, wersja (`412`), opiekun (`400`), zapis `version + 1`, zdarzenie dziennika (nazwy zmienionych pól),
      audyt i rekord idempotencji; błąd któregokolwiek kroku cofa całość. Tytuł i opis są polami swobodnymi i nie trafiają do logów,
      audytu, dziennika ani komunikatów błędów. Idempotencja (api-guidelines.md → Idempotencja): `Idempotency-Key` (UUIDv7) jest
      opcjonalny, panel wysyła go zawsze; klucz jest związany z użytkownikiem, metodą, szablonem ścieżki I identyfikatorem zlecenia
      — ten sam klucz z tą samą treścią na innym zleceniu to `422 idempotency_mismatch`. Powtórka (ten sam klucz, zlecenie i treść)
      — `200` z bieżącą reprezentacją i `Idempotent-Replayed: true`, bez drugiej zmiany i drugiego zdarzenia, także gdy `If-Match`
      jest już nieaktualny. Odpowiedź `200` ma nowy `ETag`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: true
    parameters:
      - $ref: '#/WorkOrderIdParameter'
      - $ref: '#/IfMatchHeader'
      - $ref: '#/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/work-orders.yaml#/WorkOrderPatch
    responses:
      '200':
        description: >-
          Zlecenie po zmianie (albo powtórka wcześniejszej zmiany — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Nowa wersja zasobu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key`, zleceniem i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/work-orders.yaml#/WorkOrderDetails
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/WorkOrderClosed
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/IdempotencyMismatch
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  delete:
    operationId: deleteWorkOrder
    tags: [work-orders]
    summary: Usunięcie zlecenia (soft delete, tylko Administrator; step-up przy transzy opłaconej)
    description: >-
      Usunięcie zlecenia założonego przez pomyłkę (EVM-060 AC1–AC3, AC5, AC6; SR-AUTHZ-05, SR-AUTHZ-10, SR-SESS-08, SR-API-05,
      SR-API-06, SR-DATA-08, SR-LOG-03; AB-17). Soft delete: zlecenie i jego encje podrzędne (zakres, procesy, transze, dziennik,
      media) znikają dla każdej roli, w tym dla Administratora poza widokiem `view=deleted` listy; wiersz zostaje i można go
      przywrócić (`restoreWorkOrder`). Tylko Administrator, kanał `web` (Edytor i Tylko odczyt — `403 forbidden` przed `404`,
      `If-Match` i sprawdzeniem stanu; niezalogowany — `401`; token mobilny — `403 channel_not_allowed`), z audytem
      (`work_order.deleted` — aktor, identyfikator zlecenia, wynik, `traceId`, prefiks IP i, gdy wymagano step-upu, kod powodu
      `step_up_verified`; bez tytułu, klienta, adresu i kwot). Wymaga `X-CSRF-Token` i `If-Match` (silny ETag `"<version>"`):
      brak — `428`; zniekształcony — `400`; nieaktualna wersja — `412 version_conflict`.
      Reguła zależności (SR-AUTHZ-10) zależy od stanu transz płatności zlecenia, więc step-up NIE jest warunkiem operacji
      (`stepUp: false` — tak jak przy `transitionWorkOrder`), tylko kontrolą obiektową przypadku użycia: żywa transza `invoiced`
      (Wystawiona) — `409 has_active_dependents` (także gdy jest i `paid`; nie da się ukryć należności usunięciem zlecenia);
      żywa transza `paid` (Opłacona) — wymagane uwierzytelnienie kluczem dostępu w ostatnich 15 minutach, bez niego
      `403 step_up_required` (sprawdzane po roli i po regule `409`); tylko transze `planned` i `cancelled` albo brak transz —
      bez step-upu. Odpowiedzi `409` i `403 step_up_required` nie podają liczby, kwot ani identyfikatorów transz.
      Kolejność (jedna transakcja, decyzje na wierszu zlecenia zablokowanym `SELECT … FOR NO KEY UPDATE`, tym samym wierszem, który
      blokują komendy płatności — usunięcie i równoległe wystawienie transzy są szeregowane): guard (rola, CSRF, kanał), ścieżka i
      `Idempotency-Key` (`400`), zlecenie (`404` — nieistniejące, usunięte i cudze to jedna odpowiedź), `If-Match` (`428` / `400`),
      powtórka idempotentna (zapisany wynik `204`, przed regułą zależności), zależności (`409`), step-up (`403`), wersja (`412`),
      zapis `version + 1`, `deleted_at` i `deleted_by`, przeliczenie projekcji listy, audyt i rekord idempotencji. Odmowa
      (`403`, `409`, `412`) cofa całość — nie zostaje rekord idempotencji ani żaden skutek. Klucz idempotencji jest związany z
      użytkownikiem, metodą, szablonem ścieżki I identyfikatorem zlecenia: ten sam klucz na innym zleceniu —
      `422 idempotency_mismatch`; powtórka (ten sam klucz i zlecenie) — `204` z `Idempotent-Replayed: true`, także gdy `If-Match`
      jest już nieaktualny. Odpowiedź `204` nie ma treści. Brak rozstrzygnięcia reguły zależności (błąd modułu płatności) —
      `500` bez zapisu (fail closed).
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      stepUp: false
      audit: true
    parameters:
      - $ref: '#/WorkOrderIdParameter'
      - $ref: '#/IfMatchHeader'
      - $ref: '#/IdempotencyKeyHeader'
    responses:
      '204':
        description: >-
          Zlecenie usunięte (albo powtórka wcześniejszego usunięcia — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key` i zleceniem.'
            schema:
              type: string
              enum: ['true']
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/WorkOrderDeleteForbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/WorkOrderDeleteConflict
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '422':
        $ref: ../components/responses.yaml#/IdempotencyMismatch
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
workOrderRestore:
  post:
    operationId: restoreWorkOrder
    tags: [work-orders]
    summary: Przywrócenie usuniętego zlecenia (tylko Administrator)
    description: >-
      Przywrócenie zlecenia usuniętego przez `deleteWorkOrder` razem z encjami podrzędnymi (EVM-060 AC4, AC6; SR-AUTHZ-05,
      SR-API-05, SR-API-06, SR-LOG-03). Statusy i kwoty transz nie zmieniają się — przywrócenie tylko przywraca widoczność, więc
      nie wymaga step-upu (spójnie z przywracaniem procesów, EVM-042, polityka P5). Tylko Administrator, kanał `web` (Edytor i
      Tylko odczyt — `403 forbidden` przed `404` i `If-Match`; niezalogowany — `401`; token mobilny — `403 channel_not_allowed`),
      z audytem (`work_order.undeleted` — aktor, identyfikator, wynik, `traceId`, prefiks IP; bez tytułu i kwot; osobna akcja od
      `work_order.restored`, które oznacza przywrócenie statusu). Wymaga `X-CSRF-Token` i `If-Match` (silny ETag
      `"<version>"` usuniętego zlecenia, z pola `version` pozycji widoku `view=deleted`): brak — `428`; zniekształcony — `400`;
      nieaktualna wersja — `412`. Zlecenie nieusunięte albo nieistniejące — `404 not_found` (jedna odpowiedź). Klient albo
      lokalizacja usunięte w międzyczasie nie blokują przywrócenia (lista pokazuje „Klient usunięty”).
      Kolejność (jedna transakcja, wiersz zablokowany `SELECT … FOR NO KEY UPDATE` dopiero po sprawdzeniu roli): zlecenie usunięte
      (`404`), `If-Match`, powtórka idempotentna, wersja (`412`), zapis, projekcja, audyt, rekord idempotencji. Klucz idempotencji
      jest związany z użytkownikiem, metodą, szablonem ścieżki i identyfikatorem zlecenia (inne zlecenie — `422
      idempotency_mismatch`). Powtórka — `200` z bieżącą reprezentacją i `Idempotent-Replayed: true`. Odpowiedź `200` ma nowy `ETag`.
    x-evia-authz:
      roles: [administrator]
      channels: [web]
      audit: true
    parameters:
      - $ref: '#/WorkOrderIdParameter'
      - $ref: '#/IfMatchHeader'
      - $ref: '#/IdempotencyKeyHeader'
    responses:
      '200':
        description: >-
          Zlecenie po przywróceniu (albo powtórka wcześniejszego przywrócenia — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Nowa wersja zasobu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key` i zleceniem.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/work-orders.yaml#/WorkOrderDetails
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/IdempotencyInProgress
      '412':
        $ref: ../components/responses.yaml#/PreconditionFailed
      '422':
        $ref: ../components/responses.yaml#/IdempotencyMismatch
      '428':
        $ref: ../components/responses.yaml#/PreconditionRequired
      '429':
        $ref: ../components/responses.yaml#/RateLimited
IfMatchHeader:
  name: If-Match
  in: header
  required: true
  description: Silny ETag wersji zasobu, na której użytkownik podjął decyzję (`"<version>"`, z `ETag` odczytu albo pola `version`).
  schema:
    type: string
    pattern: '^"[1-9][0-9]{0,9}"$'
    maxLength: 12
IdempotencyKeyHeader:
  name: Idempotency-Key
  in: header
  required: false
  description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
  schema:
    type: string
    format: uuid
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    maxLength: 36
ScopeItemIdParameter:
  name: scopeItemId
  in: path
  required: true
  description: Identyfikator pozycji zakresu (UUID).
  schema:
    type: string
    format: uuid
    maxLength: 36
workOrderScopeItems:
