    summary: Usunięcie pozycji zakresu (soft delete, procesy zostają)
    description: >-
      Usunięcie pozycji z zakresu zlecenia (EVM-035 AC3, AC6–AC8; SR-AUTHZ-02, SR-AUTHZ-05, SR-API-05, SR-API-07, SR-LOG-03). Soft
