# Module `work-orders` — the list of work orders (EVM-017; W-10) and the creation of an order from a template (EVM-022; W-05).
workOrders:
  get:
    operationId: listWorkOrders
    tags: [work-orders]
    summary: Lista zleceń (kursor, filtry, widoki, sortowanie)
    description: >-
      Role Administrator, Edytor i Tylko odczyt, kanał `web` (mobile — M2), bez audytu odczytu (masowy odczyt pilnuje licznik
      poniżej). Zlecenia usunięte (soft delete) nie występują w wyniku — warunek jest w zapytaniu, nie w odsiewaniu strony.
      Wszystkie filtry łączą się przez AND: `status` (lista po przecinku, do 8 różnych wartości z zamkniętej listy), `view`
      (`all_open` albo `mine`; brak = bez predykatu widoku), `coordinatorId` (UUID; nieistniejący identyfikator daje pustą listę).
      `mine` bierze opiekuna wyłącznie z sesji — parametru z identyfikatorem użytkownika nie ma. `sort`: `-number` (domyślne),
      `number`, `-createdAt`, `createdAt`; wartość spoza listy, zły `limit` (1–100, domyślnie 25) albo zły format `status` —
      `400 validation_failed`; nieznany parametr — `400 unknown_parameter`, powtórzony — `400 duplicate_parameter`.
      Paginacja kursorem nieprzezroczystym (`nextCursor`; bez licznika wyników): zmieniony, wygasły (30 minut), wydany komu innemu
      albo użyty z innymi filtrami lub sortowaniem — `400 invalid_cursor`. Masowy odczyt (P10): gdy użytkownik dostał w ostatnich
      10 minutach co najmniej 2000 rekordów, powstaje alert bezpieczeństwa; od 10 000 rekordów — `429 rate_limited` z `Retry-After`
      (sekundy) do chwili, gdy suma spadnie poniżej progu. Odrzucone żądania nie są liczone.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - name: status
        in: query
        required: false
        description: Statusy po przecinku (np. `new,quoting`), bez duplikatów znaczenia; pusty element jest błędem.
        schema:
          type: string
          maxLength: 120
          pattern: '^[a-z_]+(,[a-z_]+){0,19}$'
      - name: view
        in: query
        required: false
        description: Widok (`all_open` albo `mine`).
        schema:
          $ref: ../components/work-orders.yaml#/WorkOrderView
      - name: coordinatorId
        in: query
        required: false
        description: Filtr opiekuna (UUID; „Więcej filtrów”). Nie trafia do adresu panelu.
        schema:
          type: string
          format: uuid
          maxLength: 36
      - name: sort
        in: query
        required: false
        description: Sortowanie (domyślnie `-number`).
        schema:
          $ref: ../components/work-orders.yaml#/WorkOrderSort
      - name: limit
        in: query
        required: false
        description: Liczba pozycji na stronie.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        description: Kursor ze strony poprzedniej (`nextCursor`) — wartość nieprzezroczysta.
        schema:
          type: string
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
    responses:
      '200':
        description: Strona zleceń (pusta lista to pusta tablica `items` i `nextCursor` równy `null`).
        content:
          application/json:
            schema:
              $ref: ../components/work-orders.yaml#/WorkOrderList
      '400':
        $ref: ../components/responses.yaml#/InvalidListQuery
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  post:
    operationId: createWorkOrder
    tags: [work-orders]
    summary: Utworzenie zlecenia z szablonu (albo pustego)
    description: >-
      Role Administrator i Edytor (Tylko odczyt — `403 forbidden` dla dowolnej treści, także pustej i nieprawidłowej; niezalogowany —
      `401`), kanał `web`, z audytem (`work_order.created` — identyfikatory, bez tytułu i opisu). Wymaga `X-CSRF-Token`.
      Jedna transakcja: klient i lokalizacja (odczyt przez fasady modułów, tą samą transakcją co zapis) → szablon → numer z licznika
      rocznego (`ZL-RRRR-NNNN`, rok wg `Europe/Warsaw`, bez luk: wycofanie transakcji cofa zużycie numeru) → zlecenie w statusie
      `new` → pozycje zakresu skopiowane z szablonu (kod, nazwa, zestaw i parametry domyślne, ilość) → opiekun (`coordinator`) →
      kontrybutorzy kompozycji (procesy — EVM-031, transze — EVM-053) → audyt; błąd któregokolwiek kroku cofa całość (nie powstaje
      zlecenie, pozycja, przypisanie, wpis audytu ani rekord idempotencji, numer nie jest zużyty). `customerId` albo `siteId`
      nieistniejące lub usunięte (także dla Administratora) — `404 not_found`, ta sama odpowiedź w obu przypadkach;
      `templateId` wycofany albo nieistniejący — `422 template_unavailable`; `assigneeUserId` spoza aktywnych użytkowników —
      `400 validation_failed` (`/assigneeUserId`, `assignee_unavailable`). Pole spoza schematu — `400 unknown_field`, pole serwera
      (`number`, `status`, `scopeItems` …) — `400 read_only_field`; błędy to wskaźnik i kod, nigdy wartość. `id` (UUIDv7)
      nadaje klient; istniejące `id` (także zlecenia usuniętego) — `409 id_conflict` bez danych istniejącego zasobu.
      Idempotencja (api-guidelines.md → Idempotencja): `Idempotency-Key` (UUIDv7) jest opcjonalny; panel wysyła go zawsze, a przy
      ponowieniu używa tego samego `id` i klucza. Powtórka (ten sam klucz i treść) — to samo zlecenie z tym samym numerem,
      bieżąca reprezentacja i `Idempotent-Replayed: true`, bez nowego zdarzenia audytu; ten sam klucz z inną treścią albo na innej
      operacji — `422 idempotency_mismatch`; równoległe żądanie z tym samym kluczem — `409 idempotency_in_progress` z `Retry-After`.
      Klucz obowiązuje 30 dni, osobno dla każdego użytkownika.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: true
    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Klucz idempotencji (UUIDv7) generowany raz na akcję użytkownika.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          maxLength: 36
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/work-orders.yaml#/CreateWorkOrderRequest
    responses:
      '201':
        description: >-
          Zlecenie utworzone (albo powtórka wcześniejszego zapisu — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Wersja zasobu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key` i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/work-orders.yaml#/WorkOrder
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/ResourceConflict
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/CreateWorkOrderUnprocessable
      '429':
        $ref: ../components/responses.yaml#/RateLimited
WorkOrderIdParameter:
  name: workOrderId
  in: path
  required: true
  description: Identyfikator zlecenia (UUID).
  schema:
    type: string
    format: uuid
    maxLength: 36
workOrder:
  get:
    operationId: getWorkOrder
    tags: [work-orders]
    summary: Szczegóły zlecenia — nagłówek
    description: >-
      Nagłówek W-06: numer, tytuł, status, klient i adres lokalizacji (nazwa i adres z fasad modułów `customers` i `sites`),
      opiekun, data utworzenia; odpowiedź ma `ETag` (`"<version>"`). Role Administrator, Edytor i Tylko odczyt, kanał `web`
      (aplikacja mobilna korzysta z synchronizacji; token mobilny — `403 channel_not_allowed`), bez audytu odczytu. Zlecenie
      jest rozwiązywane najpierw, przez politykę odczytu w zapytaniu: nieistniejące albo usunięte (soft delete — także dla
      Administratora; podgląd usuniętych to EVM-060) daje `404 not_found` — ta sama odpowiedź w obu przypadkach, bez wartości.
      Zły format `workOrderId` — `400 validation_failed`. Każda odpowiedź ma `Cache-Control: no-store` (dane osobowe).
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - $ref: '#/WorkOrderIdParameter'
    responses:
      '200':
        description: Nagłówek zlecenia.
        headers:
          ETag:
            description: Wersja zasobu (`"<version>"`).
            schema:
              type: string
              maxLength: 32
        content:
          application/json:
            schema:
              $ref: ../components/work-orders.yaml#/WorkOrderDetails
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
workOrderScopeItems:
  get:
    operationId: listWorkOrderScopeItems
    tags: [work-orders]
    summary: Zakres zlecenia — pozycje z parametrami
    description: >-
      Aktywne pozycje zakresu zlecenia w kolejności `position` (`work_order_id` i `deleted_at is null` w tym samym zapytaniu co
      pozycja — pozycja innego zlecenia nigdy nie występuje). Parametry to płaska mapa wartości skalarnych (najwyżej 20 kluczy,
      tekst do 100 znaków); nieznany zestaw albo wartość panel pokazuje jako wartość nieznaną. Uprawnienia, kanał i błędy jak
      w `getWorkOrder` (zlecenie jest rozwiązywane najpierw, polityką odczytu w zapytaniu).
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - $ref: '#/WorkOrderIdParameter'
    responses:
      '200':
        description: Pozycje zakresu (pusta tablica `items`, gdy zlecenie nie ma pozycji).
        content:
          application/json:
            schema:
              $ref: ../components/work-orders.yaml#/ScopeItemList
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
workOrderCustomer:
  get:
    operationId: getWorkOrderCustomer
    tags: [work-orders]
    summary: Zlecenie — karta klienta
    description: >-
      Karta „Klient” (DO-K): nazwa wyświetlana, telefon i e-mail. `customerId` pochodzi wyłącznie z wiersza zlecenia po polityce
      odczytu — nigdy z wejścia klienta; klient usunięty albo zlecenie bez klienta — `404 not_found`. Uprawnienia, kanał
      i błędy jak w `getWorkOrder`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - $ref: '#/WorkOrderIdParameter'
    responses:
      '200':
        description: Karta klienta.
        content:
          application/json:
            schema:
              $ref: ../components/work-orders.yaml#/CustomerCard
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
workOrderSite:
  get:
    operationId: getWorkOrderSite
    tags: [work-orders]
    summary: Zlecenie — karta lokalizacji
    description: >-
      Karta „Lokalizacja” (DO-K): typ obiektu, adres, miejsce i poziom, moc przyłączeniowa, PPE, notatki oraz OSD i zarządca
      (`{id, displayName}`, jednym zapytaniem do fasady stron). `siteId` pochodzi wyłącznie z wiersza zlecenia po polityce odczytu;
      lokalizacja usunięta albo zlecenie bez lokalizacji — `404 not_found`. Uprawnienia, kanał i błędy jak w `getWorkOrder`.
    x-evia-authz:
      roles: [administrator, editor, read_only]
      channels: [web]
    parameters:
      - $ref: '#/WorkOrderIdParameter'
    responses:
      '200':
        description: Karta lokalizacji.
        content:
          application/json:
            schema:
              $ref: ../components/work-orders.yaml#/SiteCard
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
