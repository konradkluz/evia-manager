      '404':
        $ref: ../components/responses.yaml#/NotFound
      '429':
        $ref: ../components/responses.yaml#/RateLimited
  post:
    operationId: createWorkOrderScopeItem
    tags: [work-orders]
    summary: Dodanie pozycji zakresu z katalogu (z procesami)
    description: >-
      Dodanie pozycji katalogu usług do zakresu zlecenia razem z wybranymi procesami, które pozycja wnosi (EVM-035 AC2, AC4–AC8;
      SR-AUTHZ-02, SR-AUTHZ-04, SR-AUTHZ-05, SR-INPUT-01, SR-INPUT-02, SR-API-02, SR-API-05, SR-API-06, SR-DATA-02, SR-LOG-03).
      Role Administrator i Edytor (Tylko odczyt — `403 forbidden` dla dowolnej treści; niezalogowany — `401`; token mobilny —
      `403 channel_not_allowed`), kanał `web`, z audytem (`scope_item.created` — aktor, identyfikator pozycji, wynik i `traceId`;
      bez nazwy, parametrów i notatek). Wymaga `X-CSRF-Token`. Jedna transakcja na zablokowanym wierszu zlecenia (`SELECT … FOR
      UPDATE`): zlecenie (`404` — przed treścią), treść `CreateScopeItemRequest` (`400`: schemat, parametry wg zestawu pozycji
      katalogu, notatki, kody procesów; kod i wskaźnik, nigdy wartość), powtórka idempotentna, zlecenie zamknięte (`409
      work_order_closed`), pozycja katalogu (`400`, `/catalogItemCode`, `unknown_catalog_item`), limit 50 aktywnych pozycji (`422
      limit_exceeded`, `errors[]` — wskaźnik i kod) i 30 procesów (`422 limit_exceeded`), zapis pozycji na końcu zakresu
      (`position` = liczba pozycji + 1, `quantity` = 1, `version` = 1), procesy z etapami „Do zrobienia” (kody już aktywne w
      zleceniu są pomijane, bez błędu), zdarzenie dziennika (`scope_item_added`: kod pozycji i kody dodanych procesów), audyt i
      rekord idempotencji. Błąd któregokolwiek kroku cofa całość. `id` (UUIDv7) nadaje klient; istniejące `id` — także pozycji
      innego zlecenia — `409 id_conflict` bez danych istniejącego zasobu i bez nadpisania. Idempotencja: `Idempotency-Key`
      (UUIDv7) jest opcjonalny, panel wysyła go zawsze; klucz jest związany z użytkownikiem, metodą, szablonem ścieżki I
      identyfikatorem zlecenia (ten sam klucz i treść na innym zleceniu — `422 idempotency_mismatch`). Powtórka — `201` z bieżącą
      reprezentacją i `Idempotent-Replayed: true`, bez nowego zdarzenia. Odpowiedź ma `ETag` pozycji i `Location`.
    x-evia-authz:
      roles: [administrator, editor]
      channels: [web]
      audit: true
    parameters:
      - $ref: '#/WorkOrderIdParameter'
      - $ref: '#/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/work-orders.yaml#/CreateScopeItemRequest
    responses:
      '201':
        description: >-
          Pozycja dodana (albo powtórka wcześniejszego zapisu — wtedy nagłówek `Idempotent-Replayed: true`).
        headers:
          ETag:
            description: Wersja pozycji (`"<version>"`).
            schema:
              type: string
              maxLength: 32
          Location:
            description: Adres pozycji (`/api/v1/work-orders/{workOrderId}/scope-items/{scopeItemId}`).
            schema:
              type: string
              maxLength: 120
          Idempotent-Replayed:
            description: '`true` przy powtórce żądania z tym samym `Idempotency-Key`, zleceniem i treścią.'
            schema:
              type: string
              enum: ['true']
        content:
          application/json:
            schema:
              $ref: ../components/work-orders.yaml#/ScopeItemAddition
      '400':
        $ref: ../components/responses.yaml#/ValidationFailed
      '401':
        $ref: ../components/responses.yaml#/Unauthenticated
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/ScopeItemConflict
      '413':
        $ref: ../components/responses.yaml#/PayloadTooLarge
      '415':
        $ref: ../components/responses.yaml#/UnsupportedMediaType
      '422':
        $ref: ../components/responses.yaml#/LimitExceeded
      '429':
        $ref: ../components/responses.yaml#/RateLimited
workOrderScopeItem:
