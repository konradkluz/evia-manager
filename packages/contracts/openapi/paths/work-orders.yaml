    summary: Pozycja zakresu zlecenia (z ETag)
    description: >-
      Jedna aktywna pozycja zakresu (EVM-035 AC8; SR-AUTHZ-02, SR-AUTHZ-05, CWE-639). Pozycja jest wyszukiwana warunkiem `id =
