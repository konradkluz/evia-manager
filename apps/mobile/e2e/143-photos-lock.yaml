# EVM-142 AC5: with the preview open and the download of its picture in progress the app goes to the background and comes back after 6 minutes (the hook moves the clock;
# the hook "unlock held" keeps the system unlock from opening the app): the cover "Aplikacja zablokowana" is there, the preview and the grid are gone from the tree of
# views, the request in progress was abandoned. tools/mobile-e2e reads the whole tree (also the views "not important for accessibility") and the server counts the abandoned request.
appId: pl.eviacharge.manager
---
- tapOn:
    id: 'evia-e2e-hooks-panel'
- scrollUntilVisible:
    element:
      id: 'e2e-unlock-hold'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'e2e-unlock-hold'
- scrollUntilVisible:
    element:
      id: 'e2e-background-6'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'e2e-background-6'
- scrollUntilVisible:
    element:
      id: 'e2e-close'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'e2e-close'
- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: 'lock-overlay'
    timeout: 20000
- assertNotVisible:
    id: 'photo-preview'
- assertNotVisible:
    id: 'order-photos-grid'
- assertNotVisible: 'Po zakończeniu.*'
- assertNotVisible: 'Opis testowy.*'
- takeScreenshot: m08-photos-locked
