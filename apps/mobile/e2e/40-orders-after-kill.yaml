# EVM-103 AC1, AC6: after the process was killed (SIGKILL, like "Nie zachowuj aktywności" and the system reclaiming memory) the list is
# back from the local database offline, and the search field starts EMPTY - the query was never kept anywhere. The marker typed in
# the previous flow must be in no file and no log (check-encrypted after this flow).
appId: pl.eviacharge.manager
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: 'Brak zasięgu.*'
    timeout: 30000
# the emulator image is older than 12 months: the security banner of EVM-100 pushes the list down - acknowledge it if shown
- tapOn:
    text: 'Rozumiem'
    optional: true
- assertVisible: 'ZL-E2E-1'
- assertVisible: 'ZL-E2E-2'
- assertVisible: 'Szukaj: adres, nazwisko, numer'
- assertNotVisible: 'EVM093-SENTINEL'
- takeScreenshot: m05-after-kill-empty-field
