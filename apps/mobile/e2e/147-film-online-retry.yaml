# EVM-143 AC4: the manual retry after the network came back plays the film; the player is closed.
appId: pl.eviacharge.manager
---
- tapOn: 'Spróbuj ponownie'
- extendedWaitUntil:
    visible: 'Pauza'
    timeout: 60000
- takeScreenshot: m08c-film-back-online
- tapOn:
    id: 'video-player-close'
- extendedWaitUntil:
    notVisible:
      id: 'video-player'
    timeout: 10000
