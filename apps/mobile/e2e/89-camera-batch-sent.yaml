# EVM-108 AC7: the thirty files end as "Wysłano" ("0 do wysłania"), none waiting, none in an error, none needing attention, and the app is still
# signed in. The count comes from the snapshot the rows of the Queue are drawn from (the hook `media: status`). tools/mobile-e2e asserts
# afterwards, with the scenario server and adb: thirty objects in the right work order, one per asset, the SHA-256 of the original, 0 duplicates,
# no orphaned multipart, and no token or signed address in the log or the files of the app.
appId: pl.eviacharge.manager
---
- launchApp:
    stopApp: false
- tapOn:
    text: 'Rozumiem'
    optional: true
- tapOn:
    id: 'nav-queue'
# the Queue may be drawn before its files are loaded ("0 do wysłania" of an empty list): a file that is sent comes first
- extendedWaitUntil:
    visible: '.*Wysłano'
    timeout: 240000
- extendedWaitUntil:
    visible:
      id: 'files-summary'
      text: '0 do wysłania'
    timeout: 420000
- assertNotVisible: 'Wylogowano ten telefon'
- takeScreenshot: m07-batch-sent
- runFlow:
    file: common/media-status.yaml
    env:
      STATUS: 'files=30;waiting=0;uploading=0;sent=30;failed=0;attention=0;notifications=[a-z_]+'
