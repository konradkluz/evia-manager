# EVM-142 AC5: signs in again (the replica comes back), the photos are looked at (grid, preview), then "Więcej" -> "Wyczyść dane firmowe" -> the confirmation: "Wylogowano".
# tools/mobile-e2e then searches the directories of the app and reads the log.
appId: pl.eviacharge.manager
---
- launchApp:
    stopApp: false
- tapOn: 'Zaloguj się'
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
    visible: 'ZL-E2E-1'
    timeout: 60000
- tapOn:
    text: 'Rozumiem'
    optional: true
- runFlow: common/photos-grid-open.yaml
- tapOn:
    id: 'photo-tile-0'
- extendedWaitUntil:
    visible:
      id: 'photo-preview'
    timeout: 20000
- assertVisible: 'Opis testowy completed_work'
- tapOn:
    id: 'photo-preview-close'
- extendedWaitUntil:
    notVisible:
      id: 'photo-preview'
    timeout: 10000
- tapOn:
    id: 'order-photos-back'
- tapOn:
    id: 'nav-more'
- scrollUntilVisible:
    element:
      id: 'more-wipe'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'more-wipe'
- extendedWaitUntil:
    visible:
      id: 'wipe-dialog'
    timeout: 10000
- tapOn:
    id: 'wipe-confirm'
- extendedWaitUntil:
    visible: 'Wylogowano'
    timeout: 90000
