- launchApp:
    clearState: true
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
    visible: 'ZL-E2E-2'
    timeout: 60000
- assertVisible: 'ZL-E2E-1'
- takeScreenshot: m05-list-online
