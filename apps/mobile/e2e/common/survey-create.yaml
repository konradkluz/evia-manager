# EVM-137 AC1 AC2: the shared creation of a site survey from the list (M-05 -> M-10 "Wizja lokalna"): "Dodaj" -> "Wizja lokalna" (the first
# row), the city, the street, the building number, the postal code and the phone of the requester - nothing else is asked - and "Zapisz wizję".
# Ends on the details (M-03) of the survey that waits for its number. The typed words are the ones tools/mobile-e2e looks for in the log
# afterwards (src/device-survey.mjs SURVEY_SYNTHETIC_WORDS). Synthetic ASCII data only (the keyboard of the emulator does not carry Polish
# letters reliably). Rules of the earlier flows: elements below the fold are scrolled to first with centerElement; hideKeyboard only right after
# a text was typed (the keyboard is certainly open).
appId: pl.eviacharge.manager
---
- tapOn:
    id: 'orders-add'
- tapOn:
    id: 'add-site-survey'
- extendedWaitUntil:
    visible: 'Numer nadamy po synchronizacji\.'
    timeout: 10000
- tapOn:
    id: 'survey-city'
- inputText: 'Piaseczno'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'survey-street'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'survey-street'
- inputText: 'Fikcyjna'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'survey-building'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'survey-building'
- inputText: '12'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'survey-postal'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'survey-postal'
- inputText: '05-500'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'survey-phone'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'survey-phone'
- inputText: '600000011'
- hideKeyboard
# the term of 90 days is always said
- scrollUntilVisible:
    element: 'Klienta uzupełni biuro\. Wizja bez klienta zostanie usunięta po 90 dniach\.'
    direction: DOWN
    centerElement: true
- takeScreenshot: m10-survey-filled
- tapOn:
    id: 'survey-save'
- extendedWaitUntil:
    visible: 'Oczekuje na numer'
    timeout: 10000
