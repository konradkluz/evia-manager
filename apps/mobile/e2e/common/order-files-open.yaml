# EVM-111 AC1 (shared): from any screen to the details of the first order of the list (ZL-E2E-1, the order of the scenario server) - the row "Pliki z tego
# telefonu" is there, above the journal. Ends on the details.
appId: pl.eviacharge.manager
---
- tapOn:
    id: 'nav-orders'
- tapOn:
    id: 'order-row-30000000-0000-4000-8000-000000000001'
- extendedWaitUntil:
    visible: 'Zlecenie testowe 1'
    timeout: 20000
# the row sits in the scrolled content of M-03 (above the journal), below the fold on a phone: bring it on screen
- scrollUntilVisible:
    element:
      id: 'order-files-row'
    direction: DOWN
    centerElement: true
