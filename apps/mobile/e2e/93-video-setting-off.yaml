# EVM-110 AC4: on the mobile network with charges a film waits ("Czeka na Wi-Fi"); "Więcej" -> "Wysyłanie": the switch "Filmy tylko przez Wi-Fi" is turned
# off with ONE tap (no dialog; the explanation under it changes) and the waiting film is handed to the system again with any network: it goes through the
# mobile network and ends as "Wysłano". tools/mobile-e2e then proves the object at the scenario server.
appId: pl.eviacharge.manager
---
- launchApp:
    stopApp: false
- tapOn:
    text: 'Rozumiem'
    optional: true
- runFlow:
    file: common/hook-capture-video.yaml
    env:
      MIB: '16'
      COUNT: '1'
- tapOn:
    id: 'nav-queue'
- extendedWaitUntil:
    visible:
      id: 'waiting-wifi-banner'
    timeout: 120000
- tapOn:
    id: 'waiting-wifi-change'
- scrollUntilVisible:
    element:
      id: 'more-wifi-switch'
    direction: DOWN
    centerElement: true
- assertVisible:
    id: 'more-wifi-description'
    text: 'Filmy wysyłamy tylko przez sieć bez opłat.*'
- takeScreenshot: m09-wifi-setting-on
- tapOn:
    id: 'more-wifi-switch'
- extendedWaitUntil:
    visible:
      id: 'more-wifi-description'
      text: 'Filmy wysyłamy przez każdą sieć.*'
    timeout: 20000
- assertNotVisible: 'Wylogować się\?'
- takeScreenshot: m09-wifi-setting-off
- tapOn:
    id: 'nav-queue'
- extendedWaitUntil:
    visible:
      id: 'files-summary'
      text: '0 do wysłania'
    timeout: 300000
- assertNotVisible:
    id: 'waiting-wifi-banner'
