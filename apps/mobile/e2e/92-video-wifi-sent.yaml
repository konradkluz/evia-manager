# EVM-110 AC4 AC5 AC8: the network without charges is back (Wi-Fi, set by tools/mobile-e2e) and the films go on their own - with the app open, after a
# force-stop, after a kill. The Queue ends with no film waiting for Wi-Fi and no banner (the entries stay until the server confirms the files, which this
# scenario does not send: EVM-111 AC5). The same flow serves every such end of a scenario; tools/mobile-e2e then waits for the objects at the scenario
# server (one per asset, the SHA-256 of the original, 0 duplicates, no orphaned multipart).
appId: pl.eviacharge.manager
---
- launchApp:
    stopApp: false
- tapOn:
    text: 'Rozumiem'
    optional: true
- tapOn:
    id: 'nav-queue'
- extendedWaitUntil:
    notVisible: '.*Czeka na Wi-Fi.*'
    timeout: 420000
- assertVisible:
    id: 'files-summary'
- assertNotVisible:
    id: 'waiting-wifi-banner'
- assertNotVisible: 'Wymaga uwagi'
- assertNotVisible: 'Wylogowano ten telefon'
- takeScreenshot: m07-video-sent
