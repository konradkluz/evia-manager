# EVM-146 AC2 (spike): the same path as 130 but the automatic unlock of the e2e variant is NOT held - the app locks after 6 minutes in the background, unlocks
# at once and must show the same form with the typed word ("Kontrolka146") still in the field.
appId: pl.eviacharge.manager
---
- launchApp:
    stopApp: false
- tapOn:
    text: 'Rozumiem'
    optional: true
- tapOn:
    id: 'order-row-30000000-0000-4000-8000-000000000001'
- extendedWaitUntil:
    visible: 'Zlecenie testowe 1'
    timeout: 20000
- tapOn:
    id: 'order-detail-add-entry'
- extendedWaitUntil:
    visible: 'Nowy wpis'
    timeout: 10000
- tapOn:
    id: 'entry-body'
- inputText: 'Kontrolka146'
- hideKeyboard
- tapOn:
    id: 'evia-e2e-hooks-panel'
- scrollUntilVisible:
    element:
      id: 'e2e-background-6'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'e2e-background-6'
- scrollUntilVisible:
    element:
      id: 'e2e-close'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'e2e-close'
- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    notVisible:
      id: 'lock-overlay'
    timeout: 20000
- extendedWaitUntil:
    visible: 'Nowy wpis'
    timeout: 10000
- assertVisible: 'Kontrolka146'
