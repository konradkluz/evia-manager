# EVM-105 AC1, AC5, AC6 (preparation): a fresh install signs in against the scenario server; the first download (M-12) ends on the list
# of the two synthetic work orders, into which the next flows write entries.
appId: pl.eviacharge.manager
---
- launchApp:
    clearState: true
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
    visible: 'ZL-E2E-2'
    timeout: 60000
- assertVisible: 'ZL-E2E-1'
