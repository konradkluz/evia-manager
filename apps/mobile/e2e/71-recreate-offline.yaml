# EVM-128 AC1 (preparation): in airplane mode the technician creates a quick work order and adds an entry to it; both wait in the queue
# until the network returns, and then the scenario server rejects the order with `template_unavailable`. Synthetic data only.
appId: pl.eviacharge.manager
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: 'Brak zasięgu.*'
    timeout: 30000
- tapOn:
    text: 'Rozumiem'
    optional: true
- runFlow: common/quick-order-create.yaml
# "Dodaj wpis" sits in the bottom bar of the details (always visible, EVM-108 AC5)
- tapOn:
    id: 'order-detail-add-entry'
- extendedWaitUntil:
    visible: 'Nowy wpis'
    timeout: 10000
- tapOn:
    id: 'entry-body'
- inputText: 'Wpis do odrzuconego zlecenia'
- hideKeyboard
- tapOn:
    id: 'entry-save'
- extendedWaitUntil:
    visible: 'Zapisano w telefonie\. Wyślemy, gdy wróci zasięg\.'
    timeout: 10000
