# EVM-143 AC5: a cold start (the lock of the previous flow is gone with the process): the film is played, the app goes to the background (Home) and comes back: the player is gone
# (the grid is there, not the player) and the film does not start by itself.
appId: pl.eviacharge.manager
---
- launchApp:
    stopApp: true
- tapOn:
    text: 'Rozumiem'
    optional: true
- extendedWaitUntil:
    visible: 'ZL-E2E-1'
    timeout: 60000
- runFlow: common/film-grid-open.yaml
- runFlow: common/film-open.yaml
- tapOn:
    id: 'video-player-action'
- extendedWaitUntil:
    visible: 'Pauza'
    timeout: 60000
- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: 'order-photos-grid'
    timeout: 20000
- assertNotVisible:
    id: 'video-player'
- takeScreenshot: m08c-film-after-background
