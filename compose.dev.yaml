# Local development environment (EVM-077; ADR-0015) — API and PostgreSQL in containers, the panel natively. Never used on
# staging or production. Started only by `pnpm run dev` (tools/dev-env), always with the explicit file and one of four exact
# forms: up -d --wait --build | down | down -v | exec api node dist/src/cli/bootstrap-admin.js (tested by tools/repo-policy).
# Same rules as compose.yaml (tested in tools/repo-policy): images by tag + digest or built from a Dockerfile pinned by
# digest; no privileged mode, no Docker socket, no env_file and no ${…} interpolation; read-only root file system, all
# capabilities dropped, no-new-privileges, non-root user; no project `name:`. Narrow exceptions, tested one by one:
#   - ports only as 127.0.0.1:<host port other than 5432>:<container port> (never reachable from the local network);
#   - the named volume evia-dev-data (the development database survives `down`; `down -v` removes it);
#   - one network with egress (an `internal` network cannot publish ports): dev-net.
# Names of services, network and volume are disjoint from compose.yaml (both files share the Compose project), so `down -v`
# here never touches bt-work or the containers of the gates.
# The api service has every setting written out — nothing is taken from the environment of the host except CURSOR_KEY and
# FIELD_ENCRYPTION_KEYS (secrets, by name only; EVM-023). Migrations run at its start, before the marker of the database is checked by the tools, so the
# target database is fixed here: only postgres-dev/evia_dev is reachable, whatever the host environment says.

x-hardening: &hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  # PostgreSQL 18, same image and initdb arguments as compose.yaml. Runs directly as the postgres user (uid 999).
  # The password is synthetic and local only. init.sql sets the marker of the development database (read-only mount).
  postgres-dev:
    <<: *hardening
    image: postgres:18.6-trixie@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    user: '999:999'
    networks: [dev-net]
    ports:
      - '127.0.0.1:5442:5432'
    environment:
      POSTGRES_USER: evia
      POSTGRES_PASSWORD: evia-local
      POSTGRES_DB: evia_dev
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=pl-PL
    volumes:
      - evia-dev-data:/var/lib/postgresql
      - ./infra/docker/postgres-dev/init.sql:/docker-entrypoint-initdb.d/10-evia-env.sql:ro
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=0775,nosuid,nodev
      - /tmp:noexec,nosuid,nodev,mode=1777
    healthcheck:
      test: ['CMD', 'pg_isready', '--host=127.0.0.1', '--username=evia', '--dbname=evia_dev']
      interval: 2s
      timeout: 3s
      retries: 30

  # The API as in staging: built JavaScript, production dependencies, non-root. Applies migrations, then listens.
  api:
    <<: *hardening
    image: evia-api-dev:local
    build:
      context: .
      dockerfile: infra/docker/api-dev/Dockerfile
    pull_policy: build
    user: node
    working_dir: /app/apps/api
    networks: [dev-net]
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres-dev:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: '3000'
      LOG_LEVEL: info
      DATABASE_URL: postgres://evia:evia-local@postgres-dev:5432/evia_dev
      MIN_SUPPORTED_APP_VERSION_ANDROID: 0.1.0
      MIN_SUPPORTED_APP_VERSION_IOS: 0.1.0
      PANEL_ORIGIN: http://localhost:5173
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: EVia Manager
      CURSOR_KEY:
      FIELD_ENCRYPTION_KEYS:
    tmpfs:
      - /tmp:noexec,nosuid,nodev,mode=1777
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Mailpit (EVM-024 AC6; ADR-0011, ADR-0015; SR-INFRA-01): the catcher of the e-mails of the development environment — the worker sends the
  # invitations here (plain SMTP on port 1025), a person reads them in the web interface on 127.0.0.1:8025. Both ports are published on the
  # loopback ONLY. Nothing leaves the machine through it: there is NO relay (no MP_SMTP_RELAY_*) and no forwarding, the messages live in
  # memory (no MP_DATABASE: gone with the container), and the check for a newer version is off. Synthetic data only. Placed in this file —
  # not in compose.yaml with a profile (as the story words it): the rules of tools/repo-policy allow published ports here only, and
  # this file is a profile of its own (decision of the orchestrator, to confirm at the demo).
  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    user: '65534:65534'
    networks: [dev-net]
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_MAX_MESSAGES: '500'
    tmpfs:
      - /tmp:noexec,nosuid,nodev,mode=1777
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 3s
      timeout: 3s
      retries: 30

  # The worker (ADR-0010; EVM-034 step 9; EVM-024): the same image as the API, another command — it takes the background jobs of the queue
  # (the nightly `verify` of the projection of the list, the e-mails of invitations). No port, no HTTP server; migrations are applied by the
  # api, so it starts after it. The configuration is validated as for the API plus the transport of e-mail (EMAIL_TRANSPORT is required, no
  # default; `smtp` only to Mailpit and never in production), so the same settings are written out (no API_PORT). Its healthcheck reads the
  # file the worker writes every 30 seconds in its tmpfs: red when the file is stale or the transport is `none`.
  worker:
    <<: *hardening
    image: evia-api-dev:local
    build:
      context: .
      dockerfile: infra/docker/api-dev/Dockerfile
    pull_policy: build
    user: node
    working_dir: /app/apps/api
    command: ['node', 'dist/src/worker.js']
    networks: [dev-net]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgres://evia:evia-local@postgres-dev:5432/evia_dev
      MIN_SUPPORTED_APP_VERSION_ANDROID: 0.1.0
      MIN_SUPPORTED_APP_VERSION_IOS: 0.1.0
      PANEL_ORIGIN: http://localhost:5173
      WEBAUTHN_RP_ID: localhost
      CURSOR_KEY:
      EMAIL_TRANSPORT: smtp
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: '1025'
      EMAIL_FROM: noreply@evia-manager.localhost
    tmpfs:
      - /tmp:noexec,nosuid,nodev,mode=1777
    healthcheck:
      test: ['CMD', 'node', 'dist/src/cli/worker-health.js']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  dev-net:

volumes:
  evia-dev-data:
