# pnpm workspace and supply-chain settings (ADR-0012, ADR-0015, SR-SUPPLY-01; EVM-006).
# Every package with an install script needs an explicit decision in allowBuilds (strictDepBuilds);
# the reason for each entry is recorded in docs/backlog/M0/EVM-006-repozytorium-i-ci.md → "Dziennik".
packages:
  - apps/*
  - services/*
  - packages/*
  - tools/*

# Exact versions only (no ranges), resolved from the npm registry.
savePrefix: ''
engineStrict: true

# Supply chain: never lower these values (SR-SUPPLY-01).
minimumReleaseAge: 1440
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  # Hooks are installed by the root prepare script (tools/git-hooks), never by the package postinstall (W1).
  lefthook: false
  # EVM-008: optional native SSH acceleration of docker-modem (transitive dependency of @testcontainers/postgresql);
  # Testcontainers talks to the local Docker socket, so the native builds are never needed (SR-SUPPLY-06, B11).
  cpu-features: false
  ssh2: false
  # EVM-008: protobufjs (transitive via dockerode -> testcontainers) has a legacy postinstall that only tries to run
  # the CLI dependency installer; it is unused here, so the script stays blocked (SR-SUPPLY-06).
  protobufjs: false
  # EVM-009: @parcel/watcher (transitive via jest-haste-map and Expo CLI) only compiles a native file watcher from source when no
  # prebuilt binary matches; the prebuilt optional packages are used, so the script stays blocked (SR-SUPPLY-06).
  '@parcel/watcher': false
  # EVM-009: unrs-resolver (transitive via jest-resolve) has a postinstall that only checks for its prebuilt binding package, which
  # comes from optional dependencies, so the script stays blocked (SR-SUPPLY-06).
  unrs-resolver: false

  # EVM-068: sharp 0.35.5 (Apache-2.0; services/media-processor) ships prebuilt libvips in the optional packages @img/sharp-* and
  # @img/sharp-libvips-* (LGPL-3.0, dynamically linked, never modified; integrity pinned in the lockfile). Its only build script
  # compiles from source when no prebuilt binary matches, which we never want (a compiler toolchain in the image), so it stays blocked (SR-SUPPLY-06).
  sharp: false

catalog:
  '@types/node': 26.6.3
  '@vitest/coverage-v8': 5.0.3
  eslint: 10.11.0
  typescript: 6.0.3
  vitest: 5.0.3

# Security overrides — each with advisories and an exit condition (SR-SUPPLY-02).
overrides:
  # EVM-008: @hey-api/json-schema-ref-parser 1.4.4 (build-time dependency of @hey-api/openapi-ts) pins js-yaml 4.2.0
  # (GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh: CPU exhaustion on crafted YAML). 4.3.2 is a
  # compatible patch release. Remove when the generator ships js-yaml >= 4.3.2.
  'js-yaml@4.2.0': 4.3.2
  # EVM-009: uuid@7.0.3 (via xcode@3.0.1 <- @expo/config-plugins, prebuild only) carries GHSA-w5hq-g745-h8pq (missing buffer bounds
  # check in v3/v5/v6 when a buffer is passed; fixed in 11.1.1). xcode only calls v4(), so it is not reachable, but the scan is
  # blocking and 11.1.1 is the first fixed release that still ships CommonJS (xcode uses require). Remove when xcode drops uuid 7.
  'uuid@7.0.3': 11.1.1
  # node-forge@1.4.0 (via @expo/cli and @expo/code-signing-certificates, dev tooling only, not shipped in the APK or the API) carries
  # five High advisories published 2026-10-30 (fixed in 1.4.1). Remove when Expo ships node-forge >= 1.4.1.
  'node-forge@1.4.0': 1.4.1
  # Maintenance: vite 8.3.2 (auto-installed peer of vitest in the non-web workspaces) bundles launch-editor with
  # GHSA-587h-7wmj-h5pm, GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw. 8.3.4 is a compatible patch release.
  # Remove when apps/web and the vitest peer resolve to the same vite >= 8.3.3 without this override.
  'vite@8.3.2': 8.3.4
  # Maintenance 2026-10-27: transitive advisories with a fixed patch/minor release of the same line (SR-SUPPLY-02).
  # body-parser 2.3.0 (express 5.2.1, range ^2.2.1): GHSA-27r3-jxmh-p828. Remove when express ships body-parser >= 2.4.0.
  'body-parser@2.3.0': 2.4.0
  # multer 2.4.0 (pinned exactly by @nestjs/platform-express 12.1.2 and 12.2.0): GHSA-q7qp-rjg7-q26m, fixed in 2.5.0.
  # Remove when @nestjs/platform-express ships multer >= 2.5.0.
  'multer@2.4.0': 2.5.0
  # undici 8.11.2 (jsdom 30.1.1 and testcontainers 12.2.0, test-only, range ^8.10.2): GHSA-xjj6-f33q-929c,
  # GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472, fixed in 8.12.2. Remove when both resolve undici >= 8.12.2 without this override.
  'undici@8.11.2': 8.12.3
  # zod 3.25.76 (@expo/cli 58.1.13, range ^3.25.76; Expo dev tooling only, schemas of dev-tools plugins and MCP, which use only
  # basic z.object/enum/string/union/array calls): GHSA-mrhx-c7xc-m3w5 is fixed only in 4.6.6. Remove when @expo/cli uses zod >= 4.6.6.
  'zod@3.25.76': 4.6.6
patchedDependencies:
  busboy@1.6.0: patches/busboy@1.6.0.patch
  streamsearch@1.1.0: patches/streamsearch@1.1.0.patch
