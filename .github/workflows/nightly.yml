# Nightly scans of main (EVM-006, SR-SUPPLY-02): full history of secrets, SAST, dependencies and the scanner
# self-test; `pnpm audit` as a second source (report only). A failed run sends GitHub's e-mail to Konrad.
name: nightly

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scans:
    name: scans
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Output directory writable for the scanner containers
        run: mkdir -p .scratch/scans && chmod 0777 .scratch/scans
      - name: Scans and scanner self-test
        run: node tools/scan/cli.mjs security
      - name: pnpm audit (report only — does not block, see docs/security/requirements.md, bramka 3)
        run: pnpm audit --audit-level=high || echo "pnpm audit reported vulnerabilities — triage with the OSV result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-scan-reports
          path: .scratch/scans/*.json
          if-no-files-found: warn
          retention-days: 14
