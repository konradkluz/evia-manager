# CI (EVM-006 AC4; ADR-0012, ADR-0016): the same commands as locally. On GitHub Free there is no ruleset — the
# single check `ci-gate` must be green before Konrad clicks "Squash and merge" (docs/ops/github-i-ci.md, K1–K7),
# and main-integrity.yml (K6) turns red when a commit reaches main any other way. K6 is a workflow of its own: the
# concurrency group below would cancel its pending runs.
# Rules (tested in tools/repo-policy): actions pinned to a full commit SHA with a version comment, explicit
# permissions per job, checkout without persisted credentials, no secrets, timeouts on every job.
# EVM-013 (bramka 11, SR-SUPPLY-11): the documentation lifecycle validator is the first step with a command of `quality`,
# before anything is installed; its exit code is the step's result (errors and code 2 turn ci-gate red, warnings do not).
# The step is fixed by tools/repo-policy (docsCheckStepProblems): no if, continue-on-error, env or expressions in run.
# EVM-083 (ADR-0018): minutes budget. A push to a branch runs only `quick` (documentation validator, lint, types) and
# NO `ci-gate` (the job is skipped, never success — the deployment verifier trusts the full runs only). The full set runs
# on `pull_request` to main, on `push` to main (always the full set) and on demand. `changes` (tools/ci-changes) marks a heavy job as unnecessary only for a pull_request: coverage when every
# changed file is documentation, e2e-web / backend-integration (EVM-086) when every changed file is listed as "not relevant"
# to that job; any doubt = the full set. `ci-gate` itself judges the results, because a skipped job counts as satisfied for
# a required check. E2E here runs Chromium only; the full run with Firefox is in nightly.yml (EVM-086).
name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # Fast checks for a push to a branch (EVM-083 AC1). Not part of ci-gate: the full run on the pull request is.
  quick:
    name: quick
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Documentation lifecycle validator (docs:check, bramka 11)
        shell: bash
        timeout-minutes: 2
        run: |
          status=0
          node tools/docs-lifecycle/cli.mjs check --summary >> "$GITHUB_STEP_SUMMARY" || status=$?
          exit "$status"
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec turbo run lint
      - name: Types
        run: pnpm exec turbo run typecheck

  # Change detection (EVM-083, EVM-086): `heavy` (coverage), `e2e` (e2e-web) and `integration` (backend-integration) are
  # false only when every changed file is on that output's explicit not-applicable list; fail closed (all true).
  # `mobile` (EVM-009; mobile-apk) is the one POSITIVE list: false when no changed file can change the Android package.
  changes:
    name: changes
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
      e2e: ${{ steps.detect.outputs.e2e }}
      integration: ${{ steps.detect.outputs.integration }}
      mobile: ${{ steps.detect.outputs.mobile }}
      # EVM-007: iac-check (AC1) and the release images (AC2, push to main only)
      iac: ${{ steps.detect.outputs.iac }}
      publish: ${{ steps.detect.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Change detection (heavy, e2e, integration, mobile)
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/ci-changes/cli.mjs

  quality:
    name: quality
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Report to the log (stderr), summary to the step summary (stdout); no pipe — the validator's exit code is kept.
      - name: Documentation lifecycle validator (docs:check, bramka 11)
        shell: bash
        timeout-minutes: 2
        run: |
          status=0
          node tools/docs-lifecycle/cli.mjs check --summary >> "$GITHUB_STEP_SUMMARY" || status=$?
          exit "$status"
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Lint
        run: pnpm exec turbo run lint
      - name: Types
        run: pnpm exec turbo run typecheck
      - name: Module boundaries
        run: pnpm run deps:check
      - name: Tests with coverage thresholds
        run: pnpm exec turbo run test:coverage
      - name: Build
        run: pnpm exec turbo run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-quality
          path: |
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
            tools/*/coverage/lcov.info
            services/*/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  backend:
    name: backend
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Output directories writable for the container users
        run: mkdir -p coverage/backend-tests .scratch/scans && chmod 0777 coverage/backend-tests .scratch/scans
      - name: Install Linux dependencies (backend-install)
        run: docker compose -f compose.yaml run --rm backend-install
      - name: Lint, types and tests with coverage on Linux (backend-tests)
        run: docker compose -f compose.yaml run --rm backend-tests pnpm run gate:backend
      - name: Licenses of production dependencies (bramka 4)
        run: node tools/scan/cli.mjs licenses
      # EVM-007 AC4: the root script of the VM (deploy.sh) and ShellCheck, in their Linux container, when they changed.
      - name: Tests of the deployment script of the VM (deploy-sh-tests)
        if: needs.changes.outputs.iac == 'true'
        run: docker compose -f compose.yaml run --rm deploy-sh-tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-backend
          path: coverage/backend-tests/
          if-no-files-found: error
          retention-days: 7

  # EVM-008 AC1: tests with PostgreSQL 18 (ICU pl-PL) through Testcontainers on the runner's Docker — the same image
  # and initdb arguments as compose.yaml (apps/api/test/support/postgres.ts). Their lcov report feeds diff-coverage.
  backend-integration:
    name: backend-integration
    needs: [changes]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Ephemeral runner: containers end with the job, so the (unpinned) Ryuk reaper image is not pulled.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build the contract (dependencies of @evia/api)
        run: pnpm exec turbo run build --filter=@evia/api^...
      - name: Integration tests with PostgreSQL (Testcontainers)
        run: pnpm --filter @evia/api run test:integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-integration
          path: apps/api/coverage/integration/lcov.info
          if-no-files-found: error
          retention-days: 7

  # EVM-008 AC5: Playwright E2E of the panel (smoke, security headers and CSP, keyboard, axe) against `vite preview` of
  # the production build — Chromium and Firefox on Linux; Windows with Edge is the local evidence (ADR-0015). The shell
  # needs no API or database. The report (synthetic data only) is uploaded on failure.
  # Two Playwright shards (matrix): a single job passed 20 min as the suite grew (~840 tests, ~16 min before failures and
  # retries). `needs.e2e-web.result` in ci-gate aggregates the matrix, so the required check keeps working unchanged.
  e2e-web:
    name: e2e-web (${{ matrix.shard }}/2)
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build the dependencies of the panel (contract client, design tokens)
        run: pnpm exec turbo run build --filter=@evia/web^...
      - name: Playwright browser (Chromium only; Firefox runs in nightly.yml)
        run: pnpm --filter @evia/web exec playwright install --with-deps chromium
      - name: E2E of the panel (Playwright, Chromium)
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter @evia/web run e2e --project=chromium --shard="$SHARD/2"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # EVM-009 AC5, AC6: the Android package of the app, built from the generated native project (`expo prebuild`, Gradle
  # assembleRelease) WITHOUT any secret and WITHOUT signing: the artifact is `*-release-unsigned.apk` (it cannot be installed).
  # The manifest, the XML resources and the contents of the finished package are verified (tools/mobile-apk), then the SHA-256 is
  # written to the summary. No Expo/EAS account, no telemetry. The package is signed LOCALLY by the owner (tools/mobile-apk sign,
  # docs/ops/dystrybucja-apk-android.md); CI holds no signing key and no secret (RR-21).
  # The API address of the build is the repository variable EVIA_API_BASE_URL (https only; a build with another scheme fails).
  mobile-apk:
    name: mobile-apk
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EVIA_API_BASE_URL || 'https://api.example.invalid' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build the dependencies of the app (design tokens, contract client)
        run: pnpm exec turbo run build --filter=@evia/mobile^...
      - name: Accept the Android SDK licenses (Gradle installs the missing platform and NDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Native project (expo prebuild, clean; the version code is the run number plus an offset)
        working-directory: apps/mobile
        run: |
          EVIA_ANDROID_VERSION_CODE="$((GITHUB_RUN_NUMBER + 100000))" pnpm exec expo prebuild --platform android --clean --no-install
      - name: Release package (Gradle assembleRelease, unsigned)
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Name the package (version from app.config, run number)
        id: name
        run: |
          version="$(node --input-type=module -e "import { APP_VERSION } from './apps/mobile/plugins/expo-config.ts'; process.stdout.write(APP_VERSION)")"
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/evia-manager-${version}-b${GITHUB_RUN_NUMBER}-release-unsigned.apk"
          echo "file=dist/evia-manager-${version}-b${GITHUB_RUN_NUMBER}-release-unsigned.apk" >> "$GITHUB_OUTPUT"
      - name: Verify the finished package (manifest, backup and network rules, secrets in the contents)
        env:
          APK: ${{ steps.name.outputs.file }}
        run: node tools/mobile-apk/cli.mjs verify --apk "$APK"
      # No repository variable: the package carries the placeholder address (api.example.invalid). Said loudly, not only in a comment.
      - name: Placeholder API address warning (summary and annotation)
        if: ${{ vars.EVIA_API_BASE_URL == '' }}
        shell: bash
        run: |
          {
            echo '### Uwaga: adres zastępczy API'
            echo
            echo 'APK zbudowany z adresem zastępczym API — nie do dystrybucji. Ustaw zmienną repozytorium EVIA_API_BASE_URL i zbuduj ponownie.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::warning title=Adres zastępczy API::APK zbudowany z adresem zastępczym API — nie do dystrybucji (brak zmiennej repozytorium EVIA_API_BASE_URL).'
      - name: SHA-256 of the package to the summary
        env:
          APK: ${{ steps.name.outputs.file }}
        run: node tools/mobile-apk/cli.mjs digest --apk "$APK"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-apk-unsigned
          path: dist/*-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  security:
    name: security
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Scans and scanner self-test (gitleaks, Semgrep, OSV, Trivy, zizmor, actionlint, Renovate config)
        run: node tools/scan/cli.mjs security
      # EVM-007 AC1: OpenTofu without credentials (fmt -check, init without a backend from the lock files, validate);
      # Trivy config of infra/ runs in the scans above. Only when the IaC code, its container, compose files or workflows changed.
      - name: IaC checks without credentials (iac-check)
        if: needs.changes.outputs.iac == 'true'
        run: docker compose -f compose.yaml run --rm iac-check
      - name: Sensitive files changed in this push (K3)
        if: always()
        run: |
          base="$(git merge-base HEAD origin/main)"
          if [ "$base" = "$(git rev-parse HEAD)" ]; then base="$(git rev-parse HEAD^)"; fi
          {
            echo "### Zmienione pliki wrażliwe (K3) — wymagają jawnej uwagi Konrada"
            git diff --name-only "$base" HEAD -- .github .claude 'compose*.yaml' lefthook.yml .gitleaks.toml .gitleaksignore \
              osv-scanner.toml trivy.yaml .trivyignore.yaml zizmor.yml .semgrepignore .semgrep renovate.json pnpm-workspace.yaml \
              infra services/deploy-agent tools/staging-verify \
              | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scan-reports
          path: .scratch/scans/*.json
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: coverage
    needs: [changes, quality, backend, backend-integration]
    # backend-integration may be skipped ("not relevant", EVM-086 AC3) and must not skip coverage with it: no implicit
    # success(); a failed or cancelled dependency still skips coverage and ci-gate goes red.
    if: needs.changes.outputs.heavy == 'true' && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov-quality
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov-backend
          path: coverage/backend-tests
      # SF paths of this report are relative to the repository root (lcov projectRoot), so its workspace is ".".
      # Absent only when changes reported integration=false (EVM-086 AC3); otherwise a missing artifact fails the job.
      - if: needs.changes.outputs.integration == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov-integration
          path: coverage/backend-tests/integration
      - name: Changed-code coverage ≥ 90% (diff-coverage)
        run: node tools/diff-coverage/cli.mjs

  # ci-gate (K1): runs in full runs only (never for a push to a branch). Requires `changes` success and every job
  # success; e2e-web may be skipped only when `changes` reported e2e=false, backend-integration only with
  # integration=false, mobile-apk only with mobile=false and coverage only with heavy=false — and must then be skipped. Failure, cancelled, a skip
  # without its own not-applicable output, a missing job or an unreadable output = red.
  ci-gate:
    name: ci-gate
    if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    needs: [changes, quality, backend, backend-integration, e2e-web, mobile-apk, security, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job succeeded (failure, cancelled or missing = red; skipped only for a documentation-only change)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '(keys == ["backend", "backend-integration", "changes", "coverage", "e2e-web", "mobile-apk", "quality", "security"]) and (.changes.result == "success") and (.changes.outputs as $o | ($o.heavy == "true" or $o.heavy == "false") and ($o.e2e == "true" or $o.e2e == "false") and ($o.integration == "true" or $o.integration == "false") and ($o.mobile == "true" or $o.mobile == "false") and ($o.heavy == "true" or ($o.e2e == "false" and $o.integration == "false" and $o.mobile == "false")) and all(.quality, .backend, .security; .result == "success") and (.["e2e-web"].result == (if $o.e2e == "true" then "success" else "skipped" end)) and (.["backend-integration"].result == (if $o.integration == "true" then "success" else "skipped" end)) and (.["mobile-apk"].result == (if $o.mobile == "true" then "success" else "skipped" end)) and (.coverage.result == (if $o.heavy == "true" then "success" else "skipped" end)))' > /dev/null

  # EVM-007 AC2 (ADR-0018 "Publikacja hermetyczna"; security-engineer A4, A5; architect 18–20): the release images, only
  # for a push to main that changed a build input (changes.publish), after a green ci-gate — never for a pull request, a
  # branch, a manual or a scheduled run. Hermetic: no cache of any kind (no actions/cache, no setup-node, no buildx cache,
  # --no-cache --pull), bases by digest, nothing from the registry of the project, no download-artifact, no output of
  # another job as a build input. Bramka 6 before anything leaves the runner: Trivy on the saved images (Critical/High with
  # a fix = red) and the CycloneDX SBOM; the infrastructure images of the VM (infra/runtime/infra-images.json) in the same
  # gate. Then the push to GHCR (GITHUB_TOKEN, packages: write — this job only) and the `release-manifest` artifact read by
  # the deployment verifier on the VM (V3). manifestSha256 = SHA-256 of the exact bytes of release-manifest.json
  # (services/deploy-agent/README.md). Not a dependency of ci-gate: a red publish blocks the deployment, not the merge.
  publish:
    name: publish
    needs: [changes, ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success' && needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      manifestSha256: ${{ steps.manifest.outputs.sha256 }}
    env:
      EVIA_RELEASE_COMMIT: ${{ github.sha }}
      REGISTRY: ghcr.io/konradkluz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Output directories (scans, release)
        run: mkdir -p .scratch/scans release && chmod 0777 .scratch/scans
      # The VM is Hetzner Arm64 (CAX): the release images are cross-built for linux/arm64 on this x86 runner without
      # emulation (no QEMU — build stages on $BUILDPLATFORM, runtime stages only copy; tools/repo-policy release.ts),
      # the infrastructure images are pulled for linux/arm64 from their multi-arch index digests; both are checked to be
      # linux/arm64 before the scan.
      - name: Build the release images for linux/arm64 (no cache, fresh bases by digest)
        shell: bash
        run: |
          for image in api web; do
            docker buildx build --no-cache --pull --provenance=false --sbom=false --platform linux/arm64 \
              --build-arg EVIA_RELEASE_COMMIT="$EVIA_RELEASE_COMMIT" \
              --file "infra/images/$image/Dockerfile" --tag "evia-$image:candidate" --load .
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "evia-$image:candidate")"
            if [ "$platform" != linux/arm64 ]; then echo "evia-$image is $platform, not linux/arm64" >&2; exit 1; fi
            docker save "evia-$image:candidate" --output ".scratch/scans/evia-$image.tar"
          done
          for ref in $(jq -r '.images[]' infra/runtime/infra-images.json); do
            name="infra-$(echo "$ref" | sed -E 's#^([^/:@]+/)*([^/:@]+).*#\2#')"
            docker pull --platform linux/arm64 "$ref"
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ref")"
            if [ "$platform" != linux/arm64 ]; then echo "$ref is $platform, not linux/arm64" >&2; exit 1; fi
            docker save "$ref" --output ".scratch/scans/$name.tar"
          done
          # docker save writes the archives as 0600 owned by the runner user; the scanner runs as 65534 (compose.yaml)
          # and only needs to read them (the mount stays as it is, the scanner does not run as root).
          chmod a+r .scratch/scans/*.tar
      - name: Image scan and SBOM before the push (bramka 6, Critical/High with a fix = red)
        shell: bash
        run: |
          for archive in .scratch/scans/*.tar; do
            name="$(basename "$archive" .tar)"
            docker compose -f compose.yaml run --rm scan-trivy-image image --config /src/trivy.yaml --skip-version-check \
              --input "/out/$name.tar" --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --format json --output "/out/trivy-image-$name.json"
            docker compose -f compose.yaml run --rm scan-trivy-image image --config /src/trivy.yaml --skip-version-check \
              --skip-db-update --input "/out/$name.tar" --format cyclonedx --output "/out/sbom-$name.cdx.json"
          done
      - name: Push to GHCR and read the digests
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        shell: bash
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          for image in api web; do
            target="$REGISTRY/evia-$image:sha-$EVIA_RELEASE_COMMIT"
            docker tag "evia-$image:candidate" "$target"
            docker push "$target" | tee "release/push-$image.log"
            digest="$(grep -oE 'digest: sha256:[0-9a-f]{64}' "release/push-$image.log" | tail -n 1 | cut -d' ' -f2)"
            if ! echo "$digest" | grep -qE '^sha256:[0-9a-f]{64}$'; then echo "no digest for evia-$image" >&2; exit 1; fi
            echo "$REGISTRY/evia-$image@$digest" > "release/$image.ref"
          done
      - name: Release manifest (commit, digests, compose path)
        id: manifest
        shell: bash
        run: |
          jq -n --arg commit "$EVIA_RELEASE_COMMIT" --arg api "$(cat release/api.ref)" --arg web "$(cat release/web.ref)" \
            '{schemaVersion: 1, commit: $commit, images: {api: $api, web: $web}, compose: "infra/runtime/compose.staging.yaml"}' \
            > release/release-manifest.json
          jq -e --arg commit "$EVIA_RELEASE_COMMIT" '(.commit == $commit) and (.commit | test("^[0-9a-f]{40}$")) and ([.images[]] | all(test("^ghcr\\.io/konradkluz/evia-(api|web)@sha256:[0-9a-f]{64}$")))' release/release-manifest.json > /dev/null
          sha="$(sha256sum release/release-manifest.json | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "### release-manifest" >> "$GITHUB_STEP_SUMMARY"
          echo "commit $EVIA_RELEASE_COMMIT, manifestSha256 $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: release/release-manifest.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            .scratch/scans/sbom-*.cdx.json
            .scratch/scans/trivy-image-*.json
          if-no-files-found: error
          retention-days: 90
      # GHCR retention (n2; architect 20): dry-run until the IaC session confirms that GITHUB_TOKEN may delete versions;
      # fail-closed — an unreadable manifest of the last 30 push runs on main means nothing is deleted.
      - name: GHCR retention (dry-run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHCR_RETENTION_MODE: dry-run
        run: node tools/ghcr-retention/cli.mjs
      - name: Notice when staging-verify is disabled (a skipped bramka 10 is not a pass)
        if: vars.STAGING_VERIFY_ENABLED != 'true'
        run: echo "::warning title=staging-verify::STAGING_VERIFY_ENABLED is not true - bramka 10 did not run for this release"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # EVM-007 AC6 (bramka 10; ADR-0018 "Staging"; security-engineer B; plan P8): after publish, wait until /version of
  # staging reports this commit and the manifestSha256 of publish, then check from the runner — anonymously, without
  # any secret — ports (only 80/443; plain TCP connects, no new tool), TLS, headers, DNS and the anonymous ZAP baseline.
  # Red on a mismatch after the waiting time or on any violated check; the result in the summary and the artifact
  # `staging-verified`. Runs only when the repository variable STAGING_VERIFY_ENABLED is 'true' (set in the IaC session
  # once staging exists — a skipped run is never a pass: publish writes a warning and the release sign-off requires
  # true). contents: read is the minimum for the checkout of a private repository; no other permission.
  staging-verify:
    name: staging-verify
    needs: [publish]
    if: needs.publish.result == 'success' && vars.STAGING_VERIFY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_COMMIT: ${{ github.sha }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.publish.outputs.manifestSha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Wait for /version (the commit and manifest of publish)
        run: node tools/staging-verify/cli.mjs wait
      - name: Ports, TLS, headers and DNS
        run: node tools/staging-verify/cli.mjs checks
      - name: Anonymous ZAP baseline (bramka 10)
        run: |
          mkdir -p .scratch/scans && chmod 0777 .scratch/scans
          docker compose -f compose.yaml run --rm zap-baseline
      - name: Result (summary and staging-verified)
        if: always()
        env:
          ZAP_REPORT: .scratch/scans/zap-staging.json
          ZAP_RULES: infra/zap/rules.tsv
        run: node tools/staging-verify/cli.mjs report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: staging-verified
          path: .scratch/staging-verify/
          if-no-files-found: error
          retention-days: 90
