# CI (EVM-006 AC4; ADR-0012, ADR-0016): the same commands as locally. On GitHub Free there is no ruleset — the
# single check `ci-gate` must be green before Konrad clicks "Squash and merge" (docs/ops/github-i-ci.md, K1–K7),
# and main-integrity.yml (K6) turns red when a commit reaches main any other way. K6 is a workflow of its own: the
# concurrency group below would cancel its pending runs.
# Rules (tested in tools/repo-policy): actions pinned to a full commit SHA with a version comment, explicit
# permissions per job, checkout without persisted credentials, no secrets, timeouts on every job.
# EVM-013 (bramka 11, SR-SUPPLY-11): the documentation lifecycle validator is the first step with a command of `quality`,
# before anything is installed; its exit code is the step's result (errors and code 2 turn ci-gate red, warnings do not).
# The step is fixed by tools/repo-policy (docsCheckStepProblems): no if, continue-on-error, env or expressions in run.
# EVM-083 (ADR-0018): minutes budget. A push to a branch runs only `quick` (documentation validator, lint, types) and
# NO `ci-gate` (the job is skipped, never success — the deployment verifier trusts the full runs only). The full set runs
# on `pull_request` to main, on `push` to main (always the full set) and on demand. `changes` (tools/ci-changes) marks a heavy job as unnecessary only for a pull_request: coverage when every
# changed file is documentation, e2e-web / backend-integration (EVM-086) when every changed file is listed as "not relevant"
# to that job; any doubt = the full set. `ci-gate` itself judges the results, because a skipped job counts as satisfied for
# a required check. E2E here runs Chromium only; the full run with Firefox is in nightly.yml (EVM-086).
name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # Fast checks for a push to a branch (EVM-083 AC1). Not part of ci-gate: the full run on the pull request is.
  quick:
    name: quick
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Documentation lifecycle validator (docs:check, bramka 11)
        shell: bash
        timeout-minutes: 2
        run: |
          status=0
          node tools/docs-lifecycle/cli.mjs check --summary >> "$GITHUB_STEP_SUMMARY" || status=$?
          exit "$status"
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec turbo run lint
      - name: Types
        run: pnpm exec turbo run typecheck

  # Change detection (EVM-083, EVM-086): `heavy` (coverage), `e2e` (e2e-web) and `integration` (backend-integration) are
  # false only when every changed file is on that output's explicit not-applicable list; fail closed (all true).
  changes:
    name: changes
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
      e2e: ${{ steps.detect.outputs.e2e }}
      integration: ${{ steps.detect.outputs.integration }}
      # EVM-007: iac-check (AC1) and the release images (AC2, push to main only)
      iac: ${{ steps.detect.outputs.iac }}
      publish: ${{ steps.detect.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Change detection (heavy, e2e, integration)
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/ci-changes/cli.mjs

  quality:
    name: quality
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Report to the log (stderr), summary to the step summary (stdout); no pipe — the validator's exit code is kept.
      - name: Documentation lifecycle validator (docs:check, bramka 11)
        shell: bash
        timeout-minutes: 2
        run: |
          status=0
          node tools/docs-lifecycle/cli.mjs check --summary >> "$GITHUB_STEP_SUMMARY" || status=$?
          exit "$status"
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Lint
        run: pnpm exec turbo run lint
      - name: Types
        run: pnpm exec turbo run typecheck
      - name: Module boundaries
        run: pnpm run deps:check
      - name: Tests with coverage thresholds
        run: pnpm exec turbo run test:coverage
      - name: Build
        run: pnpm exec turbo run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-quality
          path: |
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
            tools/*/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  backend:
    name: backend
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Output directories writable for the container users
        run: mkdir -p coverage/backend-tests .scratch/scans && chmod 0777 coverage/backend-tests .scratch/scans
      - name: Install Linux dependencies (backend-install)
        run: docker compose -f compose.yaml run --rm backend-install
      - name: Lint, types and tests with coverage on Linux (backend-tests)
        run: docker compose -f compose.yaml run --rm backend-tests pnpm run gate:backend
      - name: Licenses of production dependencies (bramka 4)
        run: node tools/scan/cli.mjs licenses
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-backend
          path: coverage/backend-tests/
          if-no-files-found: error
          retention-days: 7

  # EVM-008 AC1: tests with PostgreSQL 18 (ICU pl-PL) through Testcontainers on the runner's Docker — the same image
  # and initdb arguments as compose.yaml (apps/api/test/support/postgres.ts). Their lcov report feeds diff-coverage.
  backend-integration:
    name: backend-integration
    needs: [changes]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Ephemeral runner: containers end with the job, so the (unpinned) Ryuk reaper image is not pulled.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build the contract (dependencies of @evia/api)
        run: pnpm exec turbo run build --filter=@evia/api^...
      - name: Integration tests with PostgreSQL (Testcontainers)
        run: pnpm --filter @evia/api run test:integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-integration
          path: apps/api/coverage/integration/lcov.info
          if-no-files-found: error
          retention-days: 7

  # EVM-008 AC5: Playwright E2E of the panel (smoke, security headers and CSP, keyboard, axe) against `vite preview` of
  # the production build — Chromium and Firefox on Linux; Windows with Edge is the local evidence (ADR-0015). The shell
  # needs no API or database. The report (synthetic data only) is uploaded on failure.
  # Two Playwright shards (matrix): a single job passed 20 min as the suite grew (~840 tests, ~16 min before failures and
  # retries). `needs.e2e-web.result` in ci-gate aggregates the matrix, so the required check keeps working unchanged.
  e2e-web:
    name: e2e-web (${{ matrix.shard }}/2)
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build the dependencies of the panel (contract client, design tokens)
        run: pnpm exec turbo run build --filter=@evia/web^...
      - name: Playwright browser (Chromium only; Firefox runs in nightly.yml)
        run: pnpm --filter @evia/web exec playwright install --with-deps chromium
      - name: E2E of the panel (Playwright, Chromium)
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter @evia/web run e2e --project=chromium --shard="$SHARD/2"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: security
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Scans and scanner self-test (gitleaks, Semgrep, OSV, Trivy, zizmor, actionlint, Renovate config)
        run: node tools/scan/cli.mjs security
      # EVM-007 AC1: OpenTofu without credentials (fmt -check, init without a backend from the lock files, validate);
      # Trivy config of infra/ runs in the scans above. Only when the IaC code, its container, compose files or workflows changed.
      - name: IaC checks without credentials (iac-check)
        if: needs.changes.outputs.iac == 'true'
        run: docker compose -f compose.yaml run --rm iac-check
      - name: Sensitive files changed in this push (K3)
        if: always()
        run: |
          base="$(git merge-base HEAD origin/main)"
          if [ "$base" = "$(git rev-parse HEAD)" ]; then base="$(git rev-parse HEAD^)"; fi
          {
            echo "### Zmienione pliki wrażliwe (K3) — wymagają jawnej uwagi Konrada"
            git diff --name-only "$base" HEAD -- .github .claude 'compose*.yaml' lefthook.yml .gitleaks.toml .gitleaksignore \
              osv-scanner.toml trivy.yaml .trivyignore.yaml zizmor.yml .semgrepignore .semgrep renovate.json pnpm-workspace.yaml \
              | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scan-reports
          path: .scratch/scans/*.json
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: coverage
    needs: [changes, quality, backend, backend-integration]
    # backend-integration may be skipped ("not relevant", EVM-086 AC3) and must not skip coverage with it: no implicit
    # success(); a failed or cancelled dependency still skips coverage and ci-gate goes red.
    if: needs.changes.outputs.heavy == 'true' && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov-quality
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov-backend
          path: coverage/backend-tests
      # SF paths of this report are relative to the repository root (lcov projectRoot), so its workspace is ".".
      # Absent only when changes reported integration=false (EVM-086 AC3); otherwise a missing artifact fails the job.
      - if: needs.changes.outputs.integration == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov-integration
          path: coverage/backend-tests/integration
      - name: Changed-code coverage ≥ 90% (diff-coverage)
        run: node tools/diff-coverage/cli.mjs

  # ci-gate (K1): runs in full runs only (never for a push to a branch). Requires `changes` success and every job
  # success; e2e-web may be skipped only when `changes` reported e2e=false, backend-integration only with
  # integration=false and coverage only with heavy=false — and must then be skipped. Failure, cancelled, a skip
  # without its own not-applicable output, a missing job or an unreadable output = red.
  ci-gate:
    name: ci-gate
    if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    needs: [changes, quality, backend, backend-integration, e2e-web, security, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job succeeded (failure, cancelled or missing = red; skipped only for a documentation-only change)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '(keys == ["backend", "backend-integration", "changes", "coverage", "e2e-web", "quality", "security"]) and (.changes.result == "success") and (.changes.outputs as $o | ($o.heavy == "true" or $o.heavy == "false") and ($o.e2e == "true" or $o.e2e == "false") and ($o.integration == "true" or $o.integration == "false") and ($o.heavy == "true" or ($o.e2e == "false" and $o.integration == "false")) and all(.quality, .backend, .security; .result == "success") and (.["e2e-web"].result == (if $o.e2e == "true" then "success" else "skipped" end)) and (.["backend-integration"].result == (if $o.integration == "true" then "success" else "skipped" end)) and (.coverage.result == (if $o.heavy == "true" then "success" else "skipped" end)))' > /dev/null
