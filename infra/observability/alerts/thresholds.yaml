# Thresholds of the alert layer (EVM-085 AC2, AC5; architect 5). The ONLY place where a threshold of a rule lives:
# rules.tmpl.yaml refers to these keys in dollar-brace form; `node infra/observability/render-rules.mjs` writes rules.yaml, which is what
# promtool tests and the OpenTofu module read (a test fails when rules.yaml is stale). Flat `key: value` only (no YAML library).
# Not here: the thresholds of EVM-026 spikes (failed logins, failed second steps) — the application decides when a spike
# happens and emits the event (alertCode); this layer only counts events. Calibration on staging: the environment variable
# of the API (decision D1 in the story).

# Deployment channel (EVM-007)
heartbeat_max_age_seconds: 600
head_mismatch_max_seconds: 1800
github_rate_limit_min_remaining: 200

# Expiry of PATs and keys (names and dates in expiries.json, written in the IaC session)
token_expiry_warn_days: 30

# Backups and the restore test (EVM-084; contract of metric names: docs/ops/runbooks/restore.md)
backup_max_age_seconds: 93600
media_copy_max_age_seconds: 129600
restore_test_max_age_seconds: 3024000
restore_rpo_max_seconds: 900
sweeper_max_silence_seconds: 10800

# Missing data (the check that the alerts themselves work)
no_data_for: 15m

# Limits of the free plans (Grafana Cloud Free: 10 000 active series, 50 GB logs per month); alarm at this share
usage_warn_ratio: 0.8
grafana_active_series_limit: 10000
grafana_logs_bytes_limit: 50000000000

# Security (events counted from the application logs, window and counts)
security_window: 15m
security_min_events: 1
account_locked_burst_min: 5
