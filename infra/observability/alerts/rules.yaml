# GENERATED by infra/observability/render-rules.mjs from rules.tmpl.yaml and thresholds.yaml; do not edit by hand.
# Alert rules of staging (EVM-085 AC2, AC5; architect 5, 6; security A14). Prometheus format, tested by promtool.
# Template: placeholders in dollar-brace form come from thresholds.yaml; the result is rules.yaml (node infra/observability/render-rules.mjs).
# Every alert has a section in docs/ops/runbooks/alerty.md (test: infra/observability/test/alerts.test.mjs).
# Annotations hold the alert name, the environment, a closed-list label and a link only — never a log line or a free label (V16.2.5).
# The decision rule: no deployment decision reads these data (RR-24); the metrics are written by the agent, never read from Grafana.
groups:
  - name: deploy-channel
    rules:
      - alert: EviaDeployAgentHeartbeatMissing
        expr: (time() - evia_deploy_agent_last_success_timestamp_seconds{env="staging"}) > 600
        for: 1m
        labels: { severity: critical, ac2: heartbeat }
        annotations:
          summary: 'Deployment agent has not completed a cycle for more than 600 s (env {{ $labels.env }})'
          runbook: docs/ops/runbooks/alerty.md#eviadeployagentheartbeatmissing
      - alert: EviaDeployedCommitBehindMain
        expr: evia_deploy_agent_main_head_mismatch_since_seconds{env="staging"} > 1800
        for: 1m
        labels: { severity: warning, ac2: head-mismatch }
        annotations:
          summary: 'HEAD of main differs from the deployed commit for more than 1800 s (env {{ $labels.env }})'
          runbook: docs/ops/runbooks/alerty.md#eviadeployedcommitbehindmain
      - alert: EviaDeployBlockedV0
        expr: evia_deploy_agent_v0_blocked{env="staging"} == 1
        for: 1m
        labels: { severity: critical, ac2: v0-block }
        annotations:
          summary: 'Deployment refused by the verifier (gate V0) (env {{ $labels.env }})'
          runbook: docs/ops/runbooks/alerty.md#eviadeployblockedv0
      - alert: EviaTokenExpiresSoon
        expr: (evia_token_expiry_timestamp_seconds{env="staging"} - time()) < 30 * 86400
        for: 5m
        labels: { severity: warning, ac2: token-expiry }
        annotations:
          summary: 'Token or key {{ $labels.token }} expires within 30 days (env {{ $labels.env }})'
          runbook: docs/ops/runbooks/alerty.md#eviatokenexpiressoon
      - alert: EviaGithubApiLimitLow
        expr: evia_github_rate_limit_remaining{env="staging"} < 200
        for: 5m
        labels: { severity: warning, ac2: api-limit }
        annotations:
          summary: 'GitHub API limit of the agent is almost exhausted: below 200 requests left (env {{ $labels.env }})'
          runbook: docs/ops/runbooks/alerty.md#eviagithubapilimitlow
  - name: backup
    rules:
      - alert: EviaBackupFailed
        expr: |
          evia_backup_last_failed{env="staging"} == 1
          or (time() - evia_backup_last_success_timestamp_seconds{env="staging"}) > 93600
        for: 1m
        labels: { severity: critical, ac2: backup }
        annotations:
          summary: 'Database backup failed or is older than 93600 s (env {{ $labels.env }})'
          runbook: docs/ops/runbooks/alerty.md#eviabackupfailed
      - alert: EviaMediaCopyFailed
        expr: |
          evia_media_copy_last_failed{env="staging"} == 1
          or (time() - evia_media_copy_last_success_timestamp_seconds{env="staging"}) > 129600
        for: 1m
        labels: { severity: critical, ac2: backup }
        annotations:
          summary: 'Media copy failed or is older than 129600 s (env {{ $labels.env }})'
          runbook: docs/ops/runbooks/alerty.md#eviamediacopyfailed
      - alert: EviaRestoreTestFailed
        expr: |
          evia_restore_test_last_run_failed{env="staging"} == 1
          or (time() - evia_restore_test_last_success_timestamp_seconds{env="staging"}) > 3024000
          or evia_restore_test_last_rpo_seconds{env="staging"} > 900
          or evia_restore_repo_heal_failed{env="staging"} == 1
        for: 1m
        labels: { severity: critical, ac2: backup }
        annotations:
          summary: 'Restore test failed, is overdue, exceeded the RPO or left the backup repository inconsistent (env {{ $labels.env }})'
          runbook: docs/ops/runbooks/alerty.md#eviarestoretestfailed
      - alert: EviaRestoreResourcesLeftover
        expr: |
          evia_restore_sweeper_last_deleted{env="staging"} > 0
          or evia_restore_sweeper_last_run_failed{env="staging"} == 1
          or (time() - evia_restore_sweeper_last_run_timestamp_seconds{env="staging"}) > 10800
        for: 1m
        labels: { severity: warning, ac2: restore-resources }
        annotations:
          summary: 'Restore test resources older than 24 h were found, or the sweeper is failing or silent (env {{ $labels.env }})'
          runbook: docs/ops/runbooks/alerty.md#eviarestoreresourcesleftover
  - name: usage
    rules:
      - alert: EviaGrafanaUsageHigh
        expr: |
          grafanacloud_instance_active_series > 0.8 * 10000
          or increase(loki_write_sent_bytes_total{env="staging"}[30d]) > 0.8 * 50000000000
        for: 15m
        labels: { severity: warning, ac2: usage-limits }
        annotations:
          summary: 'Usage of the free Grafana limits is above 0.8 of the limit (series or log volume)'
          runbook: docs/ops/runbooks/alerty.md#eviagrafanausagehigh
  - name: absent
    rules:
      - alert: EviaStagingNoData
        expr: absent(node_textfile_scrape_error{env="staging"})
        for: 15m
        labels: { severity: critical, ac2: no-data }
        annotations:
          summary: 'No metrics from staging for 15m: Alloy, the VM or the telemetry channel is down (env staging)'
          runbook: docs/ops/runbooks/alerty.md#eviastagingnodata
  - name: security
    rules:
      - alert: EviaSecurityAlert
        expr: sum by (alertCode, env) (increase(loki_process_custom_security_alerts_total{env="staging"}[15m])) >= 1
        for: 0m
        labels: { severity: critical, ac5: security }
        annotations:
          summary: 'Security alert {{ $labels.alertCode }} from the application (env {{ $labels.env }})'
          runbook: docs/ops/runbooks/alerty.md#eviasecurityalert
      - alert: EviaSecurityAccountLockedBurst
        expr: sum by (env) (increase(loki_process_custom_security_alerts_total{env="staging", alertCode="account_locked"}[15m])) >= 5
        for: 0m
        labels: { severity: critical, ac5: security }
        annotations:
          summary: 'Many account locks in 15m: possible attack (env {{ $labels.env }})'
          runbook: docs/ops/runbooks/alerty.md#eviasecurityaccountlockedburst
