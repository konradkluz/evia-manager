# PostgreSQL settings for the WAL archive (EVM-084 AC1; ADR-0011: RPO <= 15 min). Included by the IaC session together with the
# image infra/images/postgres-pgbackrest. archive_timeout 300 s: an idle staging still switches a WAL segment every 5 minutes.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest-wrapper --stanza=evia archive-push %p'
archive_timeout = 300
