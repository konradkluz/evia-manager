# pgBackRest of staging (EVM-084 AC1; ADR-0011; SR-DATA-04, SR-INFRA-07; security-engineer P8, architect 7). Baked into the image
# infra/images/postgres-pgbackrest. NO secret here: the cipher password and the S3 secret come from the files
# /run/secrets/pgbackrest-cipher-pass and /run/secrets/backup-s3-secret-access-key through pgbackrest-wrapper; the (non-secret)
# access key id comes from PGBACKREST_REPO1_S3_KEY in the compose file. TLS verification of the repository stays on (the default).
# Inactive until the image has a real digest and compose.infra.yaml is changed together with archive_command (IaC session).
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-endpoint=s3.pl-waw.scw.cloud
repo1-s3-region=pl-waw
repo1-s3-bucket=evia-staging-db-backup
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
# 30 days of point-in-time recovery: full backups younger than 35 days are kept (weekly full, daily differential)
repo1-retention-full-type=time
repo1-retention-full=35
repo1-retention-diff=14
compress-type=zst
start-fast=y
log-level-console=warn
log-level-file=off
spool-path=/tmp/pgbackrest

[evia]
pg1-path=/var/lib/postgresql/18/data
pg1-socket-path=/var/run/postgresql
pg1-user=evia_owner
