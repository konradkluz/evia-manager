# freshclam of the staging VM (EVM-084; Tech Lead decision 2026-11-13). Mounted read-only at /etc/evia-clamav/freshclam.conf; runs as uid 1000 without the root
# entrypoint of the image (see clamd.conf). It writes the signatures to the volume clamav-signatures, which clamd (another container) reads. No DatabaseOwner and no
# NotifyClamd: clamd is in another container on a network without egress, and it reloads a changed database itself (SelfCheck).
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
Foreground yes
# checks per day (the daemon also checks once at start)
Checks 12
