# clamd of the staging VM (EVM-084; Tech Lead decision 2026-11-13). Mounted read-only at /etc/evia-clamav/clamd.conf; the container runs as uid 1000
# (the clamav user of the image) WITHOUT the root entrypoint /init of the image: /init needs CAP_CHOWN and a writable /etc/clamav, which the hardened
# posture (cap_drop ALL, read_only) does not allow, so clamd never ran before 2026-11-13. These are the values that compose.infra.yaml used to pass as CLAMD_CONF_*.
# No User directive (it is already uid 1000); no pid file and no local socket (the worker uses TCP on the internal network evia-scan only).
Foreground yes
LogTime yes
TCPSocket 3310
DatabaseDirectory /var/lib/clamav
# EVM-085 AC2 (CAX11 variant A; ADR-0009 "przeładowanie nierównoległe"): without it clamd keeps BOTH databases in memory while it reloads the signatures
# (about 1.3 GB twice on a VM of 4 GB). With it the scan waits for the reload (tens of seconds, the worker retries a scan after 2 minutes; nothing becomes `clean` without a scan).
ConcurrentDatabaseReload no
# RR-44, EVM-046 (P5): limits above the largest scanned file (SCAN_LIMIT_BYTES of the API, 2 000 000 000 B) and below the ~2^31 B at which clamd stops scanning streams;
# AlertExceedsMax makes a file over the limit an error, never `clean` without a scan.
StreamMaxLength 2000M
MaxFileSize 2000M
MaxScanSize 2000M
AlertExceedsMax yes
# EVM-047 (P5 point 2, SR-FILE-04): macros in OLE2 containers are alerts, the nesting and the number of files of an archive are bounded (zip bombs), an encrypted archive
# is an alert, an encrypted office document is left to the type check of the API.
AlertOLE2Macros yes
MaxRecursion 16
MaxFiles 10000
AlertEncryptedArchive yes
AlertEncryptedDoc no
# EVM-046: the scratch space of the streams (a disk volume: the second partition of the work volume, dm-crypt); a full or missing directory is an error of the scan.
TemporaryDirectory /scan-tmp
ReadTimeout 300
CommandReadTimeout 30
# P5: no statistics and no samples leave the system - no option that reports detections is set (clamd has no egress to report to).
