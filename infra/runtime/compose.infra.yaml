# Infrastructure of the staging VM (EVM-007 AC1, AC5; ADR-0018 V4 "stała lista obrazów infrastruktury"; architect 3;
# security-engineer A6, B "Caddy"). Installed ONLY in an IaC session at /etc/evia/runtime/compose.infra.yaml and run as
#   docker compose --project-name evia-infra -f /etc/evia/runtime/compose.infra.yaml up -d
# — never by the deployment channel, which therefore cannot change the edge Caddy, TLS or the database. Images by
# tag + digest from infra/runtime/infra-images.json (scanned with the release images in `publish`, bramka 6).
# - caddy: the only published ports (80 for the HTTP-01 challenge and the redirect, 443); admin API on localhost:2019
#   inside the container only; certificates in the persistent volume caddy-data; the upstream snippet written by
#   deploy.sh from a fixed template (blue|green); the directory /etc/evia/caddy mounted read-only.
# - postgres: data on the LUKS volume /srv/evia/pgdata; roles from postgres-init (evia_migrator, the API login).
# - clamd on an internal network without egress; freshclam (the same image) updates the signatures with egress but is
#   outside the network of the worker (A6). The WORKER (the scan and the monitor of the signatures are its jobs; the API does not scan) joins evia-scan through the
#   channel (EVM-084 K9: the canonical compose document of the verifier names the network; deploy.sh refuses to start unless it is internal); clamd never joins evia-runtime.
#   The image is clamav/clamav-debian: the Alpine clamav/clamav is amd64-only and the VM is Arm64 (Hetzner CAX).
# Secrets: the PostgreSQL superuser password as a file from /etc/evia/secrets (POSTGRES_PASSWORD_FILE).

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # EVM-085 AC2 (CAX11 variant A): when the kernel must kill something for lack of memory, the edge and the database go last (clamd and the media processor first).
    oom_score_adj: -500
    security_opt: ['no-new-privileges:true']
    ports:
      - '80:80'
      - '443:443'
    # EVM-085 AC6 (security-engineer A12): a fixed address, the only value of TRUSTED_PROXIES of the API and the worker.
    networks:
      evia-runtime:
        ipv4_address: 172.30.10.2
    environment:
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
    tmpfs:
      - /config:size=8m,noexec,nosuid,nodev
      - /tmp:size=16m,noexec,nosuid,nodev
    volumes:
      - caddy-data:/data
      # The DIRECTORY, not single files: deploy.sh replaces upstream.caddy by rename (new inode), which a file mount misses.
      - /etc/evia/caddy:/etc/caddy:ro

  postgres:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: unless-stopped
    user: '999:999'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    shm_size: 256mb
    oom_score_adj: -500 # the database is killed last (EVM-085 AC2, CAX11 variant A)
    networks: [evia-runtime]
    environment:
      POSTGRES_USER: evia_owner
      POSTGRES_DB: evia
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=pl-PL
      PGDATA: /var/lib/postgresql/18/data
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=0775,nosuid,nodev
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - /srv/evia/pgdata:/var/lib/postgresql
      - /run/evia/secrets/postgres:/run/secrets:ro
      - /etc/evia/runtime/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '--host=127.0.0.1', '--username=evia_owner', '--dbname=evia']
      interval: 10s
      timeout: 5s
      retries: 10

  # clamd and freshclam run as the dedicated uid:gid 10006:10006 (not the clamav user 1000 of the image: on the host uid 1000 is the administrator, who has sudo; the pool 100xx is the one of the services) and WITHOUT the image entrypoint /init (EVM-084, Tech Lead decision 2026-11-13). /init runs as root and needs
  # CAP_CHOWN (chown -R of the signature volume) and a writable /etc/clamav (sed -i from CLAMD_CONF_*), which cap_drop ALL and read_only do not allow: with the previous
  # form (root + /init) the containers never started (clamd never ran before 2026-11-13). The configuration is a read-only file of the repository (clamav/*.conf,
  # installed in /etc/evia/runtime/clamav by the IaC session); the posture stays: no capabilities, read-only root file system, no-new-privileges.
  clamd:
    image: clamav/clamav-debian:1.5.4@sha256:76a9c3b63764b78178dc68fa7efcceca0cde2c8c9d4f925a8e697cb4511f8fdc
    restart: unless-stopped
    user: '10006:10006'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [evia-scan]
    # EVM-085 AC2 (CAX11 variant A): a lack of memory kills clamd before the database; the scan then fails closed and is retried (restart: unless-stopped).
    oom_score_adj: 300
    entrypoint: ['clamd']
    command: ['--foreground', '--config-file=/etc/evia-clamav/clamd.conf']
    environment:
      # the date in the reply to VERSION is in the local time of the container; the monitor of the signatures (EVM-049 AC7) reads it as UTC.
      TZ: UTC
    # the health check is that of the image (clamdcheck.sh: PING on 127.0.0.1:3310, no root needed)
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    volumes:
      - /etc/evia/runtime/clamav:/etc/evia-clamav:ro
      - clamav-signatures:/var/lib/clamav:ro
      - clamav-scan-tmp:/scan-tmp

  freshclam:
    image: clamav/clamav-debian:1.5.4@sha256:76a9c3b63764b78178dc68fa7efcceca0cde2c8c9d4f925a8e697cb4511f8fdc
    restart: unless-stopped
    user: '10006:10006'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [evia-updates]
    entrypoint: ['freshclam']
    command: ['--daemon', '--foreground', '--config-file=/etc/evia-clamav/freshclam.conf']
    environment:
      # freshclam is not clamd: the health check of the image (PING) is switched off, as the image does for this role
      CLAMAV_NO_CLAMD: 'true'
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - /etc/evia/runtime/clamav:/etc/evia-clamav:ro
      - clamav-signatures:/var/lib/clamav

networks:
  # The shared network of the edge Caddy, PostgreSQL and the application colours (external for the channel).
  evia-runtime:
    name: evia-runtime
    # A fixed subnet (EVM-085 AC6): the address of the edge Caddy is known, so TRUSTED_PROXIES is that one address and not the whole
    # range of Docker. Changing the subnet of an existing network needs it recreated (docs/ops/runbooks/alerty.md "Aktywacja").
    ipam:
      config:
        - subnet: 172.30.10.0/24
          # Dynamic addresses only from the upper half, so that no container can take the fixed address of Caddy (.2) after a restart of
          # the VM (CWE-348: a container at .2 would become the trusted proxy of TRUSTED_PROXIES).
          ip_range: 172.30.10.128/25
  # clamd without egress; the worker joins it through the deployment channel (EVM-084 K9) - the network is created here, the channel only references it.
  evia-scan:
    name: evia-scan
    internal: true
  # freshclam only: egress for the signature mirrors.
  evia-updates:
    name: evia-updates

volumes:
  caddy-data:
    name: evia-caddy-data
  clamav-signatures:
    name: evia-clamav-signatures
  # EVM-046: the scratch space of clamd for streams up to 2 GB (a disk volume; the size limit and the alert at 80% are set by the IaC session)
  clamav-scan-tmp:
    name: evia-clamav-scan-tmp
    # A deviation from P3 (photos and films pass through this scratch space), accepted by the user at the demo of EVM-046 (RR-71): the directory is
    # a SEPARATE mount of the host (not the root file system): the second partition of the work volume (Hetzner Volume), plain dm-crypt under an ephemeral key (kept in
    # RAM only), mounted nodev,nosuid,noexec; its size is the quota (>= 2.5 GB) with an alert at 80%. Set up at every start by evia-work-volumes.service (user-data of the
    # VM module; docs/ops/runbooks/media-processor.md), which is RequiredBy=docker.service; the volume is formatted anew at every start, so it is clean when clamd starts (CWE-459).
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/evia/clamav-scan
