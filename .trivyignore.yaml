  - id: CVE-2026-76844
    purls: ['pkg:deb/debian/zlib1g@1.3.dfsg%2Breally1.3.1-1%2Bb1?arch=arm64&distro=debian-13.7&epoch=1']
    statement: &zlib-gz 'High in zlib1g 1.3.1-1+b1 of postgres:18.6-trixie (heap overflow in the gzwrite/gzprintf API after a failed write); not reachable — the server uses zlib only for in-memory deflate/inflate, nothing in the container calls gzwrite (pg_dump is not run there, backups are made by pgBackRest in its own image); no official image with zlib 1.3.1-1+deb13u1 yet · owner: security-engineer · EVM-084'
    expired_at: 2026-12-10
