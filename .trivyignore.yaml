# Trivy exceptions (bramki 4–6). Every entry needs `statement` ("<reason> · owner: <role> · EVM-###") and
# `expired_at` (≤ 90 days; licenses only for non-distributed tools). Expired entries fail tools/repo-policy.
# Vulnerabilities (bramka 6): narrow scope only — one finding ID + the binary path + the package PURL with its exact
# version, so a rebuilt binary (another version) is scanned again; ≤ 30 days for Critical/High.
misconfigurations: []
licenses:
  - id: MIT-0
    statement: 'nodemailer — server-only (api/worker), not distributed; MIT-0 is more permissive than MIT; no runtime dependencies · owner: security-engineer · EVM-024'
    expired_at: 2027-01-10
vulnerabilities:
  # (A) gosu 1.19 (Go 1.24.6) in postgres:18.6-trixie — NOT REACHABLE (security-engineer 2026-10-21; RR-36). gosu links
  # none of the affected packages: no symbols of crypto/tls, crypto/x509, encoding/asn1, encoding/xml, html/template,
  # mime, net, net/http, net/mail, net/url, os.Root, golang.org/x/net (checked in the image by digest; the only matches
  # are GODEBUG setting names of the runtime). It takes no external input, is not setuid (0755 root:root) and runs only
  # from docker-entrypoint.sh as uid 0: every compose service (compose.yaml, compose.dev.yaml, infra/runtime) runs as
  # 999:999 with no-new-privileges, so it never runs there; Testcontainers in CI (root) runs it once with fixed arguments.
  # No upstream postgres image with a rebuilt gosu (trixie and alpine alike). Remove with a postgres digest whose gosu
  # is clean (Renovate) — at the latest on expiry.
  - id: CVE-2025-68121
    paths: ['usr/local/bin/gosu']
    purls: ['pkg:golang/stdlib@v1.24.6']
    statement: &gosu-critical 'Critical in Go stdlib 1.24.6 of gosu (postgres:18.6-trixie); not reachable — gosu links none of the affected packages, takes no external input, is not setuid and runs only as uid 0 from the entrypoint (compose services run as 999:999 with no-new-privileges); no upstream image with a rebuilt gosu (RR-36) · owner: security-engineer · EVM-007'
    expired_at: 2026-11-20
  - id: CVE-2025-61726
    paths: ['usr/local/bin/gosu']
    purls: ['pkg:golang/stdlib@v1.24.6']
    statement: &gosu-high 'High in Go stdlib 1.24.6 of gosu (postgres:18.6-trixie); not reachable — gosu links none of the affected packages, takes no external input, is not setuid and runs only as uid 0 from the entrypoint (compose services run as 999:999 with no-new-privileges); no upstream image with a rebuilt gosu (RR-36) · owner: security-engineer · EVM-007'
    expired_at: 2026-11-20
  - id: CVE-2025-61729
