  # (A) gosu 1.19 (Go 1.24.6) in postgres:18.6-trixie — NOT REACHABLE (security-engineer 2026-10-21; RR-36). gosu links
  # none of the affected packages: no symbols of crypto/tls, crypto/x509, encoding/asn1, encoding/xml, html/template,
  # mime, net, net/http, net/mail, net/url, os.Root, golang.org/x/net (checked in the image by digest; the only matches
  # are GODEBUG setting names of the runtime). It takes no external input, is not setuid (0755 root:root) and runs only
  # from docker-entrypoint.sh as uid 0: every compose service (compose.yaml, compose.dev.yaml, infra/runtime) runs as
  # 999:999 with no-new-privileges, so it never runs there; Testcontainers in CI (root) runs it once with fixed arguments.
  # No upstream postgres image with a rebuilt gosu (trixie and alpine alike). Remove with a postgres digest whose gosu
  # is clean (Renovate) — at the latest on expiry. Re-checked 2026-11-12 (EVM-084) on digest e3d24f69…: the same gosu
