# Trivy exceptions (bramki 4–6). Every entry needs `statement` ("<reason> · owner: <role> · EVM-###") and
# `expired_at` (≤ 90 days; licenses only for non-distributed tools). Expired entries fail tools/repo-policy.
# Vulnerabilities (bramka 6): narrow scope only — one finding ID + the binary path + the package PURL with its exact
# version, so a rebuilt binary (another version) is scanned again; ≤ 30 days for Critical/High.
misconfigurations: []
licenses:
  - id: MIT-0
    statement: 'nodemailer — server-only (api/worker), not distributed; MIT-0 is more permissive than MIT; no runtime dependencies · owner: security-engineer · EVM-024'
    expired_at: 2027-01-10
  - id: LGPL-3.0-or-later
    statement: '@img/sharp-libvips-* (libvips, prebuilt shared library of sharp) — server-only (services/media-processor, run in a network-less sandbox container), not redistributed to users; linked dynamically and unmodified, replaceable by the sharp package; applies to the license name, so it also covers the platform packages of the lockfile (tools/scan/platform-licenses.json) · owner: devops-engineer · EVM-068 · decision of Konrad needed (ADR-0009)'
    expired_at: 2027-01-27
