  # postgres:18.6-trixie (Debian 13.7): zlib1g 1.3.1-1+b1, fix 1.3.1-1+deb13u1 not in the official image yet. The same
  # zlib is in infra/images/postgres-pgbackrest (FROM the same digest). Verified 2026-11-12 in the binaries: postgres
  # and pgbackrest import only deflateInit2_/inflateInit2_ (compress-type=zst); gzopen/gzdopen/gzwrite are imported
  # only by the client tools pg_dump, pg_dumpall, pg_restore, pg_basebackup, pg_receivewal, pg_recvlogical and
  # pg_verifybackup, which no script, test or runbook of the project runs. Do not run them in these containers until fixed.
  - id: CVE-2026-76844
    purls: ['pkg:deb/debian/zlib1g@1.3.dfsg%2Breally1.3.1-1%2Bb1?arch=arm64&distro=debian-13.7&epoch=1']
    statement: &zlib-gz 'High in zlib1g 1.3.1-1+b1 of postgres:18.6-trixie and the pgBackRest image built on it (heap overflow in the gzwrite/gzprintf API after a failed write); not reachable — postgres and pgbackrest use only the in-memory deflate/inflate API (pgBackRest compress-type=zst), the gz* file API is used only by client tools (pg_dump, pg_basebackup, pg_receivewal …) that the project never runs in these containers; no official image with zlib 1.3.1-1+deb13u1 yet · owner: security-engineer · EVM-084'
    expired_at: 2026-12-10
  - id: CVE-2026-85091
    purls: ['pkg:deb/debian/zlib1g@1.3.dfsg%2Breally1.3.1-1%2Bb1?arch=arm64&distro=debian-13.7&epoch=1']
