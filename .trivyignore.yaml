  # (B) Findings with a fix that no upstream image carries yet (EVM-084, 2026-11-12; the Caddy/Alpine exceptions of
  # 2.11.7 are gone with the bump to 2.11.9). Each entry names the exact version, so the next digest is scanned again.
  # NOT REACHABLE (security-engineer to confirm); remove with the first upstream rebuild — at the latest on expiry.
  # Caddy 2.11.9 (edge Caddy of infra-images.json and the runtime of evia-web): golang.org/x/net 0.60.0, fix 0.62.0.
  - id: CVE-2026-78661
    paths: ['usr/bin/caddy', 'usr/local/bin/caddy']
    purls: ['pkg:golang/golang.org/x/net@v0.60.0']
    statement: 'High in golang.org/x/net/html 0.60.0 of Caddy 2.11.9 (DoS by crafted HTML in the HTML parser); not reachable — no Caddyfile of the project uses templates or response rewriting (file_server and reverse_proxy only), so no HTML is parsed; no Caddy release with x/net >= 0.62.0 yet · owner: security-engineer · EVM-084'
    expired_at: 2026-12-10
  # Alloy v1.21.3 (Ubuntu 24.04): the same x/net CVE (only html/charset is linked, not the HTML parser) and apt.
  - id: CVE-2026-78661
    paths: ['usr/bin/alloy']
    purls: ['pkg:golang/golang.org/x/net@v0.61.0']
    statement: 'High in golang.org/x/net 0.61.0 of Alloy v1.21.3 (DoS by crafted HTML in the HTML parser); not reachable — the binary links only x/net/html/charset, not the HTML parser; no Alloy release with x/net >= 0.62.0 yet · owner: security-engineer · EVM-084'
    expired_at: 2026-12-10
  - id: CVE-2026-109518
    purls: ['pkg:deb/ubuntu/apt@2.8.3?arch=arm64&distro=ubuntu-24.04']
    statement: &alloy-apt 'High in apt/libapt-pkg 2.8.3 of Alloy v1.21.3 (RCE by an on-path attacker during a package download); not reachable — nothing in the container runs apt (non-root, no package installation at run time), the image is replaced, never patched in place; no Alloy image with apt 2.8.4ubuntu0.1 yet · owner: security-engineer · EVM-084'
    expired_at: 2026-12-10
  - id: CVE-2026-109518
    purls: ['pkg:deb/ubuntu/libapt-pkg6.0t64@2.8.3?arch=arm64&distro=ubuntu-24.04']
